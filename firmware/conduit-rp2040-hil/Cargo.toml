[package]
name = "conduit-rp2040-hil"
description = "Linkable RP2040 HIL reference firmware for the Conduit embedded executor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-embedded = { path = "../../crates/conduit-embedded" }
conduit-embedded-build = { path = "../../crates/conduit-embedded-build" }
sha2 = "0.10.9"

[dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-embedded = { path = "../../crates/conduit-embedded" }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
rand_core = "0.6.4"
rp-pico = "0.9.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[target.'cfg(not(target_arch = "arm"))'.dev-dependencies]
serde_json = "1.0.149"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
