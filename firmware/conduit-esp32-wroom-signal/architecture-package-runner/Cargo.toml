[package]
name = "conduit-esp32-architecture-package-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Architecture-local machine-only builder for the Conduit ESP32-WROOM package"
publish = false

[workspace]

[dependencies]
conduit-host-fabrication = { path = "../../../crates/conduit-host-fabrication" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

