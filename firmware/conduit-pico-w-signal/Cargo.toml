[package]
name = "conduit-pico-w-signal"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
aligned = "0.4.3"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1"
embedded-io-async = "0.7"
embassy-rp = { version = "0.10", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5"
embassy-usb = "0.6"
portable-atomic = { version = "1.14.0", features = ["critical-section"] }
static_cell = "2"
cyw43 = "0.7"
cyw43-pio = "0.10"
embedded-alloc = "0.5"
fixed = "1.29"
heapless = "0.8"

conduit-core = { path = "../../crates/conduit-core" }
conduit-kernel = { path = "../../crates/conduit-kernel", features = ["alloc"] }
conduit-signal = { path = "../../crates/conduit-signal" }

[build-dependencies]
# build.rs copies memory.x into OUT_DIR

[[bin]]
name = "conduit-pico-w-signal"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
