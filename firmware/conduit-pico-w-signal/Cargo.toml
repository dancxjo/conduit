[package]
name = "conduit-pico-w-signal"
version = "0.1.0"
edition = "2021"

[features]
default = ["pico-local"]
pico-local = ["session-control"]
pico-local-minimal = []
usb-remote = ["session-control"]
triple-remote = ["session-control"]
wifi-bootstrap = ["session-control", "dep:conduit-net", "dep:embassy-net"]
r1-control = ["wifi-bootstrap"]
appliance-hello = ["session-control", "dep:conduit-net", "dep:embassy-net"]
appliance-hil-client = ["session-control", "dep:conduit-net", "dep:embassy-net"]
bluetooth-line = ["dep:conduit-bluetooth", "dep:conduit-wire", "dep:embassy-futures", "dep:embassy-sync", "dep:heapless09", "dep:rand_core", "dep:trouble-host", "cyw43/bluetooth"]
session-control = ["dep:conduit-wire", "dep:embassy-futures"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
aligned = "0.4.3"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = { version = "0.1", optional = true }
embassy-sync = { version = "0.7", optional = true }
embassy-rp = { version = "0.10", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5"
embassy-usb = "0.6"
portable-atomic = { version = "1.14.0", features = ["critical-section"] }
rp-pac = { version = "7", features = ["rp2040"] }
static_cell = "2"
cyw43 = "0.7"
cyw43-pio = "0.10"
fixed = "=1.29.0"
heapless = "0.8"
heapless09 = { package = "heapless", version = "0.9", optional = true }
rand_core = { version = "0.6", optional = true }
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp"], optional = true }
embedded-websocket = { version = "0.9.5", default-features = false }
httparse = { version = "1.10", default-features = false }

conduit-core = { path = "../../crates/conduit-core", default-features = false }
conduit-body = { path = "../../crates/conduit-body" }
conduit-kernel = { path = "../../crates/conduit-kernel" }
conduit-net = { path = "../../crates/conduit-net", default-features = false, optional = true }
conduit-signal = { path = "../../crates/conduit-signal", default-features = false }
conduit-wire = { path = "../../crates/conduit-wire", default-features = false, optional = true }
conduit-bluetooth = { path = "../../crates/conduit-bluetooth", optional = true }
trouble-host = { version = "0.7", default-features = false, features = ["central", "peripheral", "gatt", "derive", "security", "default-packet-pool", "default-packet-pool-size-8", "default-packet-pool-mtu-251", "connection-event-queue-size-4", "l2cap-rx-queue-size-4", "l2cap-tx-queue-size-4"], optional = true }
ed25519-dalek = { version = "2.2", default-features = false }
serde-json-core = "0.6"

[build-dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-embedded-build = { path = "../../crates/conduit-embedded-build" }
conduit-form = { path = "../../crates/conduit-form" }
conduit-planner = { path = "../../crates/conduit-planner" }
conduit-runtime = { path = "../../crates/conduit-runtime", default-features = false }
conduit-signal = { path = "../../crates/conduit-signal", features = ["host-profile"] }
conduit-net = { path = "../../crates/conduit-net", features = ["r1-planning"] }
conduit-system-continuity = { path = "../../crates/conduit-system-continuity", features = ["r1-recovery"] }
serde_json = "1"

[[bin]]
name = "conduit-pico-w-signal"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Trouble's maintained Pico W realization pins this CYW43 PIO revision. It
# gives reads and writes distinct DMA channels so inbound HCI traffic is not
# lost while the shared half-duplex bus is transmitting.
[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
