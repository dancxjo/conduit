[package]
name = "conduit-pico-w-hello"
description = "Pico W firmware example for Conduit board networking and telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-embedded = { path = "../../crates/conduit-embedded" }
conduit-embedded-build = { path = "../../crates/conduit-embedded-build" }
sha2 = "0.10.9"

[dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-embedded = { path = "../../crates/conduit-embedded" }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["medium-ethernet", "multicast", "proto-ipv4", "tcp", "udp"] }
embassy-rp = { version = "0.10", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5"
heapless = "0.8"
static_cell = "2"
cyw43 = { version = "0.7" }
cyw43-pio = { version = "0.10" }

[target.'cfg(not(target_arch = "arm"))'.dev-dependencies]
serde_json = "1.0.149"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
