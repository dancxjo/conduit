name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install observed media process implementations
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg sox
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Prove exact reference, FFmpeg, and SoX bindings
        env:
          CONDUIT_REQUIRE_MEDIA_PROCESS_PROVIDERS: "1"
        run: cargo test -p conduit-audio --test implementation_matrix
      - run: cargo xtask release-gate --check --output target/release-evidence.json
      - run: cargo xtask pre-release-version-gate
      - run: cargo xtask catalog-index --check
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: target/release-evidence.json
      - run: cargo run -p conduct --bin generate-conduct-assets -- --check
      # Workspace tests already execute every manifest reference test.
      - run: cargo run -p conduit-conformance -- verify-fixtures conformance/current/manifest.json
      - run: cargo xtask verify-canonical
      - run: cargo xtask performance-gate
      - run: cargo xtask check-python-boundary
      - run: cargo run -p conduct -- --check examples/hello.panel
      - run: cargo run -p conduct -- --explain examples/hello.panel
      - run: test "$(cargo run -q -p conduct -- --run examples/hello.panel)" = "HELLO FROM CONDUIT."
      - run: test "$(cargo run -q -p conduct -- examples/hello.panel)" = "HELLO FROM CONDUIT."

  tour-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-0.2.126
      - if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: bash tour/build-artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tour-${{ github.sha }}
          path: |
            target/tour-site
            target/tour-dist
          if-no-files-found: error
          retention-days: 7

  browser-engines:
    needs: tour-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            port: 4173
            shard: 1/1
            shard_name: whole
            test_args: ""
            test_timeout_ms: 30000
          - browser: firefox
            port: 4174
            shard: 1/3
            shard_name: 1-of-3
            test_args: --grep-invert=@firefox-watch-detach
            test_timeout_ms: 90000
          - browser: firefox
            port: 4176
            shard: 2/3
            shard_name: 2-of-3
            test_args: --grep-invert=@firefox-watch-detach
            test_timeout_ms: 90000
          - browser: firefox
            port: 4177
            shard: 3/3
            shard_name: 3-of-3
            test_args: --grep-invert=@firefox-watch-detach
            test_timeout_ms: 90000
          - browser: firefox
            port: 4178
            shard: 1/1
            shard_name: watch-detach
            test_args: --grep=@firefox-watch-detach
            test_timeout_ms: 120000
          - browser: webkit
            port: 4175
            shard: 1/1
            shard_name: whole
            test_args: --grep-invert=@webkit-watch-freeze
            test_timeout_ms: 30000
          - browser: webkit
            port: 4179
            shard: 1/1
            shard_name: watch-freeze
            test_args: --grep=@webkit-watch-freeze
            test_timeout_ms: 60000
    env:
      HOME: /root
      CONDUIT_PLAYWRIGHT_PORT: ${{ matrix.port }}
      CONDUIT_PLAYWRIGHT_SHARD: ${{ matrix.shard }}
      CONDUIT_PLAYWRIGHT_TEST_TIMEOUT_MS: ${{ matrix.test_timeout_ms }}
      CONDUIT_TOUR_SITE: target/tour-site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: tour-${{ github.sha }}
          path: target
      - run: npm ci --ignore-scripts
      - run: npm run check:browser-bounds
      - name: Run bounded ${{ matrix.browser }} suite (${{ matrix.shard }})
        run: >-
          timeout --signal=INT --kill-after=30s 13m
          npm run test:browser --
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}
          ${{ matrix.test_args }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.shard_name }}-${{ github.run_attempt }}
          path: |
            blob-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  embedded-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p conduit-core --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p conduit-embedded --target thumbv6m-none-eabi
      - run: cargo xtask embedded-gate

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets
      - run: cargo check -p conduit-core --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p conduit-embedded --target thumbv6m-none-eabi

  pages-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hosted, tour-artifact, browser-engines, embedded-core, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: tour-${{ github.sha }}
          path: target
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/tour-site

  deploy-tour:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested Tour to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Tour provenance
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for _ in {1..12}; do
            deployed_commit=$(
              curl --fail --silent --show-error --location \
                "${PAGE_URL%/}/BUILD_COMMIT?deployment=${GITHUB_SHA}"
            ) || true
            if [ "${deployed_commit}" = "${GITHUB_SHA}" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Expected deployed commit ${GITHUB_SHA}, got ${deployed_commit:-no response}" >&2
          exit 1

  release-tour:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hosted, tour-artifact, browser-engines, embedded-core, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: tour-${{ github.sha }}
          path: target
      - uses: actions/attest@v4
        with:
          subject-path: target/tour-dist/conduit-tour.tar.gz
      - name: Publish tested Tour release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          target/tour-dist/conduit-tour.tar.gz
          target/tour-dist/conduit-tour.tar.gz.sha256
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
