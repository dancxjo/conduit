name: Prove source
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      base:
        type: string
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTUP_TOOLCHAIN: 1.98.1
  CONDUIT_CHECKOUT_SHA: ${{ inputs.sha }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      docs-only: ${{ steps.scan.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Resolve acquisition cache
        id: tools
        run: cargo xtask ci pipeline acquisition-key preflight
      - uses: actions/cache/restore@v6.1.0
        id: tools-cache
        with:
          path: ${{ steps.tools.outputs.paths }}
          key: ${{ steps.tools.outputs.key }}
      - name: Install CI validation tools
        run: cargo xtask ci pipeline setup-ci
      - uses: actions/cache/save@v6.1.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.tools.outputs.paths }}
          key: ${{ steps.tools.outputs.key }}
      - name: Scan changed targets
        id: scan
        env:
          BASE: ${{ inputs.base }}
          SHA: ${{ inputs.sha }}
        run: cargo xtask ci pipeline scan "$BASE" "$SHA"
      - name: Check patch, formatting, repository and CI invariants
        env:
          BASE: ${{ inputs.base }}
          SHA: ${{ inputs.sha }}
        run: cargo xtask ci pipeline preflight "${BASE/all/$SHA}"
      - name: Retain acquisition measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-preflight
          path: target/acquisition/preflight.json
          if-no-files-found: warn
          retention-days: 14
  unit:
    needs: preflight
    if: needs.preflight.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [foundation, hosts, products, lint]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          key: unit-${{ matrix.shard }}
          cache-on-failure: false
      - name: Resolve acquisition cache
        id: tools
        run: cargo xtask ci pipeline acquisition-key unit
      - uses: actions/cache/restore@v6.1.0
        id: tools-cache
        with:
          path: ${{ steps.tools.outputs.paths }}
          key: ${{ steps.tools.outputs.key }}
      - name: Install native test prerequisites
        run: cargo xtask ci pipeline setup-unit
      - uses: actions/cache/save@v6.1.0
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.tools.outputs.paths }}
          key: ${{ steps.tools.outputs.key }}
      - name: Prove portable meaning
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo xtask ci pipeline unit "$SHARD"
      - name: Retain acquisition measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-unit-${{ matrix.shard }}
          path: target/acquisition/unit.json
          if-no-files-found: warn
          retention-days: 14
  target:
    needs: [preflight, unit]
    if: needs.preflight.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    name: target / ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          key: target-${{ matrix.id }}
          prefix-key: conduit-compiler-v1
          cache-targets: false
          cache-directories: |
            target/debug
            target/release
            target/*-unknown-*
          cache-on-failure: false
      - name: Resolve acquisition cache
        id: tools
        env:
          TARGET: ${{ matrix.id }}
        run: cargo xtask ci pipeline acquisition-key "$TARGET"
      - uses: actions/cache/restore@v6.1.0
        if: steps.tools.outputs.cacheable == 'true'
        id: tools-cache
        with:
          path: ${{ steps.tools.outputs.paths }}
          key: ${{ steps.tools.outputs.key }}
      - name: Acquire target tools
        env:
          TARGET: ${{ matrix.id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask ci pipeline setup "$TARGET"
      - uses: actions/cache/save@v6.1.0
        if: steps.tools.outputs.cacheable == 'true' && steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.tools.outputs.paths }}
          key: ${{ steps.tools.outputs.key }}
      - name: Retain acquisition measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-${{ matrix.id }}
          path: target/acquisition/${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build, prove, and retain the exact product
        env:
          TARGET: ${{ matrix.id }}
          SHA: ${{ inputs.sha }}
        run: cargo xtask ci pipeline target "$TARGET" "$SHA"
      - name: Preserve product executable modes
        env:
          TARGET: ${{ matrix.id }}
        run: tar -cf "target/$TARGET.tar" -C target/pipeline "$TARGET"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: product-${{ matrix.id }}
          path: target/${{ matrix.id }}.tar
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            proof/browser/test-results/
            target/conduitos/**/*.log
            target/conduitos/**/*.json
            target/conduitos/**/*.png
          if-no-files-found: ignore
          retention-days: 7
  complete:
    if: ${{ always() }}
    needs: [preflight, unit, target]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected lane
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DOCS_ONLY: ${{ needs.preflight.outputs.docs-only }}
          UNIT: ${{ needs.unit.result }}
          TARGET: ${{ needs.target.result }}
        run: |
          test "$PREFLIGHT" = success
          if test "$DOCS_ONLY" != true; then
            test "$UNIT" = success
            test "$TARGET" = success
          fi
