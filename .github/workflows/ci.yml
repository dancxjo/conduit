name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      # WASM binary layout is toolchain-dependent, so CI verifies that the
      # checked-in static Tour can be rebuilt instead of byte-comparing it.
      - run: bash tour/build-wasm.sh
      - run: bash tour/browser-smoke.sh
      - run: bash browser/run-chromium-vectors.sh
      - run: cargo run -p conduct --bin generate-conduct-assets -- --check
      - run: cargo run -p conduit-conformance -- reference conformance/v1/manifest.json
      - run: python3 conformance/c1/verify_canonical_v1.py
      - run: python3 tools/performance_gate.py
      - run: cargo run -p conduct -- --check examples/hello.panel
      - run: cargo run -p conduct -- --explain examples/hello.panel
      - run: test "$(cargo run -q -p conduct -- --run examples/hello.panel)" = "HELLO FROM CONDUIT."
      - run: test "$(cargo run -q -p conduct -- examples/hello.panel)" = "HELLO FROM CONDUIT."

  browser-engines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - run: npm run test:browser

  embedded-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - run: cargo check -p conduit-core --no-default-features --target thumbv6m-none-eabi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: thumbv6m-none-eabi
      - run: cargo check --workspace --all-targets
      - run: cargo check -p conduit-core --no-default-features --target thumbv6m-none-eabi
