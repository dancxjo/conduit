name: book-and-creche-pages

on:
  pull_request_target:
    types: [closed]
    paths:
      - .github/workflows/executable-book-pages.yml
      - .github/workflows/executable-book-deploy.yml
      - README.md
      - site/**
      - scripts/ci/stage-pages-root.sh
      - scripts/ci/stage-book-product.sh
      - scripts/ci/build-browser-application-package.mjs
      - scripts/ci/stage-creche-product.sh
      - scripts/ci/stage-patchbay-product.sh
      - scripts/ci/seal-pages-carrier.mjs
      - scripts/ci/verify-pages-carrier.mjs
      - scripts/ci/pages-product-run-selection.mjs
      - scripts/ci/resolve-pages-product-run.mjs
      - products/tour/**
      - targets/browser/host/assets/book.html
      - targets/browser/host/assets/book.css
      - targets/browser/host/assets/book.mjs
      - targets/browser/host/assets/book-state.mjs
      - targets/browser/host/assets/browser-human-input.mjs
      - targets/browser/host/assets/book-navigation.mjs
      - targets/browser/host/assets/book-runner-presentation.mjs
      - targets/browser/host/assets/book.application.template.json
      - targets/browser/host/assets/browser-application-loader.mjs
      - targets/browser/host/assets/browser-application-storage.mjs
      - targets/browser/host/assets/application-presentation.mjs
      - products/patchbay/**
      - targets/browser/host/assets/creche.html
      - targets/browser/host/assets/creche.application.template.json
      - targets/browser/host/assets/creche.css
      - targets/browser/host/assets/creche*.mjs
      - targets/browser/host/browser-deployment/**
      - targets/browser/host/assets/browser-host-bootstrap.mjs
      - targets/browser/host/assets/browser-host-membership.mjs
      - targets/browser/host/assets/browser-boot-profile.mjs
      - targets/browser/host/assets/device-base.mjs
      - targets/browser/host/assets/usb-device-base.mjs
      - targets/browser/host/assets/artifacts/**
      - targets/browser/host/src/**
      - targets/browser/host/Cargo.toml
      - targets/browser/runtime/Cargo.toml
      - targets/browser/runtime/src/book_runner/**
      - targets/browser/runtime/src/creche/**
      - targets/browser/runtime/src/installed_browser/**
      - targets/browser/runtime/src/source_interaction.rs
      - targets/browser/runtime/src/membership.rs
      - targets/browser/runtime/src/membership_abi.rs
      - targets/browser/runtime/src/lib.rs
      - targets/rp2040/browser-deployment/**
      - targets/avr/browser-deployment/**
      - targets/avr/fabrication/**
      - targets/avr/firmware/**
      - targets/esp32/browser-deployment/**
      - targets/orange-pi/**
      - targets/std/browser-deployment/**
      - targets/std/fabrication-package/**
      - profiles/host-configurations/**
      - profiles/hosts/**
      - targets/raspberry-pi/browser-deployment/**
      - targets/raspberry-pi/fabrication-package/**
      - targets/raspberry-pi/fabrication/xtask/**
      - targets/conduitos/browser-deployment/**
      - targets/conduitos/fabrication-package/**
      - targets/conduitos/fabrication/xtask/**
      - targets/conduitos/fabrication/seal-creche-release.mjs
      - targets/conduitos/src/**
      - profiles/hosts/conduitos-native.profile.json
      - profiles/hosts/conduitos-aarch64-headless.profile.json
      - targets/esp32/fabrication/**
      - targets/esp32/firmware/**
      - fabrication/host/**
      - fabrication/workspace/**
      - xtask/src/commands/avr.rs
      - xtask/src/commands/avr/**
      - xtask/src/commands/esp32_firmware.rs
      - xtask/src/commands/host.rs
      - xtask/src/commands/host_release.rs
      - xtask/src/commands/host_release_browser.rs
      - xtask/Cargo.toml
      - tools/xtask-dispatch/Cargo.toml
      - Cargo.lock
      - semantics/text/src/**
      - semantics/catalog/src/value_primitives.rs
      - architecture/form/src/back_catalog.rs
      - architecture/form/src/checked_syntax.rs
      - proof/browser/executable-book.spec.mjs
      - proof/browser/creche-browser-configuration.spec.mjs
      - proof/browser/browser-application-package.spec.mjs
      - proof/browser/browser-bundle-build.spec.mjs
      - proof/browser/browser-boot-profile.spec.mjs
      - proof/browser/browser-form-runner.spec.mjs
      - proof/browser/pages-front-door.spec.mjs
      - proof/browser/book-test-server.mjs
      - proof/browser/creche-avr.spec.mjs
      - proof/browser/creche-orange-pi.spec.mjs
      - proof/browser/creche-raspberry-pi.spec.mjs
      - proof/browser/creche-conduitos.spec.mjs
      - proof/browser/playwright.config.mjs
      - proof/browser/static-server.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request whose successful product carrier should be promoted
        required: false
        type: number
      main_sha:
        description: Exact current main commit to fabricate and promote
        required: false
        type: string

concurrency:
  group: book-and-creche-pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'promote/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      carrier_present: ${{ steps.resolve.outputs.carrier_present }}
      merge_commit: ${{ steps.resolve.outputs.merge_commit }}
      source_head: ${{ steps.resolve.outputs.source_head }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
      integration_base: ${{ steps.resolve.outputs.integration_base }}
      integration_tree: ${{ steps.resolve.outputs.integration_tree }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      disposition: ${{ steps.direct.outputs.disposition || steps.materialize.outputs.disposition }}
      direct_main: ${{ steps.resolve.outputs.direct_main }}
    steps:
      - name: Check out trusted merged workflow machinery
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the exact successful PR product run
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/resolve-pages-product-run.mjs
      - name: Check out the exact merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.merge_commit }}
          fetch-depth: 0
      - name: Fetch the immutable candidate object without executing it
        if: steps.resolve.outputs.direct_main != 'true'
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          SOURCE_HEAD: ${{ steps.resolve.outputs.source_head }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
      - name: Prepare the dependency-light merged controller
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Reconcile exact Pages carrier inputs with the merged tree
        id: reconcile
        if: steps.resolve.outputs.direct_main != 'true'
        env:
          SOURCE_HEAD: ${{ steps.resolve.outputs.source_head }}
          MERGE_COMMIT: ${{ steps.resolve.outputs.merge_commit }}
        run: |
          cargo build --locked --package conduit-xtask-dispatch
          target/debug/conduit-xtask-dispatch ci reconcile-product \
            products.pages-carrier "$SOURCE_HEAD" "$MERGE_COMMIT" \
            --locked --allow-execute \
            --json-out target/pages-product-reconciliation.json \
            >> "$GITHUB_OUTPUT"
      - name: Require exact carrier bytes for inherited promotion
        id: materialize
        if: steps.resolve.outputs.direct_main != 'true'
        env:
          RECONCILED_DISPOSITION: ${{ steps.reconcile.outputs.disposition }}
          CARRIER_PRESENT: ${{ steps.resolve.outputs.carrier_present }}
        run: |
          disposition=$RECONCILED_DISPOSITION
          if test "$disposition" = inherited && test "$CARRIER_PRESENT" != true; then
            disposition=execute
            echo 'Exact proof is inherited, but its carrier payload is absent; fabricate the merged tree.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
      - name: Fabricate the exact explicitly requested current main carrier
        id: direct
        if: steps.resolve.outputs.direct_main == 'true'
        run: echo 'disposition=execute' >> "$GITHUB_OUTPUT"

  integration-products:
    needs: resolve
    if: needs.resolve.outputs.disposition == 'execute'
    uses: ./.github/workflows/executable-book-pages.yml
    with:
      base_sha: ${{ needs.resolve.outputs.integration_base }}
      candidate_sha: ${{ needs.resolve.outputs.merge_commit }}

  deploy:
    needs: [resolve, integration-products]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.disposition == 'inherited' || needs.integration-products.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.merge_commit }}
      - name: Download the inherited candidate Pages carrier
        if: needs.resolve.outputs.disposition == 'inherited'
        uses: actions/download-artifact@v8
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the newly proven integration Pages carrier
        if: needs.resolve.outputs.disposition == 'execute'
        uses: actions/download-artifact@v8
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier
      - name: Admit the exact carrier selected by reconciliation
        env:
          EXPECTED_TREE: ${{ needs.resolve.outputs.disposition == 'inherited' && needs.resolve.outputs.source_tree || needs.resolve.outputs.integration_tree }}
        run: node scripts/ci/verify-pages-carrier.mjs target/pages-carrier "$EXPECTED_TREE"
      - name: Upload the already-proven Pages carrier
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages-carrier/site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy Conduit Pages
        id: deployment
        uses: actions/deploy-pages@v5
