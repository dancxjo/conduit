name: book-pr-proof

on:
  pull_request:
    paths:
      - .github/workflows/book-pr-proof.yml
      - scripts/ci/build-browser-application-package.mjs
      - scripts/ci/stage-book-product.sh
      - tour/book/**
      - targets/browser/host/assets/application-presentation.mjs
      - targets/browser/host/assets/book.application.template.json
      - targets/browser/host/assets/book.css
      - targets/browser/host/assets/book.html
      - targets/browser/host/assets/book*.mjs
      - targets/browser/host/assets/browser-application-*.mjs
      - targets/browser/host/src/**
      - targets/browser/host/Cargo.toml
      - targets/browser/runtime/Cargo.toml
      - targets/browser/runtime/src/book_runner/**
      - targets/browser/runtime/src/source_interaction.rs
      - apps/patchbay/html/assets/flow.css
      - apps/patchbay/html/assets/flow.js
      - apps/patchbay/html/assets/flow-*.js
      - apps/patchbay/html/assets/portable-navigation.js
      - apps/patchbay/html/assets/react*.js
      - apps/patchbay/html/assets/react-flow.css
      - proof/browser/executable-book.spec.mjs
      - proof/browser/book-test-server.mjs
      - proof/browser/playwright.config.mjs
      - package-lock.json
      - package.json

permissions:
  contents: read

concurrency:
  group: book-pr-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  book-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install the native Rust linker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the pinned browser proof dependency
        run: npm ci --ignore-scripts --prefer-offline
      - name: Build and stage only the admitted Book product
        run: |
          cargo build --locked -p conduit-browser-host
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features book-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/conduit_book_runtime.wasm
          rm -rf target/book-product
          scripts/ci/stage-book-product.sh target/conduit_book_runtime.wasm target/book-product
      - name: Prove the real Book Patchbay and interactive workspace
        run: >-
          npx playwright test
          --config proof/browser/playwright.config.mjs
          proof/browser/executable-book.spec.mjs
          --project chromium
          --workers 1
          --retries 0
          --grep
          "real Patchbay renderer|animated Cords|pairs narrative with Patchbay|invalid Form|canonical syntax projection|reviewed Back"
