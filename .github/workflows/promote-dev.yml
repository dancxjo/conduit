name: Promote dev to main

on:
  workflow_dispatch:
    inputs:
      integrated_sha:
        description: Optional exact successful integration; stale requests coalesce
        required: false
        type: string
  workflow_run:
    workflows: [dev-integration]
    types: [completed]
  # Revisit fresh evidence after the release/sync owner closes, including
  # bot actions without recursive events. This does not retry failed proof.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  request:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Admit one batch from fresh successful integration evidence
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_SHA: ${{ inputs.integrated_sha }}
        run: node tools/ci/release-request-github.mjs
