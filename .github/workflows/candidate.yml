name: candidate

on:
  pull_request:
    branches: [dev]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify the development boundary and patch shape
        env:
          CONDUIT_EVENT_NAME: pull_request
          CONDUIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/ci/branch-boundary.mjs candidate
          node tools/ci/pr-closing-intent.mjs
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the lightweight CI controller
        run: cargo test --locked --package conduit-xtask-dispatch
      - name: Check CI policy contracts
        run: >-
          node --test
          proof/ci/branch-boundary.spec.mjs
          proof/ci/browser-product-ownership.test.mjs
          proof/ci/pr-closing-intent.test.mjs
          proof/ci/release-lane-controller.spec.mjs
          proof/ci/release-request.spec.mjs
          proof/ci/tour-compatibility.test.mjs

  check:
    needs: admission
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      development_admission: true

  products:
    needs: admission
    uses: ./.github/workflows/tour-products.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      development_admission: true

  candidate:
    needs: [admission, check, products]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Admit only a candidate whose affected integration passed
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
        run: |
          test "$ADMISSION_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
