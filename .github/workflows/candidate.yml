name: Candidate
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proof:
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.event.pull_request.base.sha }}
  candidate:
    if: ${{ always() }}
    needs: proof
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful candidate proof
        env:
          RESULT: ${{ needs.proof.result }}
        run: test "$RESULT" = success
