name: candidate

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify the development boundary and patch shape
        env:
          CONDUIT_EVENT_NAME: pull_request
          CONDUIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/ci/branch-boundary.mjs candidate
          node tools/ci/pr-closing-intent.mjs
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check the lightweight CI controller
        run: cargo test --locked --package conduit-xtask-dispatch
      - name: Check CI policy contracts
        run: >-
          node --test
          proof/ci/branch-boundary.spec.mjs
          proof/ci/development-receipts.spec.mjs
          proof/ci/browser-product-ownership.test.mjs
          proof/ci/pr-closing-intent.test.mjs
          proof/ci/product-truth.spec.mjs
          proof/ci/release-lane-controller.spec.mjs
          proof/ci/release-request.spec.mjs

  check:
    needs: admission
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      development_admission: true

  products:
    needs: admission
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/product-carrier.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      development_admission: true

  candidate:
    needs: [admission, check, products]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Admit drafts cheaply and merge-ready candidates completely
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          ADMISSION_RESULT: ${{ needs.admission.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
        run: |
          test "$ADMISSION_RESULT" = success
          if test "$DRAFT" = true; then
            test "$CHECK_RESULT" = skipped
            test "$PRODUCTS_RESULT" = skipped
            exit 0
          fi
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
