name: reconcile-candidate
run-name: reconcile PR #${{ inputs.pr_number || github.event.pull_request.number }} at ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number
        required: true
        type: number
      candidate_sha:
        description: Exact unchanged current pull-request head
        required: true
        type: string
  pull_request_target:
    types: [edited, labeled, reopened]

permissions:
  contents: read

concurrency:
  group: reconcile-candidate-${{ inputs.pr_number || github.event.pull_request.number }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'reopened' ||
      (github.event.action == 'edited' && github.event.changes.base.ref != '') ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:reconcile')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      checks: write
      contents: write
      pull-requests: read
      issues: write
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      integration_sha: ${{ steps.resolve.outputs.integration_sha }}
      integration_ref: ${{ steps.integration.outputs.integration_ref }}
      check_inherited: ${{ steps.resolve.outputs.check_inherited }}
      check_evidence_url: ${{ steps.resolve.outputs.check_evidence_url }}
      products_inherited: ${{ steps.resolve.outputs.products_inherited }}
      products_evidence_url: ${{ steps.resolve.outputs.products_evidence_url }}
      published: ${{ steps.resolve.outputs.published }}
    steps:
      - name: Consume the bounded on-demand reconciliation request
        if: github.event_name == 'pull_request_target' && github.event.action == 'labeled'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/${{ github.repository }}/issues/$PR_NUMBER/labels/ci%3Areconcile"
      - name: Check out only the current trusted controller
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Install the repository Rust toolchain for the impact controller
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Build the dependency-light CI controller
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/conduit-ci-controller-target" \
            cargo build --package conduit-xtask-dispatch --locked
      - name: Materialize the current prospective integration locally
        id: integration
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_SHA"
          base_sha=$(git rev-parse HEAD)
          controller="$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch"
          "$controller" ci integration "$base_sha" "$CANDIDATE_SHA" --locked \
            --json-out integration.json --summary-out integration-summary.md
          cat integration-summary.md >> "$GITHUB_STEP_SUMMARY"
          status=$(jq -r '.status' integration.json)
          if [[ "$status" != clean ]]; then
            echo "Prospective integration is structurally conflicted." >&2
            exit 1
          fi
          integration_tree=$(jq -r '.integration_tree' integration.json)
          effective_merge_base_sha=$(jq -r '.effective_merge_base_sha' integration.json)
          effective_merge_base_tree=$(jq -r '.effective_merge_base_tree' integration.json)
          merge_base_method=$(jq -r '.merge_base_method' integration.json)
          export GIT_AUTHOR_NAME='Conduit CI'
          export GIT_AUTHOR_EMAIL='ci@conduit.invalid'
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          integration_sha=$(printf 'Conduit reconciliation of %s with %s\n' "$CANDIDATE_SHA" "$base_sha" |
            git commit-tree "$integration_tree" -p "$base_sha" -p "$CANDIDATE_SHA")
          integration_ref="refs/heads/conduit-ci/reconcile-$PR_NUMBER-$CANDIDATE_SHA-$base_sha"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "integration_sha=$integration_sha" >> "$GITHUB_OUTPUT"
          echo "integration_ref=$integration_ref" >> "$GITHUB_OUTPUT"
          echo "effective_merge_base_sha=$effective_merge_base_sha" >> "$GITHUB_OUTPUT"
          echo "effective_merge_base_tree=$effective_merge_base_tree" >> "$GITHUB_OUTPUT"
          echo "merge_base_method=$merge_base_method" >> "$GITHUB_OUTPUT"
      - name: Classify candidate-to-integration proof impact
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          INTEGRATION_SHA: ${{ steps.integration.outputs.integration_sha }}
        run: |
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch" \
            ci plan "$CANDIDATE_SHA" "$INTEGRATION_SHA" --locked \
            --json-out reconciliation-impact.json
      - name: Resolve the unchanged candidate and reusable aggregate evidence
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONDUIT_PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          CONDUIT_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          CONDUIT_BASE_SHA: ${{ steps.integration.outputs.base_sha }}
          CONDUIT_INTEGRATION_SHA: ${{ steps.integration.outputs.integration_sha }}
          CONDUIT_RECONCILIATION_PLAN: reconciliation-impact.json
          CONDUIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/ci/reconcile-candidate-request.mjs resolve | tee reconciliation-request.json
      - name: Publish the immutable integration commit for proof jobs
        if: steps.resolve.outputs.published != 'true'
        env:
          INTEGRATION_SHA: ${{ steps.integration.outputs.integration_sha }}
          INTEGRATION_REF: ${{ steps.integration.outputs.integration_ref }}
        run: git push origin "$INTEGRATION_SHA:$INTEGRATION_REF"
      - name: Summarize reconciliation request
        run: |
          printf '## Current-controller candidate reconciliation\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat reconciliation-request.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  candidate-check:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.check_inherited != 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      candidate_sha: ${{ needs.resolve.outputs.integration_sha }}

  candidate-products:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.products_inherited != 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/executable-book-pages.yml
    with:
      base_sha: ${{ needs.resolve.outputs.base_sha }}
      candidate_sha: ${{ needs.resolve.outputs.integration_sha }}

  report:
    name: ${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'reopened' || (github.event.action == 'edited' && github.event.changes.base.ref != '') || (github.event.action == 'labeled' && github.event.label.name == 'ci:reconcile')) && 'admission' || 'ignored-reconciliation-event' }}
    needs: [resolve, candidate-check, candidate-products]
    if: always() && needs.resolve.outputs.integration_ref != ''
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      checks: write
      contents: write
    steps:
      - name: Check out only the current trusted reporter
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
      - name: Publish the reconciliation-owned admission gate
        if: needs.resolve.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONDUIT_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          CONDUIT_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          CONDUIT_INTEGRATION_SHA: ${{ needs.resolve.outputs.integration_sha }}
          CONDUIT_CHECK_INHERITED: ${{ needs.resolve.outputs.check_inherited }}
          CONDUIT_CHECK_RESULT: ${{ needs.candidate-check.result }}
          CONDUIT_CHECK_EVIDENCE_URL: ${{ needs.resolve.outputs.check_evidence_url }}
          CONDUIT_PRODUCTS_INHERITED: ${{ needs.resolve.outputs.products_inherited }}
          CONDUIT_PRODUCTS_RESULT: ${{ needs.candidate-products.result }}
          CONDUIT_PRODUCTS_EVIDENCE_URL: ${{ needs.resolve.outputs.products_evidence_url }}
          CONDUIT_PUBLISH_REQUIRED_ADMISSION: ${{ github.event_name == 'workflow_dispatch' }}
          CONDUIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/ci/reconcile-candidate-request.mjs publish | tee reconciliation-result.json
      - name: Retire the temporary integration ref
        if: always()
        env:
          INTEGRATION_REF: ${{ needs.resolve.outputs.integration_ref }}
        run: git push origin ":$INTEGRATION_REF"
      - name: Summarize the published exact-head admission
        if: needs.resolve.result == 'success'
        run: |
          printf '## Published exact-head gates\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat reconciliation-result.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
