name: book-and-creche-pages

on:
  workflow_dispatch:
  pull_request:
    paths: &product-paths
      - .github/workflows/executable-book-pages.yml
      - scripts/ci/stage-book-product.sh
      - scripts/ci/stage-creche-product.sh
      - tour/book/**
      - targets/browser/host/assets/book.html
      - targets/browser/host/assets/book.css
      - targets/browser/host/assets/book.mjs
      - targets/browser/host/assets/creche.html
      - targets/browser/host/assets/creche.css
      - targets/browser/host/assets/creche*.mjs
      - targets/browser/host/browser-deployment/**
      - targets/browser/host/assets/browser-host-bootstrap.mjs
      - targets/browser/host/assets/device-base.mjs
      - targets/browser/host/assets/usb-device-base.mjs
      - targets/browser/host/assets/artifacts/**
      - targets/browser/host/src/**
      - targets/browser/host/Cargo.toml
      - targets/browser/runtime/Cargo.toml
      - targets/browser/runtime/src/book_runner/**
      - targets/browser/runtime/src/creche/**
      - targets/browser/runtime/src/installed_browser/**
      - targets/browser/runtime/src/source_interaction.rs
      - targets/browser/runtime/src/membership.rs
      - targets/browser/runtime/src/membership_abi.rs
      - targets/browser/runtime/src/lib.rs
      - targets/rp2040/browser-deployment/**
      - targets/avr/browser-deployment/**
      - targets/avr/fabrication/**
      - targets/avr/firmware/**
      - targets/esp32/browser-deployment/**
      - targets/std/browser-deployment/**
      - targets/raspberry-pi/browser-deployment/**
      - targets/raspberry-pi/fabrication-package/**
      - targets/raspberry-pi/fabrication/xtask/**
      - targets/esp32/fabrication/**
      - targets/esp32/firmware/**
      - fabrication/host/src/package_contract.rs
      - fabrication/workspace/**
      - xtask/src/commands/avr.rs
      - xtask/src/commands/avr/**
      - xtask/src/commands/esp32_firmware.rs
      - xtask/src/commands/host.rs
      - xtask/src/commands/host_release.rs
      - semantics/text/src/**
      - semantics/catalog/src/value_primitives.rs
      - architecture/form/src/back_catalog.rs
      - architecture/form/src/checked_syntax.rs
      - proof/browser/executable-book.spec.mjs
      - proof/browser/creche-avr.spec.mjs
      - proof/browser/creche-raspberry-pi.spec.mjs
      - proof/browser/playwright.config.mjs
      - proof/browser/static-server.mjs
      - package.json
      - package-lock.json
  push:
    branches:
      - main
    paths: *product-paths

concurrency:
  group: book-and-creche-pages
  cancel-in-progress: false

jobs:
  avr-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Restore the pinned AVR toolchain
        uses: actions/cache@v6
        with:
          path: |
            target/avr-promicro/tools
            target/avr-promicro/arduino
          key: avr-promicro-arduino-cli-1.5.1-arduino-avr-1.8.8-sparkfun-avr-1.1.13
      - name: Compile and seal the exact generic Pro Micro release
        run: cargo +stable xtask avr release --output target/creche-avr-release
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-avr-promicro-release
          path: target/creche-avr-release
          if-no-files-found: error
          retention-days: 7

  host-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install the Raspberry Pi OS cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
      - name: Compile and seal the reviewed generic existing-computer releases
        run: cargo +stable xtask host release --output target/creche-host-releases
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-existing-computer-releases
          path: target/creche-host-releases
          if-no-files-found: error
          retention-days: 7

  raspberry-pi-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the deterministic SD image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools mtools
      - name: Compile and seal the exact ARMv6 Model B+ SD image
        run: |
          cargo +stable xtask host rpi --board rpi-b-plus-v1.2 image --locked
          mkdir -p target/creche-rpi-release
          cp target/conduitos/armv6/conduitos-rpi-b-plus.img target/creche-rpi-release/
          cp target/conduitos/armv6/rpi-b-plus-image.json target/creche-rpi-release/
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-rpi-release
          if-no-files-found: error
          retention-days: 7

  esp32-release-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [c3, s3, wroom]
    name: esp32-release-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned ESP32-C3 Rust toolchain
        if: matrix.target == 'c3'
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - name: Restore the exact named Xtensa toolchain
        if: matrix.target != 'c3'
        id: esp-toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/esp-conduit-1.91.1
          key: esp-xtensa-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.91.1.0-ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
      - name: Install the pinned Xtensa Rust toolchain
        if: matrix.target != 'c3' && steps.esp-toolchain-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: ${{ matrix.target == 'wroom' && 'esp32' || 'esp32s3' }}
          default: false
          ldproxy: false
          name: esp-conduit-1.91.1
          version: "1.91.1.0"
      - name: Activate the pinned Xtensa compiler
        if: matrix.target != 'c3'
        run: |
          test -x "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin/xtensa-esp32-elf-gcc"
          echo "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp32-elf-clang/esp-20.1.1_20250829/esp-clang/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            targets/esp32/firmware/${{ matrix.target }}-signal -> target
      - name: Build and seal the exact generic release IMAGE
        run: >-
          cargo +stable xtask esp32-firmware build
          --target "${{ matrix.target }}"
          --locked
          --receipt "target/esp32-release/${{ matrix.target }}-build.json"
          --browser-artifact "target/esp32-release/esp32-${{ matrix.target }}-generic-release.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-esp32-release-${{ matrix.target }}
          path: |
            target/esp32-release/esp32-${{ matrix.target }}-generic-release.bin
            target/esp32-release/esp32-${{ matrix.target }}-generic-release.json
          if-no-files-found: error
          retention-days: 7

  products-proof:
    needs: [avr-release, esp32-release-images, host-releases, raspberry-pi-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install the native Rust linker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the pinned browser proof dependency
        run: npm ci --ignore-scripts --prefer-offline
      - name: Download the reviewed generic ESP32 release IMAGEs
        uses: actions/download-artifact@v6
        with:
          pattern: conduit-esp32-release-*
          merge-multiple: true
          path: target/creche-release-artifacts
      - name: Download the reviewed generic existing-computer releases
        uses: actions/download-artifact@v6
        with:
          name: conduit-existing-computer-releases
          path: target/creche-release-artifacts
      - name: Download the reviewed generic Pro Micro release
        uses: actions/download-artifact@v6
        with:
          name: conduit-avr-promicro-release
          path: target/creche-release-artifacts
      - name: Download the reviewed Raspberry Pi bare-metal release
        uses: actions/download-artifact@v6
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-release-artifacts
      - name: Build the exact browser Host and product runtimes
        run: |
          cargo build --locked -p conduit-browser-host
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features book-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/conduit_book_runtime.wasm
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features creche-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/conduit_creche_runtime.wasm
          rm -rf target/book-product target/creche-product
          scripts/ci/stage-book-product.sh target/conduit_book_runtime.wasm target/book-product
          scripts/ci/stage-creche-product.sh target/conduit_creche_runtime.wasm target/creche-product target/creche-release-artifacts
      - name: Prove the Book and Crèche independently in pinned Chromium
        run: >-
          npx playwright test
          --config proof/browser/playwright.config.mjs
          proof/browser/executable-book.spec.mjs
          proof/browser/creche-avr.spec.mjs
          proof/browser/creche-raspberry-pi.spec.mjs
          --project chromium
          --workers 1
          --retries 0

  products:
    needs: [products-proof, avr-release, esp32-release-images, host-releases, raspberry-pi-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Download the reviewed generic ESP32 release IMAGEs
        uses: actions/download-artifact@v6
        with:
          pattern: conduit-esp32-release-*
          merge-multiple: true
          path: target/creche-release-artifacts
      - name: Download the reviewed generic existing-computer releases
        uses: actions/download-artifact@v6
        with:
          name: conduit-existing-computer-releases
          path: target/creche-release-artifacts
      - name: Download the reviewed generic Pro Micro release
        uses: actions/download-artifact@v6
        with:
          name: conduit-avr-promicro-release
          path: target/creche-release-artifacts
      - name: Download the reviewed Raspberry Pi bare-metal release
        uses: actions/download-artifact@v6
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-release-artifacts
      - name: Build the independent Book and Crèche runtimes
        run: |
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features book-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/conduit_book_runtime.wasm
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features creche-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/conduit_creche_runtime.wasm
      - name: Stage independent product trees
        run: |
          rm -rf target/book-product target/creche-product
          scripts/ci/stage-book-product.sh target/conduit_book_runtime.wasm target/book-product
          scripts/ci/stage-creche-product.sh target/conduit_creche_runtime.wasm target/creche-product target/creche-release-artifacts
      - name: Upload the independent Book artifact
        uses: actions/upload-artifact@v4
        with:
          name: conduit-book-product
          path: target/book-product
          if-no-files-found: error
          retention-days: 7
      - name: Upload the independent Crèche artifact
        uses: actions/upload-artifact@v4
        with:
          name: conduit-creche-product
          path: target/creche-product
          if-no-files-found: error
          retention-days: 7

  pages:
    needs: products
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the independent Book artifact
        uses: actions/download-artifact@v6
        with:
          name: conduit-book-product
          path: target/pages-site/book
      - name: Download the independent Crèche artifact
        uses: actions/download-artifact@v6
        with:
          name: conduit-creche-product
          path: target/pages-site/creche
      - name: Verify the combined Pages carrier
        run: |
          test "$(find target/pages-site/book -type f | wc -l)" -eq 12
          test "$(find target/pages-site/creche -type f | wc -l)" -eq 61
          test "$(find target/pages-site -type f | wc -l)" -eq 73
          touch target/pages-site/.nojekyll
      - name: Upload the combined Pages carrier
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages-site

  deploy:
    needs: pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}book/
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy Book and Crèche
        id: deployment
        uses: actions/deploy-pages@v5
