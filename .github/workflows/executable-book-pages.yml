name: executable-book-pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/executable-book-pages.yml
      - tour/book/**
      - targets/browser/host/assets/book.html
      - targets/browser/host/assets/book.css
      - targets/browser/host/assets/book.mjs
      - targets/browser/host/assets/book-lifecycle.mjs
      - targets/browser/host/assets/browser-host-bootstrap.mjs
      - targets/browser/host/src/**
      - targets/browser/host/Cargo.toml
      - targets/browser/runtime/Cargo.toml
      - targets/browser/runtime/src/book_runner/**
      - targets/browser/runtime/src/installed_browser/**
      - semantics/text/src/**
      - semantics/catalog/src/value_primitives.rs
      - architecture/form/src/back_catalog.rs
      - architecture/form/src/checked_syntax.rs
      - targets/browser/runtime/src/lib.rs
      - proof/browser/executable-book.spec.mjs
      - proof/browser/playwright.config.mjs
      - package.json
      - package-lock.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/executable-book-pages.yml
      - tour/book/**
      - targets/browser/host/assets/book.html
      - targets/browser/host/assets/book.css
      - targets/browser/host/assets/book.mjs
      - targets/browser/host/assets/book-lifecycle.mjs
      - targets/browser/host/assets/browser-host-bootstrap.mjs
      - targets/browser/host/src/**
      - targets/browser/host/Cargo.toml
      - targets/browser/runtime/Cargo.toml
      - targets/browser/runtime/src/book_runner/**
      - targets/browser/runtime/src/installed_browser/**
      - semantics/text/src/**
      - semantics/catalog/src/value_primitives.rs
      - architecture/form/src/back_catalog.rs
      - architecture/form/src/checked_syntax.rs
      - targets/browser/runtime/src/lib.rs
      - proof/browser/executable-book.spec.mjs
      - proof/browser/playwright.config.mjs
      - package.json
      - package-lock.json

concurrency:
  group: executable-book-pages
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install the native Rust linker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the pinned browser proof dependency
        run: npm ci --ignore-scripts --prefer-offline
      - name: Build the exact browser Host and runtime
        run: |
          cargo build --locked -p conduit-browser-host
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release
      - name: Prove only the executable book in pinned Chromium
        run: >-
          npx playwright test
          --config proof/browser/playwright.config.mjs
          proof/browser/executable-book.spec.mjs
          --project chromium
          --workers 1
          --retries 0

  build:
    needs: book
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the exact browser Host runtime
        run: >-
          cargo build --locked -p conduit-browser-runtime
          --target wasm32-unknown-unknown --release
      - name: Stage only the executable book
        run: |
          site=target/executable-book-pages
          mkdir -p "$site/book"
          cp targets/browser/host/assets/browser-host-bootstrap.mjs "$site/"
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm "$site/runtime.wasm"
          cp targets/browser/host/assets/book.html "$site/book/index.html"
          cp targets/browser/host/assets/book.css "$site/book/"
          cp targets/browser/host/assets/book.mjs "$site/book/"
          cp targets/browser/host/assets/book-lifecycle.mjs "$site/book/"
          chapters=(chapter-{1..6}.md)
          expected_chapters="$(printf '%s\n' "${chapters[@]}")"
          source_chapters="$(find tour/book -maxdepth 1 -type f -name 'chapter-*.md' -printf '%f\n' | LC_ALL=C sort)"
          test "$source_chapters" = "$expected_chapters"
          for chapter in "${chapters[@]}"; do
            cp "tour/book/$chapter" "$site/book/"
          done
          touch "$site/.nojekyll"
          staged_chapters="$(find "$site/book" -maxdepth 1 -type f -name 'chapter-*.md' -printf '%f\n' | LC_ALL=C sort)"
          test "$staged_chapters" = "$expected_chapters"
          test "$(find "$site" -type f | wc -l)" = 13
      - name: Upload the exact book Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/executable-book-pages

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}book/
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy executable book
        id: deployment
        uses: actions/deploy-pages@v5
