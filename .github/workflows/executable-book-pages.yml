name: book-and-creche-products

on:
  workflow_dispatch:
  pull_request:
    paths: &product-paths
      - .github/workflows/executable-book-pages.yml
      - README.md
      - site/**
      - scripts/ci/stage-pages-root.sh
      - scripts/ci/stage-book-product.sh
      - scripts/ci/build-browser-application-package.mjs
      - scripts/ci/stage-creche-product.sh
      - scripts/ci/seal-pages-carrier.mjs
      - scripts/ci/verify-pages-carrier.mjs
      - tour/book/**
      - targets/browser/host/assets/book.html
      - targets/browser/host/assets/book.css
      - targets/browser/host/assets/book.mjs
      - targets/browser/host/assets/book-state.mjs
      - targets/browser/host/assets/book-navigation.mjs
      - targets/browser/host/assets/book-runner-presentation.mjs
      - targets/browser/host/assets/book.application.template.json
      - targets/browser/host/assets/browser-application-loader.mjs
      - targets/browser/host/assets/browser-application-storage.mjs
      - targets/browser/host/assets/application-presentation.mjs
      - apps/patchbay/html/assets/react.min.js
      - apps/patchbay/html/assets/react-dom.min.js
      - apps/patchbay/html/assets/react-flow.min.js
      - apps/patchbay/html/assets/react-flow.css
      - apps/patchbay/html/assets/flow.css
      - apps/patchbay/html/assets/flow.js
      - apps/patchbay/html/assets/flow-scene.js
      - apps/patchbay/html/assets/flow-layout.js
      - apps/patchbay/html/assets/flow-faceplate.js
      - apps/patchbay/html/assets/portable-navigation.js
      - targets/browser/host/assets/creche.html
      - targets/browser/host/assets/creche.css
      - targets/browser/host/assets/creche*.mjs
      - targets/browser/host/browser-deployment/**
      - targets/browser/host/assets/browser-host-bootstrap.mjs
      - targets/browser/host/assets/browser-host-membership.mjs
      - targets/browser/host/assets/device-base.mjs
      - targets/browser/host/assets/usb-device-base.mjs
      - targets/browser/host/assets/artifacts/**
      - targets/browser/host/src/**
      - targets/browser/host/Cargo.toml
      - targets/browser/runtime/Cargo.toml
      - targets/browser/runtime/src/book_runner/**
      - targets/browser/runtime/src/creche/**
      - targets/browser/runtime/src/installed_browser/**
      - targets/browser/runtime/src/source_interaction.rs
      - targets/browser/runtime/src/membership.rs
      - targets/browser/runtime/src/membership_abi.rs
      - targets/browser/runtime/src/lib.rs
      - targets/rp2040/browser-deployment/**
      - targets/avr/browser-deployment/**
      - targets/avr/fabrication/**
      - targets/avr/firmware/**
      - targets/esp32/browser-deployment/**
      - targets/orange-pi/**
      - targets/std/browser-deployment/**
      - targets/std/fabrication-package/**
      - profiles/host-configurations/**
      - profiles/hosts/**
      - targets/raspberry-pi/browser-deployment/**
      - targets/raspberry-pi/fabrication-package/**
      - targets/raspberry-pi/fabrication/xtask/**
      - targets/conduitos/browser-deployment/**
      - targets/conduitos/fabrication-package/**
      - targets/conduitos/fabrication/xtask/**
      - targets/conduitos/fabrication/seal-creche-release.mjs
      - targets/conduitos/src/**
      - profiles/hosts/conduitos-native.profile.json
      - profiles/hosts/conduitos-aarch64-headless.profile.json
      - targets/esp32/fabrication/**
      - targets/esp32/firmware/**
      - fabrication/host/**
      - fabrication/workspace/**
      - xtask/src/commands/avr.rs
      - xtask/src/commands/avr/**
      - xtask/src/commands/esp32_firmware.rs
      - xtask/src/commands/host.rs
      - xtask/src/commands/host_release.rs
      - semantics/text/src/**
      - semantics/catalog/src/value_primitives.rs
      - architecture/form/src/back_catalog.rs
      - architecture/form/src/checked_syntax.rs
      - proof/browser/executable-book.spec.mjs
      - proof/browser/browser-application-package.spec.mjs
      - proof/browser/pages-front-door.spec.mjs
      - proof/browser/book-test-server.mjs
      - proof/browser/creche-avr.spec.mjs
      - proof/browser/creche-orange-pi.spec.mjs
      - proof/browser/creche-raspberry-pi.spec.mjs
      - proof/browser/creche-conduitos.spec.mjs
      - proof/browser/playwright.config.mjs
      - proof/browser/static-server.mjs
      - package.json
      - package-lock.json
concurrency:
  group: book-and-creche-products-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the exact browser Host, Book runtime, and Crèche runtime
        run: |
          mkdir -p target/browser-product-runtimes
          cargo build --locked -p conduit-browser-host
          cp target/debug/conduit-browser-host target/browser-product-runtimes/conduit-browser-host
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features book-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/browser-product-runtimes/book-runtime.wasm
          cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features creche-surface
          cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/browser-product-runtimes/creche-runtime.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-browser-product-runtimes
          path: target/browser-product-runtimes
          if-no-files-found: error
          retention-days: 7

  avr-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Restore the pinned AVR toolchain
        uses: actions/cache@v6
        with:
          path: |
            target/avr-promicro/tools
            target/avr-promicro/arduino
          key: avr-promicro-arduino-cli-1.5.1-arduino-avr-1.8.8-sparkfun-avr-1.1.13
      - name: Compile and seal the exact generic Pro Micro release
        run: cargo +stable xtask avr release --output target/creche-avr-release
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-avr-promicro-release
          path: target/creche-avr-release
          if-no-files-found: error
          retention-days: 7

  host-releases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            artifact: linux
          - runner: windows-2025
            platform: windows
            artifact: windows-x86_64
          - runner: macos-15
            platform: macos
            artifact: macos-aarch64
    name: host-release-${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux cross targets
        if: matrix.platform == 'linux'
        run: rustup target add wasm32-unknown-unknown aarch64-unknown-linux-gnu
      - name: Install the Raspberry Pi OS cross linker
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Compile and seal the reviewed generic existing-computer releases
        run: cargo +stable xtask host release --platform ${{ matrix.platform }} --output target/creche-host-releases
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-existing-computer-releases-${{ matrix.artifact }}
          path: target/creche-host-releases
          if-no-files-found: error
          retention-days: 7

  raspberry-pi-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the deterministic SD image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools mtools
      - name: Compile and seal the exact ARMv6 Raspberry Pi SD images
        run: |
          mkdir -p target/creche-rpi-release
          for board in rpi-b-plus-v1.2 rpi-zero-v1 rpi-zero-w-v1.1 rpi-zero-wh-v1.1; do
            cargo +stable xtask host rpi --board "$board" image --locked
          done
          cp target/conduitos/armv6/conduitos-rpi-*.img target/creche-rpi-release/
          cp target/conduitos/armv6/rpi-*-image.json target/creche-rpi-release/
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-rpi-release
          if-no-files-found: error
          retention-days: 7

  orange-pi-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the deterministic SD image tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools
      - name: Compile and seal the exact Orange Pi 5 ConduitOS SD image
        run: |
          cargo +stable xtask --locked conduitos orange-pi5-image
          mkdir -p target/creche-orange-pi-release
          cp target/conduitos/aarch64/orange-pi-5/conduitos-orange-pi-5.img target/creche-orange-pi-release/
          cp target/conduitos/aarch64/orange-pi-5/orange-pi-5-image.json target/creche-orange-pi-release/
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-orange-pi-release
          path: target/creche-orange-pi-release
          if-no-files-found: error
          retention-days: 7

  conduitos-releases:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
          components: rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the deterministic hybrid ISO tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
      - name: Compile and seal the exact ConduitOS product Host releases
        run: |
          cargo +stable xtask host build profiles/hosts/conduitos-native.profile.json --output target/creche-conduitos-build/x86_64 --locked
          cargo +stable xtask host build profiles/hosts/conduitos-aarch64-headless.profile.json --output target/creche-conduitos-build/aarch64 --locked
          node targets/conduitos/fabrication/seal-creche-release.mjs target/creche-conduitos-build target/creche-conduitos-release
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-conduitos-releases
          path: target/creche-conduitos-release
          if-no-files-found: error
          retention-days: 7

  esp32-release-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [c3, s3, wroom]
    name: esp32-release-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned ESP32-C3 Rust toolchain
        if: matrix.target == 'c3'
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - name: Restore the exact named Xtensa toolchain
        if: matrix.target != 'c3'
        id: esp-toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/esp-conduit-1.91.1
          key: esp-xtensa-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.91.1.0-ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
      - name: Install the pinned Xtensa Rust toolchain
        if: matrix.target != 'c3' && steps.esp-toolchain-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: ${{ matrix.target == 'wroom' && 'esp32' || 'esp32s3' }}
          default: false
          ldproxy: false
          name: esp-conduit-1.91.1
          version: "1.91.1.0"
      - name: Activate the pinned Xtensa compiler
        if: matrix.target != 'c3'
        run: |
          test -x "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin/xtensa-esp32-elf-gcc"
          echo "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp32-elf-clang/esp-20.1.1_20250829/esp-clang/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            targets/esp32/firmware/${{ matrix.target }}-signal -> target
      - name: Build and seal the exact generic release IMAGE
        run: >-
          cargo +stable xtask esp32-firmware build
          --target "${{ matrix.target }}"
          --locked
          --receipt "target/esp32-release/${{ matrix.target }}-build.json"
          --browser-artifact "target/esp32-release/esp32-${{ matrix.target }}-generic-release.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: conduit-esp32-release-${{ matrix.target }}
          path: |
            target/esp32-release/esp32-${{ matrix.target }}-generic-release.bin
            target/esp32-release/esp32-${{ matrix.target }}-generic-release.json
          if-no-files-found: error
          retention-days: 7

  products-proof:
    needs: [avr-release, browser-runtimes, esp32-release-images, host-releases, orange-pi-release, raspberry-pi-release, conduitos-releases]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the pinned browser proof dependency
        run: npm ci --ignore-scripts --prefer-offline
      - name: Download the reviewed browser product runtimes
        uses: actions/download-artifact@v6
        with:
          name: conduit-browser-product-runtimes
          path: target/browser-product-runtimes
      - name: Download the reviewed generic ESP32 release IMAGEs
        uses: actions/download-artifact@v6
        with:
          pattern: conduit-esp32-release-*
          merge-multiple: true
          path: target/creche-release-artifacts
      - name: Download the reviewed generic existing-computer releases
        uses: actions/download-artifact@v6
        with:
          pattern: conduit-existing-computer-releases-*
          merge-multiple: true
          path: target/creche-release-artifacts
      - name: Download the reviewed generic Pro Micro release
        uses: actions/download-artifact@v6
        with:
          name: conduit-avr-promicro-release
          path: target/creche-release-artifacts
      - name: Download the reviewed Raspberry Pi bare-metal release
        uses: actions/download-artifact@v6
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-release-artifacts
      - name: Download the reviewed Orange Pi bare-metal release
        uses: actions/download-artifact@v6
        with:
          name: conduit-orange-pi-release
          path: target/creche-release-artifacts
      - name: Download the reviewed ConduitOS product Host releases
        uses: actions/download-artifact@v6
        with:
          name: conduit-conduitos-releases
          path: target/creche-release-artifacts
      - name: Stage the exact browser products
        run: |
          mkdir -p target/debug
          cp target/browser-product-runtimes/conduit-browser-host target/debug/conduit-browser-host
          chmod 755 target/debug/conduit-browser-host
          cp target/browser-product-runtimes/book-runtime.wasm target/conduit_book_runtime.wasm
          cp target/browser-product-runtimes/creche-runtime.wasm target/conduit_creche_runtime.wasm
          rm -rf target/pages-root target/book-product target/creche-product
          scripts/ci/stage-pages-root.sh target/pages-root
          scripts/ci/stage-book-product.sh target/browser-product-runtimes/book-runtime.wasm target/book-product
          scripts/ci/stage-creche-product.sh target/browser-product-runtimes/creche-runtime.wasm target/creche-product target/creche-release-artifacts
      - name: Prove the Pages products independently and together in pinned Chromium
        run: >-
          npx playwright test
          --config proof/browser/playwright.config.mjs
          proof/browser/executable-book.spec.mjs
          proof/browser/browser-application-package.spec.mjs
          proof/browser/pages-front-door.spec.mjs
          proof/browser/creche-avr.spec.mjs
          proof/browser/creche-orange-pi.spec.mjs
          proof/browser/creche-raspberry-pi.spec.mjs
          proof/browser/creche-conduitos.spec.mjs
          proof/browser/creche-native-zip.spec.mjs
          proof/browser/creche-native-disk.spec.mjs
          --project chromium
          --workers 1
          --retries 0
      - name: Seal the already-proven Pages carrier
        run: |
          rm -rf target/pages-site target/pages-carrier
          mkdir -p target/pages-site/book target/pages-site/creche
          cp -a target/pages-root/. target/pages-site/
          cp -a target/book-product/. target/pages-site/book/
          cp -a target/creche-product/. target/pages-site/creche/
          echo 'conduit.pages/nojekyll@1' > target/pages-site/.nojekyll
          test -f target/pages-site/book/book.application.json
          test -f target/pages-site/creche/index.html
          test -f target/pages-site/creche/runtime.wasm
          source_commit="$GITHUB_SHA"
          source_tree=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')
          node scripts/ci/seal-pages-carrier.mjs target/pages-site target/pages-carrier "$source_commit" "$source_tree"
          node scripts/ci/verify-pages-carrier.mjs target/pages-carrier "$source_tree"
      - name: Retain the immutable Pages carrier for post-merge promotion
        uses: actions/upload-artifact@v4
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
