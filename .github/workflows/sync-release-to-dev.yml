name: Sync release fixes to dev

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged release pull request
        required: true
        type: number
      merge_sha:
        description: Exact accepted main merge commit
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-release-to-dev
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the exact accepted release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = workflow_dispatch; then
            pr_number=$INPUT_PR_NUMBER
            merge_sha=$INPUT_MERGE_SHA
          else
            pr_number=$EVENT_PR_NUMBER
            merge_sha=$EVENT_MERGE_SHA
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          pull=$(gh pr view "$pr_number" --json state,baseRefName,headRefName,mergeCommit)
          test "$(jq -r .state <<<"$pull")" = MERGED
          test "$(jq -r .baseRefName <<<"$pull")" = main
          [[ "$(jq -r .headRefName <<<"$pull")" == release/* ]]
          test "$(jq -r .mergeCommit.oid <<<"$pull")" = "$merge_sha"
          git fetch --no-tags origin main dev "$merge_sha"
          git merge-base --is-ancestor "$merge_sha" origin/main
          printf 'merge_sha=%s\n' "$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Open the automatic development sync
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
        run: |
          branch="sync-release/$MERGE_SHA"
          git checkout --detach "$MERGE_SHA"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            merge --no-ff --no-edit origin/dev
          sync_head=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$MERGE_SHA" "$sync_head"
          git merge-base --is-ancestor origin/dev "$sync_head"
          git push origin "$sync_head:refs/heads/$branch"
          pr_url=$(gh pr list --state open --base dev --head "$branch" --json url --jq '.[0].url // empty')
          if test -z "$pr_url"; then
            pr_url=$(gh pr create \
              --base dev \
              --head "$branch" \
              --title "Sync release fixes back to dev" \
              --body "Automatically returns the accepted release fixes from \`$MERGE_SHA\` to development.")
          fi
          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
          printf 'number=%s\n' "$(gh pr view "$pr_url" --json number --jq .number)" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(gh pr view "$pr_url" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
      - name: Approve the exact bot-created sync admission when required
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100")
            run=$(jq -c --argjson number "$PR_NUMBER" '
              [.workflow_runs[] |
               select(.name == "candidate" and any(.pull_requests[]?; .number == $number))] |
              sort_by(.created_at) | last // empty
            ' <<< "$runs")
            if test -n "$run"; then
              test "$(jq -r .actor.login <<< "$run")" = 'github-actions[bot]'
              run_id=$(jq -r .id <<< "$run")
              conclusion=$(jq -r '.conclusion // ""' <<< "$run")
              if test "$conclusion" = action_required; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
              fi
              exit 0
            fi
            test "$attempt" -lt 12
            sleep 5
          done
      - name: Summarize the development sync
        env:
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: printf 'Release fixes are returning to development through %s.\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
