name: check

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      reason: ${{ steps.changes.outputs.reason }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify exact change set
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/classify-docs-only.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate documentation diff
        if: steps.changes.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  check:
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Accept validated documentation-only change set
        if: needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true'
        run: echo "Documentation-only fast path (${{ needs.classify.outputs.reason }})"
      - uses: actions/checkout@v4
        if: needs.classify.outputs.docs_only != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.classify.outputs.docs_only != 'true'
        with:
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          cache-on-failure: true

      - name: Emit machine-readable proof contract
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo xtask --json proofs

      - name: Run workspace check suite
        if: needs.classify.outputs.docs_only != 'true'
        run: cargo xtask check workspace --locked

  browser-host:
    needs: classify
    if: always() && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust build-script linker
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Run browser host proof suite
        id: browser-proof
        continue-on-error: true
        env:
          HOME: /root
          RUSTUP_HOME: /github/home/.rustup
        run: cargo xtask prove browser-host --locked --evidence-root target/conduit-evidence/browser-host
      - name: Verify complete exact-head visual evidence
        if: steps.browser-proof.outcome == 'success'
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ github.sha }}"
          --result complete
      - name: Upload complete exact-head visual evidence
        if: github.event_name == 'pull_request' && steps.browser-proof.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: conduit-visual-evidence-${{ github.sha }}
          path: target/conduit-evidence/browser-host
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify failed-run diagnostic evidence
        if: steps.browser-proof.outcome == 'failure'
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ github.sha }}"
          --result diagnostic-incomplete
      - name: Upload failed-run diagnostic evidence
        if: github.event_name == 'pull_request' && steps.browser-proof.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: conduit-visual-evidence-diagnostic-${{ github.sha }}
          path: |
            target/conduit-evidence/browser-host
            target/playwright/patchbay-visual
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve semantic browser proof as the acceptance gate
        if: steps.browser-proof.outcome == 'failure'
        run: exit 1

  conduitos-boot:
    needs: classify
    if: always() && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install deterministic image and emulator tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl xorriso qemu-system-x86 qemu-system-arm qemu-system-misc qemu-efi-aarch64 ovmf-ia32 u-boot-qemu
      - name: Prove bounded ConduitOS kernel ownership
        run: cargo xtask conduitos prove --arch x86-64 --locked
      - name: Prove bounded AArch64 ConduitOS machine wake
        run: cargo xtask conduitos prove --arch aarch64 --locked
      - name: Prove IA-32 ConduitOS machine wake
        run: cargo xtask conduitos architecture-matrix --locked && cargo xtask conduitos prove --arch ia32 --locked
      - name: Prove RISC-V64 ConduitOS entry
        run: cargo xtask conduitos prove --arch riscv64 --locked
      - name: Prove LoongArch64 ConduitOS entry
        run: cargo xtask conduitos prove --arch loongarch64 --locked
