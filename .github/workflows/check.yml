name: check

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      shared_compile_result:
        required: false
        default: success
        type: string
      shared_compile_packages:
        required: false
        default: '[]'
        type: string
      execute_proofs:
        description: Exact reconciliation proof IDs to execute; empty means ordinary candidate planning
        required: false
        default: ''
        type: string
      full_suite:
        description: Run the exhaustive stable-main promotion proof set
        required: false
        default: false
        type: boolean
  merge_group:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # Reusable workflows share github.workflow with their top-level caller. A
  # literal lane name prevents the caller and this callee from deadlocking on
  # the same group while retaining exact candidate/integration isolation.
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CONDUIT_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || '' }}
  CONDUIT_INTEGRATION_SHA: ${{ github.event.merge_group.head_sha || '' }}
  CONDUIT_CHECKOUT_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  CONDUIT_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  CONDUIT_SHARED_COMPILE_RESULT: ${{ inputs.shared_compile_result || 'success' }}
  CONDUIT_SHARED_COMPILE_PACKAGES: ${{ inputs.shared_compile_packages || '[]' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ inputs.full_suite && 'false' || steps.slice.outputs.docs_only || steps.changes.outputs.docs_only }}
      reason: ${{ steps.slice.outputs.reason || steps.changes.outputs.reason }}
      base_sha: ${{ steps.slice.outputs.base_sha || steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.slice.outputs.head_sha || steps.changes.outputs.head_sha }}
      comparison_base_sha: ${{ steps.slice.outputs.comparison_base_sha || steps.changes.outputs.comparison_base_sha }}
      stack_role: ${{ steps.stack.outputs.role || 'independent' }}
      stack_tip_pr: ${{ steps.stack.outputs.tip_pr || github.event.pull_request.number }}
      stack_tip_sha: ${{ steps.stack.outputs.tip_sha || env.CONDUIT_CHECKOUT_SHA }}
      controller_sha: ${{ steps.controller.outputs.sha }}
      exact_execution: ${{ steps.execution.outputs.exact_execution || 'false' }}
      esp32_required: ${{ inputs.full_suite && 'true' || steps.execution.outputs.esp32_required || steps.impact.outputs.esp32_required }}
      esp32_matrix: ${{ inputs.full_suite && '["wroom","c3","s3"]' || steps.execution.outputs.esp32_matrix || steps.impact.outputs.esp32_matrix || '["wroom","c3","s3"]' }}
      standalone_locks_required: ${{ inputs.full_suite && 'true' || steps.execution.outputs.standalone_locks_required || steps.impact.outputs.esp32_required }}
      browser_required: ${{ inputs.full_suite && 'true' || steps.impact.outputs.browser_required }}
      conduitos_required: ${{ inputs.full_suite && 'true' || steps.execution.outputs.conduitos_required || steps.impact.outputs.conduitos_required }}
      conduitos_limine_required: ${{ inputs.full_suite && 'true' || steps.execution.outputs.conduitos_limine_required || steps.impact.outputs.conduitos_required }}
      conduitos_tools_required: ${{ inputs.full_suite && 'true' || steps.execution.outputs.conduitos_tools_required || steps.impact.outputs.conduitos_required }}
      conduitos_x86_matrix: ${{ inputs.full_suite && '["kernel","xhci","usb","hid","keyboard","front-door","product-journey","rescue"]' || steps.execution.outputs.conduitos_x86_matrix || steps.impact.outputs.conduitos_x86_matrix || '["kernel","xhci","usb","hid","keyboard","front-door","product-journey","rescue"]' }}
      conduitos_architecture_matrix: ${{ inputs.full_suite && '["aarch64","ia32","riscv64","loongarch64"]' || steps.execution.outputs.conduitos_architecture_matrix || steps.impact.outputs.conduitos_architecture_matrix || '["aarch64","ia32","riscv64","loongarch64"]' }}
      conduitos_aarch64_product_required: ${{ inputs.full_suite && 'true' || steps.execution.outputs.conduitos_aarch64_product_required || steps.impact.outputs.conduitos_aarch64_product_required || 'true' }}
      impact_reason: ${{ steps.execution.outputs.impact_reason || steps.impact.outputs.impact_reason }}
      workspace_matrix: ${{ inputs.full_suite && '["lint","test-foundation","test-hosts","test-products","portable","pico"]' || steps.execution.outputs.workspace_matrix || steps.impact.outputs.workspace_matrix || '["lint","test-foundation","test-hosts","test-products","portable","pico"]' }}
      workspace_lint_full: ${{ inputs.full_suite && 'true' || steps.impact.outputs.workspace_lint_full || 'true' }}
      workspace_lint_packages: ${{ steps.impact.outputs.workspace_lint_packages || '[]' }}
      workspace_test_packages: ${{ steps.impact.outputs.workspace_test_packages || '[]' }}
      ci_controller_required: ${{ steps.execution.outputs.ci_controller_required || steps.impact.outputs.ci_controller_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
          fetch-depth: 0
      - name: Resolve the current trusted CI controller
        id: controller
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          read -r controller_sha _ < <(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")
          if ! [[ "$controller_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted controller did not resolve to an exact commit" >&2
            exit 1
          fi
          echo "sha=$controller_sha" >> "$GITHUB_OUTPUT"
          printf 'Trusted controller: `%s` from `%s`\n' "$controller_sha" "$DEFAULT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize the trusted controller outside the candidate workspace
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        env:
          CONTROLLER_SHA: ${{ steps.controller.outputs.sha }}
        run: |
          git fetch --no-tags origin "$CONTROLLER_SHA"
          git worktree add --detach "$RUNNER_TEMP/conduit-ci-controller" "$CONTROLLER_SHA"
      - name: Classify this immutable candidate within its open PR stack
        id: stack
        if: github.event_name == 'pull_request' && inputs.candidate_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONDUIT_PR_NUMBER: ${{ github.event.pull_request.number }}
          CONDUIT_STACK_ROLE_OUT: target/ci-plans/pr-stack-role.json
        run: |
          classifier="$RUNNER_TEMP/conduit-ci-controller/scripts/ci/classify-pr-stack.mjs"
          if test -f "$classifier"; then
            mkdir -p target/ci-plans
            node "$classifier"
          else
            echo 'role=independent' >> "$GITHUB_OUTPUT"
            echo 'reason=trusted-controller-has-no-stack-classifier' >> "$GITHUB_OUTPUT"
            echo 'Trusted controller predates stack classification; proving conservatively.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain cheap exact slice evidence for an intermediate PR
        id: slice
        if: steps.stack.outputs.role == 'intermediate'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          echo 'docs_only=true' >> "$GITHUB_OUTPUT"
          echo 'reason=stacked-intermediate-slice' >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "comparison_base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Intermediate slice `%s..%s` is covered by cumulative tip PR #%s at `%s`. Expensive proof is intentionally omitted.\n' \
            "$BASE_SHA" "$HEAD_SHA" '${{ steps.stack.outputs.tip_pr }}' '${{ steps.stack.outputs.tip_sha }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain immutable intermediate slice provenance
        if: steps.stack.outputs.role == 'intermediate'
        uses: actions/upload-artifact@v7
        with:
          name: ci-slice-${{ github.event.pull_request.head.sha }}
          path: target/ci-plans/pr-stack-role.json
          if-no-files-found: error
          retention-days: 14
      - name: Classify exact change set
        id: changes
        if: steps.stack.outputs.role != 'intermediate'
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/classify-docs-only.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate documentation diff
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.comparison_base_sha }}
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - uses: dtolnay/rust-toolchain@1.98.1
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true'
        with:
          components: clippy,rustfmt
      - name: Build the dependency-light trusted CI controller
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true'
        run: >-
          CARGO_TARGET_DIR="$RUNNER_TEMP/conduit-ci-controller-target"
          cargo build
          --manifest-path "$RUNNER_TEMP/conduit-ci-controller/Cargo.toml"
          --package conduit-xtask-dispatch --locked
      - name: Verify the exact generic Rust toolchain before proof fan-out
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true'
        run: >-
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch"
          ci rust-toolchain-preflight --locked
      - name: Plan exact CI impact
        id: impact
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: |
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch" \
            ci plan "$BASE_SHA" "$HEAD_SHA" --locked \
            --json-out target/ci-plans/ci-impact-plan.json \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            >> "$GITHUB_OUTPUT"
      - name: Project the exact reconciliation delta onto check jobs
        id: execution
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && inputs.execute_proofs != ''
        env:
          EXECUTE_PROOFS: ${{ inputs.execute_proofs }}
        run: |
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch" \
            ci execution-plan --proof-ids-json "$EXECUTE_PROOFS" --locked \
            >> "$GITHUB_OUTPUT"
          printf 'Exact reconciliation execution: `%s`\n' "$EXECUTE_PROOFS" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify candidate lifecycle controller contracts
        if: steps.stack.outputs.role != 'intermediate' && (steps.execution.outputs.ci_controller_required == 'true' || (inputs.execute_proofs == '' && steps.impact.outputs.ci_controller_required == 'true'))
        run: >-
          node --test
          proof/ci/retire-superseded-candidates.spec.mjs
          proof/ci/reconcile-candidate-request.spec.mjs
      - name: Verify the dependency-light typed CI planner contracts
        if: steps.stack.outputs.role != 'intermediate' && (steps.execution.outputs.ci_controller_required == 'true' || (inputs.execute_proofs == '' && steps.impact.outputs.ci_controller_required == 'true'))
        run: cargo test --locked --package conduit-xtask-dispatch
      - name: Verify the final result gate truth table
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && (inputs.execute_proofs == '' || steps.execution.outputs.ci_controller_required == 'true')
        env:
          CONDUIT_CHECK_WORKFLOW: ${{ github.workspace }}/.github/workflows/check.yml
        run: |
          proof=proof/ci/check-result-gate.spec.mjs
          if test -f "$RUNNER_TEMP/conduit-ci-controller/$proof"; then
            proof="$RUNNER_TEMP/conduit-ci-controller/$proof"
          fi
          node --test "$proof"
      - name: Fingerprint immutable candidate proof inputs
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        env:
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: |
          controller=(cargo xtask)
          if test -f "$RUNNER_TEMP/conduit-ci-controller/tools/xtask-dispatch/src/ci_dispatch.rs"; then
            controller=("$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch")
          fi
          applicability=()
          if grep -Fq '"--impact-plan"' "$RUNNER_TEMP/conduit-ci-controller/tools/xtask-dispatch/src/ci_dispatch.rs" 2>/dev/null; then
            applicability=(--impact-plan target/ci-plans/ci-impact-plan.json)
          fi
          "${controller[@]}" ci candidate "$HEAD_SHA" --locked "${applicability[@]}" \
            --json-out target/ci-plans/ci-proof-plan.json \
            --summary-out "$GITHUB_STEP_SUMMARY"
      - name: Retain the trusted attestation controller once for proof jobs
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        uses: actions/upload-artifact@v7
        with:
          name: ci-attestation-controller-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: ${{ runner.temp }}/conduit-ci-controller-target/debug/conduit-xtask-dispatch
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain the trusted candidate proof and applicability plans
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ steps.changes.outputs.head_sha }}
          path: target/ci-plans
          if-no-files-found: error
          retention-days: 14
      - name: Retain the exact successful CI controller proof proposition
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && (steps.execution.outputs.ci_controller_required == 'true' || (inputs.execute_proofs == '' && steps.impact.outputs.ci_controller_required == 'true')) && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: ci.controller-contracts
          evidence: typed-controller-and-result-gate-contracts
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - name: Fingerprint prospective integration proof inputs
        if: steps.stack.outputs.role != 'intermediate' && steps.changes.outputs.docs_only != 'true' && github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: >-
          cargo xtask ci reconcile "$BASE_SHA" "$HEAD_SHA" --locked
          --json-out target/ci-plans/ci-proof-plan.json
          --summary-out "$GITHUB_STEP_SUMMARY"
      - name: Retain the exact CI impact plan
        if: steps.stack.outputs.role != 'intermediate' && steps.impact.outcome == 'success' && github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ steps.changes.outputs.head_sha }}
          path: target/ci-plans
          if-no-files-found: error
          retention-days: 14

  conduitos-limine:
    needs: classify
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.conduitos_limine_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - name: Restore the pinned bootloader archive
        id: limine-cache
        uses: actions/cache@v6
        with:
          path: target/conduitos/vendor/limine-binary-12.5.2.tar.gz
          key: conduitos-limine-12.5.2-4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055
      - name: Acquire one immutable ConduitOS bootloader archive
        if: steps.limine-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(grep -c '4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055' targets/conduitos/fabrication/xtask/profile.rs)" = 1
          mkdir -p target/conduitos/vendor
          archive=target/conduitos/vendor/limine-binary-12.5.2.tar.gz
          if ! curl --fail --location --remove-on-error \
            --retry 3 --retry-all-errors --retry-delay 1 \
            --output "$archive" \
            https://github.com/limine-bootloader/limine/releases/download/v12.5.2/limine-binary.tar.gz; then
            curl --fail --location --remove-on-error \
              --retry 3 --retry-all-errors --retry-delay 1 \
              --header 'Accept: application/octet-stream' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$archive" \
              https://api.github.com/repos/limine-bootloader/limine/releases/assets/486357228
          fi
      - name: Verify the pinned bootloader archive
        run: |
          test "$(grep -c '4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055' targets/conduitos/fabrication/xtask/profile.rs)" = 1
          echo '4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055  target/conduitos/vendor/limine-binary-12.5.2.tar.gz' | sha256sum --check --strict
      - name: Distribute the verified pinned archive
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: conduitos-limine-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/vendor/limine-binary-12.5.2.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain the exact successful Limine proof proposition
        if: (github.event_name == 'pull_request' || inputs.candidate_sha != '') && (inputs.execute_proofs == '' || contains(inputs.execute_proofs, '"conduitos.limine"'))
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: conduitos.limine
          evidence: verified-limine-archive
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}

  conduitos-tools:
    needs: classify
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.conduitos_tools_required == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - name: Prove mismatched tool identity refuses
        run: |
          bundle=$(mktemp -d)
          trap 'rm -rf "$bundle"' EXIT
          mkdir "$bundle/debs"
          printf 'not a package\n' > "$bundle/debs/example.deb"
          image_os=$(. /etc/os-release; printf '%s' "$ID")
          os_release=$(. /etc/os-release; printf '%s/%s' "$ID" "$VERSION_ID")
          printf '%s\n' \
            'schema=conduit.ci.conduitos-tool-bundle/v1' \
            "image_os=$image_os" \
            'image_version=deliberately-wrong' \
            "os_release=$os_release" \
            > "$bundle/identity.env"
          cp scripts/ci/conduitos-tools-packages.txt "$bundle/packages.txt"
          (cd "$bundle" && sha256sum debs/example.deb > SHA256SUMS)
          if scripts/ci/conduitos-tools.sh verify "$bundle" 2>refusal.log; then
            echo 'mismatched bundle identity was accepted' >&2
            exit 1
          fi
          grep -Fx 'conduitos-tool-bundle-refused: runner image version mismatch' refusal.log
          test "$(scripts/ci/conduitos-tools.sh cache-status "$bundle")" = rejected
          test ! -e "$bundle"
          test -e "${bundle}.rejected"
      - name: Capture the exact runner cache identity
        id: runner-image
        run: |
          os_release=$(. /etc/os-release; printf '%s/%s' "$ID" "$VERSION_ID")
          architecture=$(dpkg --print-architecture)
          printf 'key=%s-%s\n' "$os_release" "$architecture" >> "$GITHUB_OUTPUT"
      - name: Restore the exact ConduitOS tool bundle
        id: tool-cache
        uses: actions/cache@v6
        with:
          path: target/conduitos/tool-bundle
          key: conduitos-tools-v1-${{ steps.runner-image.outputs.key }}-${{ hashFiles('scripts/ci/conduitos-tools-packages.txt') }}
          restore-keys: |
            conduitos-tools-v1-${{ steps.runner-image.outputs.key }}-
      - name: Verify any restored ConduitOS tool bundle
        id: restored-bundle
        run: |
          state=$(scripts/ci/conduitos-tools.sh cache-status target/conduitos/tool-bundle)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if test "$state" = present; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare one exact ConduitOS tool bundle
        if: steps.restored-bundle.outputs.present != 'true'
        run: scripts/ci/conduitos-tools.sh prepare target/conduitos/tool-bundle
      - name: Verify the restored or prepared tool bundle
        run: scripts/ci/conduitos-tools.sh verify target/conduitos/tool-bundle
      - name: Distribute the exact ConduitOS tool bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: conduitos-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/tool-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Retain the exact successful ConduitOS-tools proof proposition
        if: (github.event_name == 'pull_request' || inputs.candidate_sha != '') && (inputs.execute_proofs == '' || contains(inputs.execute_proofs, '"conduitos.tools"'))
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: conduitos.tools
          evidence: verified-conduitos-tool-bundle
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}

  workspace-check:
    needs: classify
    if: always() && (inputs.shared_compile_result == '' || inputs.shared_compile_result == 'success') && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.workspace_matrix != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'pull_request' || inputs.candidate_sha != '') && needs.classify.outputs.workspace_matrix || '["lint","test-foundation","test-hosts","test-products","portable","pico"]') }}
    name: workspace-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: workspace-${{ matrix.shard }}

      - name: Emit machine-readable proof contract
        if: matrix.shard == 'lint'
        run: cargo xtask --json proofs

      - name: Run ${{ matrix.shard }} workspace check shard
        env:
          CONDUIT_CI_LINT_FULL: ${{ (github.event_name != 'pull_request' && inputs.candidate_sha == '') && 'true' || needs.classify.outputs.workspace_lint_full }}
          CONDUIT_CI_LINT_PACKAGES: ${{ needs.classify.outputs.workspace_lint_packages }}
          CONDUIT_CI_TEST_PACKAGES: ${{ needs.classify.outputs.workspace_test_packages }}
        run: cargo xtask check workspace-${{ matrix.shard }} --locked
      - name: Retain the exact successful workspace proof proposition
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: ${{ matrix.shard == 'lint' && 'workspace.lint' || matrix.shard == 'test-foundation' && 'workspace.foundation' || matrix.shard == 'test-hosts' && 'workspace.hosts' || matrix.shard == 'test-products' && 'workspace.products' || matrix.shard == 'portable' && 'workspace.portable' || 'workspace.pico' }}
          evidence: workspace-${{ matrix.shard }}
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}

  standalone-locks:
    needs: classify
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.standalone_locks_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Receive the trusted standalone-lock controller
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        uses: actions/download-artifact@v8
        with:
          name: ci-attestation-controller-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: ${{ runner.temp }}/conduit-ci-attestation
      - name: Validate every standalone fabrication lock before machine fan-out
        run: |
          controller=(cargo xtask)
          if test "${{ github.event_name == 'pull_request' || inputs.candidate_sha != '' }}" = true; then
            chmod 755 "$RUNNER_TEMP/conduit-ci-attestation/conduit-xtask-dispatch"
            controller=("$RUNNER_TEMP/conduit-ci-attestation/conduit-xtask-dispatch")
          fi
          "${controller[@]}" ci standalone-locks --locked
      - name: Retain the exact successful standalone-lock proof proposition
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: repository.standalone-locks
          evidence: standalone-lock-registry
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}

  esp32-firmware:
    needs: [classify, standalone-locks]
    if: always() && (inputs.shared_compile_result == '' || inputs.shared_compile_result == 'success') && needs.classify.outputs.docs_only != 'true' && (needs.classify.outputs.standalone_locks_required != 'true' || needs.standalone-locks.result == 'success') && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.esp32_required == 'true')
    runs-on: ubuntu-latest
    # A cold Xtensa row may install substantial pinned tooling. Each row owns
    # exactly one target, while exhaustive main runs retain all three rows.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'pull_request' || inputs.candidate_sha != '') && needs.classify.outputs.esp32_matrix || '["wroom","c3","s3"]') }}
    name: esp32-firmware-${{ matrix.target }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install the pinned ESP32-C3 Rust toolchain
        if: matrix.target == 'c3'
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - name: Restore the exact named Xtensa toolchain
        if: matrix.target != 'c3'
        id: esp-toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/esp-conduit-1.91.1
          key: esp-xtensa-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.91.1.0-ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
      - name: Install the pinned Xtensa Rust toolchain
        if: matrix.target != 'c3' && steps.esp-toolchain-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: ${{ matrix.target == 'wroom' && 'esp32' || 'esp32s3' }}
          default: false
          ldproxy: false
          name: esp-conduit-1.91.1
          version: "1.91.1.0"
      - name: Activate the pinned Xtensa compiler from the restored toolchain
        if: matrix.target != 'c3'
        run: |
          test -x "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin/xtensa-esp32-elf-gcc"
          echo "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp32-elf-clang/esp-20.1.1_20250829/esp-clang/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          workspaces: |
            . -> target
            targets/esp32/firmware/${{ matrix.target }}-signal -> target
            ${{ matrix.target == 'wroom' && 'targets/esp32/firmware/wroom-signal/fabrication-package-runner -> target' || '' }}
          shared-key: esp32-${{ matrix.target }}-v4
      - name: Check the locked standalone fabrication package
        if: matrix.target == 'wroom'
        run: cargo +1.98.1 xtask esp32-firmware check --locked
      - name: Build the exact ESP32 firmware image
        run: cargo +1.98.1 xtask esp32-firmware build --target "${{ matrix.target }}" --locked --receipt "target/esp32-firmware/${{ matrix.target }}-build.json"
      - name: Retain the exact successful ESP32 proof proposition
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: machine.esp32-${{ matrix.target }}
          evidence: esp32-${{ matrix.target }}-firmware-build
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - name: Retain the machine-only check receipt
        uses: actions/upload-artifact@v7
        with:
          name: esp32-firmware-${{ matrix.target }}-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/esp32-firmware/*.json
          if-no-files-found: error
          retention-days: 14

  check:
    # This is the sole branch-protection gate. Keep every independently
    # selectable proof aggregate in this join so success cannot precede a late
    # proof failure.
    needs: [classify, workspace-check, standalone-locks, esp32-firmware, browser-host, conduitos-limine, conduitos-tools, conduitos-x86, conduitos-architecture, conduitos-aarch64-product]
    # A deliberately cancelled duplicate lifecycle run is not new proof
    # failure. Real dependency failures still reach this gate and fail it.
    if: ${{ always() && !cancelled() }}
    # This gate only inspects completed dependency results. Keep it on the
    # single-CPU automation lane so machine builds cannot occupy its runner.
    runs-on: ubuntu-slim
    steps:
      - name: Preserve the stable required workspace gate
        env:
          SHARED_COMPILE_RESULT: ${{ env.CONDUIT_SHARED_COMPILE_RESULT }}
          SHARED_COMPILE_PACKAGES: ${{ env.CONDUIT_SHARED_COMPILE_PACKAGES }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          WORKSPACE_RESULT: ${{ needs.workspace-check.result }}
          WORKSPACE_MATRIX: ${{ needs.classify.outputs.workspace_matrix }}
          ESP32_RESULT: ${{ needs.esp32-firmware.result }}
          STANDALONE_LOCKS_RESULT: ${{ needs.standalone-locks.result }}
          BROWSER_HOST_RESULT: ${{ needs.browser-host.result }}
          LIMINE_RESULT: ${{ needs.conduitos-limine.result }}
          TOOLS_RESULT: ${{ needs.conduitos-tools.result }}
          X86_RESULT: ${{ needs.conduitos-x86.result }}
          ARCHITECTURE_RESULT: ${{ needs.conduitos-architecture.result }}
          AARCH64_PRODUCT_RESULT: ${{ needs.conduitos-aarch64-product.result }}
          CONDUITOS_REQUIRED: ${{ needs.classify.outputs.conduitos_required }}
          CONDUITOS_LIMINE_REQUIRED: ${{ needs.classify.outputs.conduitos_limine_required }}
          CONDUITOS_TOOLS_REQUIRED: ${{ needs.classify.outputs.conduitos_tools_required }}
          X86_REQUIRED: ${{ needs.classify.outputs.conduitos_x86_matrix != '[]' }}
          ARCHITECTURE_REQUIRED: ${{ needs.classify.outputs.conduitos_architecture_matrix != '[]' }}
          AARCH64_PRODUCT_REQUIRED: ${{ needs.classify.outputs.conduitos_aarch64_product_required }}
          ESP32_REQUIRED: ${{ needs.classify.outputs.esp32_required }}
          STANDALONE_LOCKS_REQUIRED: ${{ needs.classify.outputs.standalone_locks_required }}
          EVENT_NAME: ${{ inputs.full_suite && 'merge_group' || (github.event_name == 'pull_request' || inputs.candidate_sha != '') && 'pull_request' || github.event_name }}
        run: |
          if test "${SHARED_COMPILE_RESULT:-success}" != success; then
            printf '{"schema":"conduit.ci.causal-block/v1","blocked_by":"workspace.shared-compile","packages":%s,"dependents":["workspace","browser","candidate-machine"]}\n' \
              "${SHARED_COMPILE_PACKAGES:-[]}" | tee causal-block.json
            printf 'blocked-by: workspace.shared-compile (%s)\n' "${SHARED_COMPILE_PACKAGES:-[]}" >&2
            exit 1
          fi
          require_result() {
            local name=$1 actual=$2 expected=$3
            if test "$actual" != "$expected"; then
              printf '%s result: expected %s, got %s\n' "$name" "$expected" "$actual" >&2
              return 1
            fi
          }
          STANDALONE_LOCKS_REQUIRED=${STANDALONE_LOCKS_REQUIRED:-$ESP32_REQUIRED}
          CONDUITOS_LIMINE_REQUIRED=${CONDUITOS_LIMINE_REQUIRED:-$CONDUITOS_REQUIRED}
          CONDUITOS_TOOLS_REQUIRED=${CONDUITOS_TOOLS_REQUIRED:-$CONDUITOS_REQUIRED}
          require_result classify "$CLASSIFY_RESULT" success
          if test "$BROWSER_HOST_RESULT" != success && test "$BROWSER_HOST_RESULT" != skipped; then
            printf 'browser-host result: expected success or skipped, got %s\n' "$BROWSER_HOST_RESULT" >&2
            exit 1
          fi
          if test "$DOCS_ONLY" != true; then
            if test "$WORKSPACE_MATRIX" = '[]'; then require_result workspace "$WORKSPACE_RESULT" skipped; else require_result workspace "$WORKSPACE_RESULT" success; fi
            if test "$EVENT_NAME" != pull_request || test "$STANDALONE_LOCKS_REQUIRED" = true; then require_result standalone-locks "$STANDALONE_LOCKS_RESULT" success; else require_result standalone-locks "$STANDALONE_LOCKS_RESULT" skipped; fi
            if test "$EVENT_NAME" != pull_request || test "$ESP32_REQUIRED" = true; then require_result esp32 "$ESP32_RESULT" success; else require_result esp32 "$ESP32_RESULT" skipped; fi
            if test "$EVENT_NAME" != pull_request || test "$CONDUITOS_LIMINE_REQUIRED" = true; then require_result conduitos-limine "$LIMINE_RESULT" success; else require_result conduitos-limine "$LIMINE_RESULT" skipped; fi
            if test "$EVENT_NAME" != pull_request || test "$CONDUITOS_TOOLS_REQUIRED" = true; then require_result conduitos-tools "$TOOLS_RESULT" success; else require_result conduitos-tools "$TOOLS_RESULT" skipped; fi
            if test "$EVENT_NAME" != pull_request || test "$X86_REQUIRED" = true; then require_result conduitos-x86 "$X86_RESULT" success; else require_result conduitos-x86 "$X86_RESULT" skipped; fi
            if test "$EVENT_NAME" != pull_request || test "$ARCHITECTURE_REQUIRED" = true; then require_result conduitos-architecture "$ARCHITECTURE_RESULT" success; else require_result conduitos-architecture "$ARCHITECTURE_RESULT" skipped; fi
            if test "$EVENT_NAME" != pull_request || test "$AARCH64_PRODUCT_REQUIRED" = true; then require_result conduitos-aarch64-product "$AARCH64_PRODUCT_RESULT" success; else require_result conduitos-aarch64-product "$AARCH64_PRODUCT_RESULT" skipped; fi
          fi
          {
            printf '## Final proof results\n\n'
            printf -- '- ConduitOS Limine: `%s`\n' "$LIMINE_RESULT"
            printf -- '- ConduitOS tools: `%s`\n' "$TOOLS_RESULT"
            printf -- '- ConduitOS x86: `%s`\n' "$X86_RESULT"
            printf -- '- ConduitOS architectures: `%s`\n' "$ARCHITECTURE_RESULT"
            printf -- '- ConduitOS AArch64 product: `%s`\n' "$AARCH64_PRODUCT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  browser-tools:
    needs: classify
    # Paused with the repository-wide visual-evidence producer. The executable
    # book owns a focused browser proof in executable-book-pages.yml.
    if: ${{ false && always() && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.browser_required == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - name: Prove mismatched browser-tool identity refuses
        run: |
          bundle=$(mktemp -d)
          trap 'rm -rf "$bundle" "${bundle}.rejected"' EXIT
          mkdir "$bundle/debs"
          printf 'not a package\n' > "$bundle/debs/example.deb"
          printf '%s\n' \
            'schema=conduit.ci.browser-tool-bundle/v1' \
            'container=deliberately-wrong' \
            "os_release=$(. /etc/os-release; printf '%s/%s' "$ID" "$VERSION_ID")" \
            "dpkg_status_sha256=$(sha256sum /var/lib/dpkg/status | cut -d' ' -f1)" \
            > "$bundle/identity.env"
          cp scripts/ci/browser-tools-packages.txt "$bundle/packages.txt"
          (cd "$bundle" && sha256sum debs/example.deb > SHA256SUMS)
          if scripts/ci/browser-tools.sh verify "$bundle" 2>refusal.log; then
            echo 'mismatched browser-tool bundle was accepted' >&2
            exit 1
          fi
          grep -Fx 'browser-tool-bundle-refused: container identity mismatch' refusal.log
          test "$(scripts/ci/browser-tools.sh cache-status "$bundle")" = rejected
          test ! -e "$bundle"
          test -e "${bundle}.rejected"
      - name: Capture the exact container package baseline
        id: container-image
        run: printf 'key=%s\n' "$(sha256sum /var/lib/dpkg/status | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the exact browser-tool bundle
        id: tool-cache
        uses: actions/cache@v6
        with:
          path: target/browser-tools/tool-bundle
          key: browser-tools-v1-playwright-1.62.0-noble-${{ steps.container-image.outputs.key }}-${{ hashFiles('scripts/ci/browser-tools.sh', 'scripts/ci/browser-tools-packages.txt') }}
          restore-keys: |
            browser-tools-v1-playwright-1.62.0-noble-${{ steps.container-image.outputs.key }}-
      - name: Verify any restored browser-tool bundle
        id: restored-bundle
        run: |
          state=$(scripts/ci/browser-tools.sh cache-status target/browser-tools/tool-bundle)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if test "$state" = present; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare one exact browser-tool bundle
        if: steps.restored-bundle.outputs.present != 'true'
        run: scripts/ci/browser-tools.sh prepare target/browser-tools/tool-bundle
      - name: Verify the restored or prepared browser-tool bundle
        run: scripts/ci/browser-tools.sh verify target/browser-tools/tool-bundle
      - name: Distribute the exact browser-tool bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: browser-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/browser-tools/tool-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  browser-host:
    needs: [classify, browser-tools]
    # Retain the broad proof definition for an explicit future decision, but do
    # not generate or upload repository-wide visual evidence automatically.
    if: ${{ false && always() && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.browser_required == 'true') }}
    runs-on: ubuntu-24.04
    # One-job cold compilation plus evidence upload and cache post-processing
    # exceeded the old ceiling after the semantic proof had already passed.
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Preserve the browser-tool preparation gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          TOOLS_RESULT: ${{ needs.browser-tools.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "$TOOLS_RESULT" = success
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - name: Receive the exact browser-tool bundle
        uses: ./.github/actions/download-exact-artifact
        with:
          name: browser-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/browser-tools/tool-bundle
          expected-digest: ${{ needs.browser-tools.outputs.artifact_digest }}
      - name: Install the exact browser-tool bundle without mirror access
        run: scripts/ci/browser-tools.sh install target/browser-tools/tool-bundle
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Run browser host proof suite
        id: browser-proof
        continue-on-error: true
        env:
          HOME: /root
          RUSTUP_HOME: /github/home/.rustup
        run: cargo xtask prove browser-host --locked --evidence-root target/conduit-evidence/browser-host
      - name: Verify complete exact-head visual evidence
        if: steps.browser-proof.outcome == 'success'
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ env.CONDUIT_CHECKOUT_SHA }}"
          --result complete
      - name: Upload complete exact-head visual evidence
        if: steps.browser-proof.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-visual-evidence-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduit-evidence/browser-host
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify failed-run diagnostic evidence
        if: steps.browser-proof.outcome == 'failure'
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ env.CONDUIT_CHECKOUT_SHA }}"
          --result diagnostic-incomplete
      - name: Upload failed-run diagnostic evidence
        if: (github.event_name == 'pull_request' || inputs.candidate_sha != '') && steps.browser-proof.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-visual-evidence-diagnostic-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: |
            target/conduit-evidence/browser-host
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve semantic browser proof as the acceptance gate
        if: steps.browser-proof.outcome == 'failure'
        run: exit 1

  conduitos-proof-image:
    needs: [classify, conduitos-limine, conduitos-tools]
    if: always() && (inputs.shared_compile_result == '' || inputs.shared_compile_result == 'success') && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || contains(needs.classify.outputs.conduitos_x86_matrix, '"xhci"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"usb"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"hid"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"keyboard"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"rescue"')) && needs.conduitos-limine.result == 'success' && needs.conduitos-tools.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rust-src
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: conduitos-x86-proof-image
      - name: Receive the verified pinned bootloader archive
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-limine-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/vendor
          expected-digest: ${{ needs.conduitos-limine.outputs.artifact_digest }}
      - name: Receive the exact ConduitOS tool bundle
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/tool-bundle
          expected-digest: ${{ needs.conduitos-tools.outputs.artifact_digest }}
      - name: Install the exact ConduitOS tool bundle without mirror access
        run: scripts/ci/conduitos-tools.sh install target/conduitos/tool-bundle
      - name: BUILD one exact immutable x86 proof image
        run: cargo xtask conduitos prepare-proof-image --locked
      - name: Distribute the exact prepared proof image
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: conduitos-proof-image-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: |
            target/conduitos/x86_64/conduitos
            target/conduitos/x86_64/conduitos.iso
            target/conduitos/x86_64/build.json
            target/conduitos/x86_64/image.json
            target/conduitos/x86_64/prepared-proof-image.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  conduitos-x86:
    needs: [classify, conduitos-limine, conduitos-tools, conduitos-proof-image]
    if: always() && (inputs.shared_compile_result == '' || inputs.shared_compile_result == 'success') && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.conduitos_x86_matrix != '[]') && needs.conduitos-limine.result == 'success' && needs.conduitos-tools.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rust-src
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: conduitos-x86-batch
      - name: Receive the verified pinned bootloader archive
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-limine-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/vendor
          expected-digest: ${{ needs.conduitos-limine.outputs.artifact_digest }}
      - name: Receive the exact ConduitOS tool bundle
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/tool-bundle
          expected-digest: ${{ needs.conduitos-tools.outputs.artifact_digest }}
      - name: Install the exact ConduitOS tool bundle without mirror access
        run: scripts/ci/conduitos-tools.sh install target/conduitos/tool-bundle
      - name: Preserve the prepared-image BUILD gate
        if: (github.event_name != 'pull_request' && inputs.candidate_sha == '') || contains(needs.classify.outputs.conduitos_x86_matrix, '"xhci"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"usb"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"hid"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"keyboard"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"rescue"')
        env:
          PREPARED_IMAGE_RESULT: ${{ needs.conduitos-proof-image.result }}
        run: test "$PREPARED_IMAGE_RESULT" = success
      - name: Receive the exact prepared proof image
        if: (github.event_name != 'pull_request' && inputs.candidate_sha == '') || contains(needs.classify.outputs.conduitos_x86_matrix, '"xhci"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"usb"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"hid"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"keyboard"') || contains(needs.classify.outputs.conduitos_x86_matrix, '"rescue"')
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-proof-image-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/x86_64
          expected-digest: ${{ needs.conduitos-proof-image.outputs.artifact_digest }}
      - name: Run selected x86 proofs in one bounded environment
        id: x86-proofs
        continue-on-error: true
        env:
          SELECTED_PROOFS: ${{ (github.event_name == 'pull_request' || inputs.candidate_sha != '') && needs.classify.outputs.conduitos_x86_matrix || '["kernel","xhci","usb","hid","keyboard","front-door","product-journey","rescue"]' }}
        run: |
          mapfile -t proofs < <(jq -r '.[]' <<<"$SELECTED_PROOFS")
          args=()
          for proof in "${proofs[@]}"; do args+=(--proof "$proof"); done
          cargo xtask conduitos prove-many "${args[@]}" --max-parallel 2 --locked
      - name: Validate the complete x86 batch contract
        id: x86-contract
        if: always()
        continue-on-error: true
        env:
          SELECTED_PROOFS: ${{ (github.event_name == 'pull_request' || inputs.candidate_sha != '') && needs.classify.outputs.conduitos_x86_matrix || '["kernel","xhci","usb","hid","keyboard","front-door","product-journey","rescue"]' }}
        run: |
          jq -e --argjson expected "$SELECTED_PROOFS" '
            .schema == "conduit.conduitos.prove-many/v1" and
            (($expected | length) == 1 or .maximum_observed_parallelism > 1) and
            ([.results[].proof] == ($expected | sort)) and
            all(.results[]; .status == "success")
          ' target/conduitos/prove-many/summary.json
      - name: Retain distinct bounded x86 proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conduitos-x86-batch-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: |
            target/conduitos/prove-many/summary.json
            target/conduitos/prove-many/results
            target/conduitos/prove-many/runs/*/logs
            target/conduitos/prove-many/runs/*/evidence
            target/conduitos/prove-many/runs/*/conduitos/**/*.json
            target/conduitos/prove-many/runs/*/conduitos/**/*.log
            target/conduitos/prove-many/runs/*/conduitos/**/*.png
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Receive the trusted candidate proof plan
        if: steps.x86-proofs.outcome == 'success' && steps.x86-contract.outcome == 'success' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: ${{ runner.temp }}/conduit-ci-plan
      - name: Receive the trusted attestation controller
        if: steps.x86-proofs.outcome == 'success' && steps.x86-contract.outcome == 'success' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        uses: actions/download-artifact@v8
        with:
          name: ci-attestation-controller-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: ${{ runner.temp }}/conduit-ci-attestation
      - name: Retain one exact receipt per successful x86 proof
        if: steps.x86-proofs.outcome == 'success' && steps.x86-contract.outcome == 'success' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        env:
          SELECTED_PROOFS: ${{ needs.classify.outputs.conduitos_x86_matrix }}
        run: |
          chmod 755 "$RUNNER_TEMP/conduit-ci-attestation/conduit-xtask-dispatch"
          mkdir -p target/ci-receipts
          mapfile -t proofs < <(jq -r '.[]' <<<"$SELECTED_PROOFS")
          for proof in "${proofs[@]}"; do
            proof_id="conduitos.x86.$proof"
            jq -e --arg proof_id "$proof_id" \
              'any(.proofs[]; .proof_id == $proof_id)' \
              "$RUNNER_TEMP/conduit-ci-plan/ci-proof-plan.json" >/dev/null
            "$RUNNER_TEMP/conduit-ci-attestation/conduit-xtask-dispatch" \
              ci attest-success "$CONDUIT_CHECKOUT_SHA" "$proof_id" \
              --evidence "target/conduitos/prove-many/results/$proof.json" \
              --out "target/ci-receipts/$proof_id.json" --locked
          done
      - name: Retain immutable x86 proof receipts
        if: steps.x86-proofs.outcome == 'success' && steps.x86-contract.outcome == 'success' && (github.event_name == 'pull_request' || inputs.candidate_sha != '')
        uses: actions/upload-artifact@v7
        with:
          name: ci-proof-conduitos.x86.batch-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/ci-receipts/conduitos.x86.*.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the exact x86 batch as the proof gate
        if: always() && (steps.x86-proofs.outcome != 'success' || steps.x86-contract.outcome != 'success')
        run: exit 1

  conduitos-architecture:
    needs: [classify, conduitos-limine, conduitos-tools]
    if: always() && (inputs.shared_compile_result == '' || inputs.shared_compile_result == 'success') && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.conduitos_architecture_matrix != '[]') && needs.conduitos-limine.result == 'success' && needs.conduitos-tools.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON((github.event_name == 'pull_request' || inputs.candidate_sha != '') && needs.classify.outputs.conduitos_architecture_matrix || '["aarch64","ia32","riscv64","loongarch64"]') }}
    name: conduitos-architecture-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rust-src
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: conduitos-architecture-${{ matrix.architecture }}
      - name: Restore pinned LoongArch64 firmware package
        if: matrix.architecture == 'loongarch64'
        uses: actions/cache@v6
        with:
          path: target/conduitos/toolchain/qemu-efi-loongarch64.deb
          key: conduitos-qemu-efi-loongarch64-2025.02-8-deb13u1-2a1bd3b00413af313d6105f38bda3f8156be514f5026f3ec29ba8e81b68f0633
      - name: Receive the verified pinned bootloader archive
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-limine-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/vendor
          expected-digest: ${{ needs.conduitos-limine.outputs.artifact_digest }}
      - name: Receive the exact ConduitOS tool bundle
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/tool-bundle
          expected-digest: ${{ needs.conduitos-tools.outputs.artifact_digest }}
      - name: Install the exact ConduitOS tool bundle without mirror access
        run: scripts/ci/conduitos-tools.sh install target/conduitos/tool-bundle
      - name: Prove ${{ matrix.architecture }} ConduitOS architecture
        run: |
          if test '${{ matrix.architecture }}' = ia32; then
            cargo xtask conduitos architecture-matrix --locked
          fi
          cargo xtask conduitos prove --arch '${{ matrix.architecture }}' --locked
      - name: Retain the exact successful architecture proof proposition
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: conduitos.architecture.${{ matrix.architecture }}
          evidence: conduitos-architecture-${{ matrix.architecture }}
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}

  conduitos-aarch64-product:
    needs: [classify, conduitos-limine, conduitos-tools]
    if: always() && (inputs.shared_compile_result == '' || inputs.shared_compile_result == 'success') && needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && inputs.candidate_sha == '') || needs.classify.outputs.conduitos_aarch64_product_required == 'true') && needs.conduitos-limine.result == 'success' && needs.conduitos-tools.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CHECKOUT_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rust-src
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: conduitos-aarch64-product
      - name: Receive the verified pinned bootloader archive
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-limine-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/vendor
          expected-digest: ${{ needs.conduitos-limine.outputs.artifact_digest }}
      - name: Receive the exact ConduitOS tool bundle
        uses: ./.github/actions/download-exact-artifact
        with:
          name: conduitos-tools-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: target/conduitos/tool-bundle
          expected-digest: ${{ needs.conduitos-tools.outputs.artifact_digest }}
      - name: Install the exact ConduitOS tool bundle without mirror access
        run: scripts/ci/conduitos-tools.sh install target/conduitos/tool-bundle
      - name: Build the checked AArch64 product PROFILE and prove two fresh boots
        run: |
          cargo xtask host build profiles/hosts/conduitos-aarch64-headless.profile.json \
            --output target/conduitos/aarch64-product-host \
            --source-identity "$CONDUIT_CHECKOUT_SHA" \
            --locked
          cargo xtask host verify target/conduitos/aarch64-product-host --boot --locked
          cargo xtask conduitos product-readiness-matrix --locked > target/conduitos/product-readiness-matrix.json
      - name: Retain AArch64 product proof and final PROFILE artifacts
        uses: actions/upload-artifact@v7
        with:
          name: conduitos-aarch64-product-${{ env.CONDUIT_CHECKOUT_SHA }}
          path: |
            target/conduitos/aarch64/aarch64-product-proof.json
            target/conduitos/product-readiness-matrix.json
            target/conduitos/aarch64-product-host/build-manifest.json
            target/conduitos/aarch64-product-host/resolved-image.json
            target/conduitos/aarch64-product-host/conduitos-aarch64.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain the exact successful AArch64 product proposition
        if: github.event_name == 'pull_request' || inputs.candidate_sha != ''
        uses: ./.github/actions/attest-ci-proof
        with:
          proof-id: conduitos.aarch64-product
          evidence: conduitos-aarch64-product
          candidate-sha: ${{ env.CONDUIT_CHECKOUT_SHA }}
