name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Emit machine-readable proof contract
        run: cargo xtask --json proofs

      - name: Run workspace check suite
        run: cargo xtask check workspace --locked

  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust build-script linker
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Run browser host proof suite
        env:
          HOME: /root
          RUSTUP_HOME: /github/home/.rustup
        run: cargo xtask prove browser-host --locked

  conduitos-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-uefi,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install deterministic image and emulator tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl xorriso qemu-system-x86 qemu-system-arm qemu-efi-aarch64
      - name: Prove bounded ConduitOS kernel ownership
        run: cargo xtask conduitos prove --arch x86-64 --locked
      - name: Prove bounded AArch64 ConduitOS entry
        run: cargo xtask conduitos prove --arch aarch64 --locked
