name: check

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      reason: ${{ steps.changes.outputs.reason }}
      base_sha: ${{ steps.changes.outputs.base_sha }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify exact change set
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci/classify-docs-only.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate documentation diff
        if: steps.changes.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
          HEAD_SHA: ${{ steps.changes.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  conduitos-limine:
    needs: classify
    if: always() && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Restore the pinned bootloader archive
        id: limine-cache
        uses: actions/cache@v6
        with:
          path: target/conduitos/vendor/limine-binary-12.5.2.tar.gz
          key: conduitos-limine-12.5.2-4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055
      - name: Acquire one immutable ConduitOS bootloader archive
        if: steps.limine-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(grep -c '4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055' xtask/src/commands/conduitos/profile.rs)" = 1
          mkdir -p target/conduitos/vendor
          archive=target/conduitos/vendor/limine-binary-12.5.2.tar.gz
          if ! curl --fail --location --remove-on-error \
            --retry 3 --retry-all-errors --retry-delay 1 \
            --output "$archive" \
            https://github.com/limine-bootloader/limine/releases/download/v12.5.2/limine-binary.tar.gz; then
            curl --fail --location --remove-on-error \
              --retry 3 --retry-all-errors --retry-delay 1 \
              --header 'Accept: application/octet-stream' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$archive" \
              https://api.github.com/repos/limine-bootloader/limine/releases/assets/486357228
          fi
      - name: Verify the pinned bootloader archive
        run: |
          test "$(grep -c '4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055' xtask/src/commands/conduitos/profile.rs)" = 1
          echo '4c760c09c53560d859b362319a3dc63b79cca3d47f35d69ab0106a13b8057055  target/conduitos/vendor/limine-binary-12.5.2.tar.gz' | sha256sum --check --strict
      - name: Distribute the verified pinned archive
        uses: actions/upload-artifact@v7
        with:
          name: conduitos-limine-${{ github.sha }}
          path: target/conduitos/vendor/limine-binary-12.5.2.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  workspace-check:
    needs: classify
    if: always() && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          [lint, test-foundation, test-hosts, test-products, portable, pico]
    name: workspace-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: workspace-${{ matrix.shard }}

      - name: Emit machine-readable proof contract
        if: matrix.shard == 'lint'
        run: cargo xtask --json proofs

      - name: Run ${{ matrix.shard }} workspace check shard
        run: cargo xtask check workspace-${{ matrix.shard }} --locked

  check:
    needs: [classify, workspace-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the stable required workspace gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          WORKSPACE_RESULT: ${{ needs.workspace-check.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if test "$DOCS_ONLY" != true; then
            test "$WORKSPACE_RESULT" = success
          fi

  browser-host:
    needs: classify
    if: always() && needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust build-script linker
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Run browser host proof suite
        id: browser-proof
        continue-on-error: true
        env:
          HOME: /root
          RUSTUP_HOME: /github/home/.rustup
        run: cargo xtask prove browser-host --locked --evidence-root target/conduit-evidence/browser-host
      - name: Verify complete exact-head visual evidence
        if: steps.browser-proof.outcome == 'success'
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ github.sha }}"
          --result complete
      - name: Upload complete exact-head visual evidence
        if: steps.browser-proof.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-visual-evidence-${{ github.sha }}
          path: target/conduit-evidence/browser-host
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify failed-run diagnostic evidence
        if: steps.browser-proof.outcome == 'failure'
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ github.sha }}"
          --result diagnostic-incomplete
      - name: Upload failed-run diagnostic evidence
        if: github.event_name == 'pull_request' && steps.browser-proof.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-visual-evidence-diagnostic-${{ github.sha }}
          path: |
            target/conduit-evidence/browser-host
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve semantic browser proof as the acceptance gate
        if: steps.browser-proof.outcome == 'failure'
        run: exit 1

  conduitos-x86:
    needs: [classify, conduitos-limine]
    if: always() && needs.classify.outputs.docs_only != 'true' && needs.conduitos-limine.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - proof: kernel
            command: cargo xtask conduitos prove --arch x86-64 --locked --evidence-root target/conduit-evidence/conduitos-x86_64 && cargo xtask evidence verify --locked --root target/conduit-evidence/conduitos-x86_64 --commit "$GITHUB_SHA" --result complete --proof conduitos-x86_64 --suite conduitos.prove.x86_64
            artifact_name: conduit-conduitos-evidence
            artifact_path: target/conduit-evidence/conduitos-x86_64
          - proof: xhci
            command: cargo xtask conduitos xhci-proof --locked
            artifact_name: conduitos-xhci-proof
            artifact_path: target/conduitos/x86_64/xhci-proof.json
          - proof: usb
            command: cargo xtask conduitos usb-proof --locked
            artifact_name: conduitos-usb-proof
            artifact_path: target/conduitos/x86_64/usb-proof.json
          - proof: hid
            command: cargo xtask conduitos hid-proof --locked
            artifact_name: conduitos-hid-proof
            artifact_path: target/conduitos/x86_64/hid-proof.json
          - proof: keyboard
            command: cargo xtask conduitos keyboard-proof --locked
            artifact_name: conduitos-keyboard-proof
            artifact_path: target/conduitos/x86_64/keyboard-proof.json
          - proof: rescue
            command: cargo xtask conduitos rescue-proof --locked
            artifact_name: conduitos-rescue-proof
            artifact_path: |
              target/conduitos/x86_64/rescue-proof.json
              target/conduitos/x86_64/rescue-serial.log
    name: conduitos-x86-${{ matrix.proof }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: conduitos-x86-${{ matrix.proof }}
      - name: Receive the verified pinned bootloader archive
        uses: actions/download-artifact@v8
        with:
          name: conduitos-limine-${{ github.sha }}
          path: target/conduitos/vendor
      - name: Install deterministic x86 image and emulator tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl xorriso qemu-system-x86 qemu-system-arm qemu-system-misc qemu-efi-aarch64 ovmf-ia32 u-boot-qemu
      - name: Run ${{ matrix.proof }} proof
        env:
          PROOF_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$PROOF_COMMAND"
      - name: Retain ${{ matrix.proof }} proof
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  conduitos-architecture:
    needs: [classify, conduitos-limine]
    if: always() && needs.classify.outputs.docs_only != 'true' && needs.conduitos-limine.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            command: cargo xtask conduitos prove --arch aarch64 --locked
          - architecture: ia32
            command: cargo xtask conduitos architecture-matrix --locked && cargo xtask conduitos prove --arch ia32 --locked
          - architecture: riscv64
            command: cargo xtask conduitos prove --arch riscv64 --locked
          - architecture: loongarch64
            command: cargo xtask conduitos prove --arch loongarch64 --locked
    name: conduitos-architecture-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: conduitos-architecture-${{ matrix.architecture }}
      - name: Restore pinned LoongArch64 firmware package
        if: matrix.architecture == 'loongarch64'
        uses: actions/cache@v6
        with:
          path: target/conduitos/toolchain/qemu-efi-loongarch64.deb
          key: conduitos-qemu-efi-loongarch64-2025.02-8-deb13u1-2a1bd3b00413af313d6105f38bda3f8156be514f5026f3ec29ba8e81b68f0633
      - name: Receive the verified pinned bootloader archive
        uses: actions/download-artifact@v8
        with:
          name: conduitos-limine-${{ github.sha }}
          path: target/conduitos/vendor
      - name: Install deterministic architecture tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential curl xorriso qemu-system-x86 qemu-system-arm qemu-system-misc qemu-efi-aarch64 ovmf-ia32 u-boot-qemu
      - name: Prove ${{ matrix.architecture }} ConduitOS architecture
        env:
          PROOF_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$PROOF_COMMAND"

  conduitos-boot:
    needs: [classify, conduitos-limine, conduitos-x86, conduitos-architecture]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the stable required ConduitOS gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          LIMINE_RESULT: ${{ needs.conduitos-limine.result }}
          X86_RESULT: ${{ needs.conduitos-x86.result }}
          ARCHITECTURE_RESULT: ${{ needs.conduitos-architecture.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if test "$DOCS_ONLY" != true; then
            test "$LIMINE_RESULT" = success
            test "$X86_RESULT" = success
            test "$ARCHITECTURE_RESULT" = success
          fi
