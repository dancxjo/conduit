name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --locked --workspace

      - name: Extra feature and no-std contracts
        run: |
          cargo test --locked -p conduit-kernel --features alloc
          cargo test --locked -p conduit --features sim-fixtures --test hello observatory_fixture_report_is_explicitly_synthetic_and_does_not_run_work
          cargo check --locked -p conduit-kernel --no-default-features
          cargo check --locked -p conduit-signal --no-default-features
          cargo check --locked -p conduit-wire --no-default-features
          cargo check --locked -p conduit-std-catalog --no-default-features
          cargo check --locked -p conduit-std-host --no-default-features

      - name: WASM contracts
        run: |
          cargo check --locked -p conduit-browser-runtime --target wasm32-unknown-unknown
          cargo check --locked -p conduit-browser-sim --target wasm32-unknown-unknown
          cargo check --locked -p conduit-wire --target wasm32-unknown-unknown --test session_wire_corpus

      - name: Thumb contracts
        run: |
          cargo check --locked -p conduit-kernel --target thumbv6m-none-eabi
          cargo check --locked -p conduit-core --target thumbv6m-none-eabi
          cargo check --locked -p conduit-realm --target thumbv6m-none-eabi
          cargo check --locked -p conduit-observatory --target thumbv6m-none-eabi
          cargo check --locked -p conduit-std-catalog --no-default-features --target thumbv6m-none-eabi
          cargo check --locked -p conduit-pico-sim --no-default-features --target thumbv6m-none-eabi

  browser-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust build-script linker
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Build browser runtime
        run: cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release
      - name: Run browser host proof
        run: npm run test:browser-host
