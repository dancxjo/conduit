name: Measure one target acquisition
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  cold:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      cache_key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
      BENCHMARK_PHASE: cold
      BENCHMARK_RUNNER: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Resolve exact tool specification and curated cache paths
        id: key
        run: cargo xtask ci pipeline acquisition-key "$TARGET"
      - name: Begin measurement
        env:
          BENCHMARK_KEY: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.key.outputs.key }}
        run: node tools/ci/pipeline/acquisition/compare.mjs begin target/benchmark
      - name: Restore exact run-scoped project cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.key.outputs.key }}
      - name: Record restore and require cold cache state
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          node tools/ci/pipeline/acquisition/compare.mjs restored target/benchmark
          test "$CACHE_HIT" != true
      - name: Test scoped Ubuntu name-resolution recovery
        run: |
          node <<'JS'
          const {spawnSync}=require('node:child_process');
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path'),net=require('node:net');
          const rows=[];
          for(const host of ['archive.ubuntu.com','security.ubuntu.com']){
            const normal=spawnSync('timeout',['4','getent','ahostsv4',host],{encoding:'utf8',timeout:6000});
            console.log(JSON.stringify({host,normalStatus:normal.status}));
            if(normal.status===0)continue;
            const reply=spawnSync('curl',['--silent','--show-error','--fail','--max-time','10','--header','accept: application/dns-json','https://cloudflare-dns.com/dns-query?name='+host+'&type=A&cd=0'],{encoding:'utf8',timeout:12000,maxBuffer:65536});
            if(reply.status!==0)throw Error('HTTPS DNS lookup failed: '+reply.stderr);
            const wire=JSON.parse(reply.stdout);
            const questions=wire.Question;
            if(wire.Status!==0||wire.TC===true||wire.CD===true||!Array.isArray(questions)||questions.length!==1||questions[0].name.replace(/\.$/,'').toLowerCase()!==host||questions[0].type!==1)throw Error('DNS response does not bind the requested host');
            const addresses=(wire.Answer||[]).filter(item=>item.type===1&&item.name.replace(/\.$/,'').toLowerCase()===host).map(item=>item.data);
            if(!addresses.length||addresses.length>16||addresses.some(ip=>net.isIP(ip)!==4))throw Error('Invalid bounded address set');
            console.log(JSON.stringify({host,httpsDnsAddresses:addresses}));
            rows.push(...addresses.map(ip=>ip+' '+host));
          }
          if(rows.length){
            if(!fs.lstatSync('/etc/hosts').isFile())throw Error('Hosts path is not a regular file');
            const directory=fs.mkdtempSync(path.join(os.tmpdir(),'conduit-ubuntu-dns-'));
            const backup=path.join(directory,'hosts');
            fs.writeFileSync(backup,fs.readFileSync('/etc/hosts'),{mode:0o600});
            fs.appendFileSync(process.env.GITHUB_ENV,'CONDUIT_DNS_BACKUP='+backup+'\n');
            const append=spawnSync('sudo',['-n','tee','-a','/etc/hosts'],{encoding:'utf8',input:'\n# Scoped Conduit Ubuntu acquisition DNS recovery\n'+rows.join('\n')+'\n',timeout:10000});
            if(append.status!==0)throw Error('Cannot install temporary host resolution: '+append.stderr);
            for(const host of ['archive.ubuntu.com','security.ubuntu.com']){
              const check=spawnSync('timeout',['4','getent','ahostsv4',host],{encoding:'utf8',timeout:6000});
              console.log(JSON.stringify({host,recoveredStatus:check.status}));
              if(check.status!==0)throw Error('Temporary resolution did not recover');
            }
          }
          JS
      - name: Acquire and verify real tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/pipeline/acquisition/compare.mjs setup target/benchmark "$TARGET"
      - name: Begin cache save measurement
        run: node tools/ci/pipeline/acquisition/compare.mjs saving target/benchmark
      - name: Save verified acquisition cache
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.key.outputs.key }}
      - name: Record cache save
        run: node tools/ci/pipeline/acquisition/compare.mjs saved target/benchmark
      - name: Restore runner host resolution
        if: always()
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),os=require('node:os');
          const {spawnSync}=require('node:child_process');
          const backup=process.env.CONDUIT_DNS_BACKUP;
          if(backup){
            if(path.dirname(path.dirname(backup))!==os.tmpdir()||!/^conduit-ubuntu-dns-[A-Za-z0-9]+$/.test(path.basename(path.dirname(backup)))||path.basename(backup)!=='hosts'||!fs.lstatSync(backup).isFile())throw Error('Unexpected backup');
            const result=spawnSync('sudo',['-n','cp','--',backup,'/etc/hosts'],{encoding:'utf8',timeout:10000});
            if(result.status!==0)throw Error('Cannot restore host resolution: '+result.stderr);
            fs.rmSync(path.dirname(backup),{recursive:true});
          }
          JS
      - name: Retain measurements and real command logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-cold-${{ inputs.target }}
          path: |
            target/benchmark/
            target/acquisition/${{ inputs.target }}.json
          if-no-files-found: error
          retention-days: 14
  warm:
    needs: [cold]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
      BENCHMARK_PHASE: warm
      BENCHMARK_RUNNER: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Resolve exact tool specification and curated cache paths
        id: key
        run: cargo xtask ci pipeline acquisition-key "$TARGET"
      - name: Begin measurement
        env:
          BENCHMARK_KEY: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.cold.outputs.cache_key }}
        run: node tools/ci/pipeline/acquisition/compare.mjs begin target/benchmark
      - name: Restore exact run-scoped project cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.cold.outputs.cache_key }}
      - name: Record restore and require warm cache state
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          node tools/ci/pipeline/acquisition/compare.mjs restored target/benchmark
          test "$CACHE_HIT" = true
      - name: Test scoped Ubuntu name-resolution recovery
        run: |
          node <<'JS'
          const {spawnSync}=require('node:child_process');
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path'),net=require('node:net');
          const rows=[];
          for(const host of ['archive.ubuntu.com','security.ubuntu.com']){
            const normal=spawnSync('timeout',['4','getent','ahostsv4',host],{encoding:'utf8',timeout:6000});
            console.log(JSON.stringify({host,normalStatus:normal.status}));
            if(normal.status===0)continue;
            const reply=spawnSync('curl',['--silent','--show-error','--fail','--max-time','10','--header','accept: application/dns-json','https://cloudflare-dns.com/dns-query?name='+host+'&type=A&cd=0'],{encoding:'utf8',timeout:12000,maxBuffer:65536});
            if(reply.status!==0)throw Error('HTTPS DNS lookup failed: '+reply.stderr);
            const wire=JSON.parse(reply.stdout);
            const questions=wire.Question;
            if(wire.Status!==0||wire.TC===true||wire.CD===true||!Array.isArray(questions)||questions.length!==1||questions[0].name.replace(/\.$/,'').toLowerCase()!==host||questions[0].type!==1)throw Error('DNS response does not bind the requested host');
            const addresses=(wire.Answer||[]).filter(item=>item.type===1&&item.name.replace(/\.$/,'').toLowerCase()===host).map(item=>item.data);
            if(!addresses.length||addresses.length>16||addresses.some(ip=>net.isIP(ip)!==4))throw Error('Invalid bounded address set');
            console.log(JSON.stringify({host,httpsDnsAddresses:addresses}));
            rows.push(...addresses.map(ip=>ip+' '+host));
          }
          if(rows.length){
            if(!fs.lstatSync('/etc/hosts').isFile())throw Error('Hosts path is not a regular file');
            const directory=fs.mkdtempSync(path.join(os.tmpdir(),'conduit-ubuntu-dns-'));
            const backup=path.join(directory,'hosts');
            fs.writeFileSync(backup,fs.readFileSync('/etc/hosts'),{mode:0o600});
            fs.appendFileSync(process.env.GITHUB_ENV,'CONDUIT_DNS_BACKUP='+backup+'\n');
            const append=spawnSync('sudo',['-n','tee','-a','/etc/hosts'],{encoding:'utf8',input:'\n# Scoped Conduit Ubuntu acquisition DNS recovery\n'+rows.join('\n')+'\n',timeout:10000});
            if(append.status!==0)throw Error('Cannot install temporary host resolution: '+append.stderr);
            for(const host of ['archive.ubuntu.com','security.ubuntu.com']){
              const check=spawnSync('timeout',['4','getent','ahostsv4',host],{encoding:'utf8',timeout:6000});
              console.log(JSON.stringify({host,recoveredStatus:check.status}));
              if(check.status!==0)throw Error('Temporary resolution did not recover');
            }
          }
          JS
      - name: Acquire and verify real tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/pipeline/acquisition/compare.mjs setup target/benchmark "$TARGET"
      - name: Read cold measurement from this exact run
        uses: actions/download-artifact@v8.0.1
        with:
          name: acquisition-cold-${{ inputs.target }}
          path: target/cold
      - name: Compare identities and real preparation costs
        run: node tools/ci/pipeline/acquisition/compare.mjs compare target/cold/benchmark/benchmark.json target/benchmark/benchmark.json target/benchmark/comparison.json
      - name: Restore runner host resolution
        if: always()
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),os=require('node:os');
          const {spawnSync}=require('node:child_process');
          const backup=process.env.CONDUIT_DNS_BACKUP;
          if(backup){
            if(path.dirname(path.dirname(backup))!==os.tmpdir()||!/^conduit-ubuntu-dns-[A-Za-z0-9]+$/.test(path.basename(path.dirname(backup)))||path.basename(backup)!=='hosts'||!fs.lstatSync(backup).isFile())throw Error('Unexpected backup');
            const result=spawnSync('sudo',['-n','cp','--',backup,'/etc/hosts'],{encoding:'utf8',timeout:10000});
            if(result.status!==0)throw Error('Cannot restore host resolution: '+result.stderr);
            fs.rmSync(path.dirname(backup),{recursive:true});
          }
          JS
      - name: Retain measurements and real command logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-warm-${{ inputs.target }}
          path: |
            target/benchmark/
            target/acquisition/${{ inputs.target }}.json
          if-no-files-found: error
          retention-days: 14
