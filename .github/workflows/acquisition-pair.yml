name: Measure one target acquisition
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  cold:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      cache_key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
      BENCHMARK_PHASE: cold
      BENCHMARK_RUNNER: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Resolve exact tool specification and curated cache paths
        id: key
        run: cargo xtask ci pipeline acquisition-key "$TARGET"
      - name: Begin measurement
        env:
          BENCHMARK_KEY: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.key.outputs.key }}
        run: node tools/ci/pipeline/acquisition/compare.mjs begin target/benchmark
      - name: Restore exact run-scoped project cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.key.outputs.key }}
      - name: Record restore and require cold cache state
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          node tools/ci/pipeline/acquisition/compare.mjs restored target/benchmark
          test "$CACHE_HIT" != true
      - name: Diagnose CI resolver without exposing proxy values
        run: |
          node <<'JS'
          const {spawnSync}=require('node:child_process');
          const fs=require('node:fs');
          const names=['HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','http_proxy','https_proxy','all_proxy','NO_PROXY','no_proxy'];
          console.log(JSON.stringify({proxyConfigured:Object.fromEntries(names.map(name=>[name,Boolean(process.env[name])]))}));
          for(const host of ['archive.ubuntu.com','security.ubuntu.com','github.com']){
            for(const [user,program,args] of [
              ['runner','timeout',['6','getent','ahostsv4',host]],
              ['root','sudo',['-n','timeout','6','getent','ahostsv4',host]],
              ['apt','sudo',['-n','-u','_apt','timeout','6','getent','ahostsv4',host]],
            ]){
              const result=spawnSync(program,args,{encoding:'utf8',timeout:8000});
              console.log(JSON.stringify({user,host,status:result.status,error:result.error?.code,stdout:result.stdout,stderr:result.stderr}));
            }
          }
          for(const filename of ['/etc/resolv.conf',fs.realpathSync('/etc/resolv.conf')]){
            console.log(JSON.stringify({resolverFile:filename,mode:(fs.statSync(filename).mode&0o777).toString(8)}));
          }
          const result=spawnSync('curl',['--silent','--show-error','--fail','--head','--max-time','10','--output','/dev/null','https://archive.ubuntu.com/ubuntu/dists/noble/InRelease'],{encoding:'utf8',timeout:12000});
          console.log(JSON.stringify({curlArchiveStatus:result.status,error:result.error?.code,stderr:result.stderr}));
          JS
      - name: Acquire and verify real tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/pipeline/acquisition/compare.mjs setup target/benchmark "$TARGET"
      - name: Begin cache save measurement
        run: node tools/ci/pipeline/acquisition/compare.mjs saving target/benchmark
      - name: Save verified acquisition cache
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.key.outputs.key }}
      - name: Record cache save
        run: node tools/ci/pipeline/acquisition/compare.mjs saved target/benchmark
      - name: Retain measurements and real command logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-cold-${{ inputs.target }}
          path: |
            target/benchmark/
            target/acquisition/${{ inputs.target }}.json
          if-no-files-found: error
          retention-days: 14
  warm:
    needs: [cold]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
      BENCHMARK_PHASE: warm
      BENCHMARK_RUNNER: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Resolve exact tool specification and curated cache paths
        id: key
        run: cargo xtask ci pipeline acquisition-key "$TARGET"
      - name: Begin measurement
        env:
          BENCHMARK_KEY: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.cold.outputs.cache_key }}
        run: node tools/ci/pipeline/acquisition/compare.mjs begin target/benchmark
      - name: Restore exact run-scoped project cache
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: acquisition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.cold.outputs.cache_key }}
      - name: Record restore and require warm cache state
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          node tools/ci/pipeline/acquisition/compare.mjs restored target/benchmark
          test "$CACHE_HIT" = true
      - name: Acquire and verify real tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/pipeline/acquisition/compare.mjs setup target/benchmark "$TARGET"
      - name: Read cold measurement from this exact run
        uses: actions/download-artifact@v8.0.1
        with:
          name: acquisition-cold-${{ inputs.target }}
          path: target/cold
      - name: Compare identities and real preparation costs
        run: node tools/ci/pipeline/acquisition/compare.mjs compare target/cold/benchmark/benchmark.json target/benchmark/benchmark.json target/benchmark/comparison.json
      - name: Retain measurements and real command logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acquisition-warm-${{ inputs.target }}
          path: |
            target/benchmark/
            target/acquisition/${{ inputs.target }}.json
          if-no-files-found: error
          retention-days: 14
