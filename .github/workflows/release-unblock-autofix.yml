name: release-unblock-autofix

on:
  push:
    branches:
      - codex/3218-creche-first-bootstrap

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/3218-creche-first-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Apply focused release repairs
        run: |
          echo '' | base64 -d > /tmp/release-repair.py
          python3 /tmp/release-repair.py
          cargo fmt --all
      - name: Validate exact conduitos library tests
        run: cargo test -p conduitos --lib --locked
      - name: Commit validated repairs and remove helper workflow
        run: |
          rm .github/workflows/release-unblock-autofix.yml
          git config user.name "conduit-release-repair"
          git config user.email "dancxjo@users.noreply.github.com"
          git add -A
          git commit -m "Repair Crèche-first x86 release proofs"
          git push origin HEAD:codex/3218-creche-first-bootstrap
