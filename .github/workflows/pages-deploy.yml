name: pages-deploy

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request whose successful product carrier should be promoted
        required: false
        type: number
      main_sha:
        description: Exact current main commit to fabricate and promote
        required: false
        type: string
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      carrier_present: ${{ steps.resolve.outputs.carrier_present }}
      carrier_name: ${{ steps.resolve.outputs.carrier_name }}
      merge_commit: ${{ steps.resolve.outputs.merge_commit }}
      source_head: ${{ steps.resolve.outputs.source_head }}
      source_tree: ${{ steps.resolve.outputs.source_tree }}
      integration_base: ${{ steps.resolve.outputs.integration_base }}
      integration_tree: ${{ steps.resolve.outputs.integration_tree }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      disposition: ${{ steps.direct.outputs.disposition || steps.materialize.outputs.disposition }}
      direct_main: ${{ steps.resolve.outputs.direct_main }}
    steps:
      - name: Check out trusted merged workflow machinery
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the exact successful PR product run
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/resolve-pages-product-run.mjs
      - name: Check out the exact merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.merge_commit }}
          fetch-depth: 0
      - name: Fetch the immutable candidate object without executing it
        if: steps.resolve.outputs.direct_main != 'true'
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          SOURCE_HEAD: ${{ steps.resolve.outputs.source_head }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
      - name: Prepare the dependency-light merged controller
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Reconcile exact Pages carrier inputs with the merged tree
        id: reconcile
        if: steps.resolve.outputs.direct_main != 'true'
        env:
          SOURCE_HEAD: ${{ steps.resolve.outputs.source_head }}
          MERGE_COMMIT: ${{ steps.resolve.outputs.merge_commit }}
        run: |
          cargo build --locked --package conduit-xtask-dispatch
          target/debug/conduit-xtask-dispatch ci reconcile-product \
            products.pages-carrier "$SOURCE_HEAD" "$MERGE_COMMIT" \
            --locked --allow-execute \
            --json-out target/pages-product-reconciliation.json \
            >> "$GITHUB_OUTPUT"
      - name: Require exact carrier bytes for inherited promotion
        id: materialize
        if: steps.resolve.outputs.direct_main != 'true'
        env:
          RECONCILED_DISPOSITION: ${{ steps.reconcile.outputs.disposition }}
          CARRIER_PRESENT: ${{ steps.resolve.outputs.carrier_present }}
        run: |
          disposition=$RECONCILED_DISPOSITION
          if test "$disposition" = inherited && test "$CARRIER_PRESENT" != true; then
            disposition=execute
            echo 'Exact proof is inherited, but its carrier payload is absent; fabricate the merged tree.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
      - name: Fabricate the exact explicitly requested current main carrier
        id: direct
        if: steps.resolve.outputs.direct_main == 'true'
        run: echo 'disposition=execute' >> "$GITHUB_OUTPUT"

  integration-products:
    needs: resolve
    if: needs.resolve.outputs.disposition == 'execute'
    uses: ./.github/workflows/product-carrier.yml
    with:
      base_sha: ${{ needs.resolve.outputs.integration_base }}
      candidate_sha: ${{ needs.resolve.outputs.merge_commit }}
      # Execute means the carrier is needed even when the diff is metadata-only.
      # Reuse exact product selection instead of accepting a successful no-op.
      execute_proofs: '["products.pages-carrier"]'

  deploy:
    needs: [resolve, integration-products]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.resolve.outputs.disposition == 'inherited' || needs.integration-products.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.merge_commit }}
      - name: Download the inherited candidate Pages carrier
        if: needs.resolve.outputs.disposition == 'inherited'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.resolve.outputs.carrier_name }}
          path: target/pages-carrier
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the newly proven integration Pages carrier
        if: needs.resolve.outputs.disposition == 'execute'
        uses: actions/download-artifact@v8
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier
      - name: Admit the exact carrier selected by reconciliation
        env:
          EXPECTED_TREE: ${{ needs.resolve.outputs.disposition == 'inherited' && needs.resolve.outputs.source_tree || needs.resolve.outputs.integration_tree }}
        run: node tools/ci/verify-pages-carrier.mjs target/pages-carrier "$EXPECTED_TREE"
      - name: Install exact current-product truth and reseal the publication carrier
        if: needs.resolve.outputs.direct_main != 'true'
        env:
          ACCEPTED_SOURCE_SHA: ${{ needs.resolve.outputs.source_head }}
          ACCEPTED_MAIN_SHA: ${{ needs.resolve.outputs.merge_commit }}
          RELEASE_PR: ${{ needs.resolve.outputs.pr_number }}
          PRODUCT_RUN_ID: ${{ needs.resolve.outputs.run_id }}
        run: |
          git fetch --no-tags origin dev
          development_sha=$(git rev-parse FETCH_HEAD)
          cp -a target/pages-carrier/site target/pages-site-with-truth
          node tools/ci/emit-current-product-truth.mjs \
            target/pages-site-with-truth/product-truth.json \
            "$GITHUB_REPOSITORY" "$development_sha" "$ACCEPTED_SOURCE_SHA" \
            "$ACCEPTED_MAIN_SHA" "$RELEASE_PR" \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PRODUCT_RUN_ID" \
            target/pages-site-with-truth/supply-chain/conduitos-x86_64-pc
          source_tree=$(git rev-parse 'HEAD^{tree}')
          node tools/ci/seal-pages-carrier.mjs \
            target/pages-site-with-truth target/pages-carrier-with-truth \
            "$ACCEPTED_MAIN_SHA" "$source_tree"
          node tools/ci/verify-pages-carrier.mjs target/pages-carrier-with-truth "$source_tree"
      - name: Upload the already-proven Pages carrier
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ needs.resolve.outputs.direct_main == 'true' && 'target/pages-carrier/site' || 'target/pages-carrier-with-truth/site' }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy Conduit Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Retain the exact accepted base carrier for downstream documentary work
        if: needs.resolve.outputs.direct_main != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-release-pages-carrier-${{ needs.resolve.outputs.source_head }}
          path: target/pages-carrier
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Record exact downstream documentary context
        if: needs.resolve.outputs.direct_main != 'true'
        env:
          PROMOTION_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          CARRIER_RUN_ID: ${{ github.run_id }}
          CARRIER_NAME: conduit-release-pages-carrier-${{ needs.resolve.outputs.source_head }}
          RELEASE_PR: ${{ needs.resolve.outputs.pr_number }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_head }}
          SOURCE_TREE: ${{ needs.resolve.outputs.source_tree }}
          MAIN_COMMIT: ${{ needs.resolve.outputs.merge_commit }}
        run: |
          mkdir -p target/release-publication-context
          main_tree=$(git rev-parse 'HEAD^{tree}')
          jq -n \
            --arg schema conduit.release-publication-context/v2 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg promotion_run_id "$PROMOTION_RUN_ID" \
            --arg carrier_run_id "$CARRIER_RUN_ID" \
            --arg carrier_name "$CARRIER_NAME" \
            --arg release_pr "$RELEASE_PR" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_tree "$SOURCE_TREE" \
            --arg main_commit "$MAIN_COMMIT" \
            --arg main_tree "$main_tree" \
            '{schema:$schema,repository:$repository,promotion_run_id:$promotion_run_id,carrier_run_id:$carrier_run_id,carrier_name:$carrier_name,release_pr:$release_pr,source_commit:$source_commit,source_tree:$source_tree,main_commit:$main_commit,main_tree:$main_tree}' \
            > target/release-publication-context/context.json
      - name: Retain downstream documentary context
        if: needs.resolve.outputs.direct_main != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: conduit-release-publication-context
          path: target/release-publication-context/context.json
          if-no-files-found: error
          retention-days: 14
      - name: Dispatch documentary publication after software deployment
        if: needs.resolve.outputs.direct_main != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run journey-publication.yml --ref main
          -f pages_run_id="$GITHUB_RUN_ID"
