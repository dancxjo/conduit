name: promotion

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: promotion-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  boundary:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Admit only an exact frozen dev snapshot for stable promotion
        env:
          CONDUIT_EVENT_NAME: pull_request
          CONDUIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CONDUIT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CONDUIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONDUIT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CONDUIT_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/branch-boundary.mjs promotion
      - name: Verify exact source snapshot and merge ancestry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          read -r FIRST_PARENT DEV_SNAPSHOT EXTRA <<EOF
          $(git show -s --format='%P' "$HEAD_SHA")
          EOF
          test -n "$DEV_SNAPSHOT"
          test -z "$EXTRA"
          test "$FIRST_PARENT" = "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$DEV_SNAPSHOT"
          test "$(git rev-parse "$HEAD_SHA^{tree}")" = "$(git rev-parse "$DEV_SNAPSHOT^{tree}")"
          test "$(git show -s --format='%(trailers:key=Conduit-Dev-Snapshot,valueonly)' "$HEAD_SHA")" = "$DEV_SNAPSHOT"

  check:
    needs: boundary
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      full_suite: true

  products:
    needs: boundary
    uses: ./.github/workflows/executable-book-pages.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      full_suite: true

  promotion:
    needs: [boundary, check, products]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Require the exact integrated dev tree to be releasable
        env:
          BOUNDARY_RESULT: ${{ needs.boundary.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
        run: |
          test "$BOUNDARY_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
