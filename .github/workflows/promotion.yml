name: promotion

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # One materially started release owns the lane. GitHub preserves that run
  # and keeps at most one pending successor, replacing an older pending run
  # when a newer release arrives. The trusted release-lane controller records
  # and closes superseded PRs and handles failure/liveness explicitly.
  group: promotion-release-lane
  cancel-in-progress: false

jobs:
  boundary:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Admit only a same-repository release branch
        env:
          CONDUIT_EVENT_NAME: pull_request
          CONDUIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CONDUIT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CONDUIT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CONDUIT_REPOSITORY: ${{ github.repository }}
        run: node tools/ci/branch-boundary.mjs promotion
      - name: Verify the captured development snapshot remains in the release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          snapshot=${HEAD_REF#release/}
          test "$snapshot" != "$HEAD_REF"
          [[ "$snapshot" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$snapshot"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$snapshot" origin/dev
          git merge-base --is-ancestor "$snapshot" HEAD

  check:
    needs: boundary
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      full_suite: true

  products:
    # Fail the machine gate before fabricating all products and browser carriers.
    # check runs its x86 prerequisite first and retains the exact prepared image.
    needs: [boundary, check]
    uses: ./.github/workflows/tour-products.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      full_suite: true

  conduitos-spore-acceptance:
    needs: [check, products]
    if: always() && !cancelled() && needs.check.result == 'success' && needs.products.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: conduitos-spore-acceptance
      - name: Receive the exact Crèche-exported ConduitOS spore
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-creche-conduitos-spore-${{ github.event.pull_request.head.sha }}
          path: target/conduitos/x86_64
      - name: Receive the exact ConduitOS tool bundle
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduitos-tools-${{ github.event.pull_request.head.sha }}
          path: target/conduitos/tool-bundle
      - name: Install the pinned ConduitOS tools without mirror access
        run: targets/conduitos/tools/conduitos-tools.sh install target/conduitos/tool-bundle
      - name: Boot the exact Crèche artifact through the ordinary product journey
        run: >-
          cargo xtask conduitos acceptance --locked
          --spore target/conduitos/x86_64/creche-export.iso
      - name: Capture the native Body journey proof capsule
        env:
          EXACT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: >-
          node tools/ci/capture-three-body-track.mjs native "$EXACT_COMMIT"
          target/conduitos/x86_64/journey-proof.json -
          "$RUNNER_TEMP/native-body-journey"
      - name: Retain the native Body journey proof capsule
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-native-body-journey-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-body-journey
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Retain exact visual and failure evidence
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduitos-creche-acceptance-${{ github.event.pull_request.head.sha }}
          path: |
            target/conduitos/x86_64/creche-spore-acceptance.json
            target/conduitos/x86_64/journey-proof.json
            target/conduitos/x86_64/journey-frames
            target/conduitos/x86_64/journey-serial.log
            target/conduitos/x86_64/journey-qmp.log
            target/conduitos/x86_64/journey-qemu-stderr.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  generative-body-journey:
    # The provider proof is independent of product fabrication. Run it beside
    # the long product fan-out instead of adding it to the release critical path.
    needs: [boundary, check]
    if: always() && !cancelled() && needs.boundary.result == 'success' && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: three-body-journey
      - name: Restore the exact local model blobs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ollama-cache/models
          key: ollama-${{ runner.os }}-0.12.3-gemma3-270m-v1
      - name: Capture the structured-Face generative Body journey
        run: |
          mkdir -p "$RUNNER_TEMP/ollama-cache/models"
          docker run --detach --name conduit-ollama -p 11434:11434 \
            --volume "$RUNNER_TEMP/ollama-cache/models:/root/.ollama/models" \
            ollama/ollama:0.12.3@sha256:36ccf1b4c161179a198a19e897aa0a1acd54cd5eeb6ab99c80f2ef50ba7fa106
          docker cp conduit-ollama:/bin/ollama "$RUNNER_TEMP/ollama"
          chmod 755 "$RUNNER_TEMP/ollama"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            test "$attempt" -lt 30
            sleep 1
          done
          PATH="$RUNNER_TEMP:$PATH" "$RUNNER_TEMP/ollama" pull gemma3:270m
          PATH="$RUNNER_TEMP:$PATH" cargo xtask --json host prove-local-model --locked \
            --model gemma3:270m --admitted-memory-mib 2048 --orifina-presenter \
            > "$RUNNER_TEMP/model-body.json"
          node tools/ci/capture-three-body-track.mjs generative \
            "${{ github.event.pull_request.head.sha }}" "$RUNNER_TEMP/model-body.json" - \
            "$RUNNER_TEMP/generative-body-journey"
      - name: Retain the generative Body proof capsule
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-generative-body-journey-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/generative-body-journey
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  three-body-journey:
    needs: [products, conduitos-spore-acceptance, generative-body-journey]
    if: >-
      always() && !cancelled() &&
      needs.products.result == 'success' &&
      needs.conduitos-spore-acceptance.result == 'success' &&
      needs.generative-body-journey.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: three-body-journey
      - name: Receive the three bounded Body proof capsules
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-browser-body-journey-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/three-bodies/browser-graphical
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-native-body-journey-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/three-bodies/native-graphical
      - uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-generative-body-journey-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/three-bodies/hosted-generative
      - name: Verify and publish the exact three-Body comparison
        env:
          EXACT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo xtask evidence three-body-journey-contract --locked \
            --commit "$EXACT_COMMIT" --output "$RUNNER_TEMP/three-bodies/contract.json"
          cargo xtask evidence three-body-journey --locked \
            --commit "$EXACT_COMMIT" \
            --contract "$RUNNER_TEMP/three-bodies/contract.json" \
            --track "$RUNNER_TEMP/three-bodies/native-graphical/track.json" \
            --track "$RUNNER_TEMP/three-bodies/browser-graphical/track.json" \
            --track "$RUNNER_TEMP/three-bodies/hosted-generative/track.json" \
            --output "$RUNNER_TEMP/three-bodies/index.json"
      - name: Retain the exact three-Body Journey
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-three-body-journey-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/three-bodies
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  pages-carrier-with-conduitos:
    needs: [products, conduitos-spore-acceptance, three-body-journey]
    if: always() && !cancelled() && needs.products.result == 'success' && needs.conduitos-spore-acceptance.result == 'success' && needs.three-body-journey.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Receive the already-proven Pages carrier
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier-base
      - name: Receive the already-proven ConduitOS visual journey
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduitos-x86-batch-${{ github.event.pull_request.head.sha }}
          path: target/conduitos-x86-batch
      - name: Receive the sealed sibling journey gallery
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-journey-gallery-${{ github.event.pull_request.head.sha }}
          path: target/journey-gallery-carrier
      - name: Receive the exact three-Body Journey
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-three-body-journey-${{ github.event.pull_request.head.sha }}
          path: target/three-body-journey
      - name: Append only validated promotion evidence and reseal the carrier
        run: |
          source_commit=$(git rev-parse HEAD)
          source_tree=$(git rev-parse 'HEAD^{tree}')
          node tools/ci/verify-pages-carrier.mjs target/pages-carrier-base "$source_tree"
          node tools/ci/verify-pages-carrier.mjs target/journey-gallery-carrier "$source_tree"
          rm -rf target/pages-site target/pages-carrier-with-conduitos
          cp -a target/pages-carrier-base/site target/pages-site
          node tools/ci/stage-journey-pages-evidence.mjs \
            target/journey-gallery-carrier/site target/pages-site "$source_commit"
          cargo xtask evidence stage-three-body-journey --locked \
            --publication-root target/three-body-journey \
            --site-root target/pages-site --commit "$source_commit"
          node tools/ci/stage-conduitos-pages-evidence.mjs \
            target/conduitos-x86-batch/runs/product-journey/conduitos/x86_64/journey-frames \
            target/pages-site "$source_commit"
          node tools/ci/seal-pages-carrier.mjs target/pages-site target/pages-carrier-with-conduitos "$source_commit" "$source_tree"
          node tools/ci/verify-pages-carrier.mjs target/pages-carrier-with-conduitos "$source_tree"
      - name: Retain the promotion-only Pages carrier with ConduitOS frames
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-pages-carrier-with-conduitos
          path: target/pages-carrier-with-conduitos
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  promotion:
    needs: [boundary, check, products, conduitos-spore-acceptance, pages-carrier-with-conduitos]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Require the exact integrated dev tree to be releasable
        env:
          BOUNDARY_RESULT: ${{ needs.boundary.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
          CONDUITOS_SPORE_RESULT: ${{ needs.conduitos-spore-acceptance.result }}
          CONDUITOS_PAGES_RESULT: ${{ needs.pages-carrier-with-conduitos.result }}
        run: |
          test "$BOUNDARY_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
          test "$CONDUITOS_SPORE_RESULT" = success
          test "$CONDUITOS_PAGES_RESULT" = success
