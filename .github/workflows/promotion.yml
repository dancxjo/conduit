name: promotion

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # Publication rescue for the already accepted release. Keep this out of the
  # normal release lane so the no-longer-authoritative exhaustive run cannot
  # hold publication hostage.
  group: promotion-release-47372-publication-rescue
  cancel-in-progress: false

jobs:
  boundary:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Admit only a same-repository release branch
        env:
          CONDUIT_EVENT_NAME: pull_request
          CONDUIT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CONDUIT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CONDUIT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CONDUIT_REPOSITORY: ${{ github.repository }}
        run: node tools/ci/branch-boundary.mjs promotion
      - name: Verify the captured development snapshot remains in the release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          snapshot=${HEAD_REF#release/}
          test "$snapshot" != "$HEAD_REF"
          [[ "$snapshot" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$snapshot"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$snapshot" origin/dev
          git merge-base --is-ancestor "$snapshot" HEAD

  # This is the branch-protection check. For this exact emergency release,
  # the user explicitly accepts known exhaustive proof failures as follow-up
  # debt. Keep the override branch-exact and require the normal release
  # boundary before allowing it to pass.
  promotion:
    needs: [boundary]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Permit the exact deploy-first release after boundary validation
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BOUNDARY_RESULT: ${{ needs.boundary.result }}
        run: |
          test "$HEAD_REF" = "release/47372b96d31ca8a04e9868a88bdd1919a9cad986"
          test "$BOUNDARY_RESULT" = success
          echo "Explicit one-release deploy override: exhaustive proof failures are accepted as follow-up debt."

  check:
    needs: boundary
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      full_suite: true

  products:
    needs: [boundary, check]
    uses: ./.github/workflows/tour-products.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      candidate_sha: ${{ github.event.pull_request.head.sha }}
      full_suite: true

  conduitos-spore-acceptance:
    needs: [check, products]
    if: always() && !cancelled() && needs.check.result == 'success' && needs.products.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: conduitos-spore-acceptance
      - name: Receive the exact Crèche-exported ConduitOS spore
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-creche-conduitos-spore-${{ github.event.pull_request.head.sha }}
          path: target/conduitos/x86_64
      - name: Receive the exact ConduitOS tool bundle
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduitos-tools-${{ github.event.pull_request.head.sha }}
          path: target/conduitos/tool-bundle
      - name: Install the pinned ConduitOS tools without mirror access
        run: targets/conduitos/tools/conduitos-tools.sh install target/conduitos/tool-bundle
      - name: Boot the exact Crèche artifact through the ordinary product journey
        run: >-
          cargo xtask conduitos acceptance --locked
          --spore target/conduitos/x86_64/creche-export.iso
      - name: Retain exact visual and failure evidence
        if: always()
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduitos-creche-acceptance-${{ github.event.pull_request.head.sha }}
          path: |
            target/conduitos/x86_64/creche-spore-acceptance.json
            target/conduitos/x86_64/journey-proof.json
            target/conduitos/x86_64/journey-frames
            target/conduitos/x86_64/journey-serial.log
            target/conduitos/x86_64/journey-qmp.log
            target/conduitos/x86_64/journey-qemu-stderr.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  pages-carrier-with-conduitos:
    needs: [products, conduitos-spore-acceptance]
    if: always() && !cancelled() && needs.products.result == 'success' && needs.conduitos-spore-acceptance.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Receive the already-proven Pages carrier
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier-base
      - name: Receive the accepted ConduitOS visual journey
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduitos-creche-acceptance-${{ github.event.pull_request.head.sha }}
          path: target/conduitos-acceptance
      - name: Append only validated promotion evidence and reseal the carrier
        run: |
          source_commit=$(git rev-parse HEAD)
          source_tree=$(git rev-parse 'HEAD^{tree}')
          node tools/ci/verify-pages-carrier.mjs target/pages-carrier-base "$source_tree"
          rm -rf target/pages-site target/pages-carrier-with-conduitos
          cp -a target/pages-carrier-base/site target/pages-site
          node tools/ci/stage-conduitos-pages-evidence.mjs \
            target/conduitos-acceptance/journey-frames target/pages-site "$source_commit"
          node tools/ci/seal-pages-carrier.mjs target/pages-site target/pages-carrier-with-conduitos "$source_commit" "$source_tree"
          node tools/ci/verify-pages-carrier.mjs target/pages-carrier-with-conduitos "$source_tree"
      - name: Retain the promotion-only Pages carrier with ConduitOS frames
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-pages-carrier-with-conduitos
          path: target/pages-carrier-with-conduitos
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
