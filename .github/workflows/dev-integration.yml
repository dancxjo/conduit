name: dev-integration

on:
  push:
    branches: [dev]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dev-integration
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event.before }}
      candidate_sha: ${{ github.sha }}
      development_admission: true

  products:
    uses: ./.github/workflows/tour-products.yml
    with:
      base_sha: ${{ github.event.before }}
      candidate_sha: ${{ github.sha }}
      development_admission: true

  dev-integration:
    needs: [check, products]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Keep the construction site usable
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
