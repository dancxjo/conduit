name: dev-integration

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact previous dev commit
        required: true
        type: string
      candidate_sha:
        description: Exact current dev commit
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: dev-integration
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
      candidate_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      development_admission: true

  products:
    uses: ./.github/workflows/tour-products.yml
    with:
      base_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
      candidate_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      development_admission: true

  dev-integration:
    needs: [check, products]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    steps:
      - name: Keep the construction site usable
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
      - name: Continue the release train after an explicitly dispatched integration
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-dev.yml --ref main
