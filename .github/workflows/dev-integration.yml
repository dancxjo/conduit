name: dev-integration

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact previous dev commit
        required: true
        type: string
      candidate_sha:
        description: Exact current dev commit
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: dev-integration
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-slim
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Include changes from coalesced development updates
        id: base
        env:
          EVENT_SHA: ${{ github.sha }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
        run: |
          # Dispatch run metadata must identify the same commit it proves.
          test -z "$INPUT_SHA" || test "$INPUT_SHA" = "$EVENT_SHA"
          git fetch --no-tags origin main
          printf 'sha=%s\n' "$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: baseline
    uses: ./.github/workflows/check.yml
    with:
      base_sha: ${{ needs.baseline.outputs.base_sha }}
      candidate_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      development_admission: true

  products:
    needs: baseline
    uses: ./.github/workflows/tour-products.yml
    with:
      base_sha: ${{ needs.baseline.outputs.base_sha }}
      candidate_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      development_admission: true

  dev-integration:
    needs: [check, products]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Keep the construction site usable
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          PRODUCTS_RESULT: ${{ needs.products.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$PRODUCTS_RESULT" = success
      - name: Continue the release train after an explicitly dispatched integration
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATED_SHA: ${{ inputs.candidate_sha }}
        run: |
          main_controller=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/promote-dev.yml?ref=main" \
            --jq .content | base64 --decode)
          if grep -q 'integrated_sha:' <<< "$main_controller"; then
            gh workflow run promote-dev.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f integrated_sha="$INTEGRATED_SHA"
          else
            printf 'The trusted main controller predates exact dispatch inputs; its workflow_run trigger owns this completed integration.\n'
          fi
