name: Monitor trusted release pull request

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Trusted pull request class
        required: true
        type: choice
        options: [release, sync]
      pr_number:
        description: Exact pull request number
        required: true
        type: number
      head_sha:
        description: Exact pull request head commit
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: monitor-trusted-pr-${{ inputs.kind }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
        if: inputs.kind == 'sync'
        with:
          components: rustfmt
      - name: Admit, observe, and finalize the exact trusted pull request
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r .state <<<"$pull")" = open
          test "$(jq -r .head.repo.full_name <<<"$pull")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .head.sha <<<"$pull")" = "$HEAD_SHA"
          head_branch=$(jq -r .head.ref <<<"$pull")
          base_branch=$(jq -r .base.ref <<<"$pull")
          case "$KIND" in
            release)
              test "$base_branch" = main
              snapshot=${head_branch#release/}
              test "$snapshot" != "$head_branch"
              [[ "$snapshot" =~ ^[0-9a-f]{40}$ ]]
              expected_workflow=promotion
              ;;
            sync)
              test "$base_branch" = dev
              release_merge=${head_branch#sync-release/}
              test "$release_merge" != "$head_branch"
              [[ "$release_merge" =~ ^[0-9a-f]{40}$ ]]
              expected_workflow=candidate
              ;;
            *) exit 2 ;;
          esac
          git fetch --no-tags origin main dev
          git fetch --no-tags origin "refs/heads/$head_branch"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          if test "$KIND" = release; then
            git merge-base --is-ancestor "$snapshot" "$HEAD_SHA"
            git merge-base --is-ancestor "$snapshot" origin/dev
          else
            git merge-base --is-ancestor "$release_merge" origin/main
            git merge-base --is-ancestor "$release_merge" "$HEAD_SHA"
          fi
          if test "$KIND" = sync; then
            event_path="$RUNNER_TEMP/trusted-sync-event.json"
            jq -n --argjson pull_request "$pull" '{pull_request: $pull_request}' > "$event_path"
            event_base_sha=$(jq -r .base.sha <<<"$pull")
            git checkout --detach "$HEAD_SHA"
            CONDUIT_EVENT_NAME=pull_request \
              CONDUIT_BASE_REF=dev \
              BASE_SHA="$event_base_sha" \
              HEAD_SHA="$HEAD_SHA" \
              node tools/ci/branch-boundary.mjs candidate
            GITHUB_EVENT_PATH="$event_path" node tools/ci/pr-closing-intent.mjs
            git diff --check "$event_base_sha" "$HEAD_SHA"
            cargo fmt --all -- --check
            cargo test --locked --package conduit-xtask-dispatch
            node --test \
              proof/ci/branch-boundary.spec.mjs \
              proof/ci/browser-product-ownership.test.mjs \
              proof/ci/pr-closing-intent.test.mjs \
              proof/ci/release-lane-controller.spec.mjs \
              proof/ci/tour-compatibility.test.mjs
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name=candidate \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion=success \
              -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f 'output[title]=Trusted sync candidate validation passed' \
              -f 'output[summary]=The exact sync head passed the focused candidate contract.'
          else
            run_id=
            approved_run=
            last_progress=$(date +%s)
            last_fingerprint=
            started_at=
            for attempt in $(seq 1 90); do
              current=$(gh pr view "$PR_NUMBER" --json state,headRefOid)
              test "$(jq -r .state <<<"$current")" = OPEN
              test "$(jq -r .headRefOid <<<"$current")" = "$HEAD_SHA"
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100")
              run=$(jq -c --arg name "$expected_workflow" --argjson number "$PR_NUMBER" '
                [.workflow_runs[] |
                 select(.name == $name and any(.pull_requests[]?; .number == $number))] |
                sort_by(.created_at) | last // empty
              ' <<<"$runs")
              if test -n "$run"; then
                run_id=$(jq -r .id <<<"$run")
                status=$(jq -r .status <<<"$run")
                conclusion=$(jq -r '.conclusion // ""' <<<"$run")
                test -n "$started_at" || started_at=$(jq -r '.run_started_at // .created_at' <<<"$run")
                jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100&filter=latest")
                fingerprint=$(jq -c '[.jobs[] | {id,status,conclusion,started_at,completed_at}] | sort_by(.id)' <<<"$jobs")
                now=$(date +%s)
                if test "$fingerprint" != "$last_fingerprint"; then
                  last_fingerprint=$fingerprint
                  last_progress=$now
                fi
                failed=$(jq -c '[.jobs[] | select(.conclusion == "failure") | {id,name,html_url}]' <<<"$jobs")
                if test "$(jq length <<<"$failed")" -gt 0; then
                  marker="<!-- conduit-release-cancelled-bad:$run_id -->"
                  if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
                    --jq '.[].body' | grep -Fq "$marker"; then
                    summary=$(jq -r '.[] | "- " + .name + ": " + .html_url' <<<"$failed")
                    gh pr comment "$PR_NUMBER" --body "$marker
Release attempt \`$run_id\` for exact head \`$HEAD_SHA\` is known bad and remaining work is being cancelled.

$summary"
                  fi
                  test "$status" = completed || gh run cancel "$run_id"
                  exit 1
                fi
                start_epoch=$(date -d "$started_at" +%s)
                if test $((now - last_progress)) -ge 900 || test $((now - start_epoch)) -ge 2700; then
                  gh workflow run release-lane.yml --ref main
                  printf 'Release %s run %s made no bounded progress; release-lane escalation dispatched.\n' "$PR_NUMBER" "$run_id" >&2
                  exit 1
                fi
                if test "$conclusion" = action_required && test "$approved_run" != "$run_id"; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
                  approved_run=$run_id
                elif test "$status" = completed; then
                  if test "$conclusion" = success; then
                    break
                  fi
                  if test "$conclusion" = cancelled; then
                    gh workflow run release-lane.yml --ref main
                    printf 'Release run %s was cancelled before acceptance; release-lane reconciliation owns its terminal classification.\n' "$run_id" >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  test "$conclusion" = success
                fi
              fi
              test "$attempt" -lt 90
              sleep 30
            done
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          fi
          current=$(gh pr view "$PR_NUMBER" --json state,headRefOid,url)
          test "$(jq -r .state <<<"$current")" = OPEN
          test "$(jq -r .headRefOid <<<"$current")" = "$HEAD_SHA"
          pr_url=$(jq -r .url <<<"$current")
          git fetch --no-tags origin "$base_branch"
          base_sha=$(git rev-parse "origin/$base_branch")
          if test "$KIND" = release; then
            gh pr merge "$pr_url" --merge --match-head-commit "$HEAD_SHA"
            merge_sha=$(gh pr view "$PR_NUMBER" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')
          else
            expected_tree=$(git merge-tree --write-tree "$base_sha" "$HEAD_SHA")
            [[ "$expected_tree" =~ ^[0-9a-f]{40}$ ]]
            base_tree=$(git rev-parse "$base_sha^{tree}")
            if test "$expected_tree" = "$base_tree"; then
              gh pr close "$pr_url" --comment "Development already contains the accepted release tree; no synchronization commit is required."
              printf 'Synchronization %s is already represented by dev %s; no merge commit was created.\n' \
                "$HEAD_SHA" "$base_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh pr merge "$pr_url" --squash --match-head-commit "$HEAD_SHA" --auto
            merge_sha=
            for attempt in $(seq 1 12); do
              current=$(gh pr view "$PR_NUMBER" --json state,headRefOid,mergeCommit)
              test "$(jq -r .headRefOid <<<"$current")" = "$HEAD_SHA"
              state=$(jq -r .state <<<"$current")
              if test "$state" = MERGED; then
                merge_sha=$(jq -r .mergeCommit.oid <<<"$current")
                break
              fi
              test "$state" = OPEN
              test "$attempt" -lt 12
              sleep 5
            done
          fi
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$base_branch"
          test "$(git rev-parse "origin/$base_branch")" = "$merge_sha"
          test "$(git rev-parse "$merge_sha^1")" = "$base_sha"
          if test "$KIND" = release; then
            test "$(git rev-parse "$merge_sha^2")" = "$HEAD_SHA"
            test "$(git rev-parse "$merge_sha^{tree}")" = "$(git rev-parse "$HEAD_SHA^{tree}")"
            gh workflow run tour-and-creche-pages --ref main -f pr_number="$PR_NUMBER"
            gh workflow run sync-release-to-dev.yml --ref main \
              -f pr_number="$PR_NUMBER" -f merge_sha="$merge_sha"
          else
            test "$(git rev-parse "$merge_sha^{tree}")" = "$expected_tree"
            gh workflow run dev-integration.yml --ref dev \
              -f base_sha="$base_sha" -f candidate_sha="$merge_sha"
          fi
