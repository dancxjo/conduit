name: Measure tool acquisition
on:
  pull_request:
    branches: [dev]
    types: [ready_for_review]
    paths:
      - '.github/workflows/acquisition.yml'
      - '.github/workflows/acquisition-pair.yml'
      - '.github/workflows/ci.yml'
      - 'tools/ci/pipeline/**'
      - 'tools/xtask/src/commands/avr/**'
  workflow_dispatch:
    inputs:
      targets:
        description: 'all, or comma-separated pipeline target IDs (also preflight,unit)'
        type: string
        default: 'unit,preflight,conduitos-ia32,browser,rp2040,avr,esp32-c3,esp32-s3'
        required: true
permissions:
  contents: read
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - id: matrix
        env:
          SELECTION: ${{ inputs.targets || 'unit,preflight,conduitos-ia32,browser,rp2040,avr,esp32-c3,esp32-s3' }}
        run: echo "matrix=$(node tools/ci/pipeline/acquisition/compare.mjs matrix "$SELECTION")" >> "$GITHUB_OUTPUT"
  measure:
    needs: [select]
    strategy:
      fail-fast: false
      # Finish each cold/warm pair before admitting a new wave of cache keys.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/acquisition-pair.yml
    with:
      target: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
