name: Comparative benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/comparative-benchmarks.yml"
      - "benchmarks/comparative/**"
      - "crates/conduit-benchmark/**"
      - "crates/conduit-core/**"
      - "crates/conduit-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Run the full 1,000,000-value fixture
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: comparative-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comparative:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: benchmarks/comparative/javascript/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Select full or smoke input cardinality
        id: size
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$FULL_INPUT" == "true" ]]; then
            echo "values=1000000" >> "$GITHUB_OUTPUT"
          else
            echo "values=10000" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pinned comparative matrix
        env:
          CONDUIT_BENCHMARK_VALUES: ${{ steps.size.outputs.values }}
          CONDUIT_BENCHMARK_MACHINE_CLASS: github-hosted-ubuntu-x86_64
        run: bash benchmarks/comparative/run.sh target/comparative-benchmark
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: comparative-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: target/comparative-benchmark
          if-no-files-found: error
          retention-days: 30
