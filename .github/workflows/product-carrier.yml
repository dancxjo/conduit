name: product-carrier

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      execute_proofs:
        description: Exact product proof IDs selected by trusted reconciliation; empty keeps ordinary impact planning
        required: false
        default: ''
        type: string
      full_suite:
        description: Make and prove the complete stable-main product carrier
        required: false
        default: false
        type: boolean
      development_admission:
        description: Prove affected browser presentation without release make
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact target-base commit
        required: true
        type: string
      candidate_sha:
        description: Exact immutable candidate commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  CONDUIT_CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  CONDUIT_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
concurrency:
  group: product-carrier-${{ github.event.pull_request.number || github.ref }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ inputs.full_suite || inputs.development_admission && fromJSON(steps.impact.outputs.browser_required || 'false') || (inputs.execute_proofs != '' && fromJSON(steps.exact.outputs.required)) || (inputs.execute_proofs == '' && fromJSON(steps.slice.outputs.required || steps.impact.outputs.pages_products_required || 'true')) }}
      proofs: ${{ (inputs.execute_proofs != '' && inputs.execute_proofs) || steps.slice.outputs.proofs || steps.impact.outputs.pages_product_proofs || '[]' }}
      browser_runtime_required: ${{ inputs.full_suite || inputs.development_admission && fromJSON(steps.impact.outputs.browser_required || 'false') || (inputs.execute_proofs != '' && fromJSON(steps.exact.outputs.browser_runtime_required)) || (inputs.execute_proofs == '' && fromJSON(steps.slice.outputs.required || steps.impact.outputs.pages_products_required || 'true')) }}
      pages_carrier_required: ${{ inputs.full_suite || !inputs.development_admission && ((inputs.execute_proofs != '' && fromJSON(steps.exact.outputs.pages_carrier_required)) || (inputs.execute_proofs == '' && fromJSON(steps.slice.outputs.required || steps.impact.outputs.pages_products_required || 'true'))) }}
      browser_admission_required: ${{ inputs.development_admission && fromJSON(steps.impact.outputs.browser_required || 'false') }}
      browser_admission_matrix: ${{ (!inputs.development_admission || inputs.full_suite) && '["browser-host","workspace","pages"]' || steps.impact.outputs.browser_admission_matrix || '["browser-host","workspace","pages"]' }}
      browser_release_required: ${{ inputs.full_suite || !inputs.development_admission && ((inputs.execute_proofs != '' && fromJSON(steps.exact.outputs.pages_carrier_required)) || (inputs.execute_proofs == '' && fromJSON(steps.slice.outputs.required || steps.impact.outputs.pages_products_required || 'true'))) || inputs.development_admission && fromJSON(steps.impact.outputs.browser_required || 'false') && (contains(steps.impact.outputs.browser_admission_matrix, 'workspace') || contains(steps.impact.outputs.browser_admission_matrix, 'pages')) }}
      host_releases_required: ${{ inputs.full_suite || !inputs.development_admission && fromJSON(steps.slice.outputs.required || steps.impact.outputs.pages_products_required || 'true') }}
      stack_role: ${{ steps.stack.outputs.role || 'independent' }}
      stack_tip_pr: ${{ steps.stack.outputs.tip_pr || github.event.pull_request.number }}
      stack_tip_sha: ${{ steps.stack.outputs.tip_sha || env.CONDUIT_CANDIDATE_SHA }}
      standalone_locks_required: ${{ inputs.full_suite && 'true' || steps.impact.outputs.esp32_required || 'true' }}
      controller_sha: ${{ steps.controller.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Resolve the current trusted CI controller
        id: controller
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          read -r controller_sha _ < <(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")
          if ! [[ "$controller_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted controller did not resolve to an exact commit" >&2
            exit 1
          fi
          echo "sha=$controller_sha" >> "$GITHUB_OUTPUT"
          printf 'Trusted controller: `%s` from `%s`\n' "$controller_sha" "$DEFAULT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize the trusted controller outside the candidate workspace
        env:
          CONTROLLER_SHA: ${{ steps.controller.outputs.sha }}
        run: |
          git fetch --no-tags origin "$CONTROLLER_SHA"
          git worktree add --detach "$RUNNER_TEMP/conduit-ci-controller" "$CONTROLLER_SHA"
      - name: Classify this immutable candidate within its open PR stack
        id: stack
        if: github.event_name == 'pull_request' && inputs.candidate_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONDUIT_PR_NUMBER: ${{ github.event.pull_request.number }}
          CONDUIT_STACK_ROLE_OUT: target/product-plan/pr-stack-role.json
        run: |
          mapfile -t classifiers < <(git -C "$RUNNER_TEMP/conduit-ci-controller" ls-files -- '*/classify-pr-stack.mjs')
          if test "${#classifiers[@]}" -ne 1; then
            echo 'Expected one tracked stack classifier in the trusted controller.' >&2
            exit 1
          fi
          mkdir -p target/ci-plans
          node "$RUNNER_TEMP/conduit-ci-controller/${classifiers[0]}"
      - name: Retain cheap product slice evidence for an intermediate PR
        id: slice
        if: steps.stack.outputs.role == 'intermediate'
        run: |
          git diff --check "$CONDUIT_BASE_SHA" "$CONDUIT_CANDIDATE_SHA"
          echo 'required=false' >> "$GITHUB_OUTPUT"
          echo 'proofs=[]' >> "$GITHUB_OUTPUT"
          printf 'Intermediate PR slice is covered by cumulative tip PR #%s at `%s`; no product make is scheduled.\n' \
            '${{ steps.stack.outputs.tip_pr }}' '${{ steps.stack.outputs.tip_sha }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1.98.1
        if: steps.stack.outputs.role != 'intermediate'
        with:
          components: clippy,rustfmt
      - name: Build the dependency-light trusted CI controller
        if: steps.stack.outputs.role != 'intermediate'
        run: >-
          CARGO_TARGET_DIR="$RUNNER_TEMP/conduit-ci-controller-target"
          cargo build
          --manifest-path "$RUNNER_TEMP/conduit-ci-controller/Cargo.toml"
          --package conduit-xtask-dispatch --locked
      - name: Verify the exact generic Rust toolchain before product fan-out
        if: steps.stack.outputs.role != 'intermediate'
        run: >-
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch"
          ci rust-toolchain-preflight --locked
      - name: Select exact product proof impact
        id: impact
        if: steps.stack.outputs.role != 'intermediate'
        run: |
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch" \
            ci plan "$CONDUIT_BASE_SHA" "$CONDUIT_CANDIDATE_SHA" --locked \
            --json-out target/product-plan/impact.json \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            >> "$GITHUB_OUTPUT"
      - name: Project the trusted reconciliation delta onto product jobs
        id: exact
        if: steps.stack.outputs.role != 'intermediate' && inputs.execute_proofs != ''
        env:
          EXECUTE_PROOFS: ${{ inputs.execute_proofs }}
        run: >-
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch"
          ci product-execution-plan --proof-ids-json "$EXECUTE_PROOFS" --locked
          >> "$GITHUB_OUTPUT"
  browser-runtimes:
    needs: plan
    if: needs.plan.outputs.browser_runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Build the exact browser Host and product runtimes
        env:
          BROWSER_ADMISSION_MATRIX: ${{ needs.plan.outputs.browser_admission_matrix }}
        run: |
          mkdir -p target/browser-product-runtimes
          cargo build --locked -p conduit-browser-host
          cp target/debug/conduit-browser-host target/browser-product-runtimes/conduit-browser-host
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"browser-host"'* ]]; then
            cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features protected-line
            cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/browser-product-runtimes/browser-host-runtime.wasm
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"workspace"'* || "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release --no-default-features --features creche-surface,form-runner
            cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/browser-product-runtimes/workspace-runtime.wasm
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"browser-host"'* || "$BROWSER_ADMISSION_MATRIX" == *'"workspace"'* || "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            cargo build --locked -p conduit-browser-runtime --target wasm32-unknown-unknown --release
            cp target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm target/browser-product-runtimes/patchbay-runtime.wasm
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"workspace"'* || "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            cargo build --locked -p patchbay-html --bin patchbay-static-assets --bin patchbay-html -p patchbay-native --bin browser-parts-capstone
            cp target/debug/patchbay-static-assets target/debug/patchbay-html target/debug/browser-parts-capstone target/browser-product-runtimes/
          fi
          cargo build --locked --bin webchat-server -p conduit-std-host --bin browser-admission-probe --bin protected-line-browser-peer
          cargo build --locked -p conduit --bin conduit --bin conduit-relay
          cargo build --locked -p conduit-std-host --features native-webrtc --bin native-webrtc-line-probe
          cp target/debug/conduit target/debug/conduit-relay target/debug/webchat-server target/debug/browser-admission-probe target/debug/protected-line-browser-peer target/debug/native-webrtc-line-probe target/browser-product-runtimes/
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-browser-product-runtimes
          path: target/browser-product-runtimes
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  standalone-locks:
    needs: plan
    if: needs.plan.outputs.pages_carrier_required == 'true' && needs.plan.outputs.standalone_locks_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - name: Materialize the trusted CI controller outside the candidate workspace
        env:
          CONTROLLER_SHA: ${{ needs.plan.outputs.controller_sha }}
        run: |
          git fetch --no-tags origin "$CONTROLLER_SHA"
          git worktree add --detach "$RUNNER_TEMP/conduit-ci-controller" "$CONTROLLER_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/conduit-ci-controller-target" \
            cargo build --manifest-path "$RUNNER_TEMP/conduit-ci-controller/Cargo.toml" \
            --package conduit-xtask-dispatch --locked
      - name: Validate every standalone make lock before machine fan-out
        run: >-
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch"
          ci standalone-locks --locked

  browser-admission-stage:
    needs: [plan, browser-runtimes, browser-release]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.browser_admission_required == 'true' &&
      needs.browser-runtimes.result == 'success' &&
      (needs.plan.outputs.browser_release_required != 'true' || needs.browser-release.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - name: Download the exact browser product runtimes
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-browser-product-runtimes
          path: target/browser-product-runtimes
      - name: Download the exact reviewed browser Host distribution
        if: needs.plan.outputs.browser_release_required == 'true'
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-existing-computer-releases-browser
          path: target/workspace-release-artifacts
      - name: Stage the affected browser surfaces without release make
        env:
          BROWSER_ADMISSION_MATRIX: ${{ needs.plan.outputs.browser_admission_matrix }}
        run: |
          mkdir -p target/debug target/wasm32-unknown-unknown/release
          cp target/browser-product-runtimes/conduit-browser-host target/debug/conduit-browser-host
          cp target/browser-product-runtimes/conduit target/browser-product-runtimes/conduit-relay target/browser-product-runtimes/webchat-server target/browser-product-runtimes/browser-admission-probe target/browser-product-runtimes/protected-line-browser-peer target/browser-product-runtimes/native-webrtc-line-probe target/debug/
          chmod 755 target/debug/conduit-browser-host target/debug/conduit-relay target/debug/webchat-server target/debug/browser-admission-probe target/debug/protected-line-browser-peer target/debug/native-webrtc-line-probe
          site/tools/stage-pages-root.sh target/pages-root
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"browser-host"'* ]]; then
            cp target/browser-product-runtimes/browser-host-runtime.wasm target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"workspace"'* || "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            products/workspace/tools/stage-workspace-product.sh target/browser-product-runtimes/workspace-runtime.wasm target/workspace-product target/workspace-release-artifacts
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"browser-host"'* || "$BROWSER_ADMISSION_MATRIX" == *'"workspace"'* || "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            cp target/browser-product-runtimes/patchbay-runtime.wasm target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"workspace"'* || "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            cp target/browser-product-runtimes/patchbay-html target/browser-product-runtimes/browser-parts-capstone target/debug/
            chmod 755 target/debug/patchbay-html target/debug/browser-parts-capstone
          fi
          if [[ "$BROWSER_ADMISSION_MATRIX" == *'"pages"'* ]]; then
            chmod 755 target/browser-product-runtimes/patchbay-static-assets
            products/patchbay/tools/stage-patchbay-product.sh target/browser-product-runtimes/patchbay-runtime.wasm target/browser-product-runtimes/patchbay-static-assets target/patchbay-product
          fi
      - name: Retain the browser-only candidate surfaces
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-development-browser-products
          path: |
            target/debug/conduit-browser-host
            target/debug/patchbay-html
            target/debug/browser-parts-capstone
            target/debug/webchat-server
            target/debug/browser-admission-probe
            target/debug/protected-line-browser-peer
            target/debug/conduit
            target/debug/conduit-relay
            target/debug/native-webrtc-line-probe
            target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm
            target/pages-root
            target/workspace-product
            target/patchbay-product
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  browser-admission-proof:
    needs: [plan, browser-admission-stage]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.browser_admission_required == 'true' &&
      needs.browser-admission-stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser_admission_matrix) }}
    name: browser-admission-${{ matrix.shard }}
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - name: Install the pinned browser proof dependency
        run: npm --prefix proof/browser ci --ignore-scripts --prefer-offline
      - name: Receive the exact browser-only candidate surfaces
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-development-browser-products
          path: target
      - name: Restore executable Host permission
        run: |
          chmod 755 target/debug/conduit target/debug/conduit-relay target/debug/conduit-browser-host target/debug/webchat-server target/debug/browser-admission-probe target/debug/protected-line-browser-peer target/debug/native-webrtc-line-probe
          for optional in target/debug/patchbay-html target/debug/browser-parts-capstone; do
            if [ -e "$optional" ]; then
              restored="${optional}.restored"
              install -m 755 "$optional" "$restored"
              mv -f "$restored" "$optional"
              test -f "$optional"
              test -x "$optional"
            fi
          done
      - name: Prove foreground input and Body retirement contracts
        if: matrix.shard == 'workspace'
        run: node --test proof/browser/browser-body-input.test.mjs proof/browser/browser-body-host.test.mjs proof/browser/workspace-handoff.test.mjs
      - name: Prove the affected ${{ matrix.shard }} surface in pinned Chromium
        env:
          BROWSER_PROOF_SPECS: ${{ matrix.shard == 'browser-host' && 'proof/browser/presentation-nucleus.spec.mjs proof/browser/browser-application-package.spec.mjs proof/browser/browser-bundle-build.spec.mjs proof/browser/browser-boot-profile.spec.mjs proof/browser/browser-human-input.spec.mjs proof/browser/browser-form-runner.spec.mjs proof/browser/protected-line.spec.mjs proof/browser/native-webrtc-line.spec.mjs' || matrix.shard == 'workspace' && 'proof/browser/workspace-arrival.spec.mjs proof/browser/workspace-birth-naming.spec.mjs proof/browser/sdk-external-body-execution.spec.mjs proof/browser/workspace-mixed-membership.spec.mjs proof/browser/workspace-library.spec.mjs proof/browser/workspace-continuity.spec.mjs' || 'proof/browser/pages-front-door.spec.mjs proof/browser/web-accessibility.spec.mjs' }}
          CONDUIT_BROWSER_PROOF_SHARD: admission-${{ matrix.shard }}
        run: >-
          node proof/browser/node_modules/@playwright/test/cli.js test
          --config proof/browser/playwright.config.mjs
          $BROWSER_PROOF_SPECS
          --project chromium
          --workers 1
          --retries 0

  avr-release:
    needs: plan
    if: needs.plan.outputs.pages_carrier_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Restore the pinned AVR toolchain
        uses: actions/cache@v6
        with:
          path: |
            target/avr-promicro/tools
            target/avr-promicro/arduino
          key: avr-promicro-arduino-cli-1.5.1-arduino-avr-1.8.8-sparkfun-avr-1.1.13
      - name: Compile and seal the exact generic Pro Micro release
        run: cargo +1.98.1 xtask make avr release --output target/creche-avr-release
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-avr-promicro-release
          path: target/creche-avr-release
          if-no-files-found: error
          retention-days: 7

  browser-release:
    needs: plan
    if: needs.plan.outputs.browser_release_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Compile and seal the reviewed browser distribution
        run: |
          cargo +1.98.1 xtask make host release --platform browser --output target/creche-host-releases
          cargo +1.98.1 xtask make host release-catalog --root target/creche-host-releases --generation "${{ github.run_number }}"
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-existing-computer-releases-browser
          path: target/creche-host-releases
          if-no-files-found: error
          retention-days: 7

  host-releases:
    needs: plan
    if: needs.plan.outputs.host_releases_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            artifact: linux
          - runner: windows-2025
            platform: windows
            artifact: windows-x86_64
          - runner: macos-15
            platform: macos
            artifact: macos-aarch64
    name: host-release-${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Prepare the Linux release toolchain
        if: matrix.platform == 'linux'
        run: cargo +1.98.1 xtask setup linux-release
      - name: Compile and seal the reviewed generic existing-computer releases
        run: cargo +1.98.1 xtask make host release --platform ${{ matrix.platform }} --output target/creche-host-releases
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-existing-computer-releases-${{ matrix.artifact }}
          path: target/creche-host-releases
          if-no-files-found: error
          retention-days: 7

  raspberry-pi-release:
    needs: plan
    if: needs.plan.outputs.pages_carrier_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Install the deterministic SD image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools mtools
      - name: Compile and seal the exact ARMv6 Raspberry Pi SD images
        run: |
          mkdir -p target/creche-rpi-release
          for board in rpi-b-plus-v1.2 rpi-zero-v1 rpi-zero-w-v1.1 rpi-zero-wh-v1.1; do
            cargo +1.98.1 xtask make host rpi --board "$board" image --locked
          done
          cp target/conduitos/armv6/conduitos-rpi-*.img target/creche-rpi-release/
          cp target/conduitos/armv6/rpi-*-image.json target/creche-rpi-release/
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-rpi-release
          if-no-files-found: error
          retention-days: 7

  orange-pi-release:
    needs: plan
    if: needs.plan.outputs.pages_carrier_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-unknown-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Install the deterministic SD image tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools
      - name: Compile and seal the exact Orange Pi 5 ConduitOS SD image
        run: |
          cargo +1.98.1 xtask --locked make conduitos orange-pi5-image
          mkdir -p target/creche-orange-pi-release
          cp target/conduitos/aarch64/orange-pi-5/conduitos-orange-pi-5.img target/creche-orange-pi-release/
          cp target/conduitos/aarch64/orange-pi-5/orange-pi-5-image.json target/creche-orange-pi-release/
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-orange-pi-release
          path: target/creche-orange-pi-release
          if-no-files-found: error
          retention-days: 7

  conduitos-release-images:
    needs: plan
    if: needs.plan.outputs.pages_carrier_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            profile: targets/conduitos/profiles/conduitos-native.host.conduit
          - architecture: aarch64
            profile: targets/conduitos/profiles/conduitos-aarch64-virt.host.conduit
          - architecture: ia32
            profile: targets/conduitos/profiles/conduitos-ia32-pc.host.conduit
          - architecture: riscv64
            profile: targets/conduitos/profiles/conduitos-riscv64-virt.host.conduit
          - architecture: loongarch64
            profile: targets/conduitos/profiles/conduitos-loongarch64-virt.host.conduit
    name: conduitos-release-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: i686-unknown-uefi,i686-unknown-linux-gnu,x86_64-unknown-none,aarch64-unknown-none,riscv64gc-unknown-none-elf,loongarch64-unknown-none
          components: rust-src,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
      - name: Restore an identical admitted ConduitOS image
        id: image-cache
        uses: actions/cache@v6
        with:
          path: target/creche-conduitos-build/${{ matrix.architecture }}
          key: >-
            conduitos-product-${{ matrix.architecture }}-${{
            hashFiles('Cargo.lock', '**/Cargo.toml', 'architecture/**', 'make/**',
            'runtime/**', 'semantics/**', 'targets/conduitos/**', 'tools/xtask/**', matrix.profile) }}
      - name: Install the deterministic hybrid ISO tool
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
      - name: Compile the exact ${{ matrix.architecture }} ConduitOS product Host release
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: >-
          cargo +1.98.1 xtask make host build ${{ matrix.profile }}
          --output target/creche-conduitos-build/${{ matrix.architecture }} --locked
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-conduitos-build-${{ matrix.architecture }}
          path: target/creche-conduitos-build/${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 7

  conduitos-releases:
    needs: conduitos-release-images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - name: Download the exact x86_64 ConduitOS image
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-build-x86_64
          path: target/creche-conduitos-build/x86_64
      - name: Download the exact aarch64 ConduitOS image
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-build-aarch64
          path: target/creche-conduitos-build/aarch64
      - name: Download the exact ia32 ConduitOS image
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-build-ia32
          path: target/creche-conduitos-build/ia32
      - name: Download the exact riscv64 ConduitOS image
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-build-riscv64
          path: target/creche-conduitos-build/riscv64
      - name: Download the exact loongarch64 ConduitOS image
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-build-loongarch64
          path: target/creche-conduitos-build/loongarch64
      - name: Seal the complete ConduitOS release set
        run: node targets/conduitos/make/seal-creche-release.mjs target/creche-conduitos-build target/creche-conduitos-release
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-conduitos-releases
          path: target/creche-conduitos-release
          if-no-files-found: error
          retention-days: 7

  conduitos-oci-provenance:
    needs: conduitos-releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - name: Download the exact ConduitOS release set
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-releases
          path: target/creche-conduitos-release
      - name: Download the authoritative x86_64 ConduitOS build manifest
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-build-x86_64
          path: target/creche-conduitos-build/x86_64
      - name: Export and freshly verify the x86_64 release as a non-container OCI layout
        run: |
          rm -rf target/conduitos-x86_64-oci
          node tools/ci/oci-release-export.mjs prepare-conduitos \
            target/creche-conduitos-release/conduitos-x86_64-pc-release.json \
            target/creche-conduitos-build/x86_64/build-manifest.json \
            target/conduitos-x86_64-oci-input \
            "$CONDUIT_CANDIDATE_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node tools/ci/oci-release-export.mjs export \
            target/conduitos-x86_64-oci-input.config.json \
            target/conduitos-x86_64-oci
          node tools/ci/oci-release-export.mjs verify target/conduitos-x86_64-oci
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-conduitos-x86_64-oci
          path: target/conduitos-x86_64-oci
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  esp32-release-images:
    needs: [plan, standalone-locks]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.pages_carrier_required == 'true' && (needs.standalone-locks.result == 'success' || needs.standalone-locks.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [c3, s3, wroom]
    name: esp32-release-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install the pinned ESP32-C3 Rust toolchain
        if: matrix.target == 'c3'
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: riscv32imc-unknown-none-elf
          components: rust-src
      - name: Restore the exact named Xtensa toolchain
        if: matrix.target != 'c3'
        id: esp-toolchain-cache
        uses: actions/cache@v6
        with:
          path: ~/.rustup/toolchains/esp-conduit-1.91.1
          key: esp-xtensa-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.91.1.0-ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
      - name: Install the pinned Xtensa Rust toolchain
        if: matrix.target != 'c3' && steps.esp-toolchain-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          buildtargets: ${{ matrix.target == 'wroom' && 'esp32' || 'esp32s3' }}
          default: false
          ldproxy: false
          name: esp-conduit-1.91.1
          version: "1.91.1.0"
      - name: Activate the pinned Xtensa compiler
        if: matrix.target != 'c3'
        run: |
          test -x "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin/xtensa-esp32-elf-gcc"
          echo "$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp-elf/esp-15.2.0_20250920/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$HOME/.rustup/toolchains/esp-conduit-1.91.1/xtensa-esp32-elf-clang/esp-20.1.1_20250829/esp-clang/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          workspaces: |
            . -> target
            targets/esp32/firmware/${{ matrix.target }}-signal -> target
      - name: Build and seal the exact generic release IMAGE
        run: >-
          cargo +1.98.1 xtask make esp32-firmware build
          --target "${{ matrix.target }}"
          --locked
          --receipt "target/esp32-release/${{ matrix.target }}-build.json"
          --browser-artifact "target/esp32-release/esp32-${{ matrix.target }}-generic-release.bin"
      - uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-esp32-release-${{ matrix.target }}
          path: |
            target/esp32-release/esp32-${{ matrix.target }}-generic-release.bin
            target/esp32-release/esp32-${{ matrix.target }}-generic-release.json
          if-no-files-found: error
          retention-days: 7

  products-stage:
    needs: [avr-release, browser-release, browser-runtimes, esp32-release-images, host-releases, orange-pi-release, raspberry-pi-release, conduitos-releases, conduitos-oci-provenance]
    if: >-
      always() && !cancelled() &&
      needs.avr-release.result == 'success' &&
      needs.browser-release.result == 'success' &&
      needs.browser-runtimes.result == 'success' &&
      needs.esp32-release-images.result == 'success' &&
      needs.host-releases.result == 'success' &&
      needs.orange-pi-release.result == 'success' &&
      needs.raspberry-pi-release.result == 'success' &&
      needs.conduitos-releases.result == 'success' &&
      needs.conduitos-oci-provenance.result == 'success'
    runs-on: ubuntu-24.04
    # The final staged carrier now exceeds 360 MiB. Keep a bounded margin for
    # artifact download, assembly, and upload on ordinary hosted runners.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build the reviewed Form bundles before release payload assembly
        run: |
          mkdir -p target/reviewed-form-bundles
          cargo +1.98.1 xtask check forms bundle-initial-body --output target/reviewed-form-bundles/initial-body.conduit
          cargo +1.98.1 xtask check forms bundle-workspace-catalog --output target/reviewed-form-bundles/workspace-catalog.json
      - name: Download the reviewed browser product runtimes
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-browser-product-runtimes
          path: target/browser-product-runtimes
      - name: Download the reviewed generic ESP32 release IMAGEs
        uses: ./.github/actions/download-artifact-retry
        with:
          pattern: conduit-esp32-release-*
          merge-multiple: true
          path: target/creche-release-artifacts
      - name: Download the reviewed generic existing-computer releases
        uses: ./.github/actions/download-artifact-retry
        with:
          pattern: conduit-existing-computer-releases-*
          merge-multiple: true
          path: target/creche-release-artifacts
      - name: Verify the browser Host release carries the normal Form ABI
        run: >-
          node -e 'const fs=require("node:fs"); const names=new Set(WebAssembly.Module.exports(new WebAssembly.Module(fs.readFileSync("target/creche-release-artifacts/runtime.wasm"))).map(({name})=>name)); for (const name of ["conduit_browser_form_inventory","conduit_browser_form_start","conduit_browser_form_complete","conduit_browser_form_cancel"]) if (!names.has(name)) throw new Error(`browser Host runtime lacks ${name}`);'
      - name: Download the reviewed generic Pro Micro release
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-avr-promicro-release
          path: target/creche-release-artifacts
      - name: Download the reviewed Raspberry Pi bare-metal release
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-raspberry-pi-release
          path: target/creche-release-artifacts
      - name: Download the reviewed Orange Pi bare-metal release
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-orange-pi-release
          path: target/creche-release-artifacts
      - name: Download the reviewed ConduitOS product Host releases
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-releases
          path: target/creche-release-artifacts
      - name: Download the exact non-container ConduitOS OCI layout
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-conduitos-x86_64-oci
          path: target/conduitos-x86_64-oci
      - name: Seal the bounded installed release catalog
        run: |
          rm -f target/creche-release-artifacts/release-catalog.json
          cargo +1.98.1 xtask make host release-catalog \
            --root target/creche-release-artifacts \
            --generation "${{ github.run_number }}"
      - name: Stage the exact browser products
        run: |
          mkdir -p target/debug
          cp target/browser-product-runtimes/conduit-browser-host target/debug/conduit-browser-host
          cp target/browser-product-runtimes/conduit target/browser-product-runtimes/conduit-relay target/browser-product-runtimes/patchbay-html target/browser-product-runtimes/browser-parts-capstone target/browser-product-runtimes/webchat-server target/browser-product-runtimes/browser-admission-probe target/browser-product-runtimes/protected-line-browser-peer target/browser-product-runtimes/native-webrtc-line-probe target/debug/
          mkdir -p target/wasm32-unknown-unknown/release
          cp target/browser-product-runtimes/patchbay-runtime.wasm target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm
          chmod 755 target/debug/conduit-browser-host
          chmod 755 target/browser-product-runtimes/patchbay-static-assets
          rm -rf target/pages-root target/workspace-product target/patchbay-product
          site/tools/stage-pages-root.sh target/pages-root
          mkdir -p target/pages-root/supply-chain/conduitos-x86_64-pc
          cp -a target/conduitos-x86_64-oci/. target/pages-root/supply-chain/conduitos-x86_64-pc/
          products/workspace/tools/stage-workspace-product.sh target/browser-product-runtimes/workspace-runtime.wasm target/workspace-product target/creche-release-artifacts target/reviewed-form-bundles/initial-body.conduit target/reviewed-form-bundles/workspace-catalog.json
          products/patchbay/tools/stage-patchbay-product.sh target/browser-product-runtimes/patchbay-runtime.wasm target/browser-product-runtimes/patchbay-static-assets target/patchbay-product
      - name: Retain the exact staged products once for parallel consumers
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-staged-browser-products
          path: |
            target/debug/conduit-browser-host
            target/debug/patchbay-html
            target/debug/browser-parts-capstone
            target/debug/webchat-server
            target/debug/browser-admission-probe
            target/debug/protected-line-browser-peer
            target/debug/conduit
            target/debug/conduit-relay
            target/debug/native-webrtc-line-probe
            target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm
            target/pages-root
            target/workspace-product
            target/patchbay-product
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          # This carrier contains sparse target images. Disabling compression
          # turns roughly 157 MiB of transported content into a 3.1 GiB
          # artifact and every browser shard pays that cost again.
          compression-level: 6

  browser-proof:
    needs: products-stage
    if: always() && !cancelled() && needs.products-stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: browser-host
            specs: proof/browser/presentation-nucleus.spec.mjs proof/browser/browser-bundle-build.spec.mjs proof/browser/browser-boot-profile.spec.mjs proof/browser/browser-human-input.spec.mjs proof/browser/protected-line.spec.mjs proof/browser/native-webrtc-line.spec.mjs
          - shard: workspace-machines
            specs: proof/browser/creche-avr.spec.mjs proof/browser/creche-orange-pi.spec.mjs proof/browser/creche-raspberry-pi.spec.mjs proof/browser/creche-conduitos.spec.mjs proof/browser/creche-native-zip.spec.mjs proof/browser/creche-native-disk.spec.mjs proof/browser/creche-browser-configuration.spec.mjs proof/browser/workspace-arrival.spec.mjs proof/browser/workspace-birth-naming.spec.mjs proof/browser/sdk-external-body-execution.spec.mjs proof/browser/workspace-mixed-membership.spec.mjs proof/browser/workspace-library.spec.mjs proof/browser/workspace-membership.spec.mjs proof/browser/workspace-continuity.spec.mjs
          - shard: pages
            specs: proof/browser/pages-front-door.spec.mjs proof/browser/web-accessibility.spec.mjs
    name: browser-proof-${{ matrix.shard }}
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CONDUIT_BROWSER_PROOF_SHARD: ${{ matrix.shard }}
      CONDUIT_BROWSER_PROOF_OUTPUT: /tmp/conduit-browser-proof-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Install the pinned browser proof dependency
        run: npm --prefix proof/browser ci --ignore-scripts --prefer-offline
      - name: Receive the exact staged products
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-staged-browser-products
          path: target
      - name: Restore executable Host permission
        run: |
          chmod 755 target/debug/conduit target/debug/conduit-relay target/debug/conduit-browser-host target/debug/webchat-server target/debug/browser-admission-probe target/debug/protected-line-browser-peer target/debug/native-webrtc-line-probe
          for optional in target/debug/patchbay-html target/debug/browser-parts-capstone; do
            if [ -e "$optional" ]; then
              restored="${optional}.restored"
              install -m 755 "$optional" "$restored"
              mv -f "$restored" "$optional"
              test -f "$optional"
              test -x "$optional"
            fi
          done
      - name: Prove foreground input and Body retirement contracts
        if: matrix.shard == 'workspace-machines'
        run: node --test proof/browser/browser-body-input.test.mjs proof/browser/browser-body-host.test.mjs proof/browser/workspace-handoff.test.mjs
      - name: Prove the ${{ matrix.shard }} surface in pinned Chromium
        env:
          BROWSER_PROOF_SPECS: ${{ matrix.specs }}
          CONDUIT_WORKSPACE_SPORE_OUTPUT: ${{ runner.temp }}/creche-export.iso
        run: >-
          node proof/browser/node_modules/@playwright/test/cli.js test
          --config proof/browser/playwright.config.mjs
          $BROWSER_PROOF_SPECS
          --project chromium
          --workers 1
          --retries 0
          --output "$CONDUIT_BROWSER_PROOF_OUTPUT"
      - name: Retain the exact Crèche-exported ConduitOS spore
        if: matrix.shard == 'workspace-machines'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-workspace-conduitos-spore-${{ env.CONDUIT_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/creche-export.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain the browser Body journey track
        if: matrix.shard == 'workspace-machines'
        run: |
          track=$(find "$CONDUIT_BROWSER_PROOF_OUTPUT" -path '*/body-journey-track/track.json' -type f -print -quit)
          test -n "$track"
          mkdir -p "$RUNNER_TEMP/browser-body-journey"
          cp -a "$(dirname "$track")/." "$RUNNER_TEMP/browser-body-journey/"
      - name: Upload the browser Body journey track
        if: matrix.shard == 'workspace-machines'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-browser-body-journey-${{ env.CONDUIT_CANDIDATE_SHA }}
          path: ${{ runner.temp }}/browser-body-journey
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Retain the browser two-profile make report
        if: matrix.shard == 'workspace-machines'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: browser-two-profile-capstone-proof
          path: |
            target/proof/browser-two-profile-capstone.json
            target/proof/browser-two-profile-capstone.md
          if-no-files-found: error
          retention-days: 14

  pages-carrier:
    needs: [plan, products-stage, browser-proof]
    if: always() && !cancelled() && needs.products-stage.result == 'success' && needs.browser-proof.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CONDUIT_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Receive the exact staged products
        uses: ./.github/actions/download-artifact-retry
        with:
          name: conduit-staged-browser-products
          path: target
      - name: Seal the already-proven Pages carrier
        run: |
          rm -rf target/pages-site target/pages-carrier
          mkdir -p target/pages-site/workspace target/pages-site/patchbay
          cp -a target/pages-root/. target/pages-site/
          cp -a target/workspace-product/. target/pages-site/workspace/
          cp -a target/patchbay-product/. target/pages-site/patchbay/
          echo 'conduit.pages/nojekyll@1' > target/pages-site/.nojekyll
          test -f target/pages-site/workspace/workspace.application.json
          test -f target/pages-site/workspace/runtime.wasm
          test -f target/pages-site/patchbay/patchbay.application.json
          test -f target/pages-site/patchbay/api/snapshot
          source_commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          source_tree=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')
          node tools/ci/seal-pages-carrier.mjs target/pages-site target/pages-carrier "$source_commit" "$source_tree"
          node tools/ci/verify-pages-carrier.mjs target/pages-carrier "$source_tree"
      - name: Retain the immutable Pages carrier for post-merge promotion
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: conduit-pages-carrier
          path: target/pages-carrier
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Materialize the trusted carrier attestation controller
        env:
          CONTROLLER_SHA: ${{ needs.plan.outputs.controller_sha }}
        run: |
          git fetch --no-tags origin "$CONTROLLER_SHA"
          git worktree add --detach "$RUNNER_TEMP/conduit-ci-controller" "$CONTROLLER_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/conduit-ci-controller-target" \
            cargo build --manifest-path "$RUNNER_TEMP/conduit-ci-controller/Cargo.toml" \
            --package conduit-xtask-dispatch --locked
      - name: Attest the exact successful Pages carrier proposition
        id: carrier-receipt
        env:
          CONTROLLER_SHA: ${{ needs.plan.outputs.controller_sha }}
        run: |
          if ! git show "$CONTROLLER_SHA:tools/xtask/src/commands/ci/proof_graph/spec.rs" | grep -Fq 'id: "products.pages-carrier"'; then
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo 'Trusted controller predates the carrier proof receipt; bootstrap execution remains authoritative.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$RUNNER_TEMP/conduit-ci-controller-target/debug/conduit-xtask-dispatch" \
            ci attest-success "$CONDUIT_CANDIDATE_SHA" products.pages-carrier \
            --evidence products-stage \
            --evidence browser-proof \
            --evidence pages-carrier-verification \
            --out target/ci-receipts/products.pages-carrier.json \
            --locked
          echo 'supported=true' >> "$GITHUB_OUTPUT"
      - name: Retain immutable Pages carrier proof evidence
        if: steps.carrier-receipt.outputs.supported == 'true'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: ci-proof-products.pages-carrier-${{ env.CONDUIT_CANDIDATE_SHA }}
          path: target/ci-receipts/products.pages-carrier.json
          if-no-files-found: error
          retention-days: 14

  products-proof:
    needs: [plan, browser-admission-proof, products-stage, browser-proof, pages-carrier]
    # A deliberately cancelled duplicate lifecycle run is not new proof
    # failure. Real dependency failures still reach this gate and fail it.
    if: ${{ always() && !cancelled() }}
    # Collect results on the standard pool; a queued collector blocks admission.
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve the stable required product gate
        env:
          PRODUCT_REQUIRED: ${{ needs.plan.outputs.required }}
          PRODUCT_PROOFS: ${{ needs.plan.outputs.proofs }}
          CARRIER_REQUIRED: ${{ needs.plan.outputs.pages_carrier_required }}
          BROWSER_ADMISSION_REQUIRED: ${{ needs.plan.outputs.browser_admission_required }}
          BROWSER_ADMISSION_RESULT: ${{ needs.browser-admission-proof.result }}
          STAGE_RESULT: ${{ needs.products-stage.result }}
          BROWSER_RESULT: ${{ needs.browser-proof.result }}
          CARRIER_RESULT: ${{ needs.pages-carrier.result }}
        run: |
          if test "$PRODUCT_REQUIRED" != true; then
            echo "No Pages product proof inputs changed: $PRODUCT_PROOFS"
            exit 0
          fi
          if test "$BROWSER_ADMISSION_REQUIRED" = true; then
            test "$BROWSER_ADMISSION_RESULT" = success
          fi
          if test "$CARRIER_REQUIRED" = true; then
            test "$STAGE_RESULT" = success
            test "$BROWSER_RESULT" = success
            test "$CARRIER_RESULT" = success
          fi
