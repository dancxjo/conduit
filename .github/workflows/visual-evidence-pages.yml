name: visual-evidence-pages

on:
  push:
    branches:
      - main

concurrency:
  group: visual-evidence-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build and history tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Produce exact-main semantic and visual evidence
        env:
          HOME: /root
          RUSTUP_HOME: /github/home/.rustup
        run: cargo xtask prove browser-host --locked --evidence-root target/conduit-evidence/browser-host
      - name: Verify exact-main evidence before promotion
        run: >-
          cargo xtask evidence verify --locked
          --root target/conduit-evidence/browser-host
          --commit "${{ github.sha }}"
          --result complete
      - name: Prepare bounded accepted history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git fetch origin refs/heads/conduit-visual-evidence-history:refs/remotes/origin/conduit-visual-evidence-history; then
            git worktree add --detach "$RUNNER_TEMP/conduit-gallery-history" refs/remotes/origin/conduit-visual-evidence-history
          else
            git worktree add --detach "$RUNNER_TEMP/conduit-gallery-history" HEAD
            git -C "$RUNNER_TEMP/conduit-gallery-history" switch --orphan conduit-visual-evidence-history
          fi
          mkdir -p "$RUNNER_TEMP/conduit-gallery-history/public"
      - name: Build provenance-bearing gallery
        run: >-
          cargo xtask evidence gallery --locked
          --evidence-root target/conduit-evidence/browser-host
          --site-root "$RUNNER_TEMP/conduit-gallery-history/public"
          --commit "${{ github.sha }}"
      - name: Verify canonical documentation references against exact gallery
        run: >-
          cargo xtask evidence docs-verify --locked
          --workspace-root .
          --site-root "$RUNNER_TEMP/conduit-gallery-history/public"
          --commit "${{ github.sha }}"
      - name: Retain latest 32 accepted main galleries
        run: |
          git -C "$RUNNER_TEMP/conduit-gallery-history" config user.name github-actions[bot]
          git -C "$RUNNER_TEMP/conduit-gallery-history" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$RUNNER_TEMP/conduit-gallery-history" add -A public
          if ! git -C "$RUNNER_TEMP/conduit-gallery-history" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/conduit-gallery-history" commit -m "Publish visual evidence ${{ github.sha }}"
          fi
          git -C "$RUNNER_TEMP/conduit-gallery-history" push origin HEAD:refs/heads/conduit-visual-evidence-history
      - name: Upload accepted-main Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/conduit-gallery-history/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy accepted-main gallery
        id: deployment
        uses: actions/deploy-pages@v5
