name: retire-merged-pr-branch

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: retire-merged-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retire:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check out canonical controller only
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retarget dependents before retiring the merged branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/retire-merged-pr-branch.mjs | tee merged-branch-retirement.json
      - name: Summarize exact branch retirement
        run: |
          printf '## Merged branch retirement\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat merged-branch-retirement.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
