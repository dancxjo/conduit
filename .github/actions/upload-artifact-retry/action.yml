name: Upload artifact with one bounded retry
description: Retry one transient GitHub artifact-service failure without hiding a repeated failure

inputs:
  name:
    description: Artifact name
    default: artifact
  path:
    description: File, directory, or wildcard to upload
    required: true
  if-no-files-found:
    description: Behavior when the path matches no files
    default: warn
  retention-days:
    description: Artifact retention in days
    default: "0"
  compression-level:
    description: Zip compression level
    default: "6"
  overwrite:
    description: Whether the primary upload may replace an artifact
    default: "false"
  include-hidden-files:
    description: Whether hidden files are included
    default: "false"
  archive:
    description: Whether to archive the uploaded content
    default: "true"

outputs:
  artifact-id:
    description: Identifier of the successful upload
    value: ${{ steps.retry.outputs.artifact-id || steps.primary.outputs.artifact-id }}
  artifact-url:
    description: URL of the successful upload
    value: ${{ steps.retry.outputs.artifact-url || steps.primary.outputs.artifact-url }}
  artifact-digest:
    description: Digest of the successful upload
    value: ${{ steps.retry.outputs.artifact-digest || steps.primary.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - id: primary
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
    - if: steps.primary.outcome == 'failure'
      shell: bash
      run: sleep 5
    - id: retry
      if: steps.primary.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
