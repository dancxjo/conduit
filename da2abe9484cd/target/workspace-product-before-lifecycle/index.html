<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101114">
  <title>Your body · Conduit</title>
  <link rel="manifest" href="./workspace.webmanifest">
  <meta name="conduit-application-package" content="./workspace.application.json">
  <link rel="stylesheet" href="./workspace.css">
<style>/* Shared by the homepage, handbook, and every documentary page. */
* { box-sizing: border-box; }
html { color-scheme: dark light; scroll-behavior: smooth; }
body { margin: 0; background: var(--conduit-background); color: var(--conduit-text-primary); font: 400 1rem/1.65 var(--conduit-font-body, system-ui, sans-serif); }
a { color: var(--conduit-emphasis); text-underline-offset: .2em; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--conduit-focus); outline-offset: 4px; }
.site-header { width: 100%; display: flex; align-items: center; gap: 2rem; padding: 1rem max(1.25rem, calc((100vw - 88rem)/2)); background: var(--conduit-surface); border-bottom: 1px solid var(--conduit-structure-secondary); }
.site-header a { color: var(--conduit-text-secondary); text-decoration: none; font-size: .9rem; white-space: nowrap; }
.site-header .site-brand { color: var(--conduit-text-primary); font-size: 1.15rem; font-weight: 750; }
.site-header nav { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.4rem; margin: 0; }
.site-header .site-source { margin-left: auto; }
.site-header a:hover, .site-header a[aria-current="page"] { color: var(--conduit-emphasis); }
.site-header a[aria-current="page"] { text-decoration: underline; text-underline-offset: .45em; }
.site-content { width: min(78rem, calc(100% - 3rem)); margin: 0 auto; padding: clamp(2rem, 5vw, 5rem) 0; }
.site-content h1 { font-size: clamp(2.5rem, 6vw, 4.8rem); line-height: 1.08; letter-spacing: -.04em; margin: .4rem 0 1.4rem; }
.site-content h2 { font-size: clamp(1.65rem, 3vw, 2.4rem); line-height: 1.2; }
.site-content .lede { max-width: 65ch; font-size: 1.2rem; color: var(--conduit-text-secondary); }
.site-content .eyebrow { font-size: .8rem; color: var(--conduit-text-secondary); }
.site-content img, .site-content video { display: block; width: 100%; height: auto; border: 1px solid var(--conduit-structure-secondary); border-radius: .5rem; }
.site-content figure { margin: 1.5rem 0; }
.site-content figcaption { color: var(--conduit-text-secondary); font-size: .95rem; margin-top: .6rem; }
.site-content details { border-top: 1px solid var(--conduit-structure-secondary); padding: 1rem 0; margin-top: 1.5rem; overflow-wrap: anywhere; }
.site-content summary { cursor: pointer; }
.journey-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1.25rem; margin: 2rem 0 3rem; }
.journey-card { padding: 1.5rem; background: var(--conduit-surface); border: 1px solid var(--conduit-structure-secondary); border-radius: .6rem; }
.journey-card h2, .journey-card h3 { margin-top: 0; }
.journey-steps { list-style: none; padding: 0; counter-reset: journey-step; }
.journey-step { counter-increment: journey-step; padding: 2rem 0; border-top: 1px solid var(--conduit-structure-secondary); }
.journey-step h2::before { content: counter(journey-step, decimal-leading-zero) "  "; color: var(--conduit-text-secondary); }
.journey-step p { max-width: 70ch; }
.recording-note { color: var(--conduit-text-secondary); font-size: .95rem; }
@media (max-width: 50rem) { .site-header { gap: .8rem 1.2rem; flex-wrap: wrap; } .site-header nav { order: 3; width: 100%; gap: .65rem 1.2rem; } .site-content { width: calc(100% - 2rem); } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style></head>
<body><header class="site-header"><a class="site-brand" href="/conduit/" aria-label="Conduit home">Conduit</a><nav aria-label="Main navigation"><a data-section="home" href="/conduit/">Home</a><a data-section="journeys" href="/conduit/journeys/">Journeys</a><a data-section="handbook" href="/conduit/handbook/">Handbook</a><a data-section="downloads" href="/conduit/#get-conduit">Downloads</a><a data-section="workspace" href="/conduit/workspace/">Open Conduit</a></nav><a class="site-source" href="https://github.com/dancxjo/conduit">Source</a></header>

  <a class="skip-link" href="#plot-input">Skip to the plot</a>
  <div class="workspace-shell">
    <header class="body-header">
      <a class="conduit-mark" href="../" aria-label="Conduit home"><span aria-hidden="true">c.</span> conduit</a>
      <div class="body-heading"><h1 data-body-name>Your body</h1><span class="body-state" data-body-state>Opening…</span>
        <div class="membership-shortcuts"><button type="button" data-open-membership aria-controls="workspace-membership" aria-expanded="false" hidden>parts / hosts</button><button type="button" data-invite-host hidden>Invite</button></div>
      </div>

    </header>
    <details class="body-tutorial" data-body-tutorial open>
      <summary>Learn through this body</summary>
      <div data-body-tutorial-core data-application-slot="body-tutorial"></div>
      <div data-body-tutorial-resident></div>
    </details>
    <main>
      <section class="workspace-creche" data-workspace-creche hidden aria-label="Birth your body">
        <div data-creche-content></div>
      </section>
      <section class="plot-surface" aria-labelledby="surface-title" data-workspace-surface hidden>
        <div class="surface-content">
          <h2 id="surface-title">Start with a word.</h2>
          <p class="surface-invitation" data-surface-invitation>Type something. Watch it become a signal.</p>
          <div id="plot-input" role="textbox" aria-multiline="true" aria-label="Interact with your plot" tabindex="-1" aria-disabled="true" aria-describedby="surface-guidance" inert>
            <span class="input-prompt" aria-hidden="true">Type to begin.</span>
            <div class="signal-manifestation" aria-label="plot output" data-plot-output></div>
          </div>
          <p id="surface-guidance" class="surface-guidance">Preparing your plot…</p>
          <div class="body-controls"><button type="button" data-wake-body hidden>wake body</button><button type="button" data-lull-body disabled>lull body</button><button type="button" data-fulfill-body>Finish body</button></div>
        </div>
      </section>
      <nav class="activity-switcher" aria-label="Your plots" hidden></nav>
      <section class="workspace-panel plot-library-panel" id="workspace-library" aria-labelledby="library-title" hidden>
        <div class="panel-heading"><h2 id="library-title" tabindex="-1">plots for your body</h2><button type="button" data-close-library>back to the surface</button></div>
        <div data-application-slot="workspace-plot-library"></div>
      </section>
      <section class="workspace-panel membership-panel" id="workspace-membership" aria-labelledby="membership-title" hidden>
        <div class="panel-heading"><h2 id="membership-title" tabindex="-1">parts and hosts</h2><button type="button" data-close-membership>back to the surface</button></div>
        <div data-membership-content></div>
      </section>
      <section class="workspace-panel" id="workspace-inspection" aria-labelledby="inspection-title" hidden>
        <div class="panel-heading"><h2 id="inspection-title" tabindex="-1">Inside this plot</h2><button type="button" data-close-inspection aria-label="Close inspection">back to the surface <span aria-hidden="true">↗</span></button></div>
        <div data-inspection-content></div>
      </section>
    </main>
    <footer class="truth-strip" aria-label="Current activity">
      <button type="button" data-inspect="plot" aria-controls="workspace-inspection" aria-expanded="false" class="current-plot">Your plot <span aria-hidden="true">⌄</span></button>
      <button type="button" data-inspect="flow" aria-controls="workspace-inspection" aria-expanded="false" class="current-flow"><span data-flow-label>keyboard → encode → light</span><span class="inspect-hint">Look inside ↗</span></button>
      <button type="button" data-inspect="lifecycle" aria-controls="workspace-inspection" aria-expanded="false" class="current-state"><span class="state-dot" aria-hidden="true"></span><span data-play-state>Preparing</span></button>
    </footer>
    <p class="workspace-notice" role="status" aria-live="polite" data-workspace-notice></p>
  </div>
  <script type="module" src="./browser-application-loader.mjs"></script>
</body>
</html>
