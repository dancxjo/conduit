[package]
name = "conduit-host-esp32-make"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-host-make = { path = "../../../make/host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

conduit-mcu-source-build = { path = "../../mcu/source-build" }

# Host-side checked Source generation; never enabled by ordinary Make users.
conduit-core = { path = "../../../architecture/core", optional = true }
conduit-embedded-build = { path = "../../../make/embedded-build", optional = true }
conduit-mcu-host-runtime = { path = "../../mcu/host-runtime", optional = true, features = ["execution"] }
conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture", optional = true, features = ["host-call", "plot-catalog"] }
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637", optional = true, features = ["host-call"] }
conduit-monotonic-wait = { path = "../../../mechanisms/io/monotonic-wait", optional = true }
conduit-resource-snapshot = { path = "../../../mechanisms/io/resource-snapshot", optional = true, features = ["native-host-call"] }

[features]
source-emission = ["dep:conduit-core", "dep:conduit-embedded-build", "dep:conduit-mcu-host-runtime", "dep:conduit-pulse-capture", "dep:conduit-tm1637-wire", "dep:conduit-monotonic-wait", "dep:conduit-resource-snapshot"]

[[example]]
name = "emit-source"
required-features = ["source-emission"]
