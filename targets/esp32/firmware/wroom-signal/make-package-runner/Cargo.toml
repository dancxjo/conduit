[package]
name = "conduit-esp32-make-package-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Machine-only builder for the Conduit ESP32-WROOM make package"
publish = false

[workspace]

[dependencies]
conduit-host-make = { path = "../../../../../make/host" }
conduit-host-esp32-make = { path = "../../../make" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
