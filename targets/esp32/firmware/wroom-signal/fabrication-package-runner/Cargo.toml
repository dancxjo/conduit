[package]
name = "conduit-esp32-fabrication-package-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Machine-only builder for the Conduit ESP32-WROOM fabrication package"
publish = false

[workspace]

[dependencies]
conduit-host-fabrication = { path = "../../../../../fabrication/host" }
conduit-host-esp32-fabrication = { path = "../../../fabrication" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
