[package]
name = "conduit-esp32-electrical"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
host-carrier = ["dep:conduit-mcu-host-runtime", "dep:embassy-time"]
host-call = ["conduit-pulse-capture/host-call"]

[dependencies]
critical-section = "1"
conduit-mcu-host-runtime = { path = "../../mcu/host-runtime", optional = true }
embassy-time = { version = "0.5.1", optional = true }
conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture" }
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637" }
esp-hal = { version = "=1.1.2", features = ["esp32", "unstable"] }

# Direct use of the already qualified core cycle counter; no new package.
xtensa-lx = "=0.13.0"
