[package]
name = "conduit-mcu-host-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
conduit-ht16k33 = { path = "../../../mechanisms/io/ht16k33", optional = true, features = ["canonical-frame"] }
conduit-composite = { path = "../../../architecture/composite", default-features = false, optional = true }
conduit-tm1637-protocol = { path = "../../../mechanisms/devices/tm1637", optional = true }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, optional = true }

conduit-dht11-observation = { path = "../../../mechanisms/devices/dht11", optional = true, features = ["kernel-step"] }
conduit-core = { path = "../../../architecture/core", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
conduit-body = { path = "../../../architecture/body" }
conduit-wire = { path = "../../../architecture/wire", default-features = false }
serde-json-core = "0.6"
serde = { version = "1", default-features = false, features = ["derive"] }

conduit-kernel = { path = "../../../architecture/kernel", optional = true, features = ["alloc"] }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", optional = true, features = ["delegated-preparation"] }
conduit-time = { path = "../../../semantics/time", optional = true, features = ["kernel-step"] }
conduit-environment-runtime = { path = "../../../bodies/environment/runtime", optional = true, features = ["appliance", "face-projection", "display-mask"] }

conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture", optional = true, features = ["host-call"] }
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637", optional = true, features = ["host-call"] }
conduit-resource-snapshot = { path = "../../../mechanisms/io/resource-snapshot", optional = true, features = ["native-host-call"] }
conduit-monotonic-wait = { path = "../../../mechanisms/io/monotonic-wait", optional = true, features = ["clock-at"] }
conduit-i2c-transaction = { path = "../../../mechanisms/io/i2c-transaction", default-features = false, optional = true }

conduit-face = { path = "../../../semantics/face", default-features = false, features = ["assigned-renderer", "postcard-wire"], optional = true }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask", features = ["native-kernel"], optional = true }

[features]
execution-workspace = ["execution", "conduit-kernel/execution-workspace"]
schema-value-storage = ["execution", "conduit-kernel/schema-value-storage", "conduit-plan-lowering/schema-value-storage"]
ht16k33-mask = ["execution", "dep:conduit-ht16k33", "conduit-environment-runtime/display-mask-ht16k33"]
execution = ["dep:conduit-i2c-transaction", "dep:conduit-composite", "dep:conduit-tm1637-protocol", "dep:conduit-semantic-catalog", "dep:conduit-dht11-observation", "dep:conduit-resource-snapshot", "dep:conduit-face", "dep:conduit-seven-segment-mask", "dep:conduit-kernel", "dep:conduit-plan-lowering", "dep:conduit-time", "dep:conduit-environment-runtime", "dep:conduit-pulse-capture", "dep:conduit-tm1637-wire", "dep:conduit-monotonic-wait"]

[dev-dependencies]
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false }
conduit-embedded-build = { path = "../../../make/embedded-build" }
serde_json = "1"
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc", "step-test-support"] }

[[test]]
name = "native_sync"
required-features = ["execution"]
