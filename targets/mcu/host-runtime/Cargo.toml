[package]
name = "conduit-mcu-host-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
conduit-core = { path = "../../../architecture/core", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = { version = "0.10", default-features = false }
conduit-body = { path = "../../../architecture/body" }
conduit-wire = { path = "../../../architecture/wire", default-features = false }
serde-json-core = "0.6"
serde = { version = "1", default-features = false, features = ["derive"] }

conduit-kernel = { path = "../../../architecture/kernel", optional = true, features = ["alloc"] }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", optional = true, features = ["delegated-preparation"] }
conduit-time = { path = "../../../semantics/time", optional = true, features = ["kernel-step"] }
conduit-environment-runtime = { path = "../../../bodies/environment/runtime", optional = true, features = ["appliance", "face-projection", "display-mask"] }

conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture", optional = true, features = ["host-call"] }
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637", optional = true, features = ["host-call"] }
conduit-monotonic-wait = { path = "../../../mechanisms/io/monotonic-wait", optional = true }

conduit-face = { path = "../../../semantics/face", default-features = false, features = ["assigned-renderer"], optional = true }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask", features = ["native-kernel"], optional = true }

[features]
execution = ["dep:conduit-face", "dep:conduit-seven-segment-mask", "dep:conduit-kernel", "dep:conduit-plan-lowering", "dep:conduit-time", "dep:conduit-environment-runtime", "dep:conduit-pulse-capture", "dep:conduit-tm1637-wire", "dep:conduit-monotonic-wait"]

[dev-dependencies]
serde_json = "1"
