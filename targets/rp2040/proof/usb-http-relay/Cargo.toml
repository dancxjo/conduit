[package]
name = "conduit-pico-usb-http-relay"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
# Selects only the existing physical CYW43 network initializer's compatibility
# cfg. No Signal, Body, HIL client or authored Plan is imported into this image.
firmware = ["appliance-hil-client"]
appliance-hil-client = []

[[bin]]
name = "conduit-pico-usb-http-relay"
path = "src/main.rs"
required-features = ["firmware"]

[target.'cfg(target_arch = "arm")'.dependencies]
aligned = "0.4.3"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }
heapless = "0.8"
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
