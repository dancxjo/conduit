[package]
name = "conduit-pico-w-signal"
version = "0.1.0"
edition = "2021"

[features]
default = ["pico-local"]
pico-local = ["session-control"]
pico-local-minimal = []
usb-remote = ["session-control"]
triple-remote = ["session-control"]
wifi-bootstrap = ["session-control", "dep:conduit-net", "dep:conduit-rp2040-network-realization", "dep:conduit-r1-network-conformance", "dep:embassy-net"]
r1-control = ["wifi-bootstrap"]
appliance-hello = ["session-control", "dep:conduit-net", "dep:conduit-rp2040-network-realization", "dep:embassy-net"]
appliance-hil-client = ["session-control", "dep:conduit-net", "dep:conduit-rp2040-network-realization", "dep:embassy-net"]
bluetooth-line = ["session-control", "dep:conduit-bluetooth", "dep:embassy-sync", "dep:heapless09", "dep:trouble-host", "cyw43/bluetooth"]
distributed-lenia = ["session-control", "dep:conduit-alife", "dep:conduit-bluetooth", "dep:embassy-sync", "dep:heapless09", "dep:trouble-host", "cyw43/bluetooth"]
usb-midi-fixture = ["dep:embassy-futures"]
pete-capstone = ["dep:conduit-wire", "dep:embassy-futures"]
session-control = ["dep:conduit-wire", "dep:embassy-futures"]
light-switch = ["session-control"]
indicator-resource = ["light-switch"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
aligned = "0.4.3"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = { version = "0.1", optional = true }
embassy-sync = { version = "0.7", optional = true }
embassy-rp = { version = "0.10", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-time = "0.5"
embassy-usb = "0.6"
portable-atomic = { version = "1.14.0", features = ["critical-section"] }
rp-pac = { version = "7", features = ["rp2040"] }
static_cell = "2"
cyw43 = "0.7"
cyw43-pio = "0.10"
fixed = "=1.29.0"
heapless = "0.8"
embedded-hal-nb = "1.0"
nb = "1.1"
heapless09 = { package = "heapless", version = "0.9", optional = true }
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp"], optional = true }
embedded-websocket = { version = "0.9.5", default-features = false }
httparse = { version = "1.10", default-features = false }

conduit-alife = { path = "../../../../semantics/alife", default-features = false, optional = true }
conduit-core = { path = "../../../../architecture/core", default-features = false }
conduit-create-oi = { path = "../../../../mechanisms/devices/create-oi" }
conduit-body = { path = "../../../../architecture/body" }
conduit-kernel = { path = "../../../../architecture/kernel" }
conduit-mpu6050 = { path = "../../../../mechanisms/devices/mpu6050" }
conduit-ssd1306 = { path = "../../../../mechanisms/devices/ssd1306" }
conduit-net = { path = "../../../../semantics/net", default-features = false, optional = true }
conduit-rp2040-network-realization = { path = "../../network-realization", optional = true }
conduit-r1-network-conformance = { path = "../../../../proof/conformance/network-r1", default-features = false, optional = true }
conduit-signal = { path = "../../../../semantics/signal", default-features = false }
conduit-wire = { path = "../../../../architecture/wire", default-features = false, optional = true }
conduit-bluetooth = { path = "../../../../mechanisms/protocols/bluetooth", optional = true }
trouble-host = { version = "0.7", default-features = false, features = ["central", "peripheral", "gatt", "derive", "security", "default-packet-pool", "default-packet-pool-size-8", "default-packet-pool-mtu-251", "connection-event-queue-size-4", "l2cap-rx-queue-size-4", "l2cap-tx-queue-size-4"], optional = true }
ed25519-dalek = { version = "2.2", default-features = false }
serde-json-core = "0.6"

[build-dependencies]
conduit-alife-distributed-conformance = { path = "../../../../proof/conformance/alife-distributed" }
conduit-core = { path = "../../../../architecture/core" }
conduit-embedded-build = { path = "../../../../fabrication/embedded-build" }
conduit-form = { path = "../../../../architecture/form" }
conduit-planner = { path = "../../../../architecture/planner" }
conduit-plan-lowering = { path = "../../../../architecture/plan-lowering", default-features = false }
conduit-signal = { path = "../../../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../../../proof/conformance/signal" }
conduit-net = { path = "../../../../semantics/net", features = ["form-catalog"] }
conduit-rp2040-network-realization = { path = "../../network-realization" }
conduit-r1-network-conformance = { path = "../../../../proof/conformance/network-r1" }
serde_json = "1"

[[bin]]
name = "conduit-pico-w-signal"
path = "src/main.rs"

[[bin]]
name = "conduit-pico-w-midi-fixture"
path = "src/bin/pico_midi_fixture.rs"
required-features = ["usb-midi-fixture"]

[[bin]]
name = "conduit-pico-w-pete-capstone"
path = "src/bin/pete_capstone.rs"
required-features = ["pete-capstone"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Trouble's maintained Pico W realization pins this CYW43 PIO revision. It
# gives reads and writes distinct DMA channels so inbound HCI traffic is not
# lost while the shared half-duplex bus is transmitting.
[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "1d3c3dec8edbf37450d0174b312f8d3d6cc0bf12" }
