[package]
name = "conduit-linux-face-display"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sha2 = "0.10"
conduit-environment-runtime = { path = "../../bodies/environment/runtime" }
conduit-environment-history = { path = "../../bodies/environment/history" }
conduitos = { path = "../conduitos", features = ["native-face-raster"] }
conduit-face = { path = "../../semantics/face" }
conduit-core = { path = "../../architecture/core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
conduit-todo-face = { path = "../../plots/todo/face" }
conduit-todo-plot = { path = "../../plots/todo/model" }
conduit-seven-segment-mask = { path = "../../plots/seven-segment-mask" }
