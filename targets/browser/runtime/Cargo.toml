[package]
name = "conduit-browser-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["form-runner", "tour-surface", "creche-surface"]
form-runner = []
tour-surface = ["form-runner"]
creche-surface = []

[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-human = { path = "../../../semantics/human" }
conduit-body = { path = "../../../architecture/body" }
conduit-body-fabrication = { path = "../../../fabrication/body" }
conduit-chat = { path = "../../../semantics/chat", features = ["form-catalog"] }
conduit-form = { path = "../../../architecture/form" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-language = { path = "../../../semantics/language" }
conduit-net = { path = "../../../semantics/net", features = ["form-catalog"] }
conduit-planner = { path = "../../../architecture/planner" }
conduit-presentation = { path = "../../../semantics/presentation", default-features = false }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../../proof/conformance/signal" }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["form-catalog", "text-lab-plan", "kernel-operation"] }
conduit-text = { path = "../../../semantics/text", default-features = false, features = ["form-catalog"] }
conduit-time = { path = "../../../semantics/time", features = ["form-catalog", "kernel-operation"] }
conduit-wire = { path = "../../../architecture/wire" }
conduit-host-fabrication = { path = "../../../fabrication/host" }
conduit-host-avr-fabrication = { path = "../../avr/fabrication" }
conduit-host-rp2040 = { path = "../../rp2040/fabrication" }
conduit-host-esp32-fabrication = { path = "../../esp32/fabrication" }
conduit-host-hosted = { path = "../../std/fabrication" }
conduit-host-orange-pi = { path = "../../orange-pi/fabrication" }
conduit-host-browser-fabrication = { path = "../fabrication" }
conduit-host-raspberry-pi = { path = "../../raspberry-pi/fabrication" }
conduit-host-conduitos-fabrication = { path = "../../conduitos/fabrication" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

conduit-web = { path = "../../../semantics/web", features = ["form-catalog"] }

[dev-dependencies]
conduit-std-offers = { path = "../../std/offers" }
