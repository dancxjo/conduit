[package]
name = "conduit-browser-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["form-runner", "tour-surface", "creche-surface", "protected-line"]
form-runner = []
tour-surface = ["form-runner"]
creche-surface = []
protected-line = ["dep:conduit-protected-line"]

[dependencies]
conduit-synth = { path = "../../../mechanisms/implementations/synth" }
conduit-audio = { path = "../../../semantics/audio" }
conduit-body-invitation-form = { path = "../../../semantics/body-invitation" }
conduit-core = { path = "../../../architecture/core" }
conduit-composite = { path = "../../../architecture/composite" }
conduit-birth-form = { path = "../../../forms/birth" }
conduit-data = { path = "../../../semantics/data", features = ["kernel-step"] }
conduit-little-seismograph-fixture = { path = "../../../forms/little-seismograph/fixture" }
conduit-form-library = { path = "../../../semantics/form-library" }
conduit-human = { path = "../../../semantics/human" }
conduit-body = { path = "../../../architecture/body" }
conduit-body-make = { path = "../../../make/body" }
conduit-chat = { path = "../../../semantics/chat", features = ["form-catalog"] }
conduit-ai = { path = "../../../semantics/ai", features = ["form-catalog"] }
conduit-tongues = { path = "../../../semantics/tongues" }
conduit-form = { path = "../../../architecture/form" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-language = { path = "../../../semantics/language" }
conduit-net = { path = "../../../semantics/net", features = ["form-catalog"] }
conduit-planner = { path = "../../../architecture/planner" }
conduit-presentation = { path = "../../../semantics/presentation", default-features = false, features = ["form-catalog"] }
conduit-tour-model = { path = "../../../forms/tour" }
conduit-tutorial-form = { path = "../../../semantics/tutorial" }
patchbay-application = { path = "../../../forms/patchbay/application" }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../../proof/conformance/signal" }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["form-catalog", "text-lab-plan", "kernel-step"] }
conduit-text = { path = "../../../semantics/text", default-features = false, features = ["form-catalog"] }
conduit-time = { path = "../../../semantics/time", features = ["form-catalog", "kernel-step"] }
conduit-wire = { path = "../../../architecture/wire" }
conduit-protected-line = { path = "../../../architecture/protected-line", optional = true }
conduit-host-make = { path = "../../../make/host" }
conduit-host-avr-make = { path = "../../avr/make" }
conduit-host-rp2040 = { path = "../../rp2040/make" }
conduit-host-esp32-make = { path = "../../esp32/make" }
conduit-host-hosted = { path = "../../std/make" }
conduit-host-orange-pi = { path = "../../orange-pi/make" }
conduit-host-browser-make = { path = "../make" }
conduit-host-raspberry-pi = { path = "../../raspberry-pi/make" }
conduit-host-conduitos-make = { path = "../../conduitos/make" }
conduit-linear-framebuffer-make = { path = "../../../mechanisms/implementations/linear-framebuffer-make" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
qrcode = { version = "0.14.1", default-features = false }

conduit-web = { path = "../../../semantics/web", features = ["form-catalog"] }

[dev-dependencies]
# Browser planning conformance exercises the hosted speech offer catalog as
# fixture data; production browser builds still carry no std speech provider.
conduit-std-offers = { path = "../../std/offers", features = ["speech"] }
