<!doctype html>
<!-- Workspace icons use the pinned Lucide subset; see mechanisms/implementations/bounded-lucide/LICENSE. -->
<html lang="en" data-workspace-look="editorial">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101114">
  <title>Your body · Conduit</title>
  <link rel="manifest" href="./workspace.webmanifest">
  <meta name="conduit-application-package" content="./workspace.application.json">
  <link rel="stylesheet" href="./workspace.css">
</head>
<body>
  <a class="skip-link" href="#plot-input">Skip to the plot</a>
  <div class="workspace-shell">
    <header class="body-header">
      <a class="conduit-mark" href="../" aria-label="Conduit home"><span aria-hidden="true">c.</span> conduit</a>
      <div class="body-heading"><h1 data-body-name>Your body</h1><span class="body-state" data-body-state>Opening…</span>
        <div class="membership-shortcuts"><button type="button" data-open-membership aria-controls="workspace-membership" aria-expanded="false" hidden><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
  <path d="M16 3.128a4 4 0 0 1 0 7.744" />
  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
  <circle cx="9" cy="7" r="4" />
</svg>parts / hosts</button><button type="button" data-invite-host hidden><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
  <circle cx="9" cy="7" r="4" />
  <line x1="19" x2="19" y1="8" y2="14" />
  <line x1="22" x2="16" y1="11" y2="11" />
</svg>Invite</button></div>
      </div>

      <label class="workspace-look-picker"><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" />
  <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
  <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
  <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
  <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
</svg>Workspace Look
        <select data-workspace-look-picker aria-label="Workspace Look">
          <option value="editorial">Editorial</option>
          <option value="engineering">Engineering</option>
          <option value="phosphor">Phosphor</option>
        </select>
      </label>
    </header>
    <details class="body-tutorial" data-body-tutorial open>
      <summary>Learn through this body</summary>
      <div data-body-tutorial-core data-application-slot="body-tutorial"></div>
      <div data-body-tutorial-resident></div>
    </details>
    <main>
      <section class="workspace-creche" data-workspace-creche hidden aria-label="Birth your body">
        <div data-creche-content></div>
      </section>
      <section class="plot-surface" aria-labelledby="surface-title" data-workspace-surface hidden>
        <div class="surface-content">
          <h2 id="surface-title">Start with a word.</h2>
          <p class="surface-invitation" data-surface-invitation>Type something. Watch it become a signal.</p>
          <div id="plot-input" role="textbox" aria-multiline="true" aria-label="Interact with your plot" tabindex="-1" aria-disabled="true" aria-describedby="surface-guidance" inert>
            <span class="input-prompt" aria-hidden="true">Type to begin.</span>
            <div class="signal-manifestation" aria-label="plot output" data-plot-output></div>
          </div>
          <p id="surface-guidance" class="surface-guidance">Preparing your plot…</p>
          <div class="body-controls"><button type="button" data-wake-body hidden><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 2v8" />
  <path d="m4.93 10.93 1.41 1.41" />
  <path d="M2 18h2" />
  <path d="M20 18h2" />
  <path d="m19.07 10.93-1.41 1.41" />
  <path d="M22 22H2" />
  <path d="m8 6 4-4 4 4" />
  <path d="M16 18a4 4 0 0 0-8 0" />
</svg>wake body</button><button type="button" data-lull-body disabled><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
</svg>lull body</button><button type="button" data-fulfill-body><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <path d="m9 12 2 2 4-4" />
</svg>Finish body</button></div>
        </div>
      </section>
      <nav class="activity-switcher" aria-label="Your plots" hidden></nav>
      <section class="workspace-panel plot-library-panel" id="workspace-library" aria-labelledby="library-title" hidden>
        <div class="panel-heading"><h2 id="library-title" tabindex="-1">plots for your body</h2><button type="button" data-close-library><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m12 19-7-7 7-7" />
  <path d="M19 12H5" />
</svg>back to the surface</button></div>
        <div data-application-slot="workspace-plot-library"></div>
      </section>
      <section class="workspace-panel membership-panel" id="workspace-membership" aria-labelledby="membership-title" hidden>
        <div class="panel-heading"><h2 id="membership-title" tabindex="-1">parts and hosts</h2><button type="button" data-close-membership><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m12 19-7-7 7-7" />
  <path d="M19 12H5" />
</svg>back to the surface</button></div>
        <div data-membership-content></div>
      </section>
      <section class="workspace-panel" id="workspace-inspection" aria-labelledby="inspection-title" hidden>
        <div class="panel-heading"><h2 id="inspection-title" tabindex="-1">Inside this plot</h2><button type="button" data-close-inspection aria-label="Close inspection"><svg class="workspace-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m12 19-7-7 7-7" />
  <path d="M19 12H5" />
</svg>back to the surface <span aria-hidden="true">↗</span></button></div>
        <div data-inspection-content></div>
      </section>
    </main>
    <footer class="truth-strip" aria-label="Current activity">
      <button type="button" data-inspect="plot" aria-controls="workspace-inspection" aria-expanded="false" class="current-plot">Your plot <span aria-hidden="true">⌄</span></button>
      <button type="button" data-inspect="flow" aria-controls="workspace-inspection" aria-expanded="false" class="current-flow"><span data-flow-label>keyboard → encode → light</span><span class="inspect-hint">Look inside ↗</span></button>
      <button type="button" data-inspect="lifecycle" aria-controls="workspace-inspection" aria-expanded="false" class="current-state"><span class="state-dot" aria-hidden="true"></span><span data-play-state>Preparing</span></button>
    </footer>
    <p class="workspace-notice" role="status" aria-live="polite" data-workspace-notice></p>
  </div>
  <script type="module" src="./browser-application-loader.mjs"></script>
</body>
</html>
