[package]
name = "conduitos-application-service"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
[workspace]
resolver = "2"
[[bin]]
name = "conduitos-application-service"
path = "main.rs"
[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
conduitos-application-core = { path = "../application-core" }
[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = "fat"
