[features]
default = []
# Compile pure ConduitOS description and planning surfaces for hosted repository
# tooling without enabling any target's runtime or physical device support.
hosted-tools = []
hotplug-proof = []
scripted-keyboard-proof = []
native-compositor = []
native-http-client = []
# Proof-appliance selectors. Every selected entrypoint lives under the explicit
# proof/appliances tree and remains absent from an ordinary product build.
aarch64-a0 = []
aarch64-a2 = []
aarch64-a3 = []
aarch64-product = []
aarch64-orange-pi-5 = []
armv6-rpi-b-plus-a0 = []
armv6-rpi-b-plus-a2 = []
armv6-rpi-b-plus-a3 = []
ia32-a0 = []
ia32-a2 = []
ia32-a3 = []
ia32-product = []
riscv64-a0 = []
riscv64-a2 = []
riscv64-a3 = []
riscv64-a4 = []
riscv64-product = []
loongarch64-a0 = []
loongarch64-a2 = []
loongarch64-a3 = []
loongarch64-a4 = []
loongarch64-product = []

[dependencies]
conduit-audio = { path = "../../semantics/audio" }
conduit-body = { path = "../../architecture/body", default-features = false }
conduit-core = { path = "../../architecture/core" }
conduit-human = { path = "../../semantics/human" }
conduit-robotics = { path = "../../semantics/robotics" }
patchbay-control = { path = "../../products/patchbay/control" }
conduit-form = { path = "../../architecture/form" }
conduit-kernel = { path = "../../architecture/kernel" }
conduit-observatory = { path = "../../architecture/observatory" }
conduit-planner = { path = "../../architecture/planner" }
conduit-presentation = { path = "../../semantics/presentation" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering", default-features = false }
conduit-semantic-catalog = { path = "../../semantics/catalog", default-features = false, features = ["form-catalog"] }
conduit-time = { path = "../../semantics/time" }
conduit-text = { path = "../../semantics/text", default-features = false }
conduit-web = { path = "../../semantics/web", default-features = false }
conduit-synth = { path = "../../mechanisms/implementations/synth" }
sha2 = { version = "=0.10.9", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64", target_arch = "loongarch64"))'.dependencies]
limine = "=0.5.0"

[dev-dependencies]
conduit-std-host = { path = "../std" }

[[test]]
name = "native_compositor"
path = "tests/native_compositor.rs"
required-features = ["native-compositor"]
