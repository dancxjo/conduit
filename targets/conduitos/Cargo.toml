[features]
default = []
# Compile pure ConduitOS description and planning surfaces for hosted repository
# tooling without enabling any target's runtime or physical device support.
hosted-tools = []
hotplug-proof = []
scripted-keyboard-proof = []
usb-configuration-proof = []
usb-endpoint-read-proof = ["scripted-keyboard-proof"]
usb-hid-endpoint-proof = ["usb-endpoint-read-proof"]
usb-hid-mouse-proof = ["usb-hid-endpoint-proof"]
native-compositor = ["dep:fontdue", "native-owner-network"]
# The product's invitation-bound owner exchange uses the same bounded network
# machinery as the isolated transport proof, without selecting its entrypoint.
native-owner-network = ["dep:embedded-io", "dep:embedded-tls", "dep:embedded-websocket", "dep:rand_chacha", "dep:rand_core", "dep:serde-json-core", "dep:smoltcp"]
native-http-client = []
conduitos-isolation-proof = []
ordinary-domain-proof = []
emergency-halt-proof = []
virtio-net-proof = ["native-owner-network"]
ps2-input = []
# Proof-appliance selectors. Every selected entrypoint lives under the explicit
# proof/appliances tree and remains absent from an ordinary product build.
aarch64-a0 = []
aarch64-a2 = []
aarch64-a3 = []
aarch64-product = []
aarch64-orange-pi-5 = []
armv6-rpi-b-plus-a0 = []
armv6-rpi-b-plus-a2 = []
armv6-rpi-b-plus-a3 = []
ia32-a0 = []
ia32-a2 = []
ia32-a3 = []
ia32-product = []
riscv64-a0 = []
riscv64-a2 = []
riscv64-a3 = []
riscv64-a4 = []
riscv64-product = []
loongarch64-a0 = []
loongarch64-a2 = []
loongarch64-a3 = []
loongarch64-a4 = []
loongarch64-product = []

[dependencies]
conduit-birth-plot = { path = "../../plots/birth" }
conduit-home-model = { path = "../../semantics/home" }
conduit-audio = { path = "../../semantics/audio" }
conduit-body = { path = "../../architecture/body", default-features = false, features = ["authenticated-admission"] }
conduit-core = { path = "../../architecture/core" }
conduit-human = { path = "../../semantics/human" }
conduit-robotics = { path = "../../semantics/robotics" }
patchbay-control = { path = "../../plots/patchbay" }
patchbay-application = { path = "../../plots/patchbay/application" }
conduit-plot = { path = "../../architecture/plot" }
conduit-composite = { path = "../../architecture/composite" }
conduit-kernel = { path = "../../architecture/kernel", features = ["alloc"] }
conduit-observatory = { path = "../../architecture/observatory" }
conduit-planner = { path = "../../architecture/planner" }
conduit-protected-line = { path = "../../architecture/protected-line", default-features = false, features = ["noise-session"] }
conduit-presentation = { path = "../../semantics/presentation" }
conduit-conduitos-mask-offer = { path = "mask-offer" }
conduit-tour-model = { path = "../../plots/tour" }
conduit-tutorial-plot = { path = "../../semantics/tutorial" }
embedded-io = { version = "0.7.1", optional = true, default-features = false }
embedded-tls = { version = "0.19.0", optional = true, default-features = false, features = ["rustpki", "ed25519"] }
embedded-websocket = { version = "0.9.5", optional = true, default-features = false }
rand_chacha = { version = "0.3.1", optional = true, default-features = false }
rand_core = { version = "0.6.4", optional = true, default-features = false }
smoltcp = { version = "0.13.1", optional = true, default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "iface-max-addr-count-1", "iface-max-route-count-1", "iface-neighbor-cache-count-4"] }
patchbay-graph = { path = "../../plots/patchbay/graph" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering", default-features = false }
conduit-wire = { path = "../../architecture/wire" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
conduit-semantic-catalog = { path = "../../semantics/catalog", default-features = false, features = ["plot-catalog", "kernel-step"] }
conduit-time = { path = "../../semantics/time" }
conduit-text = { path = "../../semantics/text", default-features = false }
conduit-web = { path = "../../semantics/web", default-features = false }
conduit-synth = { path = "../../mechanisms/implementations/synth" }
sha2 = { version = "=0.10.9", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde-json-core = { version = "0.6", optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64", target_arch = "loongarch64"))'.dependencies]
limine = "=0.5.0"

[dev-dependencies]
conduit-std-host = { path = "../std" }

[build-dependencies]
# Make-only rasterization: no font parser or atlas allocation in Play.
fontdue = { version = "=0.9.3", optional = true, default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9" }

[[test]]
name = "native_compositor"
path = "tests/native_compositor.rs"
required-features = ["native-compositor"]

[[test]]
name = "native_compositor_input"
path = "tests/native_compositor_input.rs"
required-features = ["native-compositor"]

[[test]]
name = "native_compositor_scanout"
path = "tests/native_compositor_scanout.rs"
required-features = ["native-compositor"]
