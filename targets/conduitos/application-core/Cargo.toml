[package]
name = "conduitos-application-core"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-body = { path = "../../../architecture/body" }
conduit-face = { path = "../../../semantics/face", default-features = false }
conduit-tutorial-plot = { path = "../../../semantics/tutorial" }
conduit-tour-model = { path = "../../../plots/tour" }
patchbay-application = { path = "../../../plots/patchbay/application" }
patchbay-graph = { path = "../../../plots/patchbay/graph" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde-json-core = { version = "0.6", default-features = false }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
