[package]
name="conduitos-compositor-hostile-proof"
version="0.1.0"
edition="2024"
publish=false
build="build.rs"
[workspace]
resolver="2"

[[bin]]
name="compositor-proof-envelope"
path="bins/envelope.rs"

[[bin]]
name="compositor-proof-shape"
path="bins/shape.rs"

[[bin]]
name="compositor-proof-fault"
path="bins/fault.rs"

[[bin]]
name="compositor-proof-loop"
path="bins/loop.rs"

[dependencies]
conduitos-compositor-core={path="../compositor-core"}
[profile.release]
panic="abort"
opt-level="s"
codegen-units=1
lto="fat"
