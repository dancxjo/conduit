[package]
name = "conduitos-tls-service"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
[workspace]
resolver = "2"
[[bin]]
name = "conduitos-tls-service"
path = "main.rs"
[dependencies]
conduitos-tls-core = { path = "../tls-core" }
# Guest CR0.TS deliberately forbids SIMD; Root crypto retains its own features.
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = "fat"
