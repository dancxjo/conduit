[package]
name = "conduitos-runtime-service"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
[workspace]
resolver = "2"
[[bin]]
name = "conduitos-runtime-service"
path = "main.rs"
[dependencies]
conduitos-runtime-core = { path = "../runtime-core" }
conduit-kernel = { path = "../../../architecture/kernel", default-features = false }
[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = "fat"
