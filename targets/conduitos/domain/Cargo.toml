[package]
name = "conduitos-domain"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"

[[bin]]
name = "conduitos-domain"
path = "main.rs"

[dependencies]
conduit-human = { path = "../../../semantics/human" }

conduit-text = { path = "../../../semantics/text", default-features = false }

conduit-kernel = { path = "../../../architecture/kernel" }
conduit-time = { path = "../../../semantics/time", default-features = false }

[features]
proof = []

[profile.release]
panic = "abort"
# The separately admitted image has a fixed 128 KiB code/constant window.
opt-level = "s"
codegen-units = 1
# Eliminate intermediate fixed-state copies across kernel crate boundaries.
lto = "thin"

# The private protection-domain workspace runs the same finite catalogue/font
# generators as the root build. Optimize their build-time work while retaining
# the admitted domain binary's size-oriented release profile above.
[profile.release.build-override]
opt-level = 1
