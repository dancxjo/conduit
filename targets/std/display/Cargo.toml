[package]
name = "conduit-linux-display"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
sdl = ["dep:libc", "dep:conduit-face", "dep:conduit-human", "dep:conduit-semantic-catalog", "dep:conduitos", "dep:sdl2"]

[dependencies]
conduit-human = { path = "../../../semantics/human", optional = true }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, optional = true }
conduit-face = { path = "../../../semantics/face", optional = true }
conduitos = { path = "../../conduitos", default-features = false, optional = true }
sdl2 = { version = "=0.38.0", default-features = false, optional = true }

[dev-dependencies]
conduit-core = { path = "../../../architecture/core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
