[package]
name = "conduit-body-make"
version = "0.1.0"
edition = "2021"
description = "Bounded Body construction and Spore binding above Conduit Host make"

[dependencies]
conduit-form = { path = "../../architecture/form" }
conduit-host-make = { path = "../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
conduit-workspace-make = { path = "../workspace" }
