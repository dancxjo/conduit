[package]
name = "conduit-embedded-build"
version = "0.1.0"
edition = "2021"
description = "Host-only current-plan to fixed Conduit kernel table generator"

[features]
schema-value-storage = ["conduit-semantic-catalog/schema-value-storage"]
execution-workspace = ["conduit-semantic-catalog/execution-workspace"]
delegated-preparation = ["conduit-plan-lowering/delegated-preparation", "conduit-body/authenticated-admission"]

[dependencies]
conduit-body = { path = "../../architecture/body", default-features = false }
conduit-core = { path = "../../architecture/core" }
conduit-wire = { path = "../../architecture/wire" }
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
conduit-kernel = { path = "../../architecture/kernel" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering", default-features = false }

conduit-plot = { path = "../../architecture/plot" }

sha2 = { version = "0.10", default-features = false }

conduit-semantic-catalog = { path = "../../semantics/catalog", default-features = false, features = ["kernel-step"] }
serde_json = "1"

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
conduit-plan-lowering = { path = "../../architecture/plan-lowering", default-features = false, features = ["body-plan-binding"] }
conduit-body = { path = "../../architecture/body" }
conduit-wire = { path = "../../architecture/wire", features = ["deflate"] }
ed25519-dalek = { version = "2.2", default-features = false }
conduit-net = { path = "../../semantics/net" }
conduit-r1-network-conformance = { path = "../../proof/conformance/network-r1" }
conduit-planner = { path = "../../architecture/planner" }
conduit-signal = { path = "../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
