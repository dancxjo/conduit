[package]
name = "conduit-protected-line"
version = "0.1.0"
edition = "2021"

[dependencies]
noise-protocol = { version = "0.2.1", default-features = false, features = ["use_alloc"], optional = true }
noise-rust-crypto = { version = "0.6.2", default-features = false, features = ["use-chacha20poly1305", "use-sha2"], optional = true }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"], optional = true }

[features]
default = ["noise-session"]
noise-session = ["dep:noise-protocol", "dep:noise-rust-crypto", "dep:x25519-dalek"]

[dev-dependencies]
serde_json = "1"
