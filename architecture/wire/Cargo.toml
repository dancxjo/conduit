[package]
name = "conduit-wire"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../core" }
conduit-plot = { path = "../plot" }
miniz_oxide = { version = "=0.8.9", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
conduit-plot = { path = "../plot" }

[features]
default = []
deflate = ["dep:miniz_oxide"]
offer-images = ["deflate", "dep:serde_json"]

[dev-dependencies]
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
