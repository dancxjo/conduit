[package]
name = "conduit-plan-lowering"
version = "0.1.0"
edition = "2021"

[features]
default = []
body-plan-binding = ["dep:conduit-body"]
delegated-preparation = ["dep:conduit-body", "conduit-body/authenticated-admission"]
schema-value-storage = ["conduit-kernel/schema-value-storage"]
hosted-region-storage = ["conduit-kernel/alloc"]

[dependencies]
conduit-body = { path = "../body", default-features = false, optional = true }
conduit-core = { path = "../core" }
conduit-kernel = { path = "../kernel" }

[[test]]
name = "lowering_boundary"
