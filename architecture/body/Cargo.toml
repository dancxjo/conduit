[package]
name = "conduit-body"
version = "0.1.0"
edition = "2021"

[features]
default = ["authenticated-admission"]
authenticated-admission = ["dep:ed25519-dalek", "dep:miniz_oxide", "dep:serde_json"]

[dependencies]
conduit-core = { path = "../core" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
minicbor = { version = "2.3", default-features = false }

miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

# IDs are immutable across portable Hosts; cloning shares bytes without losing
# Send/Sync on targets whose atomics are supplied by critical-section.
portable-atomic-util = { version = "0.2.8", default-features = false, features = ["alloc", "serde"] }

[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

[dev-dependencies]
serde_json = "1"
