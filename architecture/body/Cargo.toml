[package]
name = "conduit-body"
version = "0.1.0"
edition = "2021"

[features]
default = ["authenticated-admission"]
authenticated-admission = ["dep:ed25519-dalek"]

[dependencies]
conduit-core = { path = "../core" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1"
