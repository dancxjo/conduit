[package]
name = "conduit-composite"
version = "0.1.0"
edition = "2021"

[features]
default = ["kernel-executor"]
# Finite StepBacks need only Core and the existing execution kernel.
# Hosted/nested-Plan preparation remains an explicit, separately linked layer.
kernel-executor = ["dep:conduit-plot", "dep:conduit-plan-lowering"]
fixture-registry-preparation = ["kernel-executor"]

[[test]]
name = "kernel_execution"
required-features = ["fixture-registry-preparation"]

[[test]]
name = "flow_select"
required-features = ["fixture-registry-preparation"]

[[test]]
name = "canonical_export"
required-features = ["fixture-registry-preparation"]

[dependencies]
conduit-core = { path = "../core" }
conduit-plot = { path = "../plot", optional = true }
conduit-kernel = { path = "../kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../plan-lowering", default-features = false, optional = true }

[dev-dependencies]
conduit-kernel = { path = "../kernel", features = ["alloc", "step-test-support"] }
conduit-planner = { path = "../planner" }
conduit-signal = { path = "../../semantics/signal", default-features = false, features = ["host-profile"] }
conduit-semantic-catalog = { path = "../../semantics/catalog", default-features = false, features = ["plot-catalog"] }
