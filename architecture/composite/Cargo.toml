[package]
name = "conduit-composite"
version = "0.1.0"
edition = "2021"

[features]
fixture-registry-preparation = []

[[test]]
name = "kernel_execution"
required-features = ["fixture-registry-preparation"]

[[test]]
name = "flow_select"
required-features = ["fixture-registry-preparation"]

[dependencies]
conduit-core = { path = "../core" }
conduit-plot = { path = "../plot" }
conduit-kernel = { path = "../kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../plan-lowering", default-features = false }

[dev-dependencies]
conduit-kernel = { path = "../kernel", features = ["alloc", "step-test-support"] }
conduit-planner = { path = "../planner" }
conduit-signal = { path = "../../semantics/signal", default-features = false, features = ["host-profile"] }
conduit-semantic-catalog = { path = "../../semantics/catalog", default-features = false, features = ["plot-catalog"] }
