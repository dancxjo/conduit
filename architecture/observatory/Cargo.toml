[package]
name = "conduit-observatory"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../core" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
conduit-form = { path = "../form" }
conduit-planner = { path = "../planner" }
conduit-signal = { path = "../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
