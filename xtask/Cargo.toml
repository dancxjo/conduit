[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
hex = "0.4.3"
conduit-compile = { path = "../crates/conduit-compile" }
conduit-core = { path = "../crates/conduit-core" }
conduit-media = { path = "../crates/conduit-media" }
conduit-runtime = { path = "../crates/conduit-runtime" }
conduit-std = { path = "../crates/conduit-std" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
