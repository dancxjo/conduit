[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
conduit-body = { path = "../crates/conduit-body" }
conduit-ai = { path = "../crates/conduit-ai" }
conduit-core = { path = "../crates/conduit-core" }
conduit-create-oi = { path = "../crates/conduit-create-oi" }
conduit-form = { path = "../crates/conduit-form" }
conduit-host-fabrication = { path = "../crates/conduit-host-fabrication" }
conduit-kernel = { path = "../crates/conduit-kernel", features = ["alloc"] }
conduit-midi = { path = "../crates/conduit-midi" }
conduit-std-catalog = { path = "../crates/conduit-std-catalog" }
conduitos = { path = "../hosts/conduitos", features = ["hosted-tools"] }
conduit-net = { path = "../crates/conduit-net" }
conduit-netherwick = { path = "../crates/conduit-netherwick" }
conduit-observatory = { path = "../crates/conduit-observatory" }
conduit-signal = { path = "../crates/conduit-signal" }
conduit-synth = { path = "../crates/conduit-synth" }
conduit-planner = { path = "../crates/conduit-planner" }
conduit-presentation = { path = "../crates/conduit-presentation", features = ["form-catalog"] }
conduit-runtime = { path = "../crates/conduit-runtime", default-features = false }
conduit-std-host = { path = "../hosts/std", features = ["local-model-proof", "netherwick-create"] }
conduit-system-continuity = { path = "../crates/conduit-system-continuity", features = ["r1-recovery"] }
conduit-tongues = { path = "../crates/conduit-tongues" }
conduit-wire = { path = "../crates/conduit-wire" }
patchbay-model = { path = "../hosts/patchbay-model" }

[dev-dependencies]
libc = "0.2"
