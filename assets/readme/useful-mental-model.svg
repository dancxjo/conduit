<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">The Conduit idea</title>
  <desc id="desc">A form describes what should happen. Body building prepares parts as spores. After boot and join, the current body contains the hosts, resources, lines, and signs that actually exist now. Conduit combines the form with that current body to create one exact plan and execute it as a play.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8bd5ca"/>
    </marker>
    <style>
      .h{font:700 26px ui-sans-serif,system-ui,sans-serif;fill:#f4f7fb}
      .t{font:16px ui-sans-serif,system-ui,sans-serif;fill:#d2dbea}
      .small{font:14px ui-sans-serif,system-ui,sans-serif;fill:#aebbd0}
      .label{font:700 17px ui-sans-serif,system-ui,sans-serif;fill:#8bd5ca}
      .semantic{fill:#243956;stroke:#7dc4e4;stroke-width:2}
      .build{fill:#332f4b;stroke:#c6a0f6;stroke-width:2}
      .truth{fill:#303748;stroke:#f5bde6;stroke-width:2}
      .exact{fill:#28354f;stroke:#c6a0f6;stroke-width:2}
      .play{fill:#2c3d32;stroke:#a6da95;stroke-width:2}
      .line{fill:none;stroke:#8bd5ca;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>

  <text x="54" y="50" class="small">A useful mental model</text>
  <text x="54" y="84" class="h">The body is the computer</text>

  <rect x="54" y="126" width="330" height="126" rx="18" class="semantic"/>
  <text x="82" y="164" class="label">form</text>
  <text x="82" y="197" class="t">what should happen</text>
  <text x="82" y="224" class="small">portable semantic meaning</text>

  <rect x="816" y="126" width="330" height="126" rx="18" class="build"/>
  <text x="844" y="164" class="label">body building</text>
  <text x="844" y="197" class="t">prepare the intended parts</text>
  <text x="844" y="224" class="small">build deployable spores</text>

  <rect x="816" y="334" width="330" height="126" rx="18" class="truth"/>
  <text x="844" y="372" class="label">current body</text>
  <text x="844" y="405" class="t">what actually came alive</text>
  <text x="844" y="432" class="small">parts · hosts · resources · lines · signs</text>

  <rect x="438" y="334" width="260" height="126" rx="18" class="exact"/>
  <text x="466" y="372" class="label">plan</text>
  <text x="466" y="405" class="t">one exact finite realization</text>
  <text x="466" y="432" class="small">admitted against current truth</text>

  <rect x="438" y="500" width="260" height="76" rx="18" class="play"/>
  <text x="466" y="535" class="label">play</text>
  <text x="466" y="559" class="t">execute that plan</text>

  <path d="M219 252 V296 H568 V334" class="line"/>
  <path d="M981 252 V334" class="line"/>
  <text x="1001" y="299" class="small">boot / join</text>
  <path d="M816 397 H698" class="line"/>
  <path d="M568 460 V500" class="line"/>

  <text x="54" y="601" class="small">The form says what must remain true. The current body says what can make it true now.</text>
</svg>
