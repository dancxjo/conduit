[package]
name = "conduit-language"
version = "0.1.0"
edition = "2021"

[features]
parser-model-selection = ["dep:conduit-ai", "dep:conduit-data", "dep:serde_json", "conduit-ai/kernel-operation-owners"]

[dependencies]
conduit-ai = { path = "../ai", optional = true, default-features = false }
conduit-data = { path = "../data", optional = true, default-features = false }
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }
conduit-core = { path = "../../architecture/core" }
conduit-plot = { path = "../../architecture/plot" }

[build-dependencies]
conduit-core = { path = "../../architecture/core" }
conduit-plot = { path = "../../architecture/plot" }

[dev-dependencies]
conduitos = { path = "../../targets/conduitos" }
conduit-composite = { path = "../../architecture/composite" }
conduit-kernel = { path = "../../architecture/kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../../architecture/plan-lowering" }
conduit-planner = { path = "../../architecture/planner" }
serde_json = "1"
conduit-ai = { path = "../ai" }
conduit-data = { path = "../data" }
conduit-std-host = { path = "../../targets/std", default-features = false }
serde = { version = "1", features = ["derive"] }
