[package]
name = "conduit-net"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../architecture/core" }
conduit-plot = { path = "../../architecture/plot" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[features]
default = []
plot-catalog = []

[build-dependencies]
conduit-plot = { path = "../../architecture/plot" }

[dev-dependencies]
conduit-plot = { path = "../../architecture/plot" }
conduit-planner = { path = "../../architecture/planner" }
conduit-text = { path = "../text", features = ["plot-catalog"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
