[package]
name = "conduit-net"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../architecture/core" }
conduit-form = { path = "../../architecture/form" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[features]
default = []
form-catalog = []

[build-dependencies]
conduit-form = { path = "../../architecture/form" }

[dev-dependencies]
conduit-form = { path = "../../architecture/form" }
conduit-planner = { path = "../../architecture/planner" }
conduit-text = { path = "../text", features = ["form-catalog"] }
serde_json = "1"
