[package]
name = "conduit-presentation"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../architecture/core" }
conduit-time = { path = "../time", default-features = false }
conduit-plot = { path = "../../architecture/plot" }
conduit-body = { path = "../../architecture/body", default-features = false }
conduit-human = { path = "../human" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
conduit-plot = { path = "../../architecture/plot" }
conduit-planner = { path = "../../architecture/planner" }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
conduit-plot = { path = "../../architecture/plot" }
conduit-human = { path = "../human" }
conduit-time = { path = "../time", default-features = false }

[features]
default = ["plot-catalog"]
plot-catalog = []
