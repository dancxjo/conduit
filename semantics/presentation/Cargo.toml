[package]
name = "conduit-presentation"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../architecture/core" }
conduit-time = { path = "../time", default-features = false }
conduit-form = { path = "../../architecture/form", optional = true }
conduit-body = { path = "../../architecture/body", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
conduit-form = { path = "../../architecture/form" }
conduit-planner = { path = "../../architecture/planner" }
serde_json = "1"

[features]
default = ["form-catalog"]
form-catalog = ["dep:conduit-form"]
