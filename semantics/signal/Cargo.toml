[package]
name = "conduit-signal"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../architecture/core", optional = true }
conduit-plot = { path = "../../architecture/plot" }
conduit-semantic-catalog = { path = "../catalog", optional = true, default-features = false }
conduit-time = { path = "../time", optional = true, default-features = false }

[features]
default = []
host-profile = ["dep:conduit-core", "dep:conduit-semantic-catalog", "dep:conduit-time", "conduit-semantic-catalog/plot-catalog"]

[build-dependencies]
conduit-plot = { path = "../../architecture/plot" }
