[package]
name = "conduit-speech"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
fargan-source = []
kernel = ["dep:conduit-language", "dep:conduit-core", "dep:conduit-plot", "dep:conduit-audio", "dep:conduit-kernel"]
semantic-bindings = ["dep:conduit-audio", "dep:conduit-core", "dep:conduit-plot", "dep:conduit-language", "dep:postcard", "dep:miniz_oxide"]

[dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"], optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
conduit-language = { path = "../language", optional = true }
conduit-core = { path = "../../architecture/core", optional = true }
conduit-plot = { path = "../../architecture/plot", optional = true }

conduit-audio = { path = "../audio", optional = true }
conduit-kernel = { path = "../../architecture/kernel", optional = true }

[build-dependencies]
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
conduit-audio = { path = "../audio" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
conduit-language = { path = "../language" }
conduit-plot = { path = "../../architecture/plot" }
conduit-core = { path = "../../architecture/core" }

[dev-dependencies]
conduit-std-host = { path = "../../targets/std" }
conduitos = { path = "../../targets/conduitos" }
conduit-composite = { path = "../../architecture/composite" }
serde_json = "1"
conduit-plot = { path = "../../architecture/plot" }
conduit-core = { path = "../../architecture/core" }
conduit-kernel = { path = "../../architecture/kernel", features = ["step-test-support", "alloc"] }
conduit-planner = { path = "../../architecture/planner" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering" }
