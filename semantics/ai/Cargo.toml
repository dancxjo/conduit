[package]
name = "conduit-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../architecture/core" }
conduit-data = { path = "../data" }
conduit-time = { path = "../time", default-features = false }
conduit-form = { path = "../../architecture/form", optional = true }
conduit-web = { path = "../web", optional = true, default-features = false, features = ["form-catalog"] }
serde = { version = "1", default-features = false, features = ["derive"] }
libm = "0.2"
sha2 = { version = "0.10", default-features = false }

[features]
default = []
form-catalog = ["dep:conduit-form", "dep:conduit-web"]

[dev-dependencies]
conduit-semantic-catalog = { path = "../catalog", features = ["form-catalog"] }
conduit-form = { path = "../../architecture/form" }
conduit-kernel = { path = "../../architecture/kernel", features = ["alloc"] }
conduit-planner = { path = "../../architecture/planner" }
conduit-signal = { path = "../signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
conduit-presentation = { path = "../presentation" }
serde_json = "1"
