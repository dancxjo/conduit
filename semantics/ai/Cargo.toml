[package]
name = "conduit-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-kernel = { path = "../../architecture/kernel", optional = true, features = ["alloc"] }
conduit-core = { path = "../../architecture/core" }
conduit-data = { path = "../data" }
conduit-time = { path = "../time", default-features = false }
conduit-plot = { path = "../../architecture/plot" }
conduit-web = { path = "../web", optional = true, default-features = false, features = ["plot-catalog"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libm = "0.2"
sha2 = { version = "0.10", default-features = false }

[features]
default = []
kernel-step = ["dep:conduit-kernel"]
plot-catalog = ["dep:conduit-web"]

[dev-dependencies]
conduit-plan-lowering = { path = "../../architecture/plan-lowering" }
conduit-semantic-catalog = { path = "../catalog", features = ["plot-catalog"] }
conduit-plot = { path = "../../architecture/plot" }
conduit-kernel = { path = "../../architecture/kernel", features = ["alloc", "step-test-support"] }
conduit-planner = { path = "../../architecture/planner" }
conduit-signal = { path = "../signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
conduit-presentation = { path = "../presentation" }
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
conduit-data = { path = "../data" }
conduit-plot = { path = "../../architecture/plot" }
