[package]
name = "conduit-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-composite = { path = "../../architecture/composite", optional = true }
conduit-plan-lowering = { path = "../../architecture/plan-lowering", optional = true, default-features = false }
conduit-kernel = { path = "../../architecture/kernel", optional = true, features = ["alloc"] }
conduit-core = { path = "../../architecture/core" }
conduit-data = { path = "../data" }
conduit-time = { path = "../time", default-features = false }
conduit-plot = { path = "../../architecture/plot" }
conduit-web = { path = "../web", optional = true, default-features = false, features = ["plot-catalog"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libm = "0.2"
sha2 = { version = "0.10", default-features = false }

[features]
# Hosted preparation only: immutable checked built-in catalogues, never model data.
hosted-catalog-cache = []
# Development proof only: retain the prior scalar arithmetic over the same view.
matrix-projection-reference = []
default = []
kernel-step = ["dep:conduit-kernel"]
kernel-operation-owners = ["kernel-step", "dep:conduit-composite", "dep:conduit-plan-lowering"]
plot-catalog = ["dep:conduit-web"]

[dev-dependencies]
serde_json = { version = "1", features = ["std"] }
libc = "0.2"
conduitos = { path = "../../targets/conduitos" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering" }
conduit-semantic-catalog = { path = "../catalog", features = ["plot-catalog", "prepared-expression-session"] }
conduit-plot = { path = "../../architecture/plot" }
conduit-kernel = { path = "../../architecture/kernel", features = ["alloc", "step-test-support"] }
conduit-planner = { path = "../../architecture/planner" }
conduit-signal = { path = "../signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
conduit-face = { path = "../face" }
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
conduit-data = { path = "../data" }
conduit-plot = { path = "../../architecture/plot" }

[[example]]
name = "fargan_performance"
required-features = ["kernel-operation-owners"]

[[example]]
name = "matrix_projection_performance"
required-features = ["matrix-projection-reference"]
