[package]
name = "conduit-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-ai = { path = "../ai", optional = true, default-features = false }
conduit-body = { path = "../../architecture/body", default-features = false }
conduit-core = { path = "../../architecture/core" }
conduit-plot = { path = "../../architecture/plot" }
conduit-net = { path = "../net" }
conduit-presentation = { path = "../presentation", default-features = false }
conduit-text = { path = "../text" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde-json-core = "0.6"
sha2 = { version = "0.10", default-features = false }

[features]
default = []
conversation-flow = ["dep:conduit-ai"]
plot-catalog = [
    "conversation-flow",
    "conduit-ai/plot-catalog",
    "conduit-net/plot-catalog",
    "conduit-presentation/plot-catalog",
]

[build-dependencies]
conduit-plot = { path = "../../architecture/plot" }

[dev-dependencies]
conduit-planner = { path = "../../architecture/planner" }
conduit-semantic-catalog = { path = "../catalog" }

[[test]]
name = "body_chat"
required-features = ["plot-catalog"]

[[test]]
name = "browser_chat"
required-features = ["plot-catalog"]

[[test]]
name = "shared_pool_chat"
required-features = ["plot-catalog"]
