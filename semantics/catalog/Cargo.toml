[package]
name = "conduit-semantic-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-kernel = { path = "../../architecture/kernel", optional = true, features = ["step-test-support"] }
conduit-alife = { path = "../alife" }
conduit-audio = { path = "../audio" }
conduit-core = { path = "../../architecture/core" }
conduit-data = { path = "../data" }
conduit-education = { path = "../education" }
conduit-human = { path = "../human" }
conduit-midi = { path = "../../mechanisms/protocols/midi" }
conduit-net = { path = "../net", default-features = false, features = ["plot-catalog"] }
conduit-presentation = { path = "../presentation" }
conduit-process = { path = "../process" }
conduit-purpose = { path = "../purpose" }
conduit-robotics = { path = "../robotics" }
conduit-web = { path = "../web", default-features = false }
conduit-text = { path = "../text", default-features = false }
conduit-time = { path = "../time", default-features = false }
conduit-plot = { path = "../../architecture/plot" }
conduit-planner = { path = "../../architecture/planner", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

conduit-composite = { path = "../../architecture/composite", optional = true }
conduit-plan-lowering = { path = "../../architecture/plan-lowering", optional = true, default-features = false }

[dev-dependencies]
conduit-planner = { path = "../../architecture/planner" }

[features]
kernel-step = ["dep:conduit-kernel"]
kernel-operation-owners = ["kernel-step", "dep:conduit-composite", "dep:conduit-plan-lowering", "conduit-data/kernel-step"]
default = ["plot-catalog"]
plot-catalog = ["conduit-time/plot-catalog", "conduit-web/plot-catalog", "conduit-text/plot-catalog"]
text-lab-plan = ["plot-catalog", "dep:conduit-planner"]
body-coordination-plan = ["plot-catalog", "dep:conduit-planner"]
