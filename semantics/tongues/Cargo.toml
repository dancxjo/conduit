[package]
name = "conduit-tongues"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
speech = ["dep:tongues-pipeline"]

[[bin]]
name = "conduit-tongues-demo"
path = "src/bin/conduit-tongues-demo.rs"
required-features = ["speech"]

[[bin]]
name = "conduit-tongues-research"
path = "src/bin/conduit-tongues-research.rs"

[dependencies]
conduit-audio = { path = "../audio" }
conduit-ai = { path = "../ai" }
conduit-core = { path = "../../architecture/core" }
conduit-data = { path = "../data" }
conduit-form = { path = "../../architecture/form" }
conduit-kernel = { path = "../../architecture/kernel", features = ["alloc"] }
conduit-planner = { path = "../../architecture/planner" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering" }
conduit-semantic-catalog = { path = "../catalog" }
conduit-text = { path = "../text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tongues-pipeline = { git = "https://github.com/dancxjo/tongues.git", rev = "5748f20ee4fd133be6a9332b01d96dc0649b26a3", optional = true }
