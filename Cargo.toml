[workspace]
members = [
    "crates/conduit-conformance",
    "crates/conduit-core",
    "crates/conduit-panel",
    "crates/conduit-runtime",
    "crates/conduct",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dancxjo/conduit"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
