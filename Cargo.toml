[workspace]
members = [
	# Universal architectural substrate.
	"architecture/body",
	"architecture/assigned-plan",
	"architecture/composite",
	"architecture/core",
	"architecture/plot",
	"architecture/kernel",
	"architecture/observatory",
	"architecture/plan-lowering",
	"architecture/planner",
	"architecture/protected-line",
	"architecture/wire",

	# Host-neutral semantic and domain packages.
	"semantics/ai",
	"semantics/alife",
	"semantics/audio",
	"semantics/catalog",
	"semantics/chat",
	"semantics/data",
	"semantics/education",
	"semantics/finance",
	"semantics/human",
	"semantics/language",
	"semantics/net",
	"semantics/face",
	"semantics/process",
	"semantics/purpose",
	"semantics/robotics",
	"semantics/signal",
	"semantics/speech",
	"semantics/system-continuity",
	"semantics/text",
	"semantics/time",
	"semantics/tongues",
	"semantics/web",

	# Generic make layers.
	"make/body",
	"make/embedded-build",
	"make/host",
	"make/workspace",

	# Reusable lower mechanisms and implementations.
	"mechanisms/devices/create-oi",
	"mechanisms/devices/mpu6050",
	"mechanisms/devices/ssd1306",
	"mechanisms/implementations/linear-framebuffer-make",
	"mechanisms/implementations/emergency-keyword-spotter",
	"mechanisms/implementations/synth",
	"mechanisms/implementations/burn-model",
	"mechanisms/protocols/bluetooth",
	"mechanisms/protocols/midi",

	# Product and application compositions.
	"products/conduit",
	"plots/birth",
	"plots/todo/model",
	"semantics/home",
	"semantics/plot-library",
	"semantics/tutorial",
	"semantics/body-invitation",
	"plots/tour",
	"plots/todo/face",
	"plots/thermostat/model",
	"plots/thermostat/face",
	"plots/thermostat/runtime",
	"targets/std/patchbay-workbench",
	"targets/browser/patchbay-workbench",
	"plots/patchbay/workbench/model",
	"plots/patchbay/application",
	"plots/patchbay/graph",
	"plots/patchbay",
	"plots/patchbay/workbench/host-contract",
	"plots/patchbay/workbench/svg-mask",
	"bodies/pete",
	"plots/little-seismograph/fixture",

	# Exact host, machine, board, and target-family realizations.
	"targets/avr/make",
	"targets/browser/host",
	"targets/browser/make",
	"targets/browser/mask-offer",
	"targets/browser/runtime",
	"targets/conduitos",
	"targets/conduitos/compositor-core",
	"targets/conduitos/creche-core",
	"targets/conduitos/runtime-core",
	"targets/conduitos/mask-core",
	"targets/conduitos/tls-core",
	"targets/conduitos/network-core",
	"targets/conduitos/application-core",
	"targets/conduitos/mask-offer",
	"targets/conduitos/make",
	"targets/esp32/make",
	"targets/orange-pi/make",
	"targets/raspberry-pi/make",
	"targets/rp2040/make",
	"targets/rp2040/network-realization",
	"targets/std",
	"targets/std/make",
	"targets/std/offers",

	# Explicit proof and conformance packages.
	"proof/conformance/alife-distributed",
	"proof/conformance/body-lifecycle",
	"proof/conformance/network-r1",
	"proof/conformance/patchbay-workbench",
	"proof/conformance/pete-workload",
	"proof/conformance/signal",
	"proof/performance/runtime",
	"proof/fixtures/rp2040-pio-audio-extension",

	# Repository-development tooling.
	"tools/xtask-dispatch",
	"tools/xtask",
]
exclude = [
	"targets/conduitos/mask-service",
	"targets/conduitos/tls-service",
	"targets/conduitos/network-service",
	"targets/conduitos/compositor-hostile-proof",
	"targets/conduitos/compositor-service",
	"targets/conduitos/creche-service",
	"targets/conduitos/runtime-service",
	"targets/conduitos/application-service",
	"targets/avr/firmware/promicro-host",
	"targets/esp32/firmware/c3-signal",
	"targets/esp32/firmware/s3-signal",
	"targets/esp32/firmware/wroom-signal",
	"targets/rp2040/firmware/pico-w-signal",
]
resolver = "2"

[profile.release.package.conduit-browser-runtime]
opt-level = "z"
strip = "symbols"

[profile.release]
strip = "symbols"

# Source checking and binding generation also run inside build dependencies.
[profile.dev.build-override]
opt-level = 1

[profile.test.build-override]
opt-level = 1

# Release generators execute the same Source checking as dev/test generators.
[profile.release.build-override]
opt-level = 1
