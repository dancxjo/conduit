[workspace]
members = [
    "crates/conduit-capsule",
    "crates/conduit-conformance",
    "crates/conduit-compile",
    "crates/conduit-cache",
    "crates/conduit-core",
    "crates/conduit-diagnostics",
    "crates/conduit-embedded",
    "crates/conduit-filesystem",
    "crates/conduit-http",
    "crates/conduit-inspect",
    "crates/conduit-media",
    "crates/conduit-package",
    "crates/conduit-panel",
    "crates/conduit-patchbay",
    "crates/conduit-process",
    "crates/conduit-socket",
    "crates/conduit-runtime",
    "crates/conduit-std",
    "crates/conduit-zenoh",
    "crates/conduit-web",
    "crates/conduct",
    "firmware/conduit-rp2040-hil",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/dancxjo/conduit"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
