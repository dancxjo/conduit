[package]
name = "conduit-burn-model"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
cuda = ["burn/cuda"]

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex", "optim", "store"] }
conduit-ai = { path = "../../../semantics/ai" }
conduit-core = { path = "../../../architecture/core" }
conduit-data = { path = "../../../semantics/data" }
conduit-plot = { path = "../../../architecture/plot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
