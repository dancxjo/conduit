[package]
name = "conduit-pulse-capture"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-plot = { path = "../../../architecture/plot", optional = true }

conduit-kernel = { path = "../../../architecture/kernel", optional = true }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", optional = true }

[build-dependencies]
conduit-plot = { path = "../../../architecture/plot" }

[dev-dependencies]
conduit-embedded-build = { path = "../../../make/embedded-build" }
conduit-plot = { path = "../../../architecture/plot" }

[features]
plot-catalog = ["dep:conduit-plot"]
host-call = ["dep:conduit-kernel", "dep:conduit-plan-lowering"]

# Boxed assigned scheduler preparation is opt-in; electrical Host Calls stay lean.
prepared-kernel = ["host-call", "conduit-kernel/alloc"]
