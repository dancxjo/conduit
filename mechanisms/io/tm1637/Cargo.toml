[package]
name = "conduit-tm1637-wire"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
host-call = ["dep:conduit-core", "dep:conduit-kernel", "dep:conduit-plan-lowering", "dep:conduit-plot"]

[dependencies]
conduit-core = { path = "../../../architecture/core", optional = true }
conduit-kernel = { path = "../../../architecture/kernel", optional = true }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", optional = true }

[build-dependencies]
conduit-plot = { path = "../../../architecture/plot", optional = true }

[dev-dependencies]
conduit-environment-runtime = { path = "../../../bodies/environment/runtime" }
conduit-embedded-build = { path = "../../../make/embedded-build" }
