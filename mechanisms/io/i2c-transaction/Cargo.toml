[package]
name = "conduit-i2c-transaction"
version = "0.1.0"
edition = "2021"
publish = false
[features]
default = ["source-catalog"]
source-catalog = ["dep:conduit-plot"]
operation-factory = ["dep:conduit-composite"]
[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false }
conduit-plot = { path = "../../../architecture/plot", optional = true }
conduit-composite = { path = "../../../architecture/composite", optional = true }

[build-dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-plot = { path = "../../../architecture/plot" }

[dev-dependencies]
conduit-body = { path = "../../../architecture/body", default-features = false }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false, features = ["body-plan-binding"] }
conduit-plot = { path = "../../../architecture/plot" }
conduit-embedded-build = { path = "../../../make/embedded-build" }
