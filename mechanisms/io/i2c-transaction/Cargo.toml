[package]
name = "conduit-i2c-transaction"
version = "0.1.0"
edition = "2021"
publish = false
[features]
default = []
operation-factory = ["dep:conduit-composite"]
[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false }
conduit-plot = { path = "../../../architecture/plot" }
conduit-composite = { path = "../../../architecture/composite", optional = true }
