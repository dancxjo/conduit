<!doctype html>
<meta charset="utf-8">
<title>Conduit shared-pool webchat</title>
<main>
  <h1>Conduit Pool Webchat</h1>
  <p id="status" role="status">joining</p>
  <ol id="history" aria-label="chat history"></ol>
  <label>Message <input id="message" maxlength="256"></label>
  <button id="send" type="button" disabled>Send</button>
</main>
<script type="module">
import { createPoolWebchat } from "./pool-webchat-runtime.mjs";
const url = new URLSearchParams(location.search).get("line");
if (!url) throw new Error("pool webchat requires a planned line URL");
globalThis.__poolWebchat = await createPoolWebchat({
  url,
  list: document.querySelector("#history"),
  input: document.querySelector("#message"),
  button: document.querySelector("#send"),
  status: document.querySelector("#status"),
});
</script>
