<!doctype html>
<meta charset="utf-8">
<title>Conduit browser Host presence proof</title>
<p role="status">starting</p>
<section aria-label="Camera resource" hidden id="camera-resource">
  <button id="acquire-camera" type="button">Acquire camera resource</button>
  <button id="use-camera" type="button" disabled>Use planned camera resource</button>
  <p id="media-status">Camera offer available</p>
  <output id="media-evidence"></output>
</section>
<script type="module">
import {
  immutableWebRtcGrantFrame,
  immutableWebRtcSignalFrame,
  joinBrowserBody,
} from "/apps/patchbay/html/assets/browser-membership.js";
import { BodyWebRtcSessions } from "/apps/patchbay/html/assets/body-webrtc-sessions.mjs";
import { createBrowserMediaHost } from "/hosts/browser-host/assets/media-host.mjs";

const parameters = new URLSearchParams(location.search);
const bodyUrl = parameters.get("body");
if (!bodyUrl) throw new Error("browser presence proof requires ?body=");
const wasmBytes = await fetch(
  "/target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm",
).then((response) => {
  if (!response.ok) throw new Error("browser WASM artifact missing");
  return response.arrayBuffer();
});
const status = document.querySelector("[role=status]");
globalThis.__browserWebRtcGrants = [];
globalThis.__immutableWebRtcGrantFrame = immutableWebRtcGrantFrame;
globalThis.__immutableWebRtcSignalFrame = immutableWebRtcSignalFrame;
globalThis.__probeConcurrentGrantStage = async () => {
  let finishCreation;
  let creations = 0;
  let ownershipCloses = 0;
  const requests = [];
  const fakeSession = (onClose = () => {}) => ({
    acceptSignal: async () => {},
    close: onClose,
    state: () => ({ sessionReady: false }),
  });
  const controller = new BodyWebRtcSessions({
    wasmBytes: new ArrayBuffer(0),
    sendSignal: () => {},
    requestGrant: (generation, index) => requests.push([generation, index]),
    createSession: ({ onSession }) => {
      creations += 1;
      const session = fakeSession();
      onSession(session);
      return new Promise((resolve) => { finishCreation = () => resolve(session); });
    },
  });
  controller.begin();
  const grant = (negotiation_id) => ({
    generation: 0,
    index: 0,
    total: 1,
    grant: {
      negotiation_id,
      role: "sink",
      peer_host_id: "host/peer",
      peer_boot_id: "boot/peer",
      session_hello: [1],
    },
  });
  const first = controller.acceptGrantFrame(grant("binding/first"));
  let secondRefusal = null;
  try {
    await controller.acceptGrantFrame(grant("binding/second"));
  } catch (error) {
    secondRefusal = error.message;
  }
  finishCreation();
  await first;
  const failed = new BodyWebRtcSessions({
    wasmBytes: new ArrayBuffer(0),
    sendSignal: () => {},
    requestGrant: () => {},
    createSession: () => { throw new Error("creation refused"); },
  });
  failed.begin();
  let creationRefusal = null;
  try {
    await failed.acceptGrantFrame(grant("binding/failed"));
  } catch (error) {
    creationRefusal = error.message;
  }
  const generationFinishes = [];
  const generationController = new BodyWebRtcSessions({
    wasmBytes: new ArrayBuffer(0),
    sendSignal: () => {},
    requestGrant: () => {},
    createSession: ({ onSession }) => {
      const session = fakeSession(() => { ownershipCloses += 1; });
      onSession(session);
      return new Promise((resolve) => generationFinishes.push(() => resolve(session)));
    },
  });
  generationController.begin();
  const oldGeneration = generationController.acceptGrantFrame(grant("binding/reused"));
  generationController.reset("test reset");
  const resetState = generationController.state();
  const closesAfterReset = ownershipCloses;
  generationController.begin();
  const newGeneration = generationController.acceptGrantFrame(grant("binding/reused"));
  generationFinishes[0]();
  let staleRefusal = null;
  try {
    await oldGeneration;
  } catch (error) {
    staleRefusal = error.message;
  }
  const stateAfterStale = generationController.state();
  generationFinishes[1]();
  await newGeneration;
  return {
    creations,
    requests,
    secondRefusal,
    state: controller.state(),
    creationRefusal,
    failedState: failed.state(),
    staleRefusal,
    ownershipCloses,
    closesAfterReset,
    resetState,
    stateAfterStale,
    generationState: generationController.state(),
  };
};
let media;
let acquiredMedia;
let mediaPlan;
let mediaTraffic = null;
globalThis.__browserPresence = await joinBrowserBody({
  bodyUrl,
  wasmBytes,
  renewPresence: parameters.get("renew") !== "false",
  reconnectPresence: parameters.get("reconnect") !== "false",
  configureHost: ({ api, hostId, bootId }) => {
    media = createBrowserMediaHost({
      api,
      hostId,
      bootId,
      status: document.querySelector("#media-status"),
      output: document.querySelector("#media-evidence"),
    });
  },
  onWebRtcGrant: (grant) => { globalThis.__browserWebRtcGrants.push(grant); },
  onState: (state) => { status.textContent = state; },
});
const cameraSection = document.querySelector("#camera-resource");
const acquireCamera = document.querySelector("#acquire-camera");
const useCamera = document.querySelector("#use-camera");
cameraSection.hidden = false;
acquireCamera.addEventListener("click", async () => {
  acquireCamera.disabled = true;
  acquiredMedia = await media.acquireResource("camera");
  mediaPlan = await globalThis.__browserPresence.publishMediaResource(acquiredMedia.resourceTruth);
  useCamera.disabled = false;
});
useCamera.addEventListener("click", async () => {
  useCamera.disabled = true;
  await acquiredMedia.use({
    planId: mediaPlan.planId,
    onValue: async (bytes, valueEvidence) => {
      const sessions = globalThis.__browserPresence.webRtcSessions().sessions
        .filter((session) => session.role === "source" && session.sessionReady);
      if (sessions.length !== 1) throw new Error("camera output has no exact ready source Cord");
      const accepted = await globalThis.__browserPresence.offerWebRtcValue(
        sessions[0].negotiationId,
        bytes,
      );
      if (!accepted.accepted) throw new Error(`camera Cord refused ${accepted.reason}`);
      mediaTraffic = Object.freeze({
        negotiationId: sessions[0].negotiationId,
        accepted,
        valueEvidence,
      });
    },
  });
});
globalThis.__browserHumanMedia = Object.freeze({
  evidence: () => media.evidence(),
  plan: () => mediaPlan,
  traffic: () => mediaTraffic,
});
</script>
