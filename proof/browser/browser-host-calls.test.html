<!doctype html>
<meta charset="utf-8">
<title>Conduit browser Host Calls proof</title>
<button id="artifact">Hand off artifact</button>
<button id="location">Move presentation location</button>
<button id="device">Choose device</button>
<output id="result">ready</output>
<script type="module">
import {
  browserHostCallLimits,
  createBrowserHostCalls,
} from "../../targets/browser/host/assets/browser-host-calls.mjs";

const context = {
  hostId: "host/browser-proof",
  bootId: "boot/browser-proof",
  applicationId: "application/browser-proof",
  applicationGeneration: 3,
  authorityGeneration: 7,
};
const call = (kind, callId, fields) => ({
  contract: browserHostCallLimits.contract,
  kind,
  callId,
  ...context,
  ...fields,
});
const calls = createBrowserHostCalls({
  ...context,
  selectedImplementations: ["browser/web-serial@1"],
  initializedImplementations: ["browser/web-serial@1"],
  secureContext: true,
  deviceAdapters: {
    "browser/web-serial@1": async ({ filters }) => ({
      getInfo: () => ({ usbVendorId: filters[0].usbVendorId, usbProductId: 42 }),
    }),
  },
});
const result = document.querySelector("#result");
globalThis.__browserHostCallProof = { outcomes: [], active: () => calls.activeCalls() };

const absentActivation = await calls.handoffArtifact(call("artifact-handoff", "artifact/no-activation", {
  userActivation: true,
  artifactId: "artifact/proof",
  bytes: Uint8Array.of(1),
  maximumBytes: 1,
  filename: "proof.bin",
  mediaType: "application/octet-stream",
}));
globalThis.__browserHostCallProof.absentActivation = absentActivation.disposition;

document.querySelector("#artifact").addEventListener("click", async () => {
  const outcome = await calls.handoffArtifact(call("artifact-handoff", "artifact/download", {
    userActivation: true,
    artifactId: "artifact/proof",
    bytes: Uint8Array.of(0x43, 0x4e, 0x44),
    maximumBytes: 3,
    filename: "proof.bin",
    mediaType: "application/octet-stream",
  }));
  globalThis.__browserHostCallProof.outcomes.push(outcome);
  result.value = outcome.disposition;
});
document.querySelector("#location").addEventListener("click", async () => {
  const outcome = await calls.moveLocation(call("location", "location/proof", {
    presentationRevision: 4,
    mode: "push",
    path: "/proof/browser/presented-place/",
  }));
  globalThis.__browserHostCallProof.outcomes.push(outcome);
  result.value = outcome.disposition;
});
document.querySelector("#device").addEventListener("click", async () => {
  const outcome = await calls.chooseDevice(call("device-choice", "device/proof", {
    implementationId: "browser/web-serial@1",
    authorized: true,
    userActivation: true,
    filters: [{ usbVendorId: 0x1209 }],
    maximumResults: 1,
    maximumResourceIdentityBytes: 256,
  }));
  globalThis.__browserHostCallProof.outcomes.push(outcome);
  result.value = outcome.disposition;
});
</script>
