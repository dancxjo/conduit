<!doctype html>
<meta charset="utf-8">
<title>Conduit browser presentation nucleus proof</title>
<link rel="stylesheet" href="../../targets/browser/host/assets/application-theme.css">
<p id="result">running</p>
<main id="nucleus" aria-label="Gear Face"></main>
<section id="controls" aria-label="Bounded controls"></section>
<section data-application-slot="semantic" aria-label="Semantic mechanisms"></section>
<section data-application-slot="focus" aria-label="Form and navigation mechanisms"></section>
<section id="theme-products" aria-label="Shared product theme mechanism"></section>
<script type="module">
import {
  instantiatePresentationNucleus,
  manifestPresentationNucleus,
} from "./presentation-nucleus-runtime.mjs";
import {
  applicationPresentationLimits,
  createApplicationPresentationHost,
  decodeApplicationTheme,
  encodeApplicationView,
  manifestApplicationView,
} from "../../targets/browser/host/assets/application-presentation.mjs";

const assert = (condition, message) => {
  if (!condition) throw new Error(message);
};

try {
  const wasmBytes = await fetch(
    "/target/tour-product/runtime.wasm",
  ).then((response) => {
    assert(response.ok, "browser runtime WASM artifact loads");
    return response.arrayBuffer();
  });
  const api = await instantiatePresentationNucleus(wasmBytes);
  const root = document.querySelector("#nucleus");
  const proof = manifestPresentationNucleus(api, root);
  let retiredThemeRefusal = "";
  try {
    decodeApplicationTheme(Uint8Array.of(applicationPresentationLimits.retiredThemeVersion));
  } catch (error) {
    retiredThemeRefusal = error.code;
  }
  assert(retiredThemeRefusal === "unsupported-version", "retired color-only theme refuses explicitly");
  const productThemeRoot = document.querySelector("#theme-products");
  for (const product of ["tour", "creche", "patchbay"]) {
    const productRoot = document.createElement("section");
    productRoot.dataset.conduitProduct = product;
    productRoot.dataset.conduitContrast = "high";
    productThemeRoot.append(productRoot);
    manifestApplicationView(encodeApplicationView({
      revision: 1,
      actions: [],
      nodes: [
        { parent: null, component: "grid", action: null, key: `${product}-grid`, text: "" },
        { parent: 0, component: "panel", action: null, key: `${product}-panel`, text: product },
      ],
    }), productRoot, { theme: proof.applicationTheme });
  }
  assert(proof.layout.children.length === 3, "row/column/stack layout reaches the browser");
  assert(proof.graphics.length === 3, "rect/text/icon graphics reach the browser");
  assert(proof.graphics.map((command) => command.kind).join(",") === "1,2,3", "graphics order is exact");
  assert(proof.graphics[1].payload === "ready", "resolved text remains exact");
  assert(proof.graphics[2].payload === "presentation", "canonical icon remains exact");
  assert(proof.text === "STRASSE", "text/upper reaches presentation/text in the browser");
  assert(proof.structured.schema === "education/feedback@1", "education schema reaches the browser");
  assert(proof.structured.variant === "passed", "assessment outcome remains a typed variant");
  assert(proof.structured.quantityUnit === "ratio/percent", "score retains its quantity unit");
  assert(proof.structured.quantity === 88, "score retains its signed magnitude");
  assert(proof.application.view.revision === 1, "application view revision remains exact");
  assert(root.dataset.applicationTheme === "conduit.presentation/phosphor@1", "browser Host consumes the shared renderer-neutral theme");
  const continueButton = root.querySelector("[data-application-action='nucleus.continue']");
  continueButton.click();
  const applicationEvent = proof.application.nextEvent();
  assert(applicationEvent.action === "nucleus.continue", "browser event returns through the bounded action identity");
  assert(applicationEvent.encoded.length < 64, "browser event is one finite encoded protocol value");
  for (let index = 0; index < 9; index += 1) continueButton.click();
  assert(proof.application.lastRefusal() === "queue-pressure", "browser event pressure refuses distinctly");
  while (proof.application.nextEvent()) {}
  const controlRoot = document.querySelector("#controls");
  const controlView = encodeApplicationView({
    revision: 2,
    actions: [{ id: "source.input", event: "input" }],
    nodes: [
      { parent: null, component: "shell", action: null, key: "control-shell", text: "" },
      {
        parent: 0, component: "textarea", action: 0, key: "source", text: "Form source",
        value: "gear source", valueCapacity: 65_536,
      },
    ],
  });
  const controls = manifestApplicationView(controlView, controlRoot, { eventByteCapacity: 40 });
  const source = controlRoot.querySelector("[data-application-key='source']");
  assert(source.value === "gear source", "control value remains distinct from its label");
  assert(source.getAttribute("aria-label") === "Form source", "control label remains explicit");
  source.value = "gear edited";
  source.dispatchEvent(new Event("input"));
  assert(controls.queuedEventBytes() === controls.nextEvent().encoded.length, "queue reports exact encoded-byte pressure");
  source.dispatchEvent(new Event("input"));
  source.dispatchEvent(new Event("input"));
  assert(controls.lastRefusal() === "queue-pressure", "aggregate event byte pressure refuses distinctly");
  const selectRoot = document.createElement("section");
  document.body.append(selectRoot);
  const selectView = (revision, value) => encodeApplicationView({
    revision,
    actions: [{ id: "program.change", event: "change" }],
    nodes: [
      { parent: null, component: "select", action: 0, key: "program", text: "Initial program", value, valueCapacity: 64 },
      { parent: 0, component: "option", action: null, key: "signal", text: "Signal", value: "signal@1", valueCapacity: 64 },
      { parent: 0, component: "option", action: null, key: "morse", text: "Morse Network", value: "morse-network@1", valueCapacity: 64 },
    ],
  });
  const selection = manifestApplicationView(selectView(3, "morse-network@1"), selectRoot);
  let program = selectRoot.querySelector("select");
  assert(program.value === "morse-network@1", "select realizes the exact admitted option value");
  assert(program.options.length === 2 && program.options[1].textContent === "Morse Network", "non-first option label remains renderer-neutral text");
  program.dispatchEvent(new Event("change"));
  assert(new TextDecoder().decode(selection.nextEvent().value) === "morse-network@1", "select event returns the exact option value");
  program.focus();
  manifestApplicationView(selectView(4, "signal@1"), selectRoot);
  program = selectRoot.querySelector("select");
  assert(program.value === "signal@1" && document.activeElement === program, "select changes exact value and retains focus across revision");
  let missingOptionRefusal = "";
  try { manifestApplicationView(selectView(5, "missing@1"), selectRoot); }
  catch (error) { missingOptionRefusal = error.code; }
  assert(missingOptionRefusal === "invalid-control-value", "select without its exact admitted option refuses distinctly");
  const acceptedMarkup = root.innerHTML;
  let malformedRefusal = "";
  try {
    manifestApplicationView(Uint8Array.of(2), root);
  } catch (error) {
    malformedRefusal = error.code;
  }
  assert(malformedRefusal === "unsupported-version", "unsupported application view version refuses distinctly");
  assert(root.innerHTML === acceptedMarkup, "refused application view does not partially mutate the DOM");
  const semanticHost = createApplicationPresentationHost();
  const semanticEvents = [];
  const semanticView = {
    revision: 4,
    actions: [{ id: "semantic.run", event: "activate" }],
    nodes: [
      { parent: null, component: "panel", action: null, key: "panel", text: "Execution" },
      { parent: 0, component: "button", state: "ready", action: 0, key: "ready", text: "Run" },
      { parent: 0, component: "button", state: "busy", action: null, key: "busy", text: "Run — busy: operation admitted" },
      { parent: 0, component: "button", state: "unavailable", action: null, key: "unavailable", text: "Download — unavailable: artifact absent" },
      { parent: 0, component: "status", action: null, key: "ordinary", text: "Ready" },
      { parent: 0, component: "warning-status", action: null, key: "warning", text: "Pressure — queue nearly full" },
      { parent: 0, component: "success-status", action: null, key: "success", text: "Complete" },
      { parent: 0, component: "failure-status", action: null, key: "failure", text: "Failed" },
      { parent: 0, component: "disclosure", action: null, key: "details", text: "Exact evidence" },
      { parent: 8, component: "paragraph", action: null, key: "evidence", text: "Plan P7" },
      { parent: 0, component: "disclosure", action: null, key: "reviewed", text: "" },
      { parent: 10, component: "summary", action: null, key: "reviewed-summary", text: "Reviewed source" },
    ],
  };
  semanticHost.present("semantic", semanticView, { onEvent: (event) => semanticEvents.push(event.action) });
  const semanticRoot = document.querySelector("[data-application-slot=semantic]");
  const ready = semanticRoot.querySelector("[data-application-key=ready]");
  const busy = semanticRoot.querySelector("[data-application-key=busy]");
  const unavailable = semanticRoot.querySelector("[data-application-key=unavailable]");
  ready.click();
  assert(semanticHost.nextEvent("semantic").action === "semantic.run", "ready action dispatches its exact identity");
  assert(semanticEvents.join(",") === "semantic.run", "Host receives only the exact ready action");
  assert(busy.disabled && busy.getAttribute("aria-busy") === "true", "busy action is disabled and announced as busy");
  assert(unavailable.disabled && unavailable.dataset.applicationAvailability === "unavailable", "unavailable action remains distinct from busy");
  const manifestation = manifestApplicationView(encodeApplicationView({ ...semanticView, revision: 5 }), document.createElement("section"));
  manifestation.requestAction("busy");
  const busyRefusal = manifestation.lastRefusal();
  manifestation.requestAction("unavailable");
  const unavailableRefusal = manifestation.lastRefusal();
  assert(busyRefusal === "action-busy" && unavailableRefusal === "unavailable-action", "busy and unavailable attempts refuse distinctly");
  const warning = semanticRoot.querySelector("[data-application-key=warning]");
  const failure = semanticRoot.querySelector("[data-application-key=failure]");
  assert(warning.dataset.applicationStatus === "warning" && warning.getAttribute("role") === "status", "warning severity drives accessible status");
  assert(failure.dataset.applicationStatus === "failure" && failure.getAttribute("role") === "alert", "failure severity drives an assertive alert");
  const disclosure = semanticRoot.querySelector("[data-application-key=details]");
  assert(disclosure.querySelector(":scope > summary").textContent === "Exact evidence", "disclosure owns one accessible summary");
  const reviewed = semanticRoot.querySelector("[data-application-key=reviewed]");
  assert(reviewed.querySelectorAll(":scope > summary").length === 1 && reviewed.querySelector("summary").textContent === "Reviewed source", "explicit disclosure summary is not duplicated");
  disclosure.open = true;
  disclosure.dispatchEvent(new Event("toggle"));
  assert(semanticHost.queuedEvents("semantic") === 0, "local disclosure state does not invent an application event");
  let staleRefusal = "";
  try { semanticHost.present("semantic", semanticView); } catch (error) { staleRefusal = error.code; }
  assert(staleRefusal === "stale-revision", "stale presentation refuses distinctly");
  let retiredRefusal = "";
  try { manifestApplicationView(Uint8Array.of(applicationPresentationLimits.retiredVersion), semanticRoot); } catch (error) { retiredRefusal = error.code; }
  assert(retiredRefusal === "unsupported-version", "retired low-level protocol refuses explicitly");
  const focusHost = createApplicationPresentationHost();
  const focusView = (revision, value, error) => ({
    revision,
    actions: [
      { id: "form.source", event: "input" },
      { id: "navigate.previous", event: "activate" },
      { id: "navigate.next", event: "activate" },
    ],
    nodes: [
      { parent: null, component: "shell", action: null, key: "focus-shell", text: "" },
      { parent: 0, component: "form-field", action: null, key: "source-field", text: "" },
      { parent: 1, component: "field-label", action: null, key: "source-label", text: "Form source" },
      { parent: 1, component: "textarea", action: 0, key: "source-control", text: "Form source", value, valueCapacity: 64 },
      { parent: 1, component: "field-help", action: null, key: "source-help", text: "Enter one bounded Form" },
      ...(error ? [{ parent: 1, component: "field-error", action: null, key: "source-error", text: error }] : []),
      { parent: 0, component: "navigation", action: null, key: "navigation", text: "Tour pages", value: "page-two", valueCapacity: 16 },
      { parent: error ? 6 : 5, component: "button", action: 1, key: "page-one", text: "Previous" },
      { parent: error ? 6 : 5, component: "button", action: 2, key: "page-two", text: "Next" },
      { parent: 0, component: "stepper", action: null, key: "stepper", text: "Birth steps", value: "2/3", valueCapacity: 11 },
      { parent: error ? 9 : 8, component: "button", action: 1, key: "step-one", text: "Body" },
      { parent: error ? 9 : 8, component: "button", action: 2, key: "step-two", text: "Host" },
      { parent: error ? 9 : 8, component: "button", action: 2, key: "step-three", text: "Play" },
      { parent: 0, component: "progress", action: null, key: "progress", text: "Birth", value: "2/3", valueCapacity: 11 },
    ],
  });
  focusHost.present("focus", focusView(1, "gear source", "Source is not checked"));
  const focusRoot = document.querySelector("[data-application-slot=focus]");
  let detachedControl = focusRoot.querySelector("[data-application-key=source-control]");
  globalThis.__conduitFocusProof = Object.freeze({
    host: focusHost,
    rerender() {
      detachedControl = focusRoot.querySelector("[data-application-key=source-control]");
      focusHost.present("focus", focusView(2, "gear source revised", null));
    },
    removeFocused() {
      focusHost.present("focus", {
        revision: 3,
        actions: [
          { id: "navigate.previous", event: "activate" },
          { id: "navigate.next", event: "activate" },
        ],
        nodes: [
          { parent: null, component: "shell", action: null, key: "focus-shell", text: "" },
          { parent: 0, component: "navigation", action: null, key: "navigation", text: "Tour pages", value: "page-two", valueCapacity: 16 },
          { parent: 1, component: "button", action: 0, key: "page-one", text: "Previous" },
          { parent: 1, component: "button", action: 1, key: "page-two", text: "Next" },
        ],
      });
    },
    dispatchDetached() { detachedControl.dispatchEvent(new Event("input")); },
  });
  let missingContext = false;
  try {
    manifestPresentationNucleus(api, null);
  } catch (error) {
    missingContext = error instanceof TypeError;
  }
  assert(missingContext, "missing browser manifestation context refuses distinctly");
  globalThis.__conduitPresentationNucleus = {
    layoutChildren: proof.layout.children.length,
    graphicsKinds: proof.graphics.map((command) => command.kind),
    text: proof.text,
    structured: proof.structured,
    application: {
      revision: proof.application.view.revision,
      theme: root.dataset.applicationTheme,
      heading: root.querySelector("[data-application-key=heading] > h3").textContent,
      evidenceIdentity: root.querySelector("[data-application-key=heading] [data-application-component=definition] dd").textContent,
      evidenceProvenance: root.querySelectorAll("[data-application-key=heading] [data-application-component=definition] dd")[1].textContent,
      artifactTag: root.querySelector("[data-application-key=artifact]").tagName,
      rawLanguage: root.querySelector("[data-application-key=raw-evidence]").dataset.applicationLanguage,
      rawText: root.querySelector("[data-application-key=raw-evidence] code").textContent,
      executableScripts: root.querySelectorAll("[data-application-key=raw-evidence] script").length,
      action: applicationEvent.action,
      encodedEventBytes: applicationEvent.encoded.length,
      queuedEvents: proof.application.queuedEvents(),
      pressureRefusal: proof.application.lastRefusal(),
      malformedRefusal,
      unchangedAfterRefusal: root.innerHTML === acceptedMarkup,
      controlValue: source.value,
      controlLabel: source.getAttribute("aria-label"),
      controlBytePressureRefusal: controls.lastRefusal(),
      semantic: {
        panelTag: semanticRoot.querySelector("[data-application-key=panel]").tagName,
        busy: busy.dataset.applicationAvailability,
        busyRefusal,
        unavailable: unavailable.dataset.applicationAvailability,
        unavailableRefusal,
        warning: warning.dataset.applicationStatus,
        failureRole: failure.getAttribute("role"),
        disclosureOpen: disclosure.open,
        disclosureEvents: semanticHost.queuedEvents("semantic"),
        staleRefusal,
        retiredVersion: applicationPresentationLimits.retiredVersion,
        retiredRefusal,
      },
    },
    missingContext,
  };
  document.querySelector("#result").textContent = "ok";
} catch (error) {
  document.querySelector("#result").textContent = `failed: ${error.message}`;
  throw error;
}
</script>
