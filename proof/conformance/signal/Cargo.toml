[package]
name = "conduit-signal-conformance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
conduit-bluetooth = { path = "../../../mechanisms/protocols/bluetooth" }
conduit-core = { path = "../../../architecture/core" }
conduit-form = { path = "../../../architecture/form" }
conduit-planner = { path = "../../../architecture/planner" }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["form-catalog"] }
conduit-std-offers = { path = "../../../targets/std/offers" }
conduit-wire = { path = "../../../architecture/wire", default-features = false }

[features]
default = ["host-profile"]
host-profile = []
