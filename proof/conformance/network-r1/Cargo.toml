[package]
name = "conduit-r1-network-conformance"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-body = { path = "../../../architecture/body", default-features = false }
conduit-core = { path = "../../../architecture/core" }
conduit-form = { path = "../../../architecture/form" }
conduit-net = { path = "../../../semantics/net", features = ["form-catalog"] }
conduit-planner = { path = "../../../architecture/planner" }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../signal" }
conduit-wire = { path = "../../../architecture/wire", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1"
