[package]
name = "conduit-r1-network-conformance"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-body = { path = "../../../architecture/body", default-features = false, optional = true }
conduit-core = { path = "../../../architecture/core" }
conduit-form = { path = "../../../architecture/form", optional = true }
conduit-net = { path = "../../../semantics/net", features = ["form-catalog"], optional = true }
conduit-planner = { path = "../../../architecture/planner", optional = true }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"], optional = true }
conduit-signal-conformance = { path = "../signal", optional = true }
conduit-wire = { path = "../../../architecture/wire", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[features]
default = ["composition"]
composition = [
    "dep:conduit-body",
    "dep:conduit-form",
    "dep:conduit-net",
    "dep:conduit-planner",
    "dep:conduit-signal",
    "dep:conduit-signal-conformance",
]

[dev-dependencies]
serde_json = "1"
