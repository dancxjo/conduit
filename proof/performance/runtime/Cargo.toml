[package]
name = "conduit-runtime-performance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-plot = { path = "../../../architecture/plot" }
conduit-kernel = { path = "../../../architecture/kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[features]
hosted-pipeline = ["dep:conduit-std-host", "dep:conduit-std-offers", "dep:conduit-planner"]

[dependencies.conduit-std-host]
path = "../../../targets/std"
optional = true

[dependencies.conduit-std-offers]
path = "../../../targets/std/offers"
optional = true

[dependencies.conduit-planner]
path = "../../../architecture/planner"
optional = true
