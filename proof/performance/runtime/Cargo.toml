[package]
name = "conduit-runtime-performance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-plot = { path = "../../../architecture/plot" }
conduit-planner = { path = "../../../architecture/planner" }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-std-offers = { path = "../../../targets/std/offers" }
conduit-kernel = { path = "../../../architecture/kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[features]
hosted-pipeline = ["dep:conduit-std-host", "dep:conduit-semantic-catalog"]

[dependencies.conduit-std-host]
path = "../../../targets/std"
optional = true

[dependencies.conduit-semantic-catalog]
path = "../../../semantics/catalog"
optional = true
