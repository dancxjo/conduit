[package]
name = "conduit-environment-http"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
embassy-sync = "=0.8.0"
conduit-net = { path = "../../../semantics/net" }
zeroize = { version = "=1.9.0", default-features = false }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask" }
conduit-core = { path = "../../../architecture/core" }
conduit-environment-face = { path = "../face" }
conduit-face = { path = "../../../semantics/face", default-features = false }
heapless = "0.8"
critical-section = "1.2"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
serde_json = "1"
