[package]
name = "conduit-environment-host"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-body = { path = "../../../architecture/body", default-features = false, features = ["authenticated-admission"] }
conduit-environment-runtime = { path = "../runtime", features = ["member-receipts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false }
[profile.dev.build-override]
opt-level = 1
[profile.test.build-override]
opt-level = 1
