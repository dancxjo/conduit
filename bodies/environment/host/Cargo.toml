[package]
name = "conduit-environment-host"
default-run = "conduit-environment-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
history-source = ["dep:conduit-std-host", "conduit-environment-runtime/history-exchange"]
retained-history-provider = ["conduit-environment-runtime/history-exchange"]
carrier-source = ["dep:conduit-std-host", "dep:conduit-host-make", "conduit-environment-runtime/environmental-source", "dep:conduit-plot", "dep:conduit-planner", "dep:conduit-web", "conduit-std-host/isolated-http-base"]

[dependencies]
conduit-web = { path = "../../../semantics/web", optional = true, features = ["plot-catalog"] }
conduit-plot = { path = "../../../architecture/plot", optional = true }
conduit-planner = { path = "../../../architecture/planner", optional = true }
conduit-std-host = { path = "../../../targets/std", optional = true }
conduit-host-make = { path = "../../../make/host", optional = true }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-core = { path = "../../../architecture/core" }
conduit-body = { path = "../../../architecture/body" }
conduit-birth-plot = { path = "../../../plots/birth" }
conduit-environment-make = { path = "../make" }
conduit-environment-runtime = { path = "../runtime", features = ["construction", "body-image", "face-projection", "display-session", "member-receipts"] }
conduit-face = { path = "../../../semantics/face", default-features = false }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask" }
conduit-embedded-build = { path = "../../../make/embedded-build" }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering" }
ed25519-dalek = { version = "2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
libc = "0.2"

[dev-dependencies]
conduit-host-rp2040 = { path = "../../../targets/rp2040/make" }
conduit-std-host = { path = "../../../targets/std" }
conduit-environment-runtime = { path = "../runtime", features = ["history-exchange"] }
conduit-wire = { path = "../../../architecture/wire" }
conduit-protected-line = { path = "../../../architecture/protected-line" }
conduit-plot = { path = "../../../architecture/plot" }
conduit-planner = { path = "../../../architecture/planner" }

[profile.dev.build-override]
opt-level = 1
[profile.test.build-override]
opt-level = 1

[[bin]]
name = "conduit-environment-http-provider"
path = "src/bin/conduit-environment-http-provider.rs"
required-features = ["carrier-source"]
