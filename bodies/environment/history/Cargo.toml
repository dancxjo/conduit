[package]
name = "conduit-environment-history"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-face = { path = "../../../semantics/face", default-features = false }
conduit-environment-face = { path = "../face" }
conduit-environment-runtime = { path = "../runtime" }

[dev-dependencies]
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
serde_json = "1"
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
conduit-linux-snapshot-store = { path = "../../../targets/std/resource-snapshot" }
conduit-resource-snapshot = { path = "../../../mechanisms/io/resource-snapshot" }

[profile.dev.build-override]
opt-level = 1
[profile.test.build-override]
opt-level = 1
