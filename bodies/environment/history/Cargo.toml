[package]
name = "conduit-environment-history"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
conduit-environment-measurement = { path = "../measurement" }
conduit-core = { path = "../../../architecture/core" }
conduit-face = { path = "../../../semantics/face", default-features = false }
conduit-environment-face = { path = "../face" }
conduit-environment-runtime = { path = "../runtime", features = ["face-projection"] }

[dev-dependencies]
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc", "step-test-support"] }
serde_json = "1"
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask" }

[profile.dev.build-override]
opt-level = 1
[profile.test.build-override]
opt-level = 1
