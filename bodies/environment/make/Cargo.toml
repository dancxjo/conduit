[package]
name = "conduit-environment-make"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "conduit-environment-specification-proof"
path = "src/main.rs"

[workspace]

[dependencies]
conduit-body = { path = "../../../architecture/body" }
conduit-birth-plot = { path = "../../../plots/birth" }
conduit-core = { path = "../../../architecture/core" }
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637", features = ["host-call"] }
conduit-planner = { path = "../../../architecture/planner" }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering" }
conduit-body-make = { path = "../../../make/body" }
conduit-host-make = { path = "../../../make/host" }
conduit-host-rp2040 = { path = "../../../targets/rp2040/make" }
conduit-host-browser-make = { path = "../../../targets/browser/make" }
conduit-face = { path = "../../../semantics/face", features = ["plot-catalog"] }
conduit-plot = { path = "../../../architecture/plot" }
serde_json = "1"

[dev-dependencies]
conduit-environment-runtime = { path = "../runtime" }
