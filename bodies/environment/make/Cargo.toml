[package]
name = "conduit-environment-make"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "conduit-environment-specification-proof"
path = "src/main.rs"

[workspace]

[features]
installed-recording-proof = ["installed-seed-proof", "conduit-std-host/linux-snapshot"]
installed-seed-proof = ["dep:conduit-std-host", "dep:conduit-std-offers", "dep:tempfile", "conduit-environment-linux/installed-seed"]

[[test]]
name = "catalog_restart"
required-features = ["installed-seed-proof"]

[dependencies]
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["plot-catalog"] }
serde = { version = "1", features = ["derive"] }
conduit-body = { path = "../../../architecture/body" }
conduit-birth-plot = { path = "../../../plots/birth" }
conduit-core = { path = "../../../architecture/core" }
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637", features = ["host-call"] }
conduit-planner = { path = "../../../architecture/planner", features = ["indexed-source"] }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering" }
conduit-body-make = { path = "../../../make/body" }
conduit-host-make = { path = "../../../make/host" }
conduit-host-rp2040 = { path = "../../../targets/rp2040/make" }
conduit-host-browser-make = { path = "../../../targets/browser/make" }
conduit-face = { path = "../../../semantics/face", features = ["plot-catalog"] }
conduit-plot = { path = "../../../architecture/plot", features = ["flat-image"] }
serde_json = "1"
conduit-environment-runtime = { path = "../runtime", features = ["construction", "recording-kernel"] }
conduit-time = { path = "../../../semantics/time", default-features = false }
conduit-net = { path = "../../../semantics/net", features = ["plot-catalog"] }

[dev-dependencies]
conduit-environment-http = { path = "../http" }
heapless = "0.8"
embassy-futures = "=0.1.2"
ed25519-dalek = { version = "2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask" }
serde-json-core = { version = "=0.6.0", default-features = false }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-embedded-build = { path = "../../../make/embedded-build" }
conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture", features = ["plot-catalog", "host-call"] }
conduit-monotonic-wait = { path = "../../../mechanisms/io/monotonic-wait" }
conduit-network-join-call = { path = "../../../mechanisms/io/network-join" }
conduit-environment-runtime = { path = "../runtime", features = ["body-image", "display-session", "face-projection", "mask-kernel", "mask-renderer", "local-planning"] }
sha2 = { version = "0.10", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
critical-section = { version = "1", features = ["std"] }

# CPU proof runs the actual native task slots with an explicit manual clock.
embassy-executor = { version = "=0.10.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false, features = ["tick-hz-1_000_000"] }
embassy-time-driver = { version = "=0.2.2", features = ["tick-hz-1_000_000"] }
static_cell = "=2.1.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
conduit-linux-snapshot-store = { path = "../../../targets/std/resource-snapshot" }
conduit-resource-snapshot = { path = "../../../mechanisms/io/resource-snapshot" }
conduit-environment-linux = { path = "../linux" }

[target.'cfg(target_os = "linux")'.dependencies]
conduit-std-host = { path = "../../../targets/std", default-features = false, optional = true }
conduit-std-offers = { path = "../../../targets/std/offers", optional = true }
tempfile = { version = "3", optional = true }
