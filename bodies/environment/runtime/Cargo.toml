[package]
name = "conduit-environment-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
member-receipts = ["dep:conduit-body", "conduit-body/authenticated-admission", "dep:serde", "dep:sha2", "dep:ed25519-dalek"]
display-mask = ["dep:conduit-face", "dep:conduit-seven-segment-mask"]
appliance = ["conduit-kernel/alloc", "dep:conduit-time", "conduit-time/kernel-step", "dep:conduit-pulse-capture"]
construction = ["appliance", "dep:conduit-planner"]
face-projection = ["dep:conduit-environment-face", "dep:conduit-face"]
source-capture = ["dep:conduit-pulse-capture"]

[dependencies]
conduit-body = { path = "../../../architecture/body", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
ed25519-dalek = { version = "2.2", default-features = false, optional = true }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask", optional = true }
conduit-time = { path = "../../../semantics/time", default-features = false, optional = true }
conduit-planner = { path = "../../../architecture/planner", optional = true }
conduit-environment-face = { path = "../face", optional = true }
conduit-face = { path = "../../../semantics/face", default-features = false, optional = true }
conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture", default-features = false, features = ["plot-catalog"], optional = true }
conduit-core = { path = "../../../architecture/core" }
conduit-kernel = { path = "../../../architecture/kernel" }
conduit-plot = { path = "../../../architecture/plot" }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["kernel-step"] }

[build-dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-plot = { path = "../../../architecture/plot" }

[dev-dependencies]
conduit-tm1637-wire = { path = "../../../mechanisms/io/tm1637", features = ["host-call"] }
serde_json = "1"
conduit-time = { path = "../../../semantics/time", features = ["kernel-step"] }
conduit-environment-face = { path = "../face" }
conduit-face = { path = "../../../semantics/face", default-features = false }
conduit-seven-segment-mask = { path = "../../../plots/seven-segment-mask" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-pulse-capture = { path = "../../../mechanisms/io/pulse-capture", features = ["plot-catalog", "host-call"] }
conduit-planner = { path = "../../../architecture/planner" }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering" }
conduit-embedded-build = { path = "../../../make/embedded-build" }

# Match the workspace's Source-generator profile: these are preparation tools.
[profile.dev.build-override]
opt-level = 1

[profile.test.build-override]
opt-level = 1
