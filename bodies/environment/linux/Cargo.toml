[package]
name = "conduit-environment-linux"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
installed-seed = ["dep:conduit-std-host", "dep:conduit-body"]

[dependencies]
conduit-std-host = { path = "../../../targets/std", optional = true }
conduit-body = { path = "../../../architecture/body", optional = true }
conduit-core = { path = "../../../architecture/core" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering" }
conduit-environment-runtime = { path = "../runtime", features = ["recording-kernel", "face-projection"] }
conduit-linux-snapshot-store = { path = "../../../targets/std/resource-snapshot" }
conduit-resource-snapshot = { path = "../../../mechanisms/io/resource-snapshot", features = ["host-call"] }
