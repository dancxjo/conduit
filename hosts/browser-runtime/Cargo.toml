[package]
name = "conduit-browser-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-form = { path = "../../crates/conduit-form" }
conduit-planner = { path = "../../crates/conduit-planner" }
conduit-runtime = { path = "../../crates/conduit-runtime" }
conduit-signal = { path = "../../crates/conduit-signal", features = ["host-profile"] }
conduit-wire = { path = "../../crates/conduit-wire" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30.0", optional = true }

[features]
native-link = ["dep:tungstenite"]

[[bin]]
name = "conduit-browser-link-host"
path = "src/bin/link_host.rs"
required-features = ["native-link"]
