<!doctype html>
<meta charset="utf-8">
<title>Conduit bounded WebRTC DataChannel Line proof</title>
<p id="state">idle</p>
<script type="module">
  import { BrowserWebRtcDataChannelLine } from "/hosts/browser/webrtc-datachannel-line.mjs";
  import {
    closeWebRtcSessionInput,
    finishWebRtcSession,
    ingestWebRtcSession,
    instantiateWebRtcSession,
    offerWebRtcSessionValue,
    pressureWebRtcSessionOffer,
    takeWebRtcSessionOutput,
    deliverWebRtcSessionValue,
    webRtcSessionNextSequence,
    webRtcSessionValue,
  } from "/hosts/browser/webrtc-session-runtime.mjs";

  let peer;
  let channel;
  let line;
  let lineArrival = Promise.resolve();
  let session;

  function gathered(connection) {
    if (connection.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => connection.addEventListener("icegatheringstatechange", () => {
      if (connection.iceGatheringState === "complete") resolve();
    }));
  }

  window.conduitOffer = async (limits) => {
    peer = new RTCPeerConnection({ iceServers: [] });
    channel = peer.createDataChannel("conduit-line", {
      ordered: true,
      negotiated: false,
    });
    line = new BrowserWebRtcDataChannelLine({ channel, ...limits });
    await peer.setLocalDescription(await peer.createOffer());
    await gathered(peer);
    return peer.localDescription.toJSON();
  };

  window.conduitAnswer = async (offer, limits) => {
    peer = new RTCPeerConnection({ iceServers: [] });
    lineArrival = new Promise((resolve) => peer.addEventListener("datachannel", (event) => {
      channel = event.channel;
      line = new BrowserWebRtcDataChannelLine({ channel, ...limits });
      resolve();
    }, { once: true }));
    await peer.setRemoteDescription(offer);
    await peer.setLocalDescription(await peer.createAnswer());
    await gathered(peer);
    return peer.localDescription.toJSON();
  };

  window.conduitAcceptAnswer = async (answer) => {
    await peer.setRemoteDescription(answer);
  };

  window.conduitOpen = async () => {
    await lineArrival;
    await line.open();
    document.querySelector("#state").textContent = "open";
    return { channel: line.state(), peer: peer.connectionState };
  };

  window.conduitSend = (values) => values.map((value) => line.send(Uint8Array.from(value)));
  window.conduitReceive = async () => {
    const result = await line.receive();
    return result.ok ? { ok: true, bytes: [...result.bytes] } : result;
  };
  window.conduitClose = () => line.close();
  window.conduitClosed = () => line.closed();
  window.conduitState = () => ({ channel: line.state(), peer: peer.connectionState });

  window.conduitSessionStart = async (role, variant = 0) => {
    const wasmBytes = await fetch(
      "/target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm",
    ).then((response) => {
      if (!response.ok) throw new Error("browser WASM artifact missing");
      return response.arrayBuffer();
    });
    session = await instantiateWebRtcSession(wasmBytes, role, variant);
    return session.status;
  };
  window.conduitSessionOutput = () => {
    const bytes = takeWebRtcSessionOutput(session);
    return bytes === null ? null : [...bytes];
  };
  window.conduitSessionIngest = (bytes) => ingestWebRtcSession(
    session,
    Uint8Array.from(bytes),
  );
  window.conduitSessionFinish = () => finishWebRtcSession(session);
  window.conduitSessionCloseInput = () => closeWebRtcSessionInput(session);
  window.conduitSessionOffer = (bytes) => offerWebRtcSessionValue(
    session,
    Uint8Array.from(bytes),
  );
  window.conduitSessionPressure = (bytes) => pressureWebRtcSessionOffer(
    session,
    Uint8Array.from(bytes),
  );
  window.conduitSessionDeliver = () => deliverWebRtcSessionValue(session);
  window.conduitSessionValue = () => [...webRtcSessionValue(session)];
  window.conduitSessionNextSequence = () => webRtcSessionNextSequence(session);
</script>
