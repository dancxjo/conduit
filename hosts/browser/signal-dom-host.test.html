<!doctype html>
<meta charset="utf-8">
<title>Conduit S4 browser DOM host proof</title>
<p id="result">running</p>
<section id="host-a" aria-label="browser host A"></section>
<section id="host-b" aria-label="browser host B"></section>
<section id="host-item-bound" hidden></section>
<section id="host-byte-bound" hidden></section>
<script type="module">
import { BrowserDomFailure, BrowserDomHost } from "./signal-dom-host.mjs";
import {
  currentEffect,
  instantiateBrowserRuntime,
  runBrowserRuntime,
  submitCompletion,
} from "./signal-wasm-runtime.mjs";

const assert = (condition, message) => {
  if (!condition) throw new Error(message);
};
const encodeSignal = (sequence, level) => {
  const encoded = new Uint8Array(9);
  new DataView(encoded.buffer).setBigUint64(0, BigInt(sequence), true);
  encoded[8] = level ? 1 : 0;
  return [...encoded];
};
const effect = (host, sequence) => ({
  planId: `plan/${host}`,
  activePlayId: `play/${host}`,
  presentationId: `presentation/${host}/${sequence}`,
  placementId: `placement/${host}/show`,
  presentationKind: "presentation/signal",
  value: {
    valueKind: "value/signal",
    encoded: encodeSignal(sequence, sequence % 2 === 1),
  },
});

try {
  const wasmBytes = await fetch(
    "/target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm",
  ).then((response) => {
    assert(response.ok, "browser runtime WASM artifact loads");
    return response.arrayBuffer();
  });
  const hosts = [
    new BrowserDomHost({
      hostId: "browser-host-a",
      bootId: "browser-boot-a",
      root: document.querySelector("#host-a"),
      maximumReceiptItems: 16,
      maximumReceiptBytes: 144,
    }),
    new BrowserDomHost({
      hostId: "browser-host-b",
      bootId: "browser-boot-b",
      root: document.querySelector("#host-b"),
      maximumReceiptItems: 16,
      maximumReceiptBytes: 144,
    }),
  ];
  const runtimes = await Promise.all([
    instantiateBrowserRuntime(wasmBytes, 0),
    instantiateBrowserRuntime(wasmBytes, 1),
  ]);
  const startedAt = performance.now();
  const runtimeResults = await Promise.all([
    runBrowserRuntime(runtimes[0], hosts[0]),
    runBrowserRuntime(runtimes[1], hosts[1]),
  ]);
  const elapsedMs = performance.now() - startedAt;
  assert(runtimeResults.every((result) => result.status === 1), "both Rust runtimes complete");
  assert(
    runtimeResults.every((result) =>
      result.timerCount === 15 && result.requestedTimerMs === 3750
    ),
    "both hosts honor all fifteen requested 250ms intervals",
  );
  assert(elapsedMs >= 3650, "page hosts use real browser timers");
  assert(
    runtimeResults.every((result) =>
      result.completionCount === 16 && result.receiptCount === 16
    ),
    "both Rust runtimes correlate sixteen DOM completions",
  );

  const mismatchRuntime = await instantiateBrowserRuntime(wasmBytes, 0);
  const mismatchEffect = currentEffect(mismatchRuntime);
  const mismatchCode = submitCompletion(mismatchRuntime, mismatchEffect, {
    planId: `${mismatchEffect.planId}-wrong`,
    activePlayId: mismatchEffect.activePlayId,
    presentationId: mismatchEffect.presentationId,
    placementId: mismatchEffect.placementId,
    value: mismatchEffect.value,
  });
  assert(mismatchCode === -6, "runtime rejects a mismatched completion identity");

  const duplicate = hosts[0].completePresentation(runtimeResults[0].presentations[0]);
  assert(
    duplicate.code === BrowserDomFailure.DuplicatePresentation,
    "duplicate presentation fails closed",
  );
  const overflow = hosts[0].completePresentation(effect("a", 16));
  assert(
    overflow.code === BrowserDomFailure.ReceiptCapacity,
    "receipt store is item and byte bounded",
  );
  const itemBoundHost = new BrowserDomHost({
    hostId: "browser-host-item-bound",
    bootId: "browser-boot-item-bound",
    root: document.querySelector("#host-item-bound"),
    maximumReceiptItems: 1,
    maximumReceiptBytes: 18,
  });
  assert(itemBoundHost.completePresentation(effect("item-bound", 0)).ok, "item bound admits one");
  const itemOverflow = itemBoundHost.completePresentation(effect("item-bound", 1));
  assert(itemOverflow.code === BrowserDomFailure.ReceiptCapacity, "item bound rejects two");
  const byteBoundHost = new BrowserDomHost({
    hostId: "browser-host-byte-bound",
    bootId: "browser-boot-byte-bound",
    root: document.querySelector("#host-byte-bound"),
    maximumReceiptItems: 2,
    maximumReceiptBytes: 9,
  });
  assert(byteBoundHost.completePresentation(effect("byte-bound", 0)).ok, "byte bound admits nine");
  const byteOverflow = byteBoundHost.completePresentation(effect("byte-bound", 1));
  assert(byteOverflow.code === BrowserDomFailure.ReceiptCapacity, "byte bound rejects eighteen");
  const malformed = hosts[1].completePresentation({
    ...effect("b", 16),
    value: { valueKind: "value/signal", encoded: [1, 2, 3] },
  });
  assert(
    malformed.code === BrowserDomFailure.InvalidPresentation,
    "malformed signal fails closed",
  );
  assert(hosts[0].receipts().length === 16, "host A retains sixteen receipts");
  assert(hosts[1].receipts().length === 16, "host B retains sixteen receipts");
  assert(
    hosts[0].receipts()[15].sequence === "15" &&
      hosts[1].receipts()[15].sequence === "15",
    "both hosts retain the same ordered semantic values",
  );

  globalThis.__conduitBrowserDomResults = Object.freeze({
    completionCount: runtimeResults.reduce((sum, result) => sum + result.completionCount, 0),
    hostAReceipts: hosts[0].receipts().length,
    hostBReceipts: hosts[1].receipts().length,
    hostATimers: runtimeResults[0].timerCount,
    hostBTimers: runtimeResults[1].timerCount,
    hostARequestedTimerMs: runtimeResults[0].requestedTimerMs,
    hostBRequestedTimerMs: runtimeResults[1].requestedTimerMs,
    hostAStatus: runtimeResults[0].status,
    hostBStatus: runtimeResults[1].status,
    mismatchCode,
    duplicateCode: duplicate.code,
    overflowCode: overflow.code,
    itemOverflowCode: itemOverflow.code,
    byteOverflowCode: byteOverflow.code,
    malformedCode: malformed.code,
  });
  document.querySelector("#result").textContent = "ok";
} catch (error) {
  document.querySelector("#result").textContent = `error:${error.stack ?? error}`;
  throw error;
}
</script>
