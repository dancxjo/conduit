<!doctype html>
<meta charset="utf-8">
<title>Conduit S4 distributed toggle proof</title>
<p id="result">running</p>
<section id="browser-sink" aria-label="distributed browser toggle sink"></section>
<script type="module">
import { BrowserDomHost } from "./signal-dom-host.mjs";
import { BrowserWebSocketLine } from "./websocket-line.mjs";
import {
  instantiateDistributedToggleRuntime,
  runDistributedToggleRuntime,
} from "./distributed-toggle-runtime.mjs";

const params = new URLSearchParams(location.search);
const url = params.get("ws");
if (!url) {
  document.querySelector("#result").textContent =
    "waiting (pass ?ws=ws://host:port/conduit or use Playwright)";
} else {
  try {
    const wasmBytes = await fetch(
      "/target/wasm32-unknown-unknown/release/conduit_browser_runtime.wasm",
    ).then((response) => {
      if (!response.ok) throw new Error("browser WASM artifact missing");
      return response.arrayBuffer();
    });
    const line = await new BrowserWebSocketLine({
      url,
      maximumMessageBytes: 2048,
      maximumBufferedBytes: 8192,
    }).open();
    const domHost = new BrowserDomHost({
      hostId: "s4/toggle-browser-sink",
      bootId: "s4/toggle-browser-sink-boot",
      root: document.querySelector("#browser-sink"),
      maximumReceiptItems: 16,
      maximumReceiptBytes: 144,
    });
    const runtime = await instantiateDistributedToggleRuntime(wasmBytes);
    const observableDomHost = {
      completePresentation(effect) {
        const result = domHost.completePresentation(effect);
        if (result.ok) {
          const output = document.querySelector("#browser-sink output:last-child");
          output.dataset.encoded = JSON.stringify(result.receipt.encoded);
        }
        return result;
      },
    };
    const result = await runDistributedToggleRuntime(runtime, line, observableDomHost);
    const closed = await line.closed();
    globalThis.__distributedToggleProof = {
      ...result,
      presentations: result.presentations.map((effect, sequence) => {
        const { value, ...identity } = effect;
        return {
          ...identity,
          sequence,
          encoded: value.encoded,
        };
      }),
      receipts: domHost.receipts(),
      closed,
    };
    document.querySelector("#result").textContent =
      `ok receipts=${result.receiptCount} capacity_stable=${result.capacityStable}`;
  } catch (error) {
    document.querySelector("#result").textContent = `error:${error.stack ?? error}`;
    throw error;
  }
}
</script>
