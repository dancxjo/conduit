[package]
name = "conduit-std-host"
version = "0.1.0"
edition = "2021"

[features]
default = []
bluetooth-bluez = ["dep:bluer", "dep:dbus", "dep:futures", "dep:tokio", "dep:uuid"]
legacy-fixture-driver = [
    "conduit-runtime/compatibility-executor",
    "conduit-signal/legacy-fixture-driver",
]
local-model-proof = []
pete-create = ["dep:conduit-create-oi"]

[dependencies]
conduit-ai = { path = "../../crates/conduit-ai", features = ["form-catalog"] }
conduit-alife = { path = "../../crates/conduit-alife", features = ["planning"] }
conduit-body = { path = "../../crates/conduit-body" }
conduit-bluetooth = { path = "../../crates/conduit-bluetooth" }
conduit-core = { path = "../../crates/conduit-core" }
conduit-chat = { path = "../../crates/conduit-chat", features = ["form-catalog"] }
conduit-form = { path = "../../crates/conduit-form" }
conduit-host-fabrication = { path = "../../crates/conduit-host-fabrication" }
conduit-kernel = { path = "../../crates/conduit-kernel", features = ["alloc"] }
conduit-midi = { path = "../../crates/conduit-midi" }
conduit-create-oi = { path = "../../crates/conduit-create-oi", optional = true }
conduit-net = { path = "../../crates/conduit-net", features = ["form-catalog", "r1-planning"] }
conduit-planner = { path = "../../crates/conduit-planner" }
conduit-presentation = { path = "../../crates/conduit-presentation" }
conduit-runtime = { path = "../../crates/conduit-runtime", default-features = false }
conduit-signal = { path = "../../crates/conduit-signal", features = ["host-profile"] }
conduit-system-continuity = { path = "../../crates/conduit-system-continuity", features = ["r1-recovery"] }
conduit-synth = { path = "../../crates/conduit-synth" }
conduit-std-catalog = { path = "../../crates/conduit-std-catalog", default-features = false, features = ["body-coordination-plan", "form-catalog", "text-lab-plan"] }
conduit-wire = { path = "../../crates/conduit-wire" }
tungstenite = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
instant-distance = "=0.6.1"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"], optional = true }
dbus = { version = "0.9.12", features = ["vendored"], optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["io-util", "time"], optional = true }
uuid = { version = "1", optional = true }

[[bin]]
name = "bluetooth-line-probe"
path = "src/bin/bluetooth-line-probe.rs"
required-features = ["bluetooth-bluez"]

[[bin]]
name = "distributed-lenia-probe"
path = "src/bin/distributed-lenia-probe.rs"
required-features = ["bluetooth-bluez"]

[dev-dependencies]
conduit-browser-runtime = { path = "../browser-runtime" }
conduit-pico-sim = { path = "../../fixtures/pico-sim", features = ["compatibility-fixture"] }
conduit-workspace-fabrication = { path = "../../crates/conduit-workspace-fabrication" }
ed25519-dalek = "2.2"
