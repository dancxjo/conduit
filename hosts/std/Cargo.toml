[package]
name = "conduit-std-host"
version = "0.1.0"
edition = "2021"

[features]
default = []
legacy-fixture-driver = []

[dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-form = { path = "../../crates/conduit-form" }
conduit-kernel = { path = "../../crates/conduit-kernel", features = ["alloc"] }
conduit-planner = { path = "../../crates/conduit-planner" }
conduit-runtime = { path = "../../crates/conduit-runtime" }
conduit-signal = { path = "../../crates/conduit-signal", features = ["host-profile"] }
conduit-wire = { path = "../../crates/conduit-wire" }
tungstenite = "0.30.0"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
