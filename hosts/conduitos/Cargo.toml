[package]
name = "conduitos"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "conduitos"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "conduitos-aarch64-a0"
path = "src/bin/aarch64_a0.rs"
test = false
bench = false
required-features = ["aarch64-a0"]

[[bin]]
name = "conduitos-aarch64-a2"
path = "src/bin/aarch64_a2.rs"
test = false
bench = false
required-features = ["aarch64-a2"]

[[bin]]
name = "conduitos-aarch64-a3"
path = "src/bin/aarch64_a3.rs"
test = false
bench = false
required-features = ["aarch64-a3"]

[[bin]]
name = "conduitos-ia32-a0"
path = "src/bin/ia32_a0.rs"
test = false
bench = false
required-features = ["ia32-a0"]

[[bin]]
name = "conduitos-ia32-a2"
path = "src/bin/ia32_a2.rs"
test = false
bench = false
required-features = ["ia32-a2"]

[[bin]]
name = "conduitos-ia32-a3"
path = "src/bin/ia32_a3.rs"
test = false
bench = false
required-features = ["ia32-a3"]

[[bin]]
name = "conduitos-riscv64-a0"
path = "src/bin/riscv64_a0.rs"
test = false
bench = false
required-features = ["riscv64-a0"]

[[bin]]
name = "conduitos-riscv64-a2"
path = "src/bin/riscv64_a2.rs"
test = false
bench = false
required-features = ["riscv64-a2"]

[[bin]]
name = "conduitos-riscv64-a3"
path = "src/bin/riscv64_a3.rs"
test = false
bench = false
required-features = ["riscv64-a3"]

[[bin]]
name = "conduitos-riscv64-a4"
path = "src/bin/riscv64_a4.rs"
test = false
bench = false
required-features = ["riscv64-a4"]

[[bin]]
name = "conduitos-loongarch64-a0"
path = "src/bin/loongarch64_a0.rs"
test = false
bench = false
required-features = ["loongarch64-a0"]

[[bin]]
name = "conduitos-loongarch64-a2"
path = "src/bin/loongarch64_a2.rs"
test = false
bench = false
required-features = ["loongarch64-a2"]

[[bin]]
name = "conduitos-loongarch64-a3"
path = "src/bin/loongarch64_a3.rs"
test = false
bench = false
required-features = ["loongarch64-a3"]

[[bin]]
name = "conduitos-loongarch64-a4"
path = "src/bin/loongarch64_a4.rs"
test = false
bench = false
required-features = ["loongarch64-a4"]

[features]
default = []
hotplug-proof = []
scripted-keyboard-proof = []
aarch64-a0 = []
aarch64-a2 = []
aarch64-a3 = []
ia32-a0 = []
ia32-a2 = []
ia32-a3 = []
riscv64-a0 = []
riscv64-a2 = []
riscv64-a3 = []
riscv64-a4 = []
loongarch64-a0 = []
loongarch64-a2 = []
loongarch64-a3 = []
loongarch64-a4 = []

[dependencies]
conduit-body = { path = "../../crates/conduit-body" }
conduit-core = { path = "../../crates/conduit-core" }
conduit-form = { path = "../../crates/conduit-form" }
conduit-kernel = { path = "../../crates/conduit-kernel" }
conduit-observatory = { path = "../../crates/conduit-observatory" }
conduit-planner = { path = "../../crates/conduit-planner" }
conduit-presentation = { path = "../../crates/conduit-presentation" }
conduit-runtime = { path = "../../crates/conduit-runtime", default-features = false }
conduit-std-catalog = { path = "../../crates/conduit-std-catalog", default-features = false, features = ["form-catalog"] }
conduit-synth = { path = "../../crates/conduit-synth" }
sha2 = { version = "=0.10.9", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "x86"))'.dependencies]
limine = "=0.5.0"

[dev-dependencies]
conduit-std-host = { path = "../std" }
