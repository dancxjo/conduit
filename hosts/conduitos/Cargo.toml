[package]
name = "conduitos"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "conduitos"
path = "src/main.rs"
test = false
bench = false

[dependencies]
conduit-kernel = { path = "../../crates/conduit-kernel" }
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(not(target_arch = "x86"))'.dependencies]
limine = "=0.5.0"
