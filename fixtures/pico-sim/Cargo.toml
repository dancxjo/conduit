[package]
name = "conduit-pico-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-form = { path = "../../crates/conduit-form", optional = true }
conduit-planner = { path = "../../crates/conduit-planner", optional = true }
conduit-runtime = { path = "../../crates/conduit-runtime", optional = true, default-features = false }
conduit-signal = { path = "../../crates/conduit-signal", default-features = false }
conduit-wire = { path = "../../crates/conduit-wire" }

[dev-dependencies]
conduit-body = { path = "../../crates/conduit-body" }
conduit-std-host = { path = "../../hosts/std", features = ["legacy-fixture-driver"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }

[features]
default = ["compatibility-fixture"]
compatibility-fixture = [
    "conduit-signal/host-profile",
    "dep:conduit-form",
    "dep:conduit-planner",
    "dep:conduit-runtime",
    "conduit-runtime/compatibility-executor",
    "conduit-signal/legacy-fixture-driver",
]
