[package]
name = "conduit-browser-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../crates/conduit-core" }
conduit-form = { path = "../../crates/conduit-form" }
conduit-planner = { path = "../../crates/conduit-planner" }
conduit-runtime = { path = "../../crates/conduit-runtime", default-features = false, features = ["compatibility-executor"] }
conduit-signal = { path = "../../crates/conduit-signal", features = ["legacy-fixture-driver"] }
conduit-wire = { path = "../../crates/conduit-wire" }

[dev-dependencies]
conduit-pico-sim = { path = "../pico-sim" }
conduit-std-host = { path = "../../hosts/std", features = ["legacy-fixture-driver"] }
