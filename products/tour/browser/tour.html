<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    const routedPage = /\/(?:one-program-many-computers|a-form-you-can-run|meet-one-gear|faces-backs-and-implementation|same-face-different-implementation|hosts-make-forms-real|one-form-across-several-hosts|the-body-one-computer-one-machine-or-many|many-forms-one-body-wide-realization|birth-spores-and-the-creche)\/(?:index\.html)?$/.test(location.pathname);
    const unslashedEntrance = /\/tour$/.test(location.pathname);
    const tourRoot = new URL(routedPage ? "../" : unslashedEntrance ? "./tour/" : "./", location.href).href;
    document.write(`<base href="${tourRoot}">`);
  </script>
  <meta name="conduit-creche-url" content="../creche/">
  <meta name="conduit-application-package" content="./tour.application.json">
  <title>A Form you can run · Tour</title>
  <style data-conduit-bootstrap>
    html { background:#05070b; } body { margin:0; }
    #conduit-suspense { position:fixed; inset:0; z-index:2147483647; display:grid; place-items:center; padding:2rem; color:#93d2f7; background:#05070b; font:16px/1.5 system-ui,sans-serif; text-align:center; transition:opacity 220ms ease,visibility 220ms step-end; }
    #conduit-suspense>div { width:min(24rem,100%); } #conduit-suspense .conduit-pulse { width:4rem; height:4rem; margin:0 auto 1.35rem; border:1px solid #0dd8f6; border-radius:50%; background:radial-gradient(circle,#e9a325 0 9%,transparent 10% 100%); box-shadow:0 0 0 0 #0dd8f655; animation:conduit-pulse 1.15s ease-out infinite; }
    #conduit-suspense strong { display:block; color:#e9a325; font:700 .78rem/1.2 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; } #conduit-suspense span { display:block; margin-top:.55rem; color:#578ec9; }
    html[data-conduit-load-state="ready"] #conduit-suspense { visibility:hidden; opacity:0; pointer-events:none; } html[data-conduit-load-state="refused"] #conduit-suspense .conduit-pulse { animation:none; border-color:#ff7272; box-shadow:none; } html[data-conduit-load-state="refused"] #conduit-suspense strong { color:#ff7272; }
    @keyframes conduit-pulse { 70%,100% { box-shadow:0 0 0 1.5rem #0dd8f600; transform:scale(.94); } } @media (prefers-reduced-motion:reduce) { #conduit-suspense,#conduit-suspense .conduit-pulse { animation:none; transition:none; } }
  </style>
</head>
<body>
  <div id="conduit-suspense" role="status" aria-live="polite" aria-busy="true"><div><div class="conduit-pulse" aria-hidden="true"></div><strong>Conduit Tour</strong><span>Preparing the next chapter…</span></div></div>
  <div data-application-slot="product-masthead"></div>
  <div class="tour-workspace">
    <nav class="tour-mode-switcher" aria-label="Tour entrances">
      <button type="button" data-tour-mode="guided" aria-pressed="true">Guided Tour</button>
      <button type="button" data-tour-mode="gallery" aria-pressed="false">Form Gallery</button>
      <details class="tour-layout-controls">
        <summary>Pane layout</summary>
        <label for="tour-patchbay-height">Patchbay height</label>
        <input id="tour-patchbay-height" type="range" min="35" max="70" step="1" value="55">
        <label for="tour-source-width">Source width</label>
        <input id="tour-source-width" type="range" min="40" max="75" step="1" value="60">
      </details>
    </nav>
    <nav class="tour-view-switcher" aria-label="Tour workspace views">
      <button type="button" data-tour-view="lesson" aria-controls="chapter" aria-pressed="true">Lesson</button>
      <button type="button" data-tour-view="laboratory" aria-controls="laboratory-slot" aria-pressed="false">Laboratory</button>
    </nav>
    <div class="tour-content" data-narrow-view="lesson">
      <main id="chapter" tabindex="-1" aria-label="Tour lesson" aria-live="polite"></main>
      <div class="tour-divider">
        <label for="tour-narrative-width">Narrative width</label>
        <input id="tour-narrative-width" type="range" min="30" max="65" step="1" value="46">
        <button type="button" data-tour-reset-layout>Reset panes</button>
      </div>
      <aside id="laboratory-slot" tabindex="-1" aria-label="Tour laboratory"></aside>
    </div>
    <div data-application-slot="tour-navigation"></div>
  </div>
  <noscript>This executable chapter requires JavaScript and WebAssembly.</noscript>
  <script type="module" src="./browser-application-loader.mjs"></script>
</body>
</html>
