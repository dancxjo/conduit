[package]
name = "patchbay-model"
version = "0.1.0"
edition = "2021"

[dependencies]
patchbay-graph = { path = "../../../forms/patchbay/graph" }
conduit-core = { path = "../../../architecture/core" }
conduit-human = { path = "../../../semantics/human" }
patchbay-control = { path = "../../../forms/patchbay" }
patchbay-workbench-host-contract = { path = "../../../forms/patchbay/workbench/host-contract" }
conduit-form = { path = "../../../architecture/form" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-net = { path = "../../../semantics/net" }
conduit-observatory = { path = "../../../architecture/observatory" }
conduit-planner = { path = "../../../architecture/planner" }
conduit-presentation = { path = "../../../semantics/presentation" }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false }
conduit-body = { path = "../../../architecture/body" }
conduit-chat = { path = "../../../semantics/chat" }
conduit-birth-form = { path = "../../../forms/birth" }
conduit-browser-runtime = { path = "../../../targets/browser/runtime" }
conduit-data = { path = "../../../semantics/data" }
conduit-little-seismograph-fixture = { path = "../../../forms/little-seismograph/fixture" }
conduit-body-make = { path = "../../../make/body" }
conduit-patchbay-workbench-conformance = { path = "../../../proof/conformance/patchbay-workbench" }
conduit-ai = { path = "../../../semantics/ai", features = ["form-catalog"] }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../../proof/conformance/signal" }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["form-catalog", "text-lab-plan"] }
conduit-std-offers = { path = "../../../targets/std/offers" }
conduit-time = { path = "../../../semantics/time" }
conduit-text = { path = "../../../semantics/text", default-features = false }
conduit-wire = { path = "../../../architecture/wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
patchbay-application = { path = "../../../forms/patchbay/application" }
conduit-std-host = { path = "../../../targets/std" }
conduit-signal = { path = "../../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../../proof/conformance/signal" }
