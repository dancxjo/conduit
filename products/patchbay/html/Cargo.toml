[package]
name = "patchbay-html"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-body = { path = "../../../architecture/body" }
conduit-browser-host = { path = "../../../targets/browser/host" }
conduit-core = { path = "../../../architecture/core" }
conduit-kernel = { path = "../../../architecture/kernel", features = ["alloc"] }
conduit-presentation = { path = "../../../semantics/presentation" }
conduit-plan-lowering = { path = "../../../architecture/plan-lowering", default-features = false }
conduit-std-host = { path = "../../../targets/std" }
conduit-semantic-catalog = { path = "../../../semantics/catalog" }
conduit-tongues = { path = "../../../semantics/tongues" }
conduit-wire = { path = "../../../architecture/wire" }
patchbay-model = { path = "../model" }
patchbay-hosted = { path = "../hosted" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30.0"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
