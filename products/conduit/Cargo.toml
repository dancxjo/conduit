[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
default-run = "conduit"

[dependencies]
clap = { version = "4", features = ["derive"] }
conduit-alife = { path = "../../semantics/alife" }
conduit-ai = { path = "../../semantics/ai" }
conduit-core = { path = "../../architecture/core" }
conduit-body = { path = "../../architecture/body" }
conduit-body-make = { path = "../../make/body" }
conduit-birth-plot = { path = "../../plots/birth" }
conduit-chat = { path = "../../semantics/chat", features = ["plot-catalog"] }
conduit-plot = { path = "../../architecture/plot" }
conduit-host-make = { path = "../../make/host" }
conduit-kernel = { path = "../../architecture/kernel" }
conduit-language = { path = "../../semantics/language" }
conduit-data = { path = "../../semantics/data" }
conduit-finance = { path = "../../semantics/finance" }
conduit-net = { path = "../../semantics/net", features = ["plot-catalog"] }
conduit-observatory = { path = "../../architecture/observatory" }
conduit-planner = { path = "../../architecture/planner" }
conduit-patchbay-workbench = { path = "../../plots/patchbay/workbench/model" }
conduit-presentation = { path = "../../semantics/presentation" }
conduit-conduitos-mask-offer = { path = "../../targets/conduitos/mask-offer" }
conduit-browser-mask-offer = { path = "../../targets/browser/mask-offer" }
conduit-host-browser-make = { path = "../../targets/browser/make" }
conduit-plan-lowering = { path = "../../architecture/plan-lowering" }
conduit-protected-line = { path = "../../architecture/protected-line" }
conduit-speech = { path = "../../semantics/speech", features = ["kernel"] }
conduit-signal = { path = "../../semantics/signal", features = ["host-profile"] }
conduit-std-host = { path = "../../targets/std" }
conduit-std-offers = { path = "../../targets/std/offers" }
conduit-semantic-catalog = { path = "../../semantics/catalog", default-features = false, features = ["plot-catalog"] }
conduit-time = { path = "../../semantics/time" }
conduit-text = { path = "../../semantics/text" }
conduit-wire = { path = "../../architecture/wire" }
conduit-web = { path = "../../semantics/web", default-features = false, features = ["plot-catalog"] }
conduit-workspace-make = { path = "../../make/workspace" }
patchbay-svg-mask = { path = "../../plots/patchbay/workbench/svg-mask" }
patchbay-hosted = { path = "../../targets/std/patchbay-workbench" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
socket2 = "0.6"

[dev-dependencies]
rcgen = "0.14"

[lib]
path = "src/lib.rs"

[[test]]
name = "hello"
path = "tests/hello.rs"

[[test]]
name = "structured_diagnostics"
path = "tests/structured_diagnostics.rs"

[[test]]
name = "two_std_line"
path = "tests/two_std_line.rs"

[[test]]
name = "installed_body_growth"
path = "tests/installed_body_growth.rs"
