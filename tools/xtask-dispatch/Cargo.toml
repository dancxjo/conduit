[package]
name = "conduit-xtask-dispatch"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "conduit-xtask-dispatch"
path = "src/main.rs"

[[test]]
name = "ci_workflow_contract"
path = "../xtask/tests/ci_workflow_contract.rs"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
conduit-host-make = { path = "../../make/host" }
conduit-host-browser-make = { path = "../../targets/browser/make", optional = true }

[features]
host-release = ["dep:clap", "dep:conduit-host-browser-make"]
