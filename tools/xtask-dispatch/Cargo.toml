[package]
name = "conduit-xtask-dispatch"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "conduit-xtask-dispatch"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
