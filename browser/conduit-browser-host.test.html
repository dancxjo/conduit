<!doctype html>
<meta charset="utf-8">
<title>Conduit browser host adapter vectors</title>
<pre id="result">running</pre>
<script>
globalThis.addEventListener("error", (event) => {
  document.querySelector("#result").textContent = `error:${event.error?.stack ?? event.message}`;
});
globalThis.addEventListener("unhandledrejection", (event) => {
  document.querySelector("#result").textContent = `error:${event.reason}`;
});
</script>
<script type="module">
import {
  AudioWorkletExecutionAdapter,
  BoundedPortQueue,
  BrowserExecutionAdapter,
  BrowserHostReason,
  BrowserMembershipSignal,
  DedicatedWorkerExecutionAdapter,
  PermissionState,
  Placement,
  ServiceWorkerExecutionAdapter,
  SharedWorkerExecutionAdapter,
  WasmExecutionAdapter,
  WebGpuExecutionAdapter,
  WindowExecutionAdapter,
  observeBrowserHost,
  assessBrowserMembershipSignal,
  resolveBrowserPlacement,
  verifyExactArtifact,
} from "./conduit-browser-host.mjs";
import {
  BoundedBrowserSupervisor,
  SupervisionReason,
} from "./conduit-supervision.mjs";
import {
  BoundedBrowserPool,
  PoolReason,
} from "./conduit-pool.mjs";
import {
  admitBrowserWorkload,
  BrowserWorkloadState,
  WorkloadReason,
} from "./conduit-workload.mjs";

const assert = (condition, message) => {
  if (!condition) throw new Error(message);
};
const mark = (stage) => {
  document.querySelector("#result").textContent = `stage:${stage}`;
};
const bounded = (promise, milliseconds, label) => Promise.race([
  promise,
  new Promise((_, reject) =>
    setTimeout(() => reject(new Error(`${label}-timeout`)), milliseconds)),
]);
const evidence = [];
const emitEvidence = (event) => evidence.push(event);
const membershipSignals = Object.values(BrowserMembershipSignal).map((signal) =>
  assessBrowserMembershipSignal(signal));
assert(
  membershipSignals.every((decision) =>
    decision.ok === false && decision.code === BrowserHostReason.ImplicitEnrollment),
  "navigation, PWA, permission, transport, and report signals never enroll",
);
const placement = (id, available, lifetime, scheduling, transfer, terminalRisks = []) => ({
  id,
  available,
  lifetime,
  scheduling,
  transfer,
  limits: { queueBytes: 1024 },
  terminalRisks,
});
const statusObservation = {
  realmId: "fixture/realm",
  entityId: "fixture/browser-entity",
  passportIdentity: "fixture/passport",
  reporterIdentity: "fixture/status-reporter",
  timeBasis: "fixture/clock",
  observedAtTick: 9,
  validUntilTick: 20,
  status: "active",
};
const report = observeBrowserHost({
  hostId: "fixture/browser",
  observationId: "fixture/observation",
  reporter: {
    realmId: "fixture/realm",
    entityId: "fixture/browser-entity",
    passportIdentity: "fixture/passport",
    statusObservation,
  },
  tick: 10,
  validUntilTick: 20,
  context: {
    secureContext: globalThis.isSecureContext,
    origin: globalThis.location.origin,
    crossOriginIsolated: globalThis.crossOriginIsolated,
  },
  placements: [
    placement(Placement.Window, true, "page", "cooperative", "clone", ["freeze", "discard"]),
    placement(Placement.DedicatedWorker, typeof Worker === "function", "worker", "event-loop", "transfer", ["worker-death"]),
    placement(Placement.SharedWorker, typeof SharedWorker === "function", "shared-worker", "event-loop", "transfer", ["worker-death"]),
    placement(Placement.ServiceWorker, "serviceWorker" in navigator, "registration", "event-driven", "clone", ["replacement", "termination"]),
    placement(Placement.AudioWorklet, Boolean(globalThis.AudioContext && globalThis.AudioWorkletNode), "audio-context", "render-quantum", "ring-buffer", ["processor-error", "context-close"]),
    placement(Placement.Wasm, typeof WebAssembly === "object", "owning-context", "placement-owned", "linear-memory", ["trap"]),
    placement(Placement.WebGpu, Boolean(navigator.gpu), "device", "provider-scheduled", "external-memory", ["device-loss"]),
  ],
  permissions: [{ capability: "microphone", state: PermissionState.Prompt, scope: "origin" }],
  activation: false,
  resources: { queueBytes: 1024, pendingMessages: 2 },
});

assert(report.ok !== false, "report accepted");
assert(report.reporter.statusObservation.status === "active", "realm/passport status bound");
assert(new Set(report.placements.map((item) => item.id)).size === 7, "placements distinct");
assert(
  resolveBrowserPlacement(report, {
    tick: 11,
    placement: Placement.Window,
    permissions: ["microphone"],
  }).code === BrowserHostReason.PromptIsNotGrant,
  "prompt is never a grant",
);
assert(
  resolveBrowserPlacement(report, {
    tick: 11,
    placement: Placement.AudioWorklet,
    requiresActivation: true,
  }).code === BrowserHostReason.ActivationRequired,
  "activation required",
);
assert(
  resolveBrowserPlacement(report, { tick: 20, placement: Placement.Window }).code ===
    BrowserHostReason.StaleObservation,
  "stale report rejected",
);

const queue = new BoundedPortQueue(1);
assert(
  queue.offer("one").ok && queue.offer("two").code === BrowserHostReason.QueueCapacity,
  "queue bounded",
);
const bytes = new TextEncoder().encode("conduit");
const digest = await verifyExactArtifact(
  bytes,
  "41a01f9945b8b394953d4d44a1522eb9c7654c7fc86a572b71fc63408e854440",
);
assert(digest.ok, "artifact verified");
assert(
  (await verifyExactArtifact(bytes, "00".repeat(32))).code ===
    BrowserHostReason.ArtifactIntegrity,
  "artifact mismatch rejected",
);

const generic = new BrowserExecutionAdapter(
  { planIdentity: "fixture/plan-generic", placement: Placement.Window },
  emitEvidence,
);
assert(
  generic.start().ok && generic.terminate("page-frozen").ok,
  "page lifecycle evidenced",
);

const windowAdapter = new WindowExecutionAdapter(
  { planIdentity: "fixture/plan-window", placement: Placement.Window },
  emitEvidence,
);
assert(windowAdapter.start().ok, "window starts");
assert(
  windowAdapter.step((value) => value.toUpperCase(), "window").value === "WINDOW",
  "window executes bounded step",
);
windowAdapter.terminate("completed");

const messageBinding = (planIdentity, placementId, artifactUrl) => ({
  planIdentity,
  placement: placementId,
  artifactUrl,
  maximumPending: 2,
  maximumMessageBytes: 1024,
  responseTimeoutMs: 1000,
});
const workerUrl = new URL("./conduit-placement-worker.mjs", import.meta.url);
const placementOutcomes = { [Placement.Window]: "executed" };

const dedicated = new DedicatedWorkerExecutionAdapter(
  messageBinding("fixture/plan-dedicated", Placement.DedicatedWorker, workerUrl),
  emitEvidence,
);
mark("dedicated-worker");
const dedicatedStart = dedicated.start();
placementOutcomes[Placement.DedicatedWorker] = dedicatedStart.ok ? "executed" : "unsupported";
if (dedicatedStart.ok) {
  assert((await dedicated.request("uppercase", "worker")).value === "WORKER", "dedicated worker executes");
  dedicated.terminate("completed");
}

const explicitlyUnsupported = new DedicatedWorkerExecutionAdapter(
  messageBinding(
    "fixture/plan-unsupported-worker",
    Placement.DedicatedWorker,
    workerUrl,
  ),
  emitEvidence,
  null,
);
assert(
  explicitlyUnsupported.start().code === BrowserHostReason.PlacementUnavailable,
  "unsupported feature is explicit",
);

const shared = new SharedWorkerExecutionAdapter(
  messageBinding("fixture/plan-shared", Placement.SharedWorker, workerUrl),
  emitEvidence,
);
mark("shared-worker");
const sharedStart = shared.start();
placementOutcomes[Placement.SharedWorker] = sharedStart.ok ? "executed" : "unsupported";
if (sharedStart.ok) {
  const sharedResult = await shared.request("uppercase", "shared");
  placementOutcomes[Placement.SharedWorker] =
    sharedResult.value === "SHARED" ? "executed" : "unsupported";
  shared.terminate("completed");
}

let registration;
mark("service-worker");
if ("serviceWorker" in navigator) {
  try {
    registration = await bounded(
      navigator.serviceWorker.register("./conduit-service-worker.mjs", {
        scope: "./",
        type: "module",
      }),
      1000,
      "service-worker-registration",
    );
    await bounded(navigator.serviceWorker.ready, 1000, "service-worker-ready");
  } catch {
    registration = undefined;
  }
}
const service = new ServiceWorkerExecutionAdapter(
  {
    planIdentity: "fixture/plan-service",
    placement: Placement.ServiceWorker,
    maximumPending: 2,
    responseTimeoutMs: 1000,
  },
  emitEvidence,
  registration?.active,
);
const serviceStart = service.start();
placementOutcomes[Placement.ServiceWorker] = serviceStart.ok ? "executed" : "unsupported";
if (serviceStart.ok) {
  assert((await service.request("echo", "service")).value === "service", "service worker executes");
  service.terminate("completed");
}
await registration?.unregister();

const AudioContextConstructor = globalThis.AudioContext ?? globalThis.webkitAudioContext;
mark("audio-worklet");
const audioContext = AudioContextConstructor ? new AudioContextConstructor() : undefined;
const audio = new AudioWorkletExecutionAdapter(
  {
    ...messageBinding(
      "fixture/plan-audio",
      Placement.AudioWorklet,
      new URL("./conduit-audio-worklet.mjs", import.meta.url),
    ),
    processorName: "conduit-pass-through",
  },
  emitEvidence,
  audioContext,
);
const audioStart = await audio.start();
placementOutcomes[Placement.AudioWorklet] = audioStart.ok ? "executed" : "unsupported";
if (audioStart.ok) {
  const audioResult = await audio.request("echo", "audio");
  placementOutcomes[Placement.AudioWorklet] =
    audioResult.value === "audio" ? "executed" : "unsupported";
  audio.terminate("completed");
}
await audioContext?.close();

const wasmBytes = new Uint8Array([
  0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
  0x01, 0x07, 0x01, 0x60, 0x02, 0x7f, 0x7f, 0x01, 0x7f,
  0x03, 0x02, 0x01, 0x00,
  0x07, 0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00,
  0x0a, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6a, 0x0b,
]);
mark("wasm");
const wasm = new WasmExecutionAdapter(
  { planIdentity: "fixture/plan-wasm", placement: Placement.Wasm },
  emitEvidence,
  wasmBytes,
);
assert((await wasm.start()).ok, "WASM starts");
assert(wasm.call("add", 2, 3).value === 5, "WASM executes exact export");
placementOutcomes[Placement.Wasm] = "executed";
wasm.terminate("completed");

let loseDevice;
mark("webgpu-loss");
const fakeGpu = {
  requestAdapter: async () => ({
    requestDevice: async () => ({
      lost: new Promise((resolve) => {
        loseDevice = resolve;
      }),
    }),
  }),
};
const gpuLoss = new WebGpuExecutionAdapter(
  {
    planIdentity: "fixture/plan-gpu-loss",
    placement: Placement.WebGpu,
    providerTimeoutMs: 1000,
  },
  emitEvidence,
  fakeGpu,
);
assert((await gpuLoss.start()).ok, "WebGPU adapter starts with explicit provider");
loseDevice({ reason: "destroyed" });
await new Promise((resolve) => setTimeout(resolve, 0));
assert(gpuLoss.state === "terminal", "GPU loss is terminal");

const actualGpu = new WebGpuExecutionAdapter(
  {
    planIdentity: "fixture/plan-gpu",
    placement: Placement.WebGpu,
    providerTimeoutMs: 1000,
  },
  emitEvidence,
);
mark("webgpu-actual");
const gpuStart = await actualGpu.start();
placementOutcomes[Placement.WebGpu] = gpuStart.ok ? "executed" : "unsupported";
if (gpuStart.ok) actualGpu.terminate("completed");

assert(
  evidence.some((event) => event.kind === "terminal" && event.cause === "page-frozen"),
  "freeze terminal evidence",
);
assert(
  evidence.some((event) => event.kind === "terminal" &&
    event.cause.startsWith("webgpu-device-lost")),
  "GPU loss terminal evidence",
);

const supervisionBinding = Object.freeze({
  schemaVersion: 0,
  id: "fixture/browser-supervisor",
  scope: "child",
  subject: "root/subject",
  handler: "root/handler",
  members: [],
  failureMode: "fail-together",
  requiredBehavior: true,
  limits: {
    maximumObservations: 2,
    maximumDecisions: 2,
    maximumInFlight: 1,
    maximumCauseDepth: 2,
    maximumNestedDepth: 2,
    maximumHandlerTicks: 8,
    maximumRecoveryTicks: 16,
    restartWindowTicks: 8,
    backoffTicks: 2,
    cooldownTicks: 2,
    operatorWaitTicks: 8,
    maximumEvidenceEvents: 8,
  },
  actions: [
    {
      kind: "propagate",
      target: null,
      maximumUses: 1,
      permitsEffectReplay: false,
      preservesRequiredGuarantees: true,
      requiresNewEpoch: false,
    },
    {
      kind: "restart-same",
      target: null,
      maximumUses: 1,
      permitsEffectReplay: false,
      preservesRequiredGuarantees: true,
      requiresNewEpoch: false,
    },
    {
      kind: "activate-declared-fallback",
      target: "fallback",
      maximumUses: 1,
      permitsEffectReplay: false,
      preservesRequiredGuarantees: true,
      requiresNewEpoch: false,
    },
  ],
});
const terminalObservation = Object.freeze({
  subject: "root/subject",
  expandedSubject: "root/subject",
  run: "fixture/run",
  planIdentity: "fixture/plan",
  planEpoch: 1,
  generation: 1,
  attempt: 1,
  causedBy: [],
  retry: "restart-only",
  budget: {
    remainingObservations: 2,
    remainingDecisions: 2,
    remainingAttempts: 1,
    remainingEvidenceEvents: 8,
    nowTick: 1,
    deadlineTick: 10,
  },
});
const browserSupervisor = new BoundedBrowserSupervisor(supervisionBinding, "browser");
assert(browserSupervisor.admit(terminalObservation).ok, "browser supervisor admits terminal");
const browserRestart = browserSupervisor.decide(
  terminalObservation,
  { kind: "restart-same", target: null },
);
assert(browserRestart.ok && browserRestart.nextAttempt === 2, "browser restart is explicit");
const constrainedSupervisor = new BoundedBrowserSupervisor(supervisionBinding, "constrained");
assert(constrainedSupervisor.admit(terminalObservation).ok, "constrained observation admitted");
const constrainedFallback = constrainedSupervisor.decide(
  terminalObservation,
  { kind: "activate-declared-fallback", target: "fallback" },
);
assert(
  !constrainedFallback.ok && constrainedFallback.code === SupervisionReason.UnsupportedProfile,
  "constrained profile rejects richer action",
);
const correlationSupervisor = new BoundedBrowserSupervisor(supervisionBinding, "browser");
assert(correlationSupervisor.admit(terminalObservation).ok, "correlation observation admitted");
const wrongCorrelation = correlationSupervisor.decide(
  { ...terminalObservation, run: "fixture/other-run" },
  { kind: "propagate", target: null },
);
assert(
  !wrongCorrelation.ok && wrongCorrelation.code === SupervisionReason.ObservationInvalid,
  "browser decisions require exact correlation",
);
const timeoutSupervisor = new BoundedBrowserSupervisor(supervisionBinding, "browser");
assert(timeoutSupervisor.admit({
  ...terminalObservation,
  run: "fixture/timeout-run",
  code: "node-failed",
  phase: "step",
}).ok, "timeout observation admitted");
const earlyHandlerTimeout = timeoutSupervisor.handlerTerminated("timeout", 8);
assert(
  !earlyHandlerTimeout.ok &&
  earlyHandlerTimeout.code === SupervisionReason.ObservationInvalid,
  "handler cannot time out before its exact deadline",
);
const handlerTimeout = timeoutSupervisor.handlerTerminated("timeout", 9);
assert(
  !handlerTimeout.ok &&
  handlerTimeout.code === SupervisionReason.DeadlineExpired &&
  handlerTimeout.outward.subject === "root/handler" &&
  handlerTimeout.outward.causedBy.length === 1,
  "handler timeout propagates a complete bounded chain",
);

const poolProfile = (count) => Object.freeze({
  memoryBytes: 256 * count,
  storageBytes: 32 * count,
  cpuUnits: count,
  timers: 2 * count,
  transports: count,
  checkpoints: count,
  evidenceBytes: 128 * count,
  childNodes: 2 * count,
  childCords: count,
  stateBytes: 64 * count,
  schedulerSlots: 3 * count,
  hostOperations: count,
  cancellationScopes: 2 * count,
});
const queuedProfile = Object.freeze({
  memoryBytes: 32,
  storageBytes: 0,
  cpuUnits: 0,
  timers: 0,
  transports: 0,
  checkpoints: 0,
  evidenceBytes: 32,
  childNodes: 0,
  childCords: 0,
  stateBytes: 16,
  schedulerSlots: 1,
  hostOperations: 0,
  cancellationScopes: 1,
});
const poolContract = Object.freeze({
  schemaVersion: 0,
  pool: "root/pool.workers",
  planIdentity: "fixture/browser-plan",
  templateIdentity: "fixture/worker-template",
  implementationSetIdentity: "fixture/browser-implementation-set",
  maximumLive: 2,
  maximumQueued: 2,
  admission: "queue-bounded",
  supervision: Object.freeze({
    kind: "restart-bounded",
    maximumAttempts: 2,
    backoffTicks: 3,
  }),
  cleanup: "abort",
  deadlineTicks: 100,
  idleTimeoutTicks: 20,
  cleanupTicks: 5,
  maximumEvidenceEvents: 64,
  perInstance: poolProfile(1),
  queuedReservation: queuedProfile,
  generationReservation: Object.freeze({
    candidateMaximumLive: 1,
    rollbackMaximumLive: 1,
    reservedSlots: 4,
    reservedResources: poolProfile(4),
  }),
  totalReservation: Object.freeze({
    ...poolProfile(4),
    memoryBytes: poolProfile(4).memoryBytes + queuedProfile.memoryBytes * 2,
    evidenceBytes: poolProfile(4).evidenceBytes + queuedProfile.evidenceBytes * 2,
    stateBytes: poolProfile(4).stateBytes + queuedProfile.stateBytes * 2,
    schedulerSlots: poolProfile(4).schedulerSlots + queuedProfile.schedulerSlots * 2,
    cancellationScopes:
      poolProfile(4).cancellationScopes + queuedProfile.cancellationScopes * 2,
  }),
});
const browserPool = new BoundedBrowserPool(poolContract, 1, 1);
const poolFacts = Object.freeze({
  authorityGranted: true,
  sensitivityAllowed: true,
  templateIdentity: "fixture/worker-template",
  implementationSetIdentity: "fixture/browser-implementation-set",
  available: poolProfile(1),
});
const poolWork = (id) => Object.freeze({
  request: `request/${id}`,
  workUnit: `work/${id}`,
  correlation: `correlation/${id}`,
});
const poolFirst = browserPool.offer(poolWork(1), poolFacts, 0);
const poolSecond = browserPool.offer(poolWork(2), poolFacts, 0);
const poolThird = browserPool.offer(poolWork(3), poolFacts, 0);
const poolFourth = browserPool.offer(poolWork(4), poolFacts, 0);
const poolOverflow = browserPool.offer(poolWork(5), poolFacts, 0);
assert(
  poolFirst.ok && poolSecond.ok && poolThird.state === "queued" &&
  poolFourth.state === "queued" &&
  !poolOverflow.ok && poolOverflow.reason === "queue-full",
  "browser pool admission and queue are exact",
);
assert(
  browserPool.evidence.at(-1).from === "empty" &&
  browserPool.evidence.at(-1).to === "empty" &&
  browserPool.evidence.at(-1).reason === "queue-full",
  "browser pool admission denials consume bounded evidence",
);
assert(browserPool.start(poolFirst.slot, 0).ok, "browser pool starts reserved instance");
const poolFirstIdentity = browserPool.slots[poolFirst.slot].instance;
assert(browserPool.progress(poolFirst.slot, 1).ok, "browser pool progress evidenced");
assert(
  browserPool.observePressure(poolFirst.slot, true, "cause/loss", 1).ok &&
  browserPool.evidence.at(-1).reason === "loss",
  "browser pool pressure loss is isolated and evidenced",
);
const poolRestart = browserPool.fail(poolFirst.slot, "cause/failure", 2);
assert(
  poolRestart.ok && poolRestart.nextAttempt === 2 && poolRestart.wakeTick === 5,
  "browser pool bounded restart scheduled",
);
assert(browserPool.tick(5).ok, "browser pool restart tick");
const poolRestarted = browserPool.slots[poolFirst.slot];
assert(
  poolRestarted.instance === poolFirstIdentity &&
  poolRestarted.attempt === 2 &&
  poolRestarted.correlation.includes("\u00002\u0000"),
  "browser pool identity is semantic and attempt correlation changes",
);
const maliciousUsage = Object.freeze({
  ...poolProfile(1),
  hostOperations: poolProfile(1).hostOperations + 1,
});
assert(
  !browserPool.observeUsage(poolSecond.slot, maliciousUsage, 6).ok ||
  browserPool.slots[poolSecond.slot].state === "cleanup",
  "browser pool cannot expand a foreign profile",
);
const browserPoolDrain = browserPool.drain("cause/transition", 7);
assert(browserPoolDrain.ok, "browser generation drain is bounded");

const terminalPool = new BoundedBrowserPool(Object.freeze({
  ...poolContract,
  admission: "reject",
  maximumQueued: 0,
  queuedReservation: poolProfile(0),
  totalReservation: poolProfile(4),
}), 2, 1);
const terminalFirst = terminalPool.offer(poolWork(11), poolFacts, 0);
const terminalSecond = terminalPool.offer(poolWork(12), poolFacts, 0);
assert(
  terminalPool.complete(terminalFirst.slot, 0).ok &&
  terminalPool.complete(terminalSecond.slot, 0).ok &&
  terminalPool.tick(5).ok,
  "browser pool reaches retained terminal states",
);
const terminalBlocked = terminalPool.offer(poolWork(13), poolFacts, 6);
assert(
  !terminalBlocked.ok && terminalBlocked.reason === "reservation-drift",
  "browser pool cannot silently overwrite terminal evidence slots",
);
assert(
  terminalPool.reclaim(terminalFirst.slot).ok &&
  terminalPool.offer(poolWork(13), poolFacts, 7).ok,
  "browser pool reuses a terminal slot only after explicit reclaim",
);
assert(
  !terminalPool.complete(terminalSecond.slot, 7).ok,
  "browser pool cannot reopen a terminal slot",
);

const checkpointPool = new BoundedBrowserPool(Object.freeze({
  ...poolContract,
  admission: "reject",
  maximumQueued: 0,
  queuedReservation: poolProfile(0),
  totalReservation: poolProfile(4),
}), 3, 1);
const checkpointWork = checkpointPool.offer(poolWork(21), poolFacts, 0);
assert(
  checkpointPool.start(checkpointWork.slot, 0).ok &&
  checkpointPool.checkpoint(checkpointWork.slot, "wrong/template", 1).accepted === false &&
  checkpointPool.slots[checkpointWork.slot].state === "running" &&
  checkpointPool.checkpoint(
    checkpointWork.slot,
    poolContract.templateIdentity,
    2,
  ).accepted &&
  checkpointPool.resume(checkpointWork.slot, 3).ok,
  "browser pool checkpoint resume requires exact template identity",
);

const retirementPool = new BoundedBrowserPool(poolContract, 4, 1);
retirementPool.offer(poolWork(31), poolFacts, 0);
retirementPool.offer(poolWork(32), poolFacts, 0);
retirementPool.offer(poolWork(33), poolFacts, 0);
const retirementDrain = retirementPool.drain("cause/retire", 1);
const retirementCleanup = retirementPool.retireDrained(2);
assert(
  retirementDrain.ok && retirementDrain.affected === 3 &&
  retirementCleanup.ok && retirementCleanup.affected === 2 &&
  retirementPool.population.cleanup === 2 &&
  retirementPool.population.queued === 0,
  "browser pool generation retirement is finite and causal",
);

const rollbackPool = new BoundedBrowserPool(poolContract, 5, 1);
rollbackPool.offer(poolWork(41), poolFacts, 0);
rollbackPool.offer(poolWork(42), poolFacts, 0);
rollbackPool.offer(poolWork(43), poolFacts, 0);
const rollbackResult = rollbackPool.rollback("cause/rollback", 1);
assert(
  rollbackResult.ok && rollbackResult.affected === 3 &&
  rollbackPool.population.cleanup === 2 &&
  rollbackPool.population.terminal === 1,
  "browser pool generation rollback contains live and queued work",
);

const browserWorkloadBudget = Object.freeze({
  workUnits: 100,
  tasks: 1,
  processes: null,
  descriptors: 2,
  connections: 1,
  storageBytes: null,
  deviceOperations: null,
  networkBytes: 4096,
  callbacks: 2,
  foreignQueueItems: 1,
  transitionOverlapWorkUnits: 20,
});
const browserWorkload = Object.freeze({
  guarantee: "host-observed-best-effort",
  timeBasis: "clock/browser",
  deadlineTicks: 20,
  maximumJitterTicks: 4,
  budget: browserWorkloadBudget,
});
const browserWorkloadCapability = Object.freeze({
  evidenceKind: "host-observation",
  timeBasis: "clock/browser",
  observedAtTick: 1,
  validUntilTick: 100,
  capacity: Object.freeze({ ...browserWorkloadBudget, workUnits: 200 }),
  maximumDeadlineTicks: 30,
  maximumJitterTicks: 4,
});
const browserWorkloadAdmission = admitBrowserWorkload(
  browserWorkload,
  browserWorkloadCapability,
  { basis: "clock/browser", tick: 10 },
);
assert(
  browserWorkloadAdmission.ok &&
  browserWorkloadAdmission.guarantee === "host-observed-best-effort",
  "browser workload remains explicitly best effort",
);
assert(
  admitBrowserWorkload(
    { ...browserWorkload, guarantee: "hard" },
    browserWorkloadCapability,
    { basis: "clock/browser", tick: 10 },
  ).code === WorkloadReason.ExactEnforcement,
  "browser observation cannot become hard deadline authority",
);
const browserWorkloadState = new BrowserWorkloadState(
  browserWorkload,
  browserWorkloadAdmission,
);
assert(
  browserWorkloadState.record({ callbacks: 3 }).code === WorkloadReason.Overload,
  "browser callback queues are included in workload accounting",
);

globalThis.__conduitBrowserResults = Object.freeze({
  placementOutcomes: Object.freeze(placementOutcomes),
  reportedAvailability: Object.freeze(Object.fromEntries(
    report.placements.map((item) => [item.id, item.available]),
  )),
  statusBound: true,
  presentationIdentitySeparate: true,
  unsupportedExplicit: evidence.some((event) => event.kind === "unsupported"),
  uaBranch: false,
  resolverEffects: Object.freeze({ prompted: false, fetched: false, mutated: false }),
  terminalEvidence: evidence.filter((event) => event.kind === "terminal").length,
  membershipSignals: Object.freeze(membershipSignals),
  supervision: Object.freeze({
    restartAttempt: browserRestart.nextAttempt,
    restartAffectedScope: browserRestart.affectedScope,
    restartNotBeforeTick: browserRestart.timing.attemptNotBeforeTick,
    evidenceKinds: browserSupervisor.evidence.map((item) => item.kind),
    constrainedCode: constrainedFallback.code,
    correlationCode: wrongCorrelation.code,
    correlationEvidenceReason: correlationSupervisor.evidence.at(-1).reason,
    handlerTimeoutCode: handlerTimeout.code,
    handlerTimeoutSubject: handlerTimeout.outward.subject,
  }),
  pool: Object.freeze({
    live: browserPool.population.live,
    queued: browserPool.population.queued,
    restarting: browserPool.population.restarting,
    retiring: browserPool.population.retiring,
    queueFullCode: poolOverflow.code,
    queueFullReason: poolOverflow.reason,
    restartAttempt: poolRestart.nextAttempt,
    evidenceCount: browserPool.evidence.length,
    evidenceBound: poolContract.maximumEvidenceEvents,
    generationDrainAffected: browserPoolDrain.affected,
    evidenceExhaustionCode: PoolReason.EvidenceExhausted,
  }),
  workload: Object.freeze({
    guarantee: browserWorkloadAdmission.guarantee,
    hardAuthority: false,
    overloadCode: browserWorkloadState.terminal,
  }),
});
document.querySelector("#result").textContent = "ok";
</script>
