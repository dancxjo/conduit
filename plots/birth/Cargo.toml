[package]
name = "conduit-birth-plot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
conduit-core = { path = "../../architecture/core", default-features = false }
conduit-body = { path = "../../architecture/body", default-features = false }
conduit-presentation = { path = "../../semantics/presentation", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
conduit-plot = { path = "../../architecture/plot" }
conduit-planner = { path = "../../architecture/planner" }
conduit-presentation = { path = "../../semantics/presentation", features = ["plot-catalog"] }
