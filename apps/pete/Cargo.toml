[package]
name = "conduit-pete"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
conduit-ai = { path = "../../semantics/ai" }
conduit-audio = { path = "../../semantics/audio" }
conduit-create-oi = { path = "../../mechanisms/devices/create-oi" }
conduit-core = { path = "../../architecture/core" }
conduit-human = { path = "../../semantics/human" }
conduit-robotics = { path = "../../semantics/robotics" }
conduit-form = { path = "../../architecture/form" }
conduit-kernel = { path = "../../architecture/kernel" }
conduit-mpu6050 = { path = "../../mechanisms/devices/mpu6050" }
conduit-presentation = { path = "../../semantics/presentation" }
conduit-ssd1306 = { path = "../../mechanisms/devices/ssd1306" }
conduit-observatory = { path = "../../architecture/observatory" }
conduit-planner = { path = "../../architecture/planner" }
conduit-signal = { path = "../../semantics/signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
conduit-semantic-catalog = { path = "../../semantics/catalog", features = ["form-catalog"] }
conduit-std-offers = { path = "../../targets/std/offers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
patchbay-model = { path = "../patchbay/model" }
