[package]
name = "patchbay-native"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "patchbay-native"

[dependencies]
conduit-body = { path = "../../../architecture/body" }
conduit-chat = { path = "../../../semantics/chat", features = ["form-catalog"] }
conduit-core = { path = "../../../architecture/core" }
conduit-human = { path = "../../../semantics/human" }
conduit-form = { path = "../../../architecture/form" }
conduit-net = { path = "../../../semantics/net", features = ["form-catalog"] }
conduit-r1-network-conformance = { path = "../../../proof/conformance/network-r1" }
conduit-observatory = { path = "../../../architecture/observatory" }
conduit-planner = { path = "../../../architecture/planner" }
conduit-presentation = { path = "../../../semantics/presentation" }
conduit-semantic-catalog = { path = "../../../semantics/catalog", features = ["form-catalog"] }
conduit-text = { path = "../../../semantics/text", default-features = false }
conduit-std-host = { path = "../../../targets/std" }
conduit-std-offers = { path = "../../../targets/std/offers" }
conduit-wire = { path = "../../../architecture/wire" }
embedded-graphics = "=0.8.1"
patchbay-model = { path = "../model" }
patchbay-hosted = { path = "../hosted" }
serde_json = "1"
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[dev-dependencies]
conduit-browser-runtime = { path = "../../../targets/browser/runtime" }
conduitos = { path = "../../../targets/conduitos" }
