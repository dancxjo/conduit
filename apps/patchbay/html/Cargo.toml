[package]
name = "patchbay-html"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-body = { path = "../../../crates/conduit-body" }
conduit-core = { path = "../../../crates/conduit-core" }
conduit-kernel = { path = "../../../crates/conduit-kernel", features = ["alloc"] }
conduit-presentation = { path = "../../../crates/conduit-presentation" }
conduit-plan-lowering = { path = "../../../crates/conduit-plan-lowering", default-features = false }
conduit-std-host = { path = "../../../hosts/std" }
conduit-semantic-catalog = { path = "../../../crates/conduit-semantic-catalog" }
conduit-wire = { path = "../../../crates/conduit-wire" }
patchbay-model = { path = "../model" }
patchbay-hosted = { path = "../hosted" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30.0"
