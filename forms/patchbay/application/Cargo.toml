[package]
name = "patchbay-application"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../../../architecture/core" }
conduit-body = { path = "../../../architecture/body" }
conduit-form = { path = "../../../architecture/form" }
conduit-presentation = { path = "../../../semantics/presentation" }
patchbay-control = { path = ".." }
patchbay-graph = { path = "../graph" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
conduit-patchbay-workbench-conformance = { path = "../../../proof/conformance/patchbay-workbench" }
conduit-semantic-catalog = { path = "../../../semantics/catalog", default-features = false, features = ["form-catalog"] }
