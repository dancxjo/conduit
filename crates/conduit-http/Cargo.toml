[package]
name = "conduit-http"
description = "Bounded HTTP domain contracts and hosted serving backends for Conduit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-panel = { path = "../conduit-panel" }
conduit-runtime = { path = "../conduit-runtime" }
conduit-std = { path = "../conduit-std" }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
sha2 = "0.10.9"

[dev-dependencies]
bumpalo = "3.19.0"
conduit-compile = { path = "../conduit-compile" }
rcgen = "=0.14.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"

[lints]
workspace = true
