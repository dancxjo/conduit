[package]
name = "conduit-bluetooth"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-wire = { path = "../conduit-wire", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1"
