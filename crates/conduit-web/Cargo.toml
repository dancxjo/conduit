[package]
name = "conduit-web"
description = "Safe WASM bindings to Conduit's production parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bumpalo = "3"
conduit-ai = { path = "../conduit-ai" }
conduit-cache = { path = "../conduit-cache" }
conduit-audio = { path = "../conduit-audio" }
conduit-compile = { path = "../conduit-compile" }
conduit-core = { path = "../conduit-core" }
conduit-knowledge = { path = "../conduit-knowledge" }
conduit-learned = { path = "../conduit-learned" }
conduit-media = { path = "../conduit-media" }
conduit-net = { path = "../conduit-net" }
conduit-panel = { path = "../conduit-panel" }
conduit-patchbay = { path = "../conduit-patchbay" }
conduit-runtime = { path = "../conduit-runtime" }
conduit-spatial = { path = "../conduit-spatial" }
conduit-std = { path = "../conduit-std" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
wasm-bindgen = "0.2.126"

[lints]
workspace = true
