[package]
name = "conduit-web"
description = "Safe WASM bindings to Conduit's production parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bumpalo = "3"
conduit-cache = { path = "../conduit-cache" }
conduit-compile = { path = "../conduit-compile" }
conduit-core = { path = "../conduit-core" }
conduit-media = { path = "../conduit-media" }
conduit-panel = { path = "../conduit-panel" }
conduit-patchbay = { path = "../conduit-patchbay" }
conduit-runtime = { path = "../conduit-runtime" }
conduit-std = { path = "../conduit-std" }
serde_json = "1"
wasm-bindgen = "0.2.126"

[dev-dependencies]
sha2 = "0.10.9"

[lints]
workspace = true
