[package]
name = "conduit-pete"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
conduit-ai = { path = "../conduit-ai" }
conduit-create-oi = { path = "../../mechanisms/devices/create-oi" }
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
conduit-kernel = { path = "../conduit-kernel" }
conduit-mpu6050 = { path = "../../mechanisms/devices/mpu6050" }
conduit-presentation = { path = "../conduit-presentation" }
conduit-ssd1306 = { path = "../../mechanisms/devices/ssd1306" }
conduit-observatory = { path = "../conduit-observatory" }
conduit-planner = { path = "../conduit-planner" }
conduit-signal = { path = "../conduit-signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
conduit-std-catalog = { path = "../conduit-std-catalog", features = ["form-catalog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
patchbay-model = { path = "../../hosts/patchbay-model" }
