[package]
name = "conduit-std-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-alife = { path = "../conduit-alife" }
conduit-core = { path = "../conduit-core" }
conduit-midi = { path = "../conduit-midi" }
conduit-presentation = { path = "../conduit-presentation" }
conduit-web = { path = "../conduit-web", default-features = false }
conduit-text = { path = "../conduit-text", default-features = false }
conduit-time = { path = "../conduit-time", default-features = false }
conduit-form = { path = "../conduit-form" }
conduit-planner = { path = "../conduit-planner", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
conduit-planner = { path = "../conduit-planner" }

[features]
default = ["form-catalog"]
form-catalog = ["conduit-time/form-catalog", "conduit-web/form-catalog", "conduit-text/form-catalog"]
text-lab-plan = ["form-catalog", "dep:conduit-planner"]
body-coordination-plan = ["form-catalog", "dep:conduit-planner"]
