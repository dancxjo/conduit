[package]
name = "conduit-std-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-presentation = { path = "../conduit-presentation" }
conduit-form = { path = "../conduit-form", optional = true }
conduit-runtime = { path = "../conduit-runtime", optional = true, default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
conduit-planner = { path = "../conduit-planner" }

[features]
default = ["form-catalog", "compatibility-fixture"]
form-catalog = ["dep:conduit-form"]
compatibility-fixture = ["dep:conduit-runtime", "conduit-runtime/compatibility-executor"]
