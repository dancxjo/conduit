[package]
name = "conduit-netherwick"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
conduit-create-oi = { path = "../conduit-create-oi" }
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
conduit-kernel = { path = "../conduit-kernel" }
conduit-observatory = { path = "../conduit-observatory" }
conduit-planner = { path = "../conduit-planner" }
conduit-std-catalog = { path = "../conduit-std-catalog", features = ["form-catalog"] }
pete-brainstem = { git = "https://github.com/dancxjo/netherwick.git", rev = "f43ff13846b47b05e133d0321bdbaafffd1bcdbe", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
patchbay-model = { path = "../../hosts/patchbay-model" }
