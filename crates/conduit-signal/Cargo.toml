[package]
name = "conduit-signal"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core", optional = true }
conduit-form = { path = "../conduit-form", optional = true }
conduit-semantic-catalog = { path = "../conduit-semantic-catalog", optional = true, default-features = false }
conduit-time = { path = "../conduit-time", optional = true, default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }

[features]
default = []
host-profile = ["dep:conduit-core", "dep:conduit-form", "dep:conduit-semantic-catalog", "dep:conduit-time", "conduit-semantic-catalog/form-catalog"]
