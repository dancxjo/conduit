[package]
name = "conduit-signal"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core", optional = true }
conduit-form = { path = "../conduit-form", optional = true }
conduit-runtime = { path = "../conduit-runtime", optional = true }
serde = { version = "1", default-features = false, features = ["derive"] }

[features]
default = []
host-profile = ["dep:conduit-core", "dep:conduit-form", "dep:conduit-runtime"]
