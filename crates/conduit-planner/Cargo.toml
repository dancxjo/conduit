[package]
name = "conduit-planner"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
conduit-body = { path = "../conduit-body", default-features = false }
conduit-ai = { path = "../conduit-ai", features = ["form-catalog"] }
conduit-kernel = { path = "../conduit-kernel" }
conduit-runtime = { path = "../conduit-runtime", default-features = false }
conduit-signal = { path = "../conduit-signal", features = ["host-profile"] }
conduit-std-catalog = { path = "../conduit-std-catalog", features = ["form-catalog"] }
serde_json = "1"
