[package]
name = "conduct"
description = "Check, explain, and conduct .panel files"
default-run = "conduct"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "conduct"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
conduit-compile = { path = "../conduit-compile" }
conduit-diagnostics = { path = "../conduit-diagnostics" }
conduit-inspect = { path = "../conduit-inspect" }
conduit-package = { path = "../conduit-package" }
conduit-panel = { path = "../conduit-panel" }
conduit-runtime = { path = "../conduit-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"
bumpalo = "3.20.2"
conduit-core = { path = "../conduit-core" }

[dev-dependencies]
sha2 = "0.10.9"

[lints]
workspace = true
