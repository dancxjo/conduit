[package]
name = "conduct"
description = "Check, explain, and conduct .panel files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "conduct"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
conduit-diagnostics = { path = "../conduit-diagnostics" }
conduit-panel = { path = "../conduit-panel" }
conduit-runtime = { path = "../conduit-runtime" }

[dev-dependencies]
serde_json = "1.0.149"

[lints]
workspace = true
