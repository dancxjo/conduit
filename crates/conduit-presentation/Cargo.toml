[package]
name = "conduit-presentation"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-time = { path = "../conduit-time", default-features = false }
conduit-form = { path = "../conduit-form", optional = true }
conduit-body = { path = "../conduit-body", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
conduit-form = { path = "../conduit-form" }
conduit-planner = { path = "../conduit-planner" }
serde_json = "1"

[features]
default = ["form-catalog"]
form-catalog = ["dep:conduit-form"]
