[package]
name = "conduit"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
conduit-alife = { path = "../conduit-alife" }
conduit-core = { path = "../conduit-core" }
conduit-body-fabrication = { path = "../conduit-body-fabrication" }
conduit-chat = { path = "../conduit-chat", features = ["form-catalog"] }
conduit-form = { path = "../conduit-form" }
conduit-host-fabrication = { path = "../conduit-host-fabrication" }
conduit-kernel = { path = "../conduit-kernel" }
conduit-language = { path = "../conduit-language" }
conduit-data = { path = "../conduit-data" }
conduit-net = { path = "../conduit-net", features = ["form-catalog"] }
conduit-observatory = { path = "../conduit-observatory" }
conduit-planner = { path = "../conduit-planner" }
conduit-presentation = { path = "../conduit-presentation" }
conduit-runtime = { path = "../conduit-runtime" }
conduit-signal = { path = "../conduit-signal", features = ["host-profile"] }
conduit-signal-conformance = { path = "../../proof/conformance/signal" }
conduit-std-host = { path = "../../hosts/std" }
conduit-std-catalog = { path = "../conduit-std-catalog", default-features = false, features = ["form-catalog"] }
conduit-time = { path = "../conduit-time" }
conduit-wire = { path = "../conduit-wire" }
conduit-web = { path = "../conduit-web", default-features = false, features = ["form-catalog"] }
conduit-workspace-fabrication = { path = "../conduit-workspace-fabrication" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[test]]
name = "hello"
path = "../../tests/hello.rs"

[[test]]
name = "copy_task_face"
path = "../../tests/copy_task_face.rs"

[[test]]
name = "structured_diagnostics"
path = "../../tests/structured_diagnostics.rs"

[[test]]
name = "two_std_line"
path = "../../tests/two_std_line.rs"
