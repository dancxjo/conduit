[package]
name = "conduit"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
conduit-net = { path = "../conduit-net", features = ["form-catalog"] }
conduit-observatory = { path = "../conduit-observatory" }
conduit-planner = { path = "../conduit-planner" }
conduit-std-host = { path = "../../hosts/std" }
conduit-std-catalog = { path = "../conduit-std-catalog", default-features = false, features = ["form-catalog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
conduit-browser-sim = { path = "../../fixtures/browser-sim" }
conduit-pico-sim = { path = "../../fixtures/pico-sim" }
conduit-signal = { path = "../conduit-signal", features = ["host-profile"] }
conduit-std-host = { path = "../../hosts/std", features = ["legacy-fixture-driver"] }

[[test]]
name = "hello"
path = "../../tests/hello.rs"

[[test]]
name = "observatory_fixture"
path = "../../tests/observatory_fixture.rs"

[[test]]
name = "copy_task_face"
path = "../../tests/copy_task_face.rs"

[[test]]
name = "structured_diagnostics"
path = "../../tests/structured_diagnostics.rs"
