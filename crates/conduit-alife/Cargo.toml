[package]
name = "conduit-alife"
version = "0.1.0"
edition = "2021"

[features]
default = []
planning = ["dep:conduit-planner"]

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
conduit-planner = { path = "../conduit-planner", optional = true }
conduit-presentation = { path = "../conduit-presentation", default-features = false }
conduit-std-catalog = { path = "../conduit-std-catalog", default-features = false, features = ["form-catalog"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
conduit-planner = { path = "../conduit-planner" }
conduit-wire = { path = "../conduit-wire" }
