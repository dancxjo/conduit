[package]
name = "conduit-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form", optional = true }
conduit-std-catalog = { path = "../conduit-std-catalog", optional = true, default-features = false, features = ["form-catalog"] }
serde = { version = "1", default-features = false, features = ["derive"] }

[features]
default = []
form-catalog = ["dep:conduit-form", "dep:conduit-std-catalog"]

[dev-dependencies]
conduit-form = { path = "../conduit-form" }
conduit-planner = { path = "../conduit-planner" }
conduit-signal = { path = "../conduit-signal", features = ["host-profile"] }
serde_json = "1"
