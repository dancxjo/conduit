[package]
name = "conduit-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
conduit-core = { path = "../conduit-core" }
conduit-runtime = { path = "../conduit-runtime" }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
