[package]
name = "conduit-composite"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
conduit-kernel = { path = "../conduit-kernel", features = ["alloc"] }
conduit-plan-lowering = { path = "../conduit-plan-lowering", default-features = false }

[dev-dependencies]
conduit-planner = { path = "../conduit-planner" }
conduit-signal = { path = "../conduit-signal", default-features = false, features = ["host-profile"] }
conduit-std-catalog = { path = "../conduit-std-catalog", default-features = false, features = ["form-catalog"] }
