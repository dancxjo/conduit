[package]
name = "conduit-body"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
sha2 = { version = "0.10", default-features = false }
