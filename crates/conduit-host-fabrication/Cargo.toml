[package]
name = "conduit-host-fabrication"
version = "0.1.0"
edition = "2021"
description = "Bounded PROFILE validation and identity for Conduit Host fabrication"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-form = { path = "../conduit-form" }
conduit-presentation = { path = "../conduit-presentation" }
conduit-semantic-catalog = { path = "../conduit-semantic-catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
conduit-std-offers = { path = "../../hosts/std/offers" }
