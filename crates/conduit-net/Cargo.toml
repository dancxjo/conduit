[package]
name = "conduit-net"
version = "0.1.0"
edition = "2021"

[dependencies]
conduit-core = { path = "../conduit-core" }
conduit-wire = { path = "../conduit-wire", default-features = false }
conduit-form = { path = "../conduit-form", optional = true }
conduit-planner = { path = "../conduit-planner", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[features]
default = []
form-catalog = ["dep:conduit-form"]
r1-planning = ["form-catalog", "dep:conduit-planner"]

[dev-dependencies]
conduit-form = { path = "../conduit-form" }
serde_json = "1"
